<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Le grimoire du trading desk — Flashcards finance</title>
<meta name="description" content="Flashcards et quiz sur la finance de marché et la finance quantitative.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,500&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --ink-900: #0B1220;
  --ink-800: #131D31;
  --ink-700: #1C2A44;
  --paper: #F6F1E4;
  --gold: #C9962C;
  --rose: #B5484F;
  --sage: #4F7A6B;
  --ink-400: #8A93A6;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: 'Inter', sans-serif;
  background: var(--ink-900);
  color: var(--paper);
  min-height: 100vh;
  padding: 28px 18px 60px;
}
button { font-family: inherit; cursor: pointer; }
svg { display: block; }

.home { max-width: 640px; margin: 0 auto; }
.hero-eyebrow { font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: .14em; color: var(--gold); margin-bottom: 10px; }
.hero-title { font-family: 'Newsreader', serif; font-weight: 500; font-size: clamp(30px, 8vw, 42px); line-height: 1.08; margin: 0 0 12px; }
.hero-accent { font-style: italic; color: var(--gold); }
.hero-sub { color: var(--ink-400); font-size: 14.5px; line-height: 1.5; margin: 0 0 22px; max-width: 46ch; }

.ticker-wrap { overflow: hidden; border-top: 1px solid var(--ink-700); border-bottom: 1px solid var(--ink-700); padding: 10px 0; margin-bottom: 26px; }
.ticker-track { display: flex; gap: 28px; width: max-content; animation: scroll-ticker 22s linear infinite; }
@keyframes scroll-ticker { from { transform: translateX(0); } to { transform: translateX(-33.333%); } }
.ticker-item { display: flex; align-items: center; gap: 6px; font-family: 'IBM Plex Mono', monospace; font-size: 12px; white-space: nowrap; color: var(--ink-400); }
.ticker-sym { color: var(--paper); font-weight: 600; }
.ticker-up { color: var(--sage); }
.ticker-down { color: var(--ink-400); }

.deck-select { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
.deck-tab { display: flex; align-items: center; gap: 7px; background: var(--ink-800); border: 1px solid var(--ink-700); color: var(--ink-400); padding: 10px 14px; border-radius: 8px; font-size: 13.5px; font-weight: 600; transition: all .15s ease; }
.deck-tab.active { color: var(--paper); border-color: var(--accent); background: var(--ink-700); }
.deck-tab svg { color: var(--accent); }

.sub-chips { display: flex; gap: 7px; flex-wrap: wrap; margin-bottom: 26px; }
.chip { background: transparent; border: 1px solid var(--ink-700); color: var(--ink-400); padding: 6px 11px; border-radius: 999px; font-size: 12.5px; }
.chip-active { border-color: var(--accent); color: var(--paper); background: rgba(255,255,255,0.04); }

.mode-cards { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 480px) { .mode-cards { grid-template-columns: 1fr; } }
.mode-card { background: var(--ink-800); border: 1px solid var(--ink-700); border-radius: 12px; padding: 20px 18px; }
.mode-card-label { font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; color: var(--accent); letter-spacing: .1em; margin-bottom: 8px; }
.mode-card h3 { font-family: 'Newsreader', serif; font-size: 22px; margin: 0 0 6px; font-weight: 600; }
.mode-card p { color: var(--ink-400); font-size: 13px; margin: 0 0 16px; line-height: 1.4; }
.mode-btn { display: inline-flex; align-items: center; gap: 6px; background: var(--accent); color: var(--ink-900); border: none; padding: 9px 14px; border-radius: 7px; font-weight: 700; font-size: 13px; }

.mode-screen { max-width: 560px; margin: 0 auto; }
.mode-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
.exit-btn { display: flex; align-items: center; gap: 5px; background: none; border: none; color: var(--ink-400); font-size: 13px; }
.exit-btn:hover { color: var(--paper); }
.progress-label { font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--ink-400); }
.progress-bar { height: 3px; background: var(--ink-700); border-radius: 3px; margin-bottom: 20px; overflow: hidden; }
.progress-fill { height: 100%; background: var(--accent); transition: width .3s ease; }

.card-stage { perspective: 1400px; margin-bottom: 22px; }
.flash-card { position: relative; min-height: 320px; border-radius: 14px; cursor: pointer; transform-style: preserve-3d; transition: transform .5s cubic-bezier(.4,.2,.2,1); }
.flash-card.is-flipped { transform: rotateY(180deg); }
.flash-face { position: absolute; inset: 0; backface-visibility: hidden; border-radius: 14px; padding: 30px 26px; display: flex; flex-direction: column; box-shadow: 0 12px 30px rgba(0,0,0,0.35); }
.flash-front { justify-content: space-between; background: var(--paper); color: var(--ink-900); background-image: repeating-linear-gradient(to bottom, transparent, transparent 30px, rgba(0,0,0,0.035) 31px); }
.flash-back { transform: rotateY(180deg); background: var(--ink-800); color: var(--paper); justify-content: center; align-items: flex-start; }
.flash-tag { font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; letter-spacing: .08em; color: var(--accent); text-transform: uppercase; margin-bottom: 12px; align-self: flex-start; border: 1px solid var(--accent); padding: 3px 8px; border-radius: 4px; }
.flash-q { font-family: 'Newsreader', serif; font-size: 23px; line-height: 1.32; font-weight: 500; }
.flash-hint { font-size: 11.5px; color: #7a7460; align-self: center; margin-top: 12px; }
.flash-a { font-size: 16px; line-height: 1.55; }

.nav-row { display: flex; align-items: center; justify-content: center; gap: 12px; }
.nav-btn { background: var(--ink-800); border: 1px solid var(--ink-700); color: var(--paper); width: 42px; height: 42px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
.nav-btn-flip { width: auto; border-radius: 8px; padding: 0 16px; gap: 6px; font-size: 13px; font-weight: 600; }

.quiz-card { background: var(--ink-800); border: 1px solid var(--ink-700); border-radius: 12px; padding: 22px 20px; margin-bottom: 18px; }
.quiz-q { font-family: 'Newsreader', serif; font-size: 20px; line-height: 1.36; margin: 10px 0 18px; font-weight: 500; }
.quiz-options { display: flex; flex-direction: column; gap: 9px; }
.quiz-option { display: flex; align-items: center; gap: 10px; text-align: left; background: var(--ink-900); border: 1px solid var(--ink-700); color: var(--paper); padding: 12px 14px; border-radius: 9px; font-size: 14px; width: 100%; }
.opt-letter { font-family: 'IBM Plex Mono', monospace; font-size: 11.5px; color: var(--ink-400); border: 1px solid var(--ink-700); width: 22px; height: 22px; border-radius: 5px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.opt-correct { border-color: var(--sage); background: rgba(79,122,107,0.15); }
.opt-wrong { border-color: var(--rose); background: rgba(181,72,79,0.15); }
.opt-icon { margin-left: auto; }
.quiz-explain { margin-top: 16px; padding-top: 14px; border-top: 1px dashed var(--ink-700); font-size: 13.5px; line-height: 1.55; color: var(--ink-400); }
.quiz-explain-label { font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; color: var(--accent); letter-spacing: .08em; margin-bottom: 6px; }
.quiz-next { width: 100%; justify-content: center; padding: 13px; font-size: 14px; }

.result-panel { text-align: center; padding: 40px 10px; }
.result-eyebrow { font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: .12em; color: var(--ink-400); margin-bottom: 18px; }
.result-score { font-family: 'Newsreader', serif; font-size: 64px; font-weight: 600; color: var(--accent); }
.result-total { font-size: 28px; color: var(--ink-400); }
.result-pct { font-size: 14px; margin: 6px 0 26px; }
.missed-list { text-align: left; background: var(--ink-800); border: 1px solid var(--ink-700); border-radius: 10px; padding: 16px 18px; margin-bottom: 24px; }
.missed-title { font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; color: var(--rose); letter-spacing: .08em; margin-bottom: 10px; }
.missed-item { font-size: 13px; color: var(--ink-400); padding: 6px 0; border-bottom: 1px solid var(--ink-700); }
.missed-item:last-child { border-bottom: none; }
.missed-more { font-size: 12px; color: var(--ink-400); margin-top: 8px; }
.result-btn { width: 100%; justify-content: center; padding: 13px; }

footer.site-footer { max-width: 560px; margin: 40px auto 0; text-align: center; font-size: 11.5px; color: var(--ink-700); font-family: 'IBM Plex Mono', monospace; }
</style>

<script>
/* ------------------------------------------------------------------ */
/* DONNÉES                                                             */
/* ------------------------------------------------------------------ */
const DECKS = {
  marche: { label: "Finance de marché", short: "MARCHÉ", accent: "#C9962C", icon: "chart",
    subs: ["Actions", "Taux & Obligations", "Dérivés", "Change", "Gestion des risques", "Marchés monétaires", "Produits structurés", "Trading & microstructure", "Économie financière & valorisation"] },
  quant: { label: "Finance quantitative", short: "QUANT", accent: "#4F7A6B", icon: "sigma",
    subs: ["Calcul stochastique", "Pricing d'options", "Grecques", "Portefeuille", "Séries temporelles", "Statistiques & probabilités", "Machine learning", "Modèles de risque avancés", "Optimisation & finance algorithmique"] },
  macro: { label: "Macroéconomie", short: "MACRO", accent: "#6B8AC4", icon: "globe",
    subs: ["Indicateurs macroéconomiques", "Politique monétaire", "Politique budgétaire", "Cycle économique & croissance", "Commerce international"] },
  brainteasers: { label: "Calcul mental & Brainteasers", short: "BRAIN", accent: "#B5764F", icon: "brain",
    subs: ["Calcul mental", "Probabilités & logique", "Estimation (Fermi)", "Logique & énigmes"] },
  prog: { label: "Programmation", short: "CODE", accent: "#7B8FA6", icon: "code",
    subs: ["Python pour la finance", "Structures de données & algorithmes", "SQL & bases de données", "Complexité & performance", "Outils & bonnes pratiques"] },
  entretien: { label: "Préparation entretien PM/Quant", short: "ENTRETIEN", accent: "#8C6BAE", icon: "briefcase",
    subs: ["Motivation & fit", "Pitch d'investissement", "Vue marché & macro", "Technique : portefeuille & risque", "Comportemental & mise en situation", "Questions techniques avancées", "Études de cas de portefeuille", "Applications numériques", "Repères marché à connaître", "Glossaire jargon front office", "Grandes crises financières"] },
};

const CARDS = [
  { id: 1, deck: "marche", sub: "Actions", q: "Qu'est-ce que le PER (Price Earning Ratio) ?", a: "Le prix de l'action divisé par le bénéfice net par action. Il mesure combien de fois on paie les bénéfices annuels de l'entreprise.", options: ["Le prix / bénéfice par action", "La dette / capitaux propres", "Le dividende / cours", "Le chiffre d'affaires / capitalisation"], correct: 0 },
  { id: 2, deck: "marche", sub: "Actions", q: "Que mesure le beta d'une action ?", a: "La sensibilité du rendement de l'action aux mouvements du marché (risque systématique).", options: ["La volatilité totale de l'action", "La sensibilité au marché (risque systématique)", "Le rendement du dividende", "La liquidité du titre"], correct: 1 },
  { id: 3, deck: "marche", sub: "Actions", q: "Qu'est-ce qu'une augmentation de capital ?", a: "Une émission de nouvelles actions par l'entreprise pour lever des fonds, ce qui dilue les actionnaires existants.", options: ["Un rachat d'actions", "Une émission d'obligations", "Une émission de nouvelles actions", "Une distribution de dividendes"], correct: 2 },
  { id: 4, deck: "marche", sub: "Actions", q: "Qu'appelle-t-on le 'short selling' ?", a: "Vendre un titre emprunté en espérant le racheter moins cher plus tard pour le rendre, et empocher la différence.", options: ["Acheter à crédit", "Vendre à découvert un titre emprunté", "Acheter et revendre le jour même", "Investir sur le long terme"], correct: 1 },
  { id: 5, deck: "marche", sub: "Actions", q: "Qu'est-ce que le 'free float' d'une action ?", a: "La part du capital réellement disponible à l'achat en bourse, hors participations stables ou bloquées (fondateurs, État...).", options: ["Le nombre total d'actions émises", "La part du capital librement échangeable en bourse", "Le volume échangé sur une journée", "La capitalisation boursière totale"], correct: 1 },
  { id: 6, deck: "marche", sub: "Actions", q: "Que fait le modèle d'actualisation des dividendes (DDM) ?", a: "Il valorise une action comme la somme actualisée de tous ses dividendes futurs attendus.", options: ["Il valorise l'action via son bénéfice comptable", "Il valorise l'action via la VA de ses dividendes futurs", "Il compare le prix à la valeur des actifs nets", "Il estime la volatilité future de l'action"], correct: 1 },
  { id: 7, deck: "marche", sub: "Actions", q: "Comment calcule-t-on la capitalisation boursière ?", a: "En multipliant le prix de l'action par le nombre total d'actions en circulation.", options: ["Chiffre d'affaires × marge nette", "Prix de l'action × nombre d'actions en circulation", "Valeur comptable des actifs", "Dette totale + capitaux propres"], correct: 1 },
  { id: 8, deck: "marche", sub: "Actions", q: "Qu'est-ce qu'une IPO (Initial Public Offering) ?", a: "La première émission d'actions d'une entreprise sur un marché coté, marquant son entrée en bourse.", options: ["Un rachat d'actions par l'entreprise", "La première cotation en bourse d'une entreprise", "Une fusion entre deux sociétés cotées", "Une émission obligataire"], correct: 1 },
  { id: 9, deck: "marche", sub: "Actions", q: "Quel est l'effet principal d'un rachat d'actions (buyback) ?", a: "Il réduit le nombre d'actions en circulation, ce qui mécaniquement augmente le bénéfice par action (BPA).", options: ["Il dilue les actionnaires existants", "Il augmente le nombre d'actions en circulation", "Il réduit le nombre d'actions et augmente le BPA", "Il n'a aucun effet sur le BPA"], correct: 2 },
  { id: 10, deck: "marche", sub: "Actions", q: "Quelle est la différence entre un ordre 'limit' et un ordre 'market' ?", a: "Le limit fixe un prix maximum (achat) ou minimum (vente) à ne pas dépasser ; le market s'exécute immédiatement au meilleur prix disponible.", options: ["Aucune différence pratique", "Le limit fixe un prix, le market exécute immédiatement au meilleur prix", "Le market est réservé aux professionnels", "Le limit garantit toujours l'exécution"], correct: 1 },
  { id: 11, deck: "marche", sub: "Actions", q: "Qu'est-ce qu'un 'dark pool' ?", a: "Une plateforme de négociation privée où les ordres ne sont pas visibles publiquement avant leur exécution.", options: ["Un marché réservé aux obligations d'État", "Une plateforme de négociation privée et opaque", "Un indice boursier peu liquide", "Un fonds spéculatif offshore"], correct: 1 },
  { id: 12, deck: "marche", sub: "Actions", q: "Qu'est-ce que le trading haute fréquence (HFT) ?", a: "Des stratégies algorithmiques exploitant des écarts de prix infimes à très grande vitesse, souvent en microsecondes.", options: ["Une stratégie d'investissement long terme", "Des stratégies algorithmiques ultra-rapides sur de petits écarts", "Une méthode d'analyse fondamentale", "Un type d'ordre limité au marché obligataire"], correct: 1 },
  { id: 13, deck: "marche", sub: "Taux & Obligations", q: "Comment évolue le prix d'une obligation quand les taux montent ?", a: "Le prix baisse : relation inverse entre taux d'intérêt et prix obligataire, car les flux futurs sont actualisés à un taux plus élevé.", options: ["Il monte", "Il baisse", "Il reste stable", "Cela dépend du coupon"], correct: 1 },
  { id: 14, deck: "marche", sub: "Taux & Obligations", q: "Qu'est-ce que la duration d'une obligation ?", a: "La sensibilité (approximativement linéaire) du prix de l'obligation à une variation des taux, exprimée en années.", options: ["La maturité résiduelle", "La sensibilité du prix aux taux", "Le taux de coupon", "Le rendement à l'échéance"], correct: 1 },
  { id: 15, deck: "marche", sub: "Taux & Obligations", q: "Qu'est-ce que le YTM (Yield to Maturity) ?", a: "Le taux de rendement actuariel qui égalise le prix de marché de l'obligation à la valeur actualisée de tous ses flux futurs.", options: ["Le taux de coupon annuel", "Le rendement actuariel jusqu'à l'échéance", "Le taux sans risque", "Le spread de crédit"], correct: 1 },
  { id: 16, deck: "marche", sub: "Taux & Obligations", q: "Qu'est-ce qu'une courbe des taux inversée ?", a: "Une situation où les taux courts sont plus élevés que les taux longs, souvent perçue comme un signal avancé de récession.", options: ["Taux longs > taux courts", "Taux courts > taux longs", "Tous les taux sont égaux", "Les taux sont négatifs"], correct: 1 },
  { id: 17, deck: "marche", sub: "Taux & Obligations", q: "Qu'est-ce que le spread de crédit d'une obligation ?", a: "L'écart de rendement entre une obligation risquée et une obligation sans risque de même maturité, reflétant le risque de défaut perçu.", options: ["L'écart entre taux fixe et taux variable", "L'écart de rendement lié au risque de défaut", "L'écart entre prix d'achat et de vente", "Le coupon moins l'inflation"], correct: 1 },
  { id: 18, deck: "marche", sub: "Taux & Obligations", q: "À quoi sert une notation de crédit (rating) ?", a: "Elle évalue la solvabilité d'un émetteur (État, entreprise) et sa capacité à rembourser sa dette, attribuée par des agences comme S&P ou Moody's.", options: ["Elle fixe le taux de coupon", "Elle évalue la solvabilité de l'émetteur", "Elle mesure la liquidité du titre", "Elle indique la devise d'émission"], correct: 1 },
  { id: 19, deck: "marche", sub: "Taux & Obligations", q: "Qu'est-ce que la convexité d'une obligation ?", a: "Une mesure de la courbure de la relation prix/taux, qui complète la duration pour estimer plus précisément l'effet des grandes variations de taux.", options: ["Un synonyme de la duration", "La courbure de la relation prix/taux", "Le risque de défaut de l'émetteur", "La fréquence des coupons"], correct: 1 },
  { id: 20, deck: "marche", sub: "Taux & Obligations", q: "Qu'est-ce qu'une obligation zéro-coupon ?", a: "Une obligation qui ne verse aucun coupon durant sa vie, émise en dessous du pair et remboursée à sa valeur nominale à l'échéance.", options: ["Une obligation à taux variable", "Une obligation sans coupon, émise avec décote", "Une obligation perpétuelle", "Une obligation convertible en actions"], correct: 1 },
  { id: 21, deck: "marche", sub: "Taux & Obligations", q: "Qu'est-ce qu'une FRN (Floating Rate Note) ?", a: "Une obligation à taux variable, dont le coupon est indexé sur un taux de référence (ex. SOFR) plus une marge fixe.", options: ["Une obligation à taux fixe", "Une obligation à taux variable indexée sur un taux de référence", "Une obligation convertible", "Une obligation zéro-coupon"], correct: 1 },
  { id: 22, deck: "marche", sub: "Taux & Obligations", q: "Qu'est-ce qu'une obligation callable ?", a: "Une obligation que l'émetteur peut rembourser par anticipation avant l'échéance, généralement à un prix prédéfini.", options: ["Une obligation que le détenteur peut revendre à tout moment", "Une obligation remboursable par anticipation par l'émetteur", "Une obligation sans risque de crédit", "Une obligation indexée sur l'inflation"], correct: 1 },
  { id: 23, deck: "marche", sub: "Taux & Obligations", q: "Qu'est-ce que le spread OAS (Option-Adjusted Spread) ?", a: "Un spread de crédit ajusté de la valeur des options intégrées à l'obligation (comme une clause de remboursement anticipé).", options: ["Le spread brut sans ajustement", "Le spread ajusté de la valeur des options intégrées", "Le spread entre deux devises", "La différence entre YTM et coupon"], correct: 1 },
  { id: 24, deck: "marche", sub: "Taux & Obligations", q: "Qu'appelle-t-on le 'pull to par' d'une obligation ?", a: "La convergence progressive du prix de marché d'une obligation vers sa valeur nominale (le pair) à mesure qu'elle approche de l'échéance.", options: ["La hausse du prix au-delà du pair", "La convergence du prix vers la valeur nominale à l'échéance", "La baisse continue du coupon", "L'augmentation de la duration dans le temps"], correct: 1 },
  { id: 25, deck: "marche", sub: "Dérivés", q: "Quelle est la différence entre un future et un forward ?", a: "Le future est standardisé et coté sur un marché organisé avec appels de marge quotidiens ; le forward est un contrat de gré à gré (OTC).", options: ["Aucune différence", "Le future est coté et standardisé, le forward est OTC", "Le forward est coté, le future est OTC", "Le future ne concerne que les devises"], correct: 1 },
  { id: 26, deck: "marche", sub: "Dérivés", q: "Qu'est-ce qu'un swap de taux d'intérêt (IRS) ?", a: "Un échange de flux d'intérêts entre deux parties, typiquement taux fixe contre taux variable, sur un notionnel donné.", options: ["Un échange de devises", "Un échange de flux fixe contre variable", "Un achat d'obligation", "Une option sur indice"], correct: 1 },
  { id: 27, deck: "marche", sub: "Dérivés", q: "Qu'est-ce que le payoff d'un call à maturité ?", a: "max(S − K, 0), où S est le prix du sous-jacent et K le strike.", options: ["max(K − S, 0)", "max(S − K, 0)", "S − K", "min(S, K)"], correct: 1 },
  { id: 28, deck: "marche", sub: "Dérivés", q: "Qu'est-ce qu'un CDS (Credit Default Swap) ?", a: "Un contrat d'assurance contre le défaut d'un émetteur : l'acheteur paie une prime périodique et reçoit un paiement en cas d'événement de crédit.", options: ["Une assurance contre le risque de change", "Une assurance contre le défaut d'un émetteur", "Un swap de taux", "Une option sur obligation"], correct: 1 },
  { id: 29, deck: "marche", sub: "Dérivés", q: "Quelle est la différence entre une option américaine et une option européenne ?", a: "L'américaine peut être exercée à n'importe quel moment jusqu'à sa maturité, l'européenne seulement à la date d'échéance.", options: ["L'américaine est toujours moins chère", "L'américaine peut être exercée à tout moment, l'européenne seulement à l'échéance", "Seule l'américaine existe sur actions", "L'européenne peut être exercée à tout moment"], correct: 1 },
  { id: 30, deck: "marche", sub: "Dérivés", q: "Que dit la relation de parité call-put ?", a: "C − P = S − Ke^(−rt) : elle relie le prix du call, du put, du sous-jacent et du strike actualisé, pour des options européennes de mêmes strike et maturité.", options: ["Le call et le put ont toujours le même prix", "Elle relie C, P, S et K actualisé", "Elle ne s'applique qu'aux options américaines", "Elle ignore le taux sans risque"], correct: 1 },
  { id: 31, deck: "marche", sub: "Dérivés", q: "Qu'est-ce qu'une option à barrière ?", a: "Une option dont l'existence dépend du franchissement d'un niveau de prix prédéfini par le sous-jacent (knock-in ou knock-out).", options: ["Une option toujours exerçable", "Une option activée ou désactivée selon un niveau de prix franchi", "Une option sans strike", "Une option uniquement sur indices"], correct: 1 },
  { id: 32, deck: "marche", sub: "Dérivés", q: "Qu'est-ce qu'un appel de marge (margin call) ?", a: "Une demande de dépôt de garantie supplémentaire adressée à un investisseur dont la position a perdu en valeur, pour restaurer la marge requise.", options: ["Un remboursement automatique de la position", "Une demande de garantie supplémentaire suite à une perte", "Une clôture forcée systématique de la position", "Un ajustement du strike de l'option"], correct: 1 },
  { id: 33, deck: "marche", sub: "Dérivés", q: "Qu'est-ce qu'une swaption ?", a: "Une option donnant le droit, mais non l'obligation, d'entrer dans un swap de taux d'intérêt à une date future.", options: ["Un swap obligatoire à terme", "Une option d'entrer dans un swap de taux futur", "Un swap de devises uniquement", "Une option sur indice obligataire"], correct: 1 },
  { id: 34, deck: "marche", sub: "Dérivés", q: "Qu'est-ce que la couverture delta-neutre ?", a: "Une stratégie qui ajuste continuellement la position en sous-jacent pour annuler l'exposition directionnelle d'un portefeuille d'options (Delta global = 0).", options: ["Une stratégie qui maximise le Delta", "Une stratégie annulant l'exposition directionnelle du portefeuille", "Une couverture uniquement via des futures", "Une stratégie sans rééquilibrage"], correct: 1 },
  { id: 35, deck: "marche", sub: "Dérivés", q: "À quoi sert un forward de change ?", a: "Il fixe aujourd'hui le taux de change applicable à une transaction en devises qui aura lieu à une date future, éliminant le risque de change.", options: ["Il spécule sur la hausse d'une devise sans engagement", "Il fixe à l'avance le taux de change d'une transaction future", "Il permet d'emprunter dans une devise étrangère", "Il n'existe que sur les marchés organisés"], correct: 1 },
  { id: 36, deck: "marche", sub: "Dérivés", q: "Qu'est-ce qu'un warrant ?", a: "Une option émise par une institution financière, souvent cotée en bourse comme un titre, donnant le droit d'acheter ou vendre un actif sous-jacent.", options: ["Une obligation convertible", "Une option émise et cotée, donnant droit d'acheter/vendre un actif", "Un certificat de dépôt bancaire", "Un future sur matières premières"], correct: 1 },
  { id: 37, deck: "marche", sub: "Change", q: "Qu'est-ce que la parité de pouvoir d'achat (PPA) ?", a: "La théorie selon laquelle le taux de change entre deux monnaies s'ajuste pour égaliser le prix d'un même panier de biens dans les deux pays.", options: ["L'égalité des taux d'intérêt", "L'égalisation du prix des biens entre pays", "L'équilibre de la balance commerciale", "La fixité des taux de change"], correct: 1 },
  { id: 38, deck: "marche", sub: "Change", q: "Que dit la relation de parité des taux d'intérêt couverte ?", a: "Le différentiel de taux d'intérêt entre deux devises est compensé par le différentiel entre le taux forward et le taux spot, empêchant l'arbitrage.", options: ["Les taux d'intérêt sont toujours égaux", "Le différentiel de taux est reflété dans le forward", "Le spot égale toujours le forward", "L'inflation n'a pas d'effet sur le change"], correct: 1 },
  { id: 39, deck: "marche", sub: "Change", q: "Qu'est-ce qu'un carry trade ?", a: "Emprunter dans une devise à taux bas pour investir dans une devise à taux élevé, en pariant sur la stabilité du taux de change.", options: ["Un arbitrage sur obligations", "Emprunter à taux bas pour investir à taux haut", "Une couverture de change parfaite", "Un swap de devises sans risque"], correct: 1 },
  { id: 40, deck: "marche", sub: "Change", q: "Qu'est-ce qu'un NDF (Non-Deliverable Forward) ?", a: "Un contrat à terme sur une devise non convertible ou peu liquide, réglé en cash dans une devise convertible (souvent USD) plutôt que par livraison physique.", options: ["Un forward classique livrable", "Un forward réglé en cash sur devise non convertible", "Une option sur devise", "Un swap de devises perpétuel"], correct: 1 },
  { id: 41, deck: "marche", sub: "Change", q: "Qu'est-ce que l'arbitrage triangulaire ?", a: "Une stratégie exploitant une incohérence entre trois taux de change croisés (ex. EUR/USD, USD/JPY, EUR/JPY) pour réaliser un profit sans risque.", options: ["Un pari directionnel sur trois devises", "L'exploitation d'une incohérence entre trois taux croisés", "Une couverture sur trois maturités différentes", "Un swap impliquant trois contreparties"], correct: 1 },
  { id: 42, deck: "marche", sub: "Change", q: "Pourquoi une banque centrale intervient-elle sur le marché des changes ?", a: "Pour influencer le cours de sa devise, en achetant ou vendant des devises étrangères, souvent afin de limiter une appréciation ou dépréciation jugée excessive.", options: ["Uniquement pour générer du profit", "Pour influencer le cours de sa devise", "Pour fixer le taux directeur", "Pour émettre de nouvelles obligations"], correct: 1 },
  { id: 43, deck: "marche", sub: "Change", q: "Qu'est-ce que le taux de change réel ?", a: "Le taux de change nominal ajusté du différentiel d'inflation entre les deux pays, reflétant la compétitivité relative réelle.", options: ["Le taux de change coté sur le marché", "Le taux nominal ajusté du différentiel d'inflation", "Le taux fixé par la banque centrale", "Le taux moyen sur 10 ans"], correct: 1 },
  { id: 44, deck: "marche", sub: "Gestion des risques", q: "Qu'est-ce que la VaR (Value at Risk) à 99% sur 1 jour ?", a: "La perte maximale qui ne devrait pas être dépassée avec 99% de probabilité sur un horizon d'un jour.", options: ["La perte moyenne quotidienne", "La perte maximale théorique absolue", "La perte non dépassée avec 99% de probabilité sur 1 jour", "Le capital réglementaire minimum"], correct: 2 },
  { id: 45, deck: "marche", sub: "Gestion des risques", q: "Quelle est la limite principale de la VaR ?", a: "Elle ne dit rien sur l'ampleur des pertes au-delà du seuil (queue de distribution) — c'est pourquoi on utilise aussi l'Expected Shortfall (CVaR).", options: ["Elle est trop complexe à calculer", "Elle ignore l'ampleur des pertes extrêmes au-delà du seuil", "Elle ne s'applique qu'aux actions", "Elle surestime toujours le risque"], correct: 1 },
  { id: 46, deck: "marche", sub: "Gestion des risques", q: "Qu'est-ce que le risque de contrepartie ?", a: "Le risque qu'une contrepartie fasse défaut avant l'échéance d'un contrat, ne pouvant honorer ses engagements.", options: ["Le risque de variation du marché", "Le risque que la contrepartie fasse défaut", "Le risque de change", "Le risque de liquidité"], correct: 1 },
  { id: 47, deck: "marche", sub: "Gestion des risques", q: "À quoi sert un stress test ?", a: "À simuler des scénarios de marché extrêmes mais plausibles pour évaluer la résistance d'un portefeuille ou d'une institution financière.", options: ["À prévoir précisément les prix futurs", "À simuler des scénarios extrêmes pour tester la résistance", "À calculer le rendement moyen historique", "À fixer les limites de trading quotidiennes"], correct: 1 },
  { id: 48, deck: "marche", sub: "Gestion des risques", q: "Qu'est-ce que le risque de liquidité ?", a: "Le risque de ne pas pouvoir dénouer une position rapidement sans provoquer un impact significatif et défavorable sur son prix.", options: ["Le risque de défaut d'une contrepartie", "Le risque de ne pas pouvoir dénouer une position sans impact de prix", "Le risque de change", "Le risque lié à la volatilité implicite"], correct: 1 },
  { id: 49, deck: "marche", sub: "Gestion des risques", q: "Qu'est-ce que le risque opérationnel ?", a: "Le risque de perte résultant de défaillances de processus internes, de systèmes, d'erreurs humaines ou d'événements externes.", options: ["Le risque de marché lié à la volatilité", "Le risque de perte lié aux processus, systèmes ou erreurs humaines", "Le risque de taux de change", "Le risque de contrepartie"], correct: 1 },
  { id: 50, deck: "marche", sub: "Gestion des risques", q: "Qu'est-ce que le ratio de levier sous Bâle III ?", a: "Le rapport entre le capital de la banque et son exposition totale, sans pondération par le risque, pour limiter l'endettement excessif.", options: ["Capital pondéré du risque / actifs pondérés", "Capital / exposition totale non pondérée", "Dette / capitaux propres", "Actifs liquides / passifs court terme"], correct: 1 },
  { id: 51, deck: "marche", sub: "Gestion des risques", q: "Que mesure le ratio CET1 (Common Equity Tier 1) ?", a: "Le rapport entre le capital de meilleure qualité d'une banque et ses actifs pondérés du risque, indicateur clé de solvabilité réglementaire.", options: ["La liquidité à court terme de la banque", "Le capital de meilleure qualité / actifs pondérés du risque", "Le rendement sur fonds propres", "Le ratio de levier brut"], correct: 1 },
  { id: 52, deck: "marche", sub: "Gestion des risques", q: "Qu'est-ce que le netting entre contreparties ?", a: "La compensation des positions et flux entre deux contreparties pour réduire l'exposition nette au risque de contrepartie.", options: ["L'augmentation du nombre de contrats", "La compensation des positions pour réduire l'exposition nette", "Un type d'appel de marge", "Une méthode de calcul de la VaR"], correct: 1 },
  { id: 53, deck: "marche", sub: "Gestion des risques", q: "Qu'est-ce que la dépendance de queue (tail dependency) ?", a: "La tendance de plusieurs actifs à chuter fortement de manière simultanée en période de crise, même s'ils semblent peu corrélés en temps normal.", options: ["Une corrélation constante quel que soit le contexte", "La tendance des actifs à chuter ensemble en période de crise", "Un indicateur de liquidité", "La volatilité moyenne d'un portefeuille"], correct: 1 },
  { id: 54, deck: "marche", sub: "Marchés monétaires", q: "Qu'est-ce qu'un repo (pension livrée) ?", a: "La vente d'un titre avec un engagement simultané de rachat à une date et un prix fixés à l'avance ; c'est un financement collatéralisé de court terme.", options: ["Un prêt bancaire sans garantie", "Une vente de titre avec engagement de rachat à terme", "Un swap de taux d'intérêt", "Une émission obligataire perpétuelle"], correct: 1 },
  { id: 55, deck: "marche", sub: "Marchés monétaires", q: "Qu'est-ce que le taux directeur d'une banque centrale ?", a: "Le taux fixé par la banque centrale, qui sert de référence et influence l'ensemble des taux du marché monétaire et du crédit.", options: ["Le taux moyen des obligations d'État", "Le taux fixé par la banque centrale, référence du marché", "Le taux interbancaire au jour le jour uniquement", "Le taux appliqué aux particuliers"], correct: 1 },
  { id: 56, deck: "marche", sub: "Marchés monétaires", q: "Qu'est-ce que le SOFR (Secured Overnight Financing Rate) ?", a: "Un taux de référence basé sur des transactions repo réelles au jour le jour, ayant remplacé le LIBOR comme référence pour le dollar.", options: ["Le taux directeur de la BCE", "Un taux de référence basé sur des transactions repo, successeur du LIBOR", "Un indice boursier américain", "Le taux appliqué aux obligations d'État"], correct: 1 },
  { id: 57, deck: "marche", sub: "Marchés monétaires", q: "Qu'est-ce que le quantitative easing (QE) ?", a: "Une politique monétaire non conventionnelle d'achats massifs d'actifs par la banque centrale, visant à injecter des liquidités et faire baisser les taux longs.", options: ["Une hausse des taux directeurs", "Des achats massifs d'actifs par la banque centrale", "Une émission de monnaie physique uniquement", "Une réduction des réserves obligatoires"], correct: 1 },
  { id: 58, deck: "marche", sub: "Marchés monétaires", q: "Que sont les opérations d'open market ?", a: "Des achats ou ventes de titres par la banque centrale sur le marché, utilisés pour piloter la liquidité bancaire et le niveau des taux courts.", options: ["Des prêts directs aux entreprises", "Des achats/ventes de titres par la banque centrale pour piloter la liquidité", "Des interventions sur le marché des changes uniquement", "Des émissions de nouvelles obligations d'État"], correct: 1 },
  { id: 59, deck: "marche", sub: "Marchés monétaires", q: "Qu'est-ce qu'un taux interbancaire (ex. €STR) ?", a: "Le taux auquel les banques se prêtent des liquidités entre elles au jour le jour, indicateur clé des conditions de financement à court terme.", options: ["Le taux appliqué aux crédits immobiliers", "Le taux auquel les banques se prêtent entre elles au jour le jour", "Le taux directeur fixé par la banque centrale", "Le rendement des obligations d'État à 10 ans"], correct: 1 },
  { id: 60, deck: "marche", sub: "Marchés monétaires", q: "Que sont les réserves obligatoires ?", a: "Le montant minimum de liquidités que les banques commerciales doivent déposer auprès de la banque centrale, en pourcentage de leurs dépôts.", options: ["Le capital minimum réglementaire (CET1)", "Le montant minimum déposé obligatoirement à la banque centrale", "La garantie exigée sur un prêt", "Le montant assuré par le fonds de garantie des dépôts"], correct: 1 },
  { id: 61, deck: "marche", sub: "Produits structurés", q: "Qu'est-ce qu'un produit autocall ?", a: "Un produit structuré remboursé automatiquement par anticipation si une condition (souvent un niveau de barrière) est atteinte à une date d'observation.", options: ["Un produit toujours détenu jusqu'à l'échéance", "Un produit remboursé automatiquement si une barrière est atteinte", "Une obligation convertible classique", "Un fonds indiciel à capital garanti"], correct: 1 },
  { id: 62, deck: "marche", sub: "Produits structurés", q: "Qu'est-ce qu'une option barrière 'knock-out' ?", a: "Une option qui cesse d'exister (s'annule) si le sous-jacent atteint un niveau de prix prédéfini avant l'échéance.", options: ["Une option qui s'active au franchissement d'une barrière", "Une option qui disparaît si une barrière est franchie", "Une option toujours exerçable", "Une option sans strike défini"], correct: 1 },
  { id: 63, deck: "marche", sub: "Produits structurés", q: "Quelle est la différence entre un ETF et un fonds indiciel classique ?", a: "L'ETF se négocie en continu en bourse comme une action, tandis que le fonds indiciel classique n'est valorisé et échangé qu'une fois par jour.", options: ["Aucune différence significative", "L'ETF se négocie en continu, le fonds classique une fois par jour", "Le fonds classique se négocie en continu, pas l'ETF", "Seul l'ETF réplique un indice"], correct: 1 },
  { id: 64, deck: "marche", sub: "Produits structurés", q: "Qu'est-ce qu'un CLN (Credit Linked Note) ?", a: "Une obligation dont le remboursement dépend de la survenance ou non d'un événement de crédit sur une entité de référence tierce.", options: ["Une obligation classique sans risque de crédit lié à un tiers", "Une obligation dont le remboursement dépend d'un événement de crédit sur une entité tierce", "Un swap de taux d'intérêt", "Une action convertible en obligation"], correct: 1 },
  { id: 65, deck: "marche", sub: "Produits structurés", q: "Comment fonctionne un produit structuré à capital garanti ?", a: "Il combine généralement une obligation zéro-coupon (qui reconstitue le capital à l'échéance) et une option (qui offre un potentiel de performance).", options: ["Il investit 100% en actions sans protection", "Il combine une obligation zéro-coupon et une option", "Il garantit un rendement fixe élevé sans risque", "Il n'utilise aucun instrument dérivé"], correct: 1 },
  { id: 66, deck: "quant", sub: "Calcul stochastique", q: "Qu'est-ce qu'un mouvement brownien standard ?", a: "Un processus stochastique à accroissements indépendants et gaussiens, tel que $W_0=0$ et $W_t - W_s \\sim \\mathcal{N}(0, t-s)$ pour $s<t$, de variance égale au temps écoulé.", options: ["Un processus déterministe", "Un processus à accroissements gaussiens indépendants", "Une suite de nombres aléatoires uniformes", "Un processus à mémoire longue"], correct: 1 },
  { id: 67, deck: "quant", sub: "Calcul stochastique", q: "Que dit le lemme d'Itô intuitivement ?", a: "C'est la formule de dérivation en chaîne pour les processus stochastiques. Pour $dX_t = \\mu\\,dt + \\sigma\\,dW_t$, on a $$df(X_t,t) = \\left(\\frac{\\partial f}{\\partial t} + \\mu\\frac{\\partial f}{\\partial x} + \\frac{1}{2}\\sigma^2\\frac{\\partial^2 f}{\\partial x^2}\\right)dt + \\sigma\\frac{\\partial f}{\\partial x}\\,dW_t$$ le terme en $\\frac{1}{2}\\sigma^2 f''$ étant le terme de convexité absent du calcul classique.", options: ["Une méthode d'intégration numérique", "La règle de dérivation en chaîne pour processus stochastiques", "Un test de normalité", "Une méthode de simulation de Monte-Carlo"], correct: 1 },
  { id: 68, deck: "quant", sub: "Calcul stochastique", q: "Qu'est-ce qu'une mesure risque-neutre ?", a: "Une mesure de probabilité $\\mathbb{Q}$ sous laquelle le prix actualisé de tout actif est une martingale : $$\\frac{V_t}{B_t} = \\mathbb{E}^{\\mathbb{Q}}\\left[\\frac{V_T}{B_T}\\,\\Big|\\,\\mathcal{F}_t\\right]$$ ce qui permet de pricer sans référence à l'aversion au risque des agents.", options: ["La probabilité historique réelle", "Une mesure sous laquelle les actifs actualisés sont des martingales", "Une mesure qui élimine toute volatilité", "La probabilité de défaut"], correct: 1 },
  { id: 69, deck: "quant", sub: "Calcul stochastique", q: "Qu'est-ce que le processus d'Ornstein-Uhlenbeck ?", a: "Un processus stochastique à retour à la moyenne, défini par $$dX_t = \\theta(\\mu - X_t)\\,dt + \\sigma\\,dW_t$$ où $\\theta$ est la vitesse de retour, $\\mu$ la moyenne de long terme, souvent utilisé pour modéliser les taux d'intérêt.", options: ["Un processus purement aléatoire sans structure", "Un processus à retour à la moyenne", "Un processus toujours croissant", "Un processus discret"], correct: 1 },
  { id: 70, deck: "quant", sub: "Calcul stochastique", q: "Qu'est-ce qu'une martingale ?", a: "Un processus stochastique dont l'espérance conditionnelle future, sachant le présent, est égale à la valeur actuelle : $$\\mathbb{E}[X_t \\mid \\mathcal{F}_s] = X_s \\quad \\text{pour } s < t$$", options: ["Un processus toujours croissant", "Un processus dont l'espérance future conditionnelle égale la valeur présente", "Un processus déterministe", "Un processus à variance nulle"], correct: 1 },
  { id: 71, deck: "quant", sub: "Calcul stochastique", q: "À quoi sert le théorème de Girsanov ?", a: "Il permet de changer de mesure de probabilité en modifiant la dérive d'un processus stochastique sans changer sa volatilité, via une dérivée de Radon-Nikodym $\\frac{d\\mathbb{Q}}{d\\mathbb{P}}$ — clé du passage à la mesure risque-neutre en pricing.", options: ["À calculer la volatilité implicite", "À changer de mesure de probabilité en modifiant la dérive du processus", "À résoudre une EDP de second ordre", "À estimer un beta variable dans le temps"], correct: 1 },
  { id: 72, deck: "quant", sub: "Calcul stochastique", q: "Qu'est-ce qu'une équation différentielle stochastique (EDS) ?", a: "Une équation de la forme $$dX_t = \\mu(X_t,t)\\,dt + \\sigma(X_t,t)\\,dW_t$$ combinant une composante déterministe (dérive $\\mu$) et une composante aléatoire (diffusion $\\sigma\\,dW_t$).", options: ["Une équation purement déterministe", "Une équation combinant dérive déterministe et bruit aléatoire", "Une équation résolue uniquement numériquement", "Un système d'équations linéaires classique"], correct: 1 },
  { id: 73, deck: "quant", sub: "Calcul stochastique", q: "Que relie la formule de Feynman-Kac ?", a: "Elle relie la solution d'une EDP à une espérance sous une mesure de probabilité : si $u(t,x)=\\mathbb{E}\\left[e^{-r(T-t)}\\phi(X_T)\\mid X_t=x\\right]$, alors $u$ vérifie $$\\frac{\\partial u}{\\partial t} + \\mu\\frac{\\partial u}{\\partial x} + \\frac{1}{2}\\sigma^2\\frac{\\partial^2 u}{\\partial x^2} - ru = 0$$ — c'est ce lien qui justifie le pricing d'options par Monte-Carlo.", options: ["Deux mesures de probabilité entre elles", "Une EDP à une espérance sous une mesure de probabilité", "La volatilité implicite et historique", "Le prix spot et le prix forward"], correct: 1 },
  { id: 74, deck: "quant", sub: "Calcul stochastique", q: "Qu'est-ce qu'une filtration en calcul stochastique ?", a: "Un ensemble croissant d'informations disponibles au cours du temps, représentant ce qui est connu à chaque instant dans un modèle stochastique.", options: ["Une méthode de réduction du bruit", "Un ensemble croissant d'informations disponibles dans le temps", "Un filtre numérique pour lisser une série", "Une mesure de la volatilité future"], correct: 1 },
  { id: 75, deck: "quant", sub: "Pricing d'options", q: "Quelles sont les hypothèses clés du modèle de Black-Scholes ?", a: "Volatilité et taux sans risque constants, sous-jacent suivant un mouvement brownien géométrique $$dS_t = \\mu S_t\\,dt + \\sigma S_t\\,dW_t$$ pas de coûts de transaction, marchés sans arbitrage.", options: ["Volatilité stochastique et taux variable", "Volatilité et taux constants, log-normalité du sous-jacent", "Sous-jacent suivant une marche binomiale uniquement", "Présence de dividendes discrets obligatoires"], correct: 1 },
  { id: 76, deck: "quant", sub: "Pricing d'options", q: "Qu'est-ce que la volatilité implicite ?", a: "La volatilité qui, injectée dans un modèle de pricing (ex: Black-Scholes), redonne le prix de marché observé de l'option.", options: ["La volatilité historique réalisée", "La volatilité qui égalise le prix modèle au prix de marché", "La volatilité moyenne sur 10 ans", "La volatilité du taux sans risque"], correct: 1 },
  { id: 77, deck: "quant", sub: "Pricing d'options", q: "Qu'est-ce que le 'smile de volatilité' ?", a: "La courbe montrant que la volatilité implicite varie selon le strike, contredisant l'hypothèse de volatilité constante de Black-Scholes.", options: ["La volatilité constante quel que soit le strike", "La variation de volatilité implicite selon le strike", "La volatilité des taux d'intérêt", "Un indicateur de tendance haussière"], correct: 1 },
  { id: 78, deck: "quant", sub: "Pricing d'options", q: "Comment fonctionne le modèle binomial de Cox-Ross-Rubinstein ?", a: "Il discrétise le temps en pas de taille $\\Delta t$ avec $u=e^{\\sigma\\sqrt{\\Delta t}}$, $d=1/u$, et une probabilité risque-neutre $$p = \\frac{e^{r\\Delta t} - d}{u - d}$$ puis actualise les payoffs par récurrence arrière.", options: ["Il résout une EDP en continu", "Il discrétise le prix en arbre à deux issues par pas", "Il utilise uniquement des simulations Monte-Carlo", "Il suppose un sous-jacent déterministe"], correct: 1 },
  { id: 79, deck: "quant", sub: "Pricing d'options", q: "Que représente l'équation aux dérivées partielles de Black-Scholes ?", a: "L'EDP que doit vérifier le prix $V(S,t)$ de toute option sur le sous-jacent modélisé : $$\\frac{\\partial V}{\\partial t} + rS\\frac{\\partial V}{\\partial S} + \\frac{1}{2}\\sigma^2 S^2\\frac{\\partial^2 V}{\\partial S^2} - rV = 0$$", options: ["Une équation valable seulement pour les calls européens", "Une EDP vérifiée par le prix de toute option sur le sous-jacent modélisé", "Une équation reliant volatilité historique et implicite", "Une formule fermée pour les options américaines"], correct: 1 },
  { id: 80, deck: "quant", sub: "Pricing d'options", q: "Comment fonctionne le pricing d'options par Monte-Carlo ?", a: "On simule $N$ trajectoires du sous-jacent sous $\\mathbb{Q}$, puis on estime $$V_0 \\approx e^{-rT}\\frac{1}{N}\\sum_{i=1}^N \\text{payoff}\\left(S_T^{(i)}\\right)$$ en moyennant les payoffs actualisés.", options: ["On résout directement l'EDP de Black-Scholes", "On simule de nombreuses trajectoires et on moyenne les payoffs actualisés", "On utilise uniquement les prix historiques", "On calcule la volatilité implicite moyenne"], correct: 1 },
  { id: 81, deck: "quant", sub: "Pricing d'options", q: "Comment ajuste-t-on Black-Scholes en présence de dividendes ?", a: "On remplace le sous-jacent $S_0$ par $S_0 e^{-qT}$ dans la formule (rendement de dividende continu $q$), ce qui revient à diminuer le prix spot de la valeur actualisée des dividendes attendus avant maturité.", options: ["On augmente la volatilité implicite", "On diminue le sous-jacent de la VA des dividendes attendus", "On ignore les dividendes dans le modèle", "On augmente le taux sans risque"], correct: 1 },
  { id: 82, deck: "quant", sub: "Pricing d'options", q: "Pourquoi le pricing d'une option américaine est-il plus complexe ?", a: "Car l'exercice anticipé possible à tout moment supprime généralement toute formule fermée ; on utilise l'arbre binomial ou des méthodes de Monte-Carlo (ex. Longstaff-Schwartz).", options: ["Parce qu'elle n'a pas de valeur temps", "Car l'exercice anticipé complique le pricing, sans formule fermée générale", "Parce qu'elle ne peut être couverte", "Parce qu'elle n'existe que sur le change"], correct: 1 },
  { id: 83, deck: "quant", sub: "Pricing d'options", q: "Quelle est la différence entre volatilité historique et volatilité implicite ?", a: "La volatilité historique est calculée à partir des rendements passés observés, tandis que l'implicite est déduite des prix actuels des options sur le marché.", options: ["Elles sont toujours identiques", "L'historique vient du passé, l'implicite est déduite des prix de marché actuels", "L'implicite est toujours plus faible que l'historique", "Seule l'historique est utilisée en pratique"], correct: 1 },
  { id: 84, deck: "quant", sub: "Grecques", q: "Que mesure le Delta d'une option ?", a: "La sensibilité $\\Delta = \\frac{\\partial V}{\\partial S}$. Pour un call européen Black-Scholes : $$\\Delta_{call} = N(d_1), \\quad d_1 = \\frac{\\ln(S/K) + (r+\\sigma^2/2)T}{\\sigma\\sqrt{T}}$$", options: ["La sensibilité au temps", "La sensibilité au sous-jacent", "La sensibilité à la volatilité", "La sensibilité au taux d'intérêt"], correct: 1 },
  { id: 85, deck: "quant", sub: "Grecques", q: "Que mesure le Gamma d'une option ?", a: "La convexité $\\Gamma = \\frac{\\partial^2 V}{\\partial S^2}$. Pour Black-Scholes : $$\\Gamma = \\frac{N'(d_1)}{S\\sigma\\sqrt{T}}$$ identique pour un call et un put de même strike/maturité.", options: ["La variation du Delta", "La sensibilité au temps", "La sensibilité à la volatilité", "Le taux de décroissance temporelle"], correct: 0 },
  { id: 86, deck: "quant", sub: "Grecques", q: "Que mesure le Vega d'une option ?", a: "La sensibilité à la volatilité $\\nu = \\frac{\\partial V}{\\partial \\sigma}$. Pour Black-Scholes : $$\\nu = S\\,N'(d_1)\\sqrt{T}$$", options: ["La sensibilité au temps", "La sensibilité à la volatilité", "La sensibilité au taux sans risque", "La sensibilité au dividende"], correct: 1 },
  { id: 87, deck: "quant", sub: "Grecques", q: "Que mesure le Theta d'une option ?", a: "La décroissance temporelle $\\Theta = \\frac{\\partial V}{\\partial t}$. Pour un call Black-Scholes : $$\\Theta_{call} = -\\frac{S\\,N'(d_1)\\sigma}{2\\sqrt{T}} - rKe^{-rT}N(d_2)$$", options: ["La sensibilité au sous-jacent", "La décroissance de la valeur temps", "La sensibilité au taux", "La convexité du prix"], correct: 1 },
  { id: 88, deck: "quant", sub: "Grecques", q: "Que mesure le Rho d'une option ?", a: "La sensibilité au taux sans risque $\\rho = \\frac{\\partial V}{\\partial r}$. Pour un call Black-Scholes : $$\\rho_{call} = KTe^{-rT}N(d_2)$$", options: ["La sensibilité au sous-jacent", "La sensibilité au taux d'intérêt sans risque", "La sensibilité à la volatilité", "La sensibilité au temps restant"], correct: 1 },
  { id: 89, deck: "quant", sub: "Grecques", q: "En quoi consiste le delta hedging dynamique ?", a: "À ajuster en continu la quantité de sous-jacent détenue pour maintenir un portefeuille delta-neutre face aux mouvements de marché, nécessitant un rééquilibrage fréquent.", options: ["Une couverture statique fixée une fois pour toutes", "Un ajustement continu de la couverture en sous-jacent", "Une stratégie ignorant le Gamma", "Une couverture uniquement via des options"], correct: 1 },
  { id: 90, deck: "quant", sub: "Grecques", q: "Que signifie un Gamma élevé pour une position en options ?", a: "Que le Delta varie rapidement lorsque le sous-jacent bouge, ce qui nécessite un rééquilibrage plus fréquent de la couverture delta-neutre.", options: ["Que la position est totalement insensible au sous-jacent", "Que le Delta varie rapidement, nécessitant un rééquilibrage fréquent", "Que la volatilité implicite est nulle", "Que l'option est proche de l'échéance sans risque"], correct: 1 },
  { id: 91, deck: "quant", sub: "Portefeuille", q: "Qu'est-ce que la frontière efficiente de Markowitz ?", a: "L'ensemble des portefeuilles solutions de $$\\min_w \\frac{1}{2}w^T\\Sigma w \\quad \\text{s.c. } w^T\\mu = \\mu_p,\\ w^T\\mathbf{1}=1$$ offrant le risque minimal pour chaque niveau de rendement cible $\\mu_p$.", options: ["L'ensemble de tous les portefeuilles possibles", "Les portefeuilles optimaux rendement/risque", "Le portefeuille de marché uniquement", "Les portefeuilles sans risque"], correct: 1 },
  { id: 92, deck: "quant", sub: "Portefeuille", q: "Que dit le CAPM (Capital Asset Pricing Model) ?", a: "Le rendement espéré d'un actif est linéaire en son beta : $$E[R_i] = R_f + \\beta_i\\left(E[R_m]-R_f\\right), \\quad \\beta_i = \\frac{\\text{Cov}(R_i,R_m)}{\\text{Var}(R_m)}$$", options: ["Tous les actifs ont le même rendement espéré", "Le rendement dépend uniquement de la volatilité totale", "Le rendement espéré est fonction linéaire du beta", "Le rendement est indépendant du marché"], correct: 2 },
  { id: 93, deck: "quant", sub: "Portefeuille", q: "Qu'est-ce que le ratio de Sharpe ?", a: "L'excès de rendement par unité de risque total : $$S = \\frac{E[R_p]-R_f}{\\sigma_p}$$", options: ["Rendement / beta", "(Rendement − taux sans risque) / écart-type", "Rendement / capitalisation", "Volatilité / rendement"], correct: 1 },
  { id: 94, deck: "quant", sub: "Portefeuille", q: "Qu'est-ce que le ratio d'information ?", a: "Le rendement actif rapporté à la tracking error : $$IR = \\frac{E[R_p - R_b]}{\\sigma(R_p-R_b)}$$ mesurant la qualité d'une gestion active.", options: ["Le rendement total divisé par le risque total", "Le rendement actif vs benchmark divisé par la tracking error", "Le rendement divisé par le beta", "Le rendement ajusté du taux sans risque uniquement"], correct: 1 },
  { id: 95, deck: "quant", sub: "Portefeuille", q: "Quelle est la différence entre le ratio de Treynor et le ratio de Sharpe ?", a: "Le Treynor divise l'excès de rendement par le beta : $$T = \\frac{E[R_p]-R_f}{\\beta_p}$$ alors que le Sharpe le divise par l'écart-type $\\sigma_p$ (risque total).", options: ["Ils sont strictement identiques", "Le Treynor utilise le beta, le Sharpe utilise l'écart-type", "Le Sharpe utilise le beta, le Treynor l'écart-type", "Le Treynor ignore le taux sans risque"], correct: 1 },
  { id: 96, deck: "quant", sub: "Portefeuille", q: "Qu'ajoute le modèle de Fama-French à 3 facteurs par rapport au CAPM ?", a: "Il ajoute deux facteurs : $$E[R_i]-R_f = \\beta_i(E[R_m]-R_f) + s_i\\cdot SMB + h_i\\cdot HML$$ où SMB (taille) et HML (value) complètent le beta de marché.", options: ["Uniquement un facteur momentum", "Les facteurs taille (SMB) et valeur (HML)", "Un facteur de liquidité uniquement", "Le taux de change et l'inflation"], correct: 1 },
  { id: 97, deck: "quant", sub: "Portefeuille", q: "Qu'est-ce que la tracking error ?", a: "L'écart-type de la différence de rendement entre le portefeuille et son benchmark : $$TE = \\sigma(R_p - R_b)$$", options: ["La différence moyenne de rendement uniquement", "L'écart-type de la différence de rendement vs le benchmark", "Le beta du portefeuille", "La corrélation avec le benchmark"], correct: 1 },
  { id: 98, deck: "quant", sub: "Portefeuille", q: "Pourquoi la diversification réduit-elle le risque d'un portefeuille ?", a: "Parce que combiner des actifs peu corrélés entre eux réduit la variance globale du portefeuille sans nécessairement réduire son rendement espéré.", options: ["Elle élimine tout risque, y compris systématique", "Elle réduit le risque en combinant des actifs peu corrélés", "Elle augmente toujours le rendement espéré", "Elle ne fonctionne que sur un seul actif"], correct: 1 },
  { id: 99, deck: "quant", sub: "Portefeuille", q: "Pourquoi rebalancer un portefeuille périodiquement ?", a: "Pour ramener les poids des actifs vers l'allocation cible initiale, car les performances différenciées font dériver naturellement cette allocation dans le temps.", options: ["Pour maximiser les frais de transaction", "Pour revenir à l'allocation cible après dérive des poids", "Pour éviter tout risque de marché", "Ce n'est jamais nécessaire une fois investi"], correct: 1 },
  { id: 100, deck: "quant", sub: "Séries temporelles", q: "Qu'est-ce qu'un modèle GARCH sert à modéliser ?", a: "La volatilité conditionnelle variable dans le temps. Le GARCH(1,1) s'écrit : $$\\sigma_t^2 = \\omega + \\alpha\\,\\epsilon_{t-1}^2 + \\beta\\,\\sigma_{t-1}^2$$ capturant le clustering de volatilité.", options: ["Une tendance linéaire déterministe", "Le clustering de volatilité dans le temps", "La corrélation entre deux actifs", "Le taux sans risque"], correct: 1 },
  { id: 101, deck: "quant", sub: "Séries temporelles", q: "Qu'est-ce que la stationnarité d'une série temporelle ?", a: "Une propriété où la moyenne, la variance et l'autocovariance de la série ne dépendent pas du temps.", options: ["La série est constante", "Moyenne et variance ne varient pas dans le temps", "La série n'a pas de bruit", "La série est toujours croissante"], correct: 1 },
  { id: 102, deck: "quant", sub: "Séries temporelles", q: "Que teste le test de Dickey-Fuller augmenté (ADF) ?", a: "La présence d'une racine unitaire via la régression $$\\Delta y_t = \\alpha + \\beta t + \\gamma y_{t-1} + \\sum_{i=1}^p \\delta_i \\Delta y_{t-i} + \\epsilon_t$$ en testant $H_0: \\gamma = 0$ (non-stationnarité) contre $H_1: \\gamma < 0$.", options: ["La normalité des résidus", "La présence d'une racine unitaire (non-stationnarité)", "L'hétéroscédasticité", "L'autocorrélation des résidus"], correct: 1 },
  { id: 103, deck: "quant", sub: "Séries temporelles", q: "Qu'est-ce qu'un modèle ARMA ?", a: "Un modèle ARMA(p,q) s'écrit $$y_t = c + \\sum_{i=1}^p \\phi_i y_{t-i} + \\epsilon_t + \\sum_{j=1}^q \\theta_j \\epsilon_{t-j}$$ combinant une composante autorégressive (AR) et une moyenne mobile (MA).", options: ["Un modèle uniquement basé sur la tendance", "Un modèle combinant composante autorégressive et moyenne mobile", "Un modèle de volatilité conditionnelle", "Un modèle exclusivement non-linéaire"], correct: 1 },
  { id: 104, deck: "quant", sub: "Séries temporelles", q: "Qu'est-ce qu'une marche aléatoire (random walk) ?", a: "Un processus tel que $$y_t = y_{t-1} + \\epsilon_t, \\quad \\epsilon_t \\sim iid(0,\\sigma^2)$$ où chaque valeur est la précédente plus un bruit imprévisible.", options: ["Un processus parfaitement prévisible", "Un processus où chaque valeur est la précédente plus un bruit imprévisible", "Un processus à retour à la moyenne", "Un processus toujours stationnaire"], correct: 1 },
  { id: 105, deck: "quant", sub: "Séries temporelles", q: "Qu'est-ce que la cointégration entre deux séries ?", a: "Une relation de long terme stable entre deux séries individuellement non-stationnaires, dont une combinaison linéaire redevient stationnaire.", options: ["Une simple corrélation instantanée", "Une relation de long terme stable entre séries non-stationnaires", "L'indépendance totale entre deux séries", "Une propriété exclusive aux séries stationnaires"], correct: 1 },
  { id: 106, deck: "quant", sub: "Séries temporelles", q: "Qu'est-ce que l'autocorrélation d'une série ?", a: "La corrélation d'une série avec son propre décalage : $$\\rho_k = \\frac{\\text{Cov}(y_t, y_{t-k})}{\\text{Var}(y_t)}$$", options: ["La corrélation entre deux séries différentes", "La corrélation d'une série avec ses propres valeurs passées", "La variance d'une série dans le temps", "La moyenne mobile d'une série"], correct: 1 },
  { id: 107, deck: "quant", sub: "Séries temporelles", q: "À quoi sert un filtre de Kalman en finance ?", a: "C'est un algorithme récursif permettant d'estimer un état caché (ex. un beta variable dans le temps) à partir d'observations bruitées.", options: ["À calculer une volatilité implicite", "À estimer un état caché à partir d'observations bruitées", "À tester la stationnarité d'une série", "À simuler des trajectoires de prix"], correct: 1 },
  { id: 108, deck: "quant", sub: "Statistiques & probabilités", q: "Que dit le théorème central limite ?", a: "Pour $X_1,...,X_n$ iid de moyenne $\\mu$ et variance $\\sigma^2$ : $$\\frac{\\bar{X}_n - \\mu}{\\sigma/\\sqrt{n}} \\xrightarrow{d} \\mathcal{N}(0,1) \\quad \\text{quand } n\\to\\infty$$ quelle que soit la distribution initiale des $X_i$.", options: ["Toute variable aléatoire suit une loi normale", "La somme de nombreuses variables indépendantes tend vers une loi normale", "La variance d'une série diminue toujours dans le temps", "Les rendements financiers sont toujours normaux"], correct: 1 },
  { id: 109, deck: "quant", sub: "Statistiques & probabilités", q: "Quelle est la différence entre corrélation et covariance ?", a: "La corrélation normalise la covariance : $$\\rho_{X,Y} = \\frac{\\text{Cov}(X,Y)}{\\sigma_X\\,\\sigma_Y} \\in [-1,1]$$ la rendant indépendante des unités de mesure.", options: ["Ce sont deux termes strictement identiques", "La corrélation est la covariance normalisée entre -1 et 1", "La covariance est toujours comprise entre -1 et 1", "La corrélation dépend des unités, pas la covariance"], correct: 1 },
  { id: 110, deck: "quant", sub: "Statistiques & probabilités", q: "Comment calcule-t-on une VaR paramétrique ?", a: "En supposant une distribution (souvent normale) des rendements : $$VaR_\\alpha = -\\left(\\mu + z_\\alpha\\,\\sigma\\right)\\times V_0$$ où $z_\\alpha$ est le quantile de la loi normale au seuil $\\alpha$.", options: ["En triant simplement les pertes historiques observées", "En supposant une distribution des rendements et en utilisant moyenne/écart-type", "En simulant des milliers de scénarios aléatoires", "En ignorant totalement la volatilité"], correct: 1 },
  { id: 111, deck: "quant", sub: "Statistiques & probabilités", q: "À quoi sert une copule en finance quantitative ?", a: "À modéliser la structure de dépendance entre plusieurs variables aléatoires, indépendamment de leurs distributions marginales individuelles.", options: ["À calculer la volatilité implicite d'une option", "À modéliser la dépendance entre variables indépendamment de leurs lois marginales", "À estimer un beta variable dans le temps", "À tester la stationnarité d'une série"], correct: 1 },
  { id: 112, deck: "quant", sub: "Statistiques & probabilités", q: "Que mesure l'asymétrie (skewness) d'une distribution ?", a: "Le moment centré normalisé d'ordre 3 : $$\\text{Skew} = \\mathbb{E}\\left[\\left(\\frac{X-\\mu}{\\sigma}\\right)^3\\right]$$ une skewness négative signale une queue plus longue vers les pertes extrêmes.", options: ["L'épaisseur des queues de distribution", "Le degré d'asymétrie de la distribution autour de sa moyenne", "La dispersion totale de la distribution", "La valeur moyenne de la distribution"], correct: 1 },
  { id: 113, deck: "quant", sub: "Statistiques & probabilités", q: "Que mesure le kurtosis d'une distribution ?", a: "Le moment centré normalisé d'ordre 4 : $$\\text{Kurt} = \\mathbb{E}\\left[\\left(\\frac{X-\\mu}{\\sigma}\\right)^4\\right]$$ mesurant l'épaisseur des queues (3 pour une loi normale).", options: ["L'asymétrie de la distribution", "L'épaisseur des queues par rapport à la loi normale", "La moyenne de la distribution", "La corrélation avec une autre variable"], correct: 1 },
  { id: 114, deck: "quant", sub: "Statistiques & probabilités", q: "Pourquoi utilise-t-on la loi log-normale pour modéliser les prix d'actifs ?", a: "Car en supposant $S_t = S_0\\,e^{(\\mu-\\sigma^2/2)t+\\sigma W_t}$, on a $\\ln S_T \\sim \\mathcal{N}\\left(\\ln S_0+(\\mu-\\sigma^2/2)T,\\ \\sigma^2 T\\right)$, ce qui garantit $S_t>0$ tout en gardant le rendement continu gaussien.", options: ["Car elle permet des prix négatifs", "Car elle garantit des prix positifs, le log du prix suivant une loi normale", "Car elle simplifie uniquement le calcul du Delta", "Car elle est utilisée exclusivement pour les taux d'intérêt"], correct: 1 },
  { id: 115, deck: "quant", sub: "Machine learning", q: "Qu'est-ce que le surapprentissage (overfitting) ?", a: "Un phénomène où un modèle colle trop précisément aux données d'entraînement, captant du bruit plutôt qu'un vrai signal, et généralise mal sur de nouvelles données.", options: ["Un modèle trop simple pour capter le signal", "Un modèle qui colle trop aux données d'entraînement et généralise mal", "Un modèle parfaitement calibré sans biais", "Un manque de données d'entraînement uniquement"], correct: 1 },
  { id: 116, deck: "quant", sub: "Machine learning", q: "À quoi sert le backtesting d'une stratégie ?", a: "À tester la performance d'une stratégie d'investissement sur des données historiques, avant tout déploiement en conditions réelles.", options: ["À prédire parfaitement la performance future", "À tester une stratégie sur des données historiques avant déploiement réel", "À calculer uniquement la volatilité implicite", "À valider une stratégie sans aucune donnée"], correct: 1 },
  { id: 117, deck: "quant", sub: "Machine learning", q: "Comment la régression linéaire est-elle utilisée pour estimer un beta ?", a: "En régressant $R_i = \\alpha + \\beta R_m + \\epsilon$, l'estimateur des moindres carrés donne $$\\hat\\beta = \\frac{\\text{Cov}(R_i,R_m)}{\\text{Var}(R_m)}$$", options: ["En calculant simplement la moyenne des rendements", "En régressant les rendements de l'actif sur ceux du marché, la pente donnant le beta", "En comparant deux volatilités implicites", "En utilisant uniquement les prix bruts sans rendements"], correct: 1 },
  { id: 118, deck: "quant", sub: "Machine learning", q: "À quoi sert l'analyse en composantes principales (ACP) en finance ?", a: "À réduire la dimension d'un ensemble de données en extrayant les facteurs dominants, par exemple pour résumer les mouvements d'une courbe des taux en quelques facteurs clés.", options: ["À prédire directement les prix futurs", "À réduire la dimension des données en extrayant les facteurs dominants", "À calculer une VaR paramétrique", "À tester la stationnarité d'une série"], correct: 1 },
  { id: 119, deck: "quant", sub: "Machine learning", q: "Qu'est-ce que la validation 'walk-forward' d'un modèle ?", a: "Une méthode de validation qui ré-entraîne et teste le modèle sur des fenêtres temporelles glissantes successives, afin d'éviter le biais d'anticipation (look-ahead bias).", options: ["Un entraînement unique sur toutes les données disponibles", "Un ré-entraînement et test sur des fenêtres temporelles glissantes successives", "Une validation croisée aléatoire classique", "Un test uniquement sur les données les plus récentes"], correct: 1 },
  { id: 120, deck: "marche", sub: "Actions", q: "Qu'est-ce que le ROE (Return on Equity) ?", a: "Le bénéfice net divisé par les capitaux propres, mesure la rentabilité générée pour les actionnaires.", options: ["Bénéfice net / capitaux propres", "Chiffre d'affaires / actifs totaux", "Dette / capitaux propres", "Bénéfice net / chiffre d'affaires"], correct: 0 },
  { id: 121, deck: "marche", sub: "Actions", q: "Qu'est-ce qu'une action privilégiée ?", a: "Une action donnant priorité sur le paiement du dividende et en cas de liquidation, mais généralement sans droit de vote.", options: ["Une action avec droit de vote double", "Une action prioritaire sur dividende/liquidation, sans droit de vote", "Une action réservée aux fondateurs", "Un synonyme d'action ordinaire"], correct: 1 },
  { id: 122, deck: "marche", sub: "Actions", q: "Comment calcule-t-on le rendement du dividende (dividend yield) ?", a: "En divisant le dividende annuel par action par le prix actuel de l'action.", options: ["Dividende / bénéfice net", "Dividende annuel / prix de l'action", "Prix de l'action / dividende", "Dividende / capitalisation totale"], correct: 1 },
  { id: 123, deck: "marche", sub: "Actions", q: "Qu'est-ce qu'un split d'actions (stock split) ?", a: "Une division du nominal de l'action qui multiplie le nombre d'actions en circulation sans changer la capitalisation boursière totale.", options: ["Une augmentation de capital classique", "Une division du nominal multipliant le nombre d'actions sans changer la capitalisation", "Un rachat suivi d'une annulation d'actions", "Une fusion de deux sociétés cotées"], correct: 1 },
  { id: 124, deck: "marche", sub: "Actions", q: "Qu'est-ce que le taux de distribution (payout ratio) ?", a: "La part des bénéfices versée aux actionnaires sous forme de dividendes, le reste étant réinvesti dans l'entreprise.", options: ["La part des bénéfices réinvestie uniquement", "La part des bénéfices distribuée en dividendes", "Le ratio dette / bénéfices", "Le rendement total d'une action"], correct: 1 },
  { id: 125, deck: "marche", sub: "Actions", q: "Qu'est-ce qu'une OPA (offre publique d'achat) ?", a: "Une offre faite à l'ensemble des actionnaires d'une société cible pour racheter leurs actions, souvent avec une prime sur le cours.", options: ["Une émission de nouvelles actions", "Une offre de rachat des actions d'une société cible, avec prime", "Un emprunt obligataire de la cible", "Une simple recommandation d'analyste"], correct: 1 },
  { id: 126, deck: "marche", sub: "Actions", q: "Que mesure le ratio price-to-book (P/B) ?", a: "Le prix de l'action rapporté à sa valeur comptable par action, indiquant la prime ou décote par rapport aux actifs nets comptables.", options: ["Le prix rapporté au bénéfice par action", "Le prix rapporté à la valeur comptable par action", "Le prix rapporté au chiffre d'affaires", "La dette rapportée aux capitaux propres"], correct: 1 },
  { id: 127, deck: "marche", sub: "Actions", q: "Quel est le rôle d'un market maker ?", a: "Afficher en continu des prix d'achat et de vente sur un titre pour en assurer la liquidité sur le marché.", options: ["Réguler les marchés financiers", "Afficher en continu des prix pour assurer la liquidité d'un titre", "Émettre de nouvelles actions", "Auditer les comptes des sociétés cotées"], correct: 1 },
  { id: 128, deck: "marche", sub: "Taux & Obligations", q: "Qu'est-ce que la duration modifiée ?", a: "La duration divisée par (1 + YTM/n), elle donne directement la sensibilité en pourcentage du prix de l'obligation à une variation de 1% des taux.", options: ["Un synonyme exact de la duration de Macaulay", "La duration ajustée donnant la sensibilité % du prix aux taux", "Le rendement actuariel de l'obligation", "La maturité résiduelle ajustée du coupon"], correct: 1 },
  { id: 129, deck: "marche", sub: "Taux & Obligations", q: "Qu'est-ce qu'une obligation 'putable' ?", a: "Une obligation offrant à son détenteur le droit de la revendre à l'émetteur avant l'échéance, à un prix prédéfini.", options: ["Une obligation remboursable par anticipation par l'émetteur", "Une obligation offrant au détenteur le droit de la revendre avant échéance", "Une obligation convertible en actions", "Une obligation à taux variable"], correct: 1 },
  { id: 130, deck: "marche", sub: "Taux & Obligations", q: "Qu'est-ce que le taux de recouvrement (recovery rate) ?", a: "La part de la valeur nominale qu'un créancier récupère effectivement en cas de défaut de l'émetteur.", options: ["Le taux de coupon résiduel après défaut", "La part du nominal récupérée par les créanciers en cas de défaut", "Le spread de crédit post-défaut", "La probabilité de défaut estimée"], correct: 1 },
  { id: 131, deck: "marche", sub: "Taux & Obligations", q: "Qu'est-ce qu'une obligation subordonnée ?", a: "Une obligation remboursée après les créanciers seniors en cas de liquidation, donc plus risquée et généralement mieux rémunérée.", options: ["Une obligation prioritaire sur toutes les autres dettes", "Une obligation remboursée après les créanciers seniors, plus risquée", "Une obligation garantie par un collatéral physique", "Une obligation émise uniquement par l'État"], correct: 1 },
  { id: 132, deck: "marche", sub: "Taux & Obligations", q: "Qu'est-ce que le carry d'une position obligataire ?", a: "Le revenu généré par le coupon de l'obligation, diminué du coût de financement de la position (ex. taux repo).", options: ["Le gain en capital uniquement", "Le revenu du coupon moins le coût de financement de la position", "Le spread de crédit brut", "La duration multipliée par le rendement"], correct: 1 },
  { id: 133, deck: "marche", sub: "Taux & Obligations", q: "Qu'est-ce qu'une obligation indexée sur l'inflation ?", a: "Une obligation dont le principal et/ou les coupons sont ajustés selon l'évolution d'un indice de prix (ex. TIPS aux USA, OATi en France).", options: ["Une obligation à taux fixe classique", "Une obligation dont les flux sont ajustés selon un indice de prix", "Une obligation zéro-coupon spéciale", "Une obligation garantie contre le risque de change"], correct: 1 },
  { id: 134, deck: "marche", sub: "Taux & Obligations", q: "Qu'est-ce que le 'roll-down' sur une courbe des taux ?", a: "Le gain de prix résultant du glissement naturel d'une obligation vers une maturité plus courte, sur une courbe des taux pentue positivement.", options: ["Une perte automatique liée au temps qui passe", "Le gain de prix lié au glissement vers une maturité plus courte sur une courbe pentue", "Le remboursement anticipé d'une obligation callable", "Le réinvestissement automatique des coupons"], correct: 1 },
  { id: 135, deck: "marche", sub: "Taux & Obligations", q: "Qu'est-ce qu'un CDO (Collateralized Debt Obligation) ?", a: "Un titre structuré adossé à un portefeuille de créances, découpé en tranches offrant des niveaux de risque et de rendement différents.", options: ["Une obligation d'État classique", "Un titre structuré adossé à un portefeuille de dettes, découpé en tranches", "Un swap de taux d'intérêt structuré", "Un fonds indiciel obligataire"], correct: 1 },
  { id: 136, deck: "marche", sub: "Dérivés", q: "À quoi sert un future sur indice boursier ?", a: "À s'exposer à la performance d'un indice boursier (à la hausse ou à la baisse) sans détenir directement les actions le composant.", options: ["À garantir un dividende fixe", "À s'exposer à la performance d'un indice sans détenir les actions", "À éliminer tout risque de marché", "À emprunter des actions individuelles"], correct: 1 },
  { id: 137, deck: "marche", sub: "Dérivés", q: "Qu'est-ce que la base en futures ?", a: "L'écart entre le prix spot et le prix future d'un même actif sous-jacent, qui converge normalement vers zéro à l'approche de l'échéance.", options: ["Le prix d'exercice de l'option", "L'écart entre le prix spot et le prix future", "Le dépôt de garantie initial", "Le taux d'intérêt implicite du contrat"], correct: 1 },
  { id: 138, deck: "marche", sub: "Dérivés", q: "Qu'est-ce qu'un straddle ?", a: "Une stratégie combinant l'achat simultané d'un call et d'un put de même strike et même maturité, pariant sur une forte variation du sous-jacent.", options: ["L'achat d'un call et la vente d'un put", "L'achat simultané d'un call et d'un put de même strike/maturité", "Une couverture delta-neutre statique", "Un swap de volatilité"], correct: 1 },
  { id: 139, deck: "marche", sub: "Dérivés", q: "Qu'est-ce qu'un collar ?", a: "Une stratégie combinant l'achat d'un put et la vente d'un call sur un actif détenu, pour limiter à la fois les pertes et les gains potentiels.", options: ["L'achat simultané d'un call et d'un put", "L'achat d'un put et la vente d'un call pour limiter pertes et gains", "Une position purement spéculative sans couverture", "Un swap de taux structuré"], correct: 1 },
  { id: 140, deck: "marche", sub: "Dérivés", q: "Qu'est-ce qu'un TRS (Total Return Swap) ?", a: "Un swap où une partie transfère la performance totale (prix + revenus) d'un actif à une autre partie, contre un paiement fixe ou variable.", options: ["Un swap de devises classique", "Un swap échangeant la performance totale d'un actif contre un taux fixe/variable", "Une option sur indice", "Un contrat forward sur matières premières"], correct: 1 },
  { id: 141, deck: "marche", sub: "Dérivés", q: "Qu'est-ce qu'une option quanto ?", a: "Une option dont le payoff, initialement dans une devise étrangère, est converti dans la devise domestique à un taux de change fixé à l'avance, neutralisant le risque de change.", options: ["Une option nécessitant deux exercices successifs", "Une option dont le payoff est converti à un taux de change fixé à l'avance", "Une option sans strike défini", "Une option réservée aux devises émergentes"], correct: 1 },
  { id: 142, deck: "marche", sub: "Dérivés", q: "Comment calcule-t-on le prix forward théorique d'un actif sans dividende ?", a: "F = S × e^(rT), c'est-à-dire le prix spot capitalisé au taux sans risque jusqu'à l'échéance du contrat.", options: ["F = S − rT", "F = S × e^(rT)", "F = S / (1+r)", "F = S × r × T"], correct: 1 },
  { id: 143, deck: "marche", sub: "Dérivés", q: "Qu'est-ce que l'arbitrage cash-and-carry ?", a: "Une stratégie consistant à acheter un actif au comptant (en le finançant) et à le vendre simultanément à terme, pour capter un écart de prix sans risque.", options: ["Une spéculation directionnelle sur le sous-jacent", "L'achat au comptant et la vente à terme pour capter un écart de prix sans risque", "Une stratégie uniquement applicable aux devises", "Un pari sur la hausse de la volatilité"], correct: 1 },
  { id: 144, deck: "marche", sub: "Change", q: "Qu'est-ce qu'un régime de change fixe ?", a: "Un régime où la banque centrale s'engage à maintenir la parité de sa devise à un niveau fixé, via des interventions sur le marché des changes.", options: ["Un régime où le taux flotte librement selon l'offre et la demande", "Un régime où la banque centrale maintient une parité fixée par intervention", "Un régime où le taux est fixé par un accord commercial international", "Un régime réservé aux devises des pays émergents"], correct: 1 },
  { id: 145, deck: "marche", sub: "Change", q: "Qu'est-ce qu'une dévaluation compétitive ?", a: "Une dépréciation volontaire de la devise d'un pays, visant à rendre ses exportations plus compétitives à l'international.", options: ["Une appréciation forcée pour lutter contre l'inflation", "Une dépréciation volontaire pour stimuler les exportations", "Une fixation permanente du taux de change", "Une interdiction des transactions en devises étrangères"], correct: 1 },
  { id: 146, deck: "marche", sub: "Change", q: "Qu'est-ce que le taux de change effectif d'une devise ?", a: "La moyenne pondérée du taux de change d'une devise face à un panier de devises des principaux partenaires commerciaux du pays.", options: ["Le taux de change face au dollar uniquement", "La moyenne pondérée du taux face à un panier de devises partenaires", "Le taux fixé par la banque centrale", "Le taux ajusté uniquement de l'inflation domestique"], correct: 1 },
  { id: 147, deck: "marche", sub: "Change", q: "Qu'est-ce qu'un swap de devises (currency swap) ?", a: "Un échange de principal et de flux d'intérêts libellés dans deux devises différentes entre deux contreparties, sur une durée donnée.", options: ["Un simple échange ponctuel de devises au comptant", "Un échange de principal et d'intérêts dans deux devises différentes", "Une option sur taux de change", "Un contrat forward standard sur devise"], correct: 1 },
  { id: 148, deck: "marche", sub: "Change", q: "Qu'est-ce que le 'fixing' sur le marché des changes ?", a: "Un moment de référence quotidien où un taux de change officiel est déterminé, par exemple le fixing WM/Reuters à 16h à Londres.", options: ["Le moment de clôture définitive d'un marché", "Un moment de référence où un taux de change officiel est établi", "Une intervention systématique de la banque centrale", "La date de règlement d'un contrat forward"], correct: 1 },
  { id: 149, deck: "marche", sub: "Change", q: "Que décrit la théorie de l'overshooting de Dornbusch ?", a: "Un choc de politique monétaire provoque un ajustement du taux de change plus fort à court terme qu'à long terme, avant un retour progressif vers l'équilibre.", options: ["Le taux de change s'ajuste toujours instantanément et durablement", "Un choc monétaire provoque un ajustement excessif à court terme du taux de change", "Les taux de change sont toujours stables face aux chocs monétaires", "Une hausse des taux affaiblit toujours la devise à court terme"], correct: 1 },
