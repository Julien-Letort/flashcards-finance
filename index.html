  { id: 303, deck: "macro", sub: "Indicateurs macroéconomiques", q: "Comment définit-on le taux de chômage ?", a: "La part de la population active (occupée + en recherche d'emploi) qui est sans emploi et recherche activement un emploi.", options: ["La part de la population totale sans emploi", "La part de la population active sans emploi et en recherche active", "Le nombre absolu de demandeurs d'emploi inscrits", "La part des jeunes de moins de 25 ans sans emploi"], correct: 1 },
  { id: 304, deck: "macro", sub: "Indicateurs macroéconomiques", q: "Qu'est-ce que l'IPC (indice des prix à la consommation) ?", a: "Un indicateur mesurant l'évolution moyenne du prix d'un panier représentatif de biens et services consommés par les ménages.", options: ["Le prix moyen d'un seul bien de référence", "L'évolution moyenne du prix d'un panier représentatif de biens et services", "Le taux de croissance du PIB en volume", "L'indice des prix de production industrielle uniquement"], correct: 1 },
  { id: 305, deck: "macro", sub: "Indicateurs macroéconomiques", q: "Qu'est-ce que l'inflation sous-jacente (core inflation) ?", a: "Une mesure de l'inflation excluant les composantes les plus volatiles, comme l'énergie et l'alimentation, pour dégager la tendance de fond.", options: ["L'inflation mesurée uniquement sur l'énergie", "L'inflation excluant les composantes volatiles comme l'énergie et l'alimentation", "L'inflation anticipée par les marchés financiers", "L'inflation cumulée sur les cinq dernières années"], correct: 1 },
  { id: 306, deck: "macro", sub: "Indicateurs macroéconomiques", q: "Qu'est-ce que le déflateur du PIB ?", a: "Un indice de prix mesurant l'évolution générale des prix de l'ensemble de l'économie, plus large que l'IPC car il couvre tous les biens produits, pas seulement ceux consommés par les ménages.", options: ["Un synonyme exact de l'IPC", "Un indice de prix plus large que l'IPC, couvrant l'ensemble des biens produits", "Le taux de change réel d'un pays", "L'indice des prix à la production industrielle uniquement"], correct: 1 },
  { id: 307, deck: "macro", sub: "Indicateurs macroéconomiques", q: "Qu'est-ce que la balance commerciale d'un pays ?", a: "La différence entre la valeur des biens et services exportés et celle des biens et services importés sur une période donnée.", options: ["Le total des investissements étrangers dans le pays", "La différence entre exportations et importations de biens et services", "Le solde du budget de l'État", "La différence entre épargne et investissement national"], correct: 1 },
  { id: 308, deck: "macro", sub: "Indicateurs macroéconomiques", q: "Qu'est-ce que la balance des paiements ?", a: "L'enregistrement comptable de l'ensemble des transactions économiques (biens, services, capitaux, revenus) entre un pays et le reste du monde sur une période donnée.", options: ["Le seul solde des échanges de biens d'un pays", "L'enregistrement de l'ensemble des transactions économiques entre un pays et le reste du monde", "Le budget annuel de l'État", "La dette extérieure totale d'un pays"], correct: 1 },
  { id: 309, deck: "macro", sub: "Indicateurs macroéconomiques", q: "Que mesure le taux d'utilisation des capacités de production ?", a: "La proportion des capacités productives d'une économie effectivement utilisées par les entreprises, un indicateur de tension sur l'appareil productif.", options: ["Le taux de croissance annuel de la production industrielle", "La proportion des capacités productives effectivement utilisées par les entreprises", "Le taux d'investissement des entreprises dans de nouvelles capacités", "Le taux de marge moyen des entreprises industrielles"], correct: 1 },
  { id: 310, deck: "macro", sub: "Indicateurs macroéconomiques", q: "Qu'est-ce que l'indice PMI (Purchasing Managers' Index) ?", a: "Un indicateur avancé de l'activité économique, basé sur des enquêtes mensuelles auprès de directeurs d'achats ; un niveau supérieur à 50 signale une expansion de l'activité.", options: ["Un indice mesurant uniquement les prix des matières premières", "Un indicateur avancé de l'activité basé sur des enquêtes, seuil de 50 pour l'expansion", "Un indice boursier composite des grandes entreprises industrielles", "Un indicateur du niveau de la dette publique"], correct: 1 },
  { id: 311, deck: "macro", sub: "Indicateurs macroéconomiques", q: "Qu'est-ce que le taux d'épargne des ménages ?", a: "La part du revenu disponible des ménages qui n'est pas consommée, mais mise de côté ou investie.", options: ["Le montant total détenu sur les comptes d'épargne réglementés", "La part du revenu disponible des ménages non consommée", "Le rendement moyen des produits d'épargne", "Le taux d'intérêt appliqué aux livrets d'épargne"], correct: 1 },
  { id: 312, deck: "macro", sub: "Indicateurs macroéconomiques", q: "Qu'est-ce que la productivité du travail ?", a: "La quantité de production réalisée par unité de travail fournie, par exemple par heure travaillée ou par employé.", options: ["Le salaire moyen versé par heure travaillée", "La production réalisée par unité de travail (ex. par heure travaillée)", "Le taux d'emploi de la population active", "Le nombre d'heures travaillées par semaine en moyenne"], correct: 1 },
  { id: 313, deck: "macro", sub: "Indicateurs macroéconomiques", q: "Qu'est-ce que le NAIRU ?", a: "Le taux de chômage n'accélérant pas l'inflation : le niveau de chômage en dessous duquel des tensions inflationnistes tendent à apparaître.", options: ["Le taux de chômage naturel constant dans le temps", "Le niveau de chômage en dessous duquel l'inflation tend à s'accélérer", "Le taux de chômage des jeunes de moins de 25 ans", "Le taux de chômage frictionnel uniquement"], correct: 1 },
  { id: 314, deck: "macro", sub: "Indicateurs macroéconomiques", q: "Qu'est-ce que l'output gap ?", a: "L'écart entre le PIB effectivement réalisé et le PIB potentiel d'une économie, indiquant une situation de sur-chauffe ou de sous-utilisation des ressources.", options: ["L'écart entre importations et exportations", "L'écart entre le PIB effectif et le PIB potentiel d'une économie", "L'écart entre taux directeur et taux neutre", "L'écart entre inflation observée et inflation cible"], correct: 1 },
  { id: 315, deck: "macro", sub: "Indicateurs macroéconomiques", q: "Qu'est-ce que le revenu national brut (RNB) ?", a: "Le PIB augmenté des revenus nets reçus de l'étranger par les résidents (salaires, dividendes, intérêts), moins les revenus versés aux non-résidents.", options: ["Un synonyme exact du PIB", "Le PIB plus les revenus nets reçus de l'étranger par les résidents", "Le revenu disponible brut des seuls ménages", "Le total des recettes fiscales de l'État"], correct: 1 },
  { id: 316, deck: "macro", sub: "Politique monétaire", q: "Quel est l'objectif principal de politique monétaire de la BCE ?", a: "La stabilité des prix, avec une cible d'inflation d'environ 2% à moyen terme dans la zone euro.", options: ["Le plein emploi avant tout", "La stabilité des prix, avec une cible d'inflation autour de 2%", "La stabilité du taux de change de l'euro", "La croissance maximale du PIB de la zone euro"], correct: 1 },
  { id: 317, deck: "macro", sub: "Politique monétaire", q: "Quels sont les deux principaux mandats de la Réserve fédérale américaine (Fed) ?", a: "La stabilité des prix et le plein emploi, ce qu'on appelle le 'mandat dual' de la Fed, contrairement au mandat unique de nombreuses autres banques centrales.", options: ["La stabilité des prix uniquement", "La stabilité des prix et le plein emploi (mandat dual)", "La stabilité du taux de change du dollar uniquement", "La croissance économique et le déficit budgétaire"], correct: 1 },
  { id: 318, deck: "macro", sub: "Politique monétaire", q: "Qu'est-ce qu'une politique monétaire restrictive ?", a: "Une politique consistant à relever les taux directeurs et/ou réduire la liquidité disponible dans l'économie, visant à freiner l'inflation.", options: ["Une politique de baisse des taux pour stimuler la croissance", "Une politique de hausse des taux et/ou de réduction de la liquidité pour freiner l'inflation", "Une politique visant uniquement à stabiliser le taux de change", "Une politique de rachat massif d'actifs par la banque centrale"], correct: 1 },
  { id: 319, deck: "macro", sub: "Politique monétaire", q: "Qu'est-ce que le canal du crédit dans la transmission de la politique monétaire ?", a: "Le mécanisme par lequel une variation des taux directeurs affecte l'offre de crédit bancaire disponible pour les entreprises et les ménages, influençant ainsi l'investissement et la consommation.", options: ["Le canal par lequel la politique monétaire affecte directement le taux de change", "Le mécanisme par lequel les taux directeurs affectent l'offre de crédit bancaire", "Le canal par lequel les anticipations d'inflation se forment", "Un synonyme du canal des anticipations"], correct: 1 },
  { id: 320, deck: "macro", sub: "Politique monétaire", q: "Qu'est-ce que le 'forward guidance' d'une banque centrale ?", a: "La communication par une banque centrale de ses intentions futures de politique monétaire, afin d'influencer les anticipations des marchés et des agents économiques.", options: ["Une intervention directe sur le marché des changes", "La communication des intentions futures de politique monétaire pour influencer les anticipations", "Un synonyme du quantitative easing", "Un rapport trimestriel purement statistique sans influence sur les marchés"], correct: 1 },
  { id: 321, deck: "macro", sub: "Politique monétaire", q: "Qu'est-ce que la trappe à liquidité ?", a: "Une situation où les taux d'intérêt sont si bas que la politique monétaire conventionnelle (baisse des taux) perd son efficacité à stimuler davantage l'économie.", options: ["Une situation d'inflation galopante incontrôlable", "Une situation où des taux très bas rendent la politique monétaire conventionnelle inefficace", "Un excès de liquidités provoquant une bulle spéculative", "Une pénurie de liquidités sur le marché interbancaire"], correct: 1 },
  { id: 322, deck: "macro", sub: "Politique monétaire", q: "Qu'est-ce que l'indépendance d'une banque centrale ?", a: "La capacité de la banque centrale à définir et conduire sa politique monétaire sans recevoir d'instruction directe du pouvoir politique.", options: ["L'absence totale de contrôle démocratique sur la banque centrale", "La capacité à fixer la politique monétaire sans instruction directe du pouvoir politique", "L'autonomie financière complète de la banque centrale vis-à-vis des marchés", "L'indépendance de la devise nationale vis-à-vis des autres devises"], correct: 1 },
  { id: 323, deck: "macro", sub: "Politique monétaire", q: "Que décrit la règle de Taylor ?", a: "Une règle empirique reliant le niveau optimal du taux directeur à l'écart d'inflation par rapport à sa cible et à l'output gap de l'économie.", options: ["Une règle fixant le taux directeur uniquement selon l'inflation observée", "Une règle reliant le taux directeur optimal à l'écart d'inflation et à l'output gap", "Une règle imposant un taux directeur constant dans le temps", "Une règle utilisée uniquement pour fixer le taux de change"], correct: 1 },
  { id: 324, deck: "macro", sub: "Politique monétaire", q: "Qu'est-ce que le canal des anticipations dans la transmission de la politique monétaire ?", a: "L'influence de la politique monétaire sur les décisions économiques (consommation, investissement) via son effet sur les anticipations d'inflation et de taux futurs des agents.", options: ["Un canal purement théorique sans effet réel observé", "L'influence de la politique monétaire via les anticipations d'inflation et de taux futurs", "Un synonyme exact du canal du crédit", "Un canal qui ne concerne que les marchés financiers"], correct: 1 },
  { id: 325, deck: "macro", sub: "Politique monétaire", q: "Qu'est-ce qu'une politique monétaire non conventionnelle ?", a: "Un ensemble de mesures (quantitative easing, taux négatifs, forward guidance) utilisées lorsque les instruments classiques de taux directeur atteignent leur limite basse d'efficacité.", options: ["Une politique appliquée uniquement en période de forte croissance", "Un ensemble de mesures utilisées quand les taux directeurs classiques atteignent leur limite", "Une politique visant uniquement à stabiliser le taux de change", "Une politique réservée exclusivement aux pays émergents"], correct: 1 },
  { id: 326, deck: "macro", sub: "Politique monétaire", q: "Comment le taux de change agit-il comme canal de transmission de la politique monétaire ?", a: "Une hausse des taux directeurs tend à apprécier la devise, ce qui freine l'inflation importée mais peut pénaliser la compétitivité des exportations.", options: ["Une hausse des taux déprécie systématiquement la devise", "Une hausse des taux tend à apprécier la devise, freinant l'inflation importée", "Le taux de change n'a aucun lien avec la politique monétaire", "Ce canal ne fonctionne que dans les pays à change fixe"], correct: 1 },
  { id: 327, deck: "macro", sub: "Politique monétaire", q: "Pourquoi la crédibilité d'une banque centrale est-elle importante ?", a: "Parce qu'elle influence directement la capacité de la banque centrale à ancrer les anticipations d'inflation des agents économiques autour de sa cible annoncée.", options: ["Elle n'a aucun effet mesurable sur l'économie réelle", "Elle influence l'ancrage des anticipations d'inflation autour de la cible annoncée", "Elle détermine uniquement le niveau du taux de change", "Elle concerne uniquement la communication financière, sans effet économique"], correct: 1 },
  { id: 328, deck: "macro", sub: "Politique budgétaire", q: "Qu'est-ce qu'un déficit budgétaire ?", a: "Une situation où les dépenses publiques d'un État excèdent ses recettes publiques sur une période donnée, généralement une année.", options: ["Une situation où la dette publique diminue", "Une situation où les dépenses publiques excèdent les recettes publiques", "Le solde négatif de la balance commerciale", "Une baisse du PIB par rapport à l'année précédente"], correct: 1 },
  { id: 329, deck: "macro", sub: "Politique budgétaire", q: "Qu'est-ce que la dette publique ?", a: "Le cumul des déficits budgétaires passés d'un État, financé par emprunt auprès des marchés financiers ou d'autres créanciers.", options: ["Le montant des dépenses publiques d'une seule année", "Le cumul des déficits passés d'un État, financé par emprunt", "La dette totale des entreprises d'un pays", "Le montant total des impôts collectés en un an"], correct: 1 },
  { id: 330, deck: "macro", sub: "Politique budgétaire", q: "Qu'est-ce qu'un stabilisateur automatique en politique budgétaire ?", a: "Un mécanisme budgétaire, comme les allocations chômage ou l'impôt progressif, qui atténue automatiquement les fluctuations du cycle économique sans intervention discrétionnaire.", options: ["Une mesure budgétaire décidée au cas par cas par le gouvernement", "Un mécanisme atténuant automatiquement les cycles économiques sans intervention discrétionnaire", "Un outil exclusivement monétaire de la banque centrale", "Une règle limitant strictement le niveau de la dette publique"], correct: 1 },
  { id: 331, deck: "macro", sub: "Politique budgétaire", q: "Qu'est-ce que le multiplicateur budgétaire ?", a: "L'effet d'une variation des dépenses publiques sur le PIB ; un multiplicateur supérieur à 1 signifie que l'effet est amplifié par la consommation induite dans l'économie.", options: ["Le rapport entre dette publique et PIB", "L'effet d'une variation des dépenses publiques sur le PIB", "Le taux d'intérêt appliqué à la dette publique", "Le rapport entre recettes fiscales et dépenses publiques"], correct: 1 },
  { id: 332, deck: "macro", sub: "Politique budgétaire", q: "Qu'est-ce que la soutenabilité de la dette publique ?", a: "La capacité d'un État à honorer sa dette dans la durée sans ajustement budgétaire insoutenable, dépendant notamment de l'écart entre le taux d'intérêt payé et le taux de croissance de l'économie.", options: ["Le niveau absolu de la dette publique en valeur", "La capacité à honorer la dette dans la durée, liée à l'écart taux/croissance", "Le montant des intérêts payés chaque année", "Le pourcentage de la dette détenue par des créanciers étrangers"], correct: 1 },
  { id: 333, deck: "macro", sub: "Politique budgétaire", q: "Qu'est-ce qu'une politique budgétaire expansionniste ?", a: "Une politique consistant à augmenter les dépenses publiques et/ou à réduire les impôts, dans le but de stimuler l'activité économique.", options: ["Une politique visant à réduire le déficit budgétaire", "Une politique de hausse des dépenses et/ou de baisse des impôts pour stimuler l'activité", "Une politique de hausse des taux d'intérêt directeurs", "Une politique de rigueur budgétaire prolongée"], correct: 1 },
  { id: 334, deck: "macro", sub: "Politique budgétaire", q: "Qu'est-ce que l'effet d'éviction (crowding out) ?", a: "Le phénomène par lequel une hausse des dépenses publiques, en augmentant les taux d'intérêt, réduit l'investissement privé dans l'économie.", options: ["Une hausse des dépenses publiques qui stimule toujours l'investissement privé", "Une hausse des dépenses publiques qui, via la hausse des taux, réduit l'investissement privé", "Une baisse des impôts qui réduit mécaniquement la consommation", "Un effet exclusivement lié à la politique monétaire"], correct: 1 },
  { id: 335, deck: "macro", sub: "Politique budgétaire", q: "Qu'est-ce que le solde budgétaire structurel ?", a: "Le solde budgétaire corrigé des effets du cycle économique, reflétant ainsi uniquement l'orientation discrétionnaire de la politique budgétaire menée.", options: ["Le solde budgétaire brut sans aucun ajustement", "Le solde budgétaire corrigé des effets du cycle économique", "Le solde budgétaire cumulé sur dix ans", "La différence entre solde primaire et solde total"], correct: 1 },
  { id: 336, deck: "macro", sub: "Politique budgétaire", q: "Qu'est-ce qu'une règle d'or budgétaire ?", a: "Une règle limitant l'emprunt public au seul financement des dépenses d'investissement, excluant les dépenses de fonctionnement courantes de l'État.", options: ["Une règle interdisant tout emprunt public", "Une règle limitant l'emprunt public au financement des seuls investissements", "Une règle fixant un plafond de dette publique en valeur absolue", "Une règle imposant l'équilibre budgétaire chaque trimestre"], correct: 1 },
  { id: 337, deck: "macro", sub: "Politique budgétaire", q: "Qu'est-ce que la dominance budgétaire ?", a: "Une situation où la politique monétaire se retrouve contrainte par les besoins de financement de l'État, limitant de fait l'indépendance effective de la banque centrale.", options: ["Une situation où la politique budgétaire est totalement indépendante de la politique monétaire", "Une situation où la politique monétaire est contrainte par les besoins de financement de l'État", "Un synonyme exact de la trappe à liquidité", "Une situation où l'État n'a plus accès aux marchés financiers"], correct: 1 },
  { id: 338, deck: "macro", sub: "Cycle économique & croissance", q: "Comment définit-on techniquement une récession dans de nombreux pays ?", a: "Généralement par deux trimestres consécutifs de baisse du PIB, bien que d'autres critères (emploi, production) puissent aussi être pris en compte selon les institutions.", options: ["Une baisse du PIB sur une seule année complète", "Deux trimestres consécutifs de baisse du PIB", "Une hausse du chômage de plus de 5 points", "Une baisse de l'inflation en dessous de zéro"], correct: 1 },
  { id: 339, deck: "macro", sub: "Cycle économique & croissance", q: "Quelles sont les quatre phases classiques du cycle économique ?", a: "Expansion, pic, contraction (récession), et creux, avant un nouveau cycle d'expansion.", options: ["Croissance, inflation, chômage, récession", "Expansion, pic, contraction, creux", "Boom, krach, reprise, stagnation", "Investissement, production, consommation, épargne"], correct: 1 },
  { id: 340, deck: "macro", sub: "Cycle économique & croissance", q: "Qu'est-ce que la croissance potentielle d'une économie ?", a: "Le rythme de croissance soutenable à long terme d'une économie, compatible avec une inflation stable, sans générer de tensions inflationnistes excessives.", options: ["Le taux de croissance maximal observé historiquement", "Le rythme de croissance soutenable à long terme sans tensions inflationnistes", "La croissance moyenne mondiale de référence", "Le taux de croissance cible fixé par le gouvernement"], correct: 1 },
  { id: 341, deck: "macro", sub: "Cycle économique & croissance", q: "Que décrit la loi d'Okun ?", a: "Une relation empirique reliant les variations du taux de chômage à l'écart entre la croissance effective du PIB et sa croissance potentielle.", options: ["Une relation entre inflation et taux de chômage uniquement", "Une relation entre les variations du chômage et l'écart de croissance du PIB par rapport au potentiel", "Une relation entre taux d'intérêt et investissement", "Une relation entre déficit budgétaire et croissance"], correct: 1 },
  { id: 342, deck: "macro", sub: "Cycle économique & croissance", q: "Qu'est-ce qu'une situation de stagflation ?", a: "Une situation économique combinant une stagnation de la croissance (voire une récession) avec une inflation élevée, simultanément.", options: ["Une forte croissance accompagnée d'une inflation nulle", "Une combinaison de stagnation économique et d'inflation élevée", "Une déflation prolongée accompagnée d'un chômage faible", "Une croissance forte accompagnée d'un chômage élevé"], correct: 1 },
  { id: 343, deck: "macro", sub: "Cycle économique & croissance", q: "Sur quoi repose le modèle de croissance de Solow ?", a: "Il explique la croissance économique de long terme par l'accumulation de capital, la croissance du travail, et surtout le progrès technique exogène.", options: ["Il explique la croissance uniquement par la politique monétaire", "Il explique la croissance par l'accumulation de capital, de travail et le progrès technique", "Il ignore totalement le rôle du capital dans la croissance", "Il ne s'applique qu'aux économies en développement"], correct: 1 },
  { id: 344, deck: "macro", sub: "Cycle économique & croissance", q: "Qu'est-ce qu'un indicateur avancé (leading indicator) du cycle économique ?", a: "Un indicateur dont l'évolution précède généralement celle du cycle économique global, utile pour anticiper les points de retournement à venir.", options: ["Un indicateur publié avec un fort retard par rapport aux faits", "Un indicateur dont l'évolution précède celle du cycle économique global", "Un synonyme exact du PIB trimestriel", "Un indicateur qui ne concerne que le marché boursier"], correct: 1 },
  { id: 345, deck: "macro", sub: "Cycle économique & croissance", q: "Qu'est-ce que l'hystérèse du chômage ?", a: "Un phénomène par lequel un chômage conjoncturel élevé et prolongé finit par devenir structurel, réduisant durablement le taux de chômage naturel compatible avec la stabilité des prix.", options: ["Un chômage qui disparaît automatiquement après une récession", "Un chômage conjoncturel prolongé qui devient structurel et durable", "Un synonyme exact du NAIRU", "Un phénomène qui ne concerne que le chômage des jeunes"], correct: 1 },
  { id: 346, deck: "macro", sub: "Cycle économique & croissance", q: "Que propose la théorie des cycles de Kondratiev ?", a: "Une théorie de cycles économiques longs, de l'ordre de 40 à 60 ans, liés à des vagues successives d'innovations technologiques majeures.", options: ["Une théorie de cycles économiques de très court terme (quelques mois)", "Une théorie de cycles longs (40-60 ans) liés à des vagues d'innovations technologiques", "Une théorie purement monétaire des cycles économiques", "Une théorie limitée aux cycles boursiers uniquement"], correct: 1 },
  { id: 347, deck: "macro", sub: "Cycle économique & croissance", q: "Qu'est-ce qu'une bulle spéculative ?", a: "Une hausse de prix d'un actif qui se déconnecte progressivement de sa valeur fondamentale, souvent alimentée par des anticipations auto-réalisatrices des investisseurs.", options: ["Une hausse de prix toujours justifiée par les fondamentaux économiques", "Une hausse de prix déconnectée de la valeur fondamentale, alimentée par des anticipations auto-réalisatrices", "Une baisse durable et justifiée du prix d'un actif", "Un synonyme exact d'une récession économique"], correct: 1 },
  { id: 348, deck: "macro", sub: "Cycle économique & croissance", q: "Que décrit le paradoxe de l'épargne (ou paradoxe de Keynes) ?", a: "Une hausse simultanée de l'épargne de tous les agents économiques peut réduire la demande globale et donc, paradoxalement, le revenu national total.", options: ["Une épargne individuelle plus élevée profite toujours à la croissance collective", "Une hausse simultanée de l'épargne de tous peut réduire la demande globale et le revenu national", "L'épargne n'a strictement aucun effet macroéconomique", "Ce paradoxe ne s'applique qu'en période de forte inflation"], correct: 1 },
  { id: 349, deck: "macro", sub: "Cycle économique & croissance", q: "Que propose la théorie des cycles réels (Real Business Cycle) ?", a: "Une école de pensée considérant que les fluctuations économiques proviennent principalement de chocs technologiques réels, plutôt que de facteurs strictement monétaires ou de demande.", options: ["Une théorie attribuant les cycles exclusivement à la politique monétaire", "Une théorie attribuant les fluctuations économiques principalement à des chocs technologiques réels", "Une théorie niant l'existence même des cycles économiques", "Une théorie limitée uniquement aux cycles financiers de court terme"], correct: 1 },
  { id: 350, deck: "macro", sub: "Commerce international", q: "Que décrit la théorie de l'avantage comparatif de Ricardo ?", a: "Un pays a intérêt à se spécialiser dans la production du bien où son désavantage relatif est le plus faible, même s'il n'a d'avantage absolu dans aucun secteur.", options: ["Un pays doit toujours produire uniquement les biens où il a un avantage absolu", "Un pays a intérêt à se spécialiser où son désavantage relatif est le plus faible", "Le commerce international est toujours défavorable aux deux parties", "Seuls les pays riches bénéficient du commerce international"], correct: 1 },
  { id: 351, deck: "macro", sub: "Commerce international", q: "Qu'est-ce qu'un tarif douanier ?", a: "Une taxe appliquée sur les biens importés, qui augmente leur prix final sur le marché domestique par rapport aux produits locaux équivalents.", options: ["Une subvention versée aux exportateurs nationaux", "Une taxe appliquée sur les biens importés, augmentant leur prix domestique", "Un quota limitant la quantité de biens exportés", "Une taxe appliquée uniquement sur les services financiers"], correct: 1 },
  { id: 352, deck: "macro", sub: "Commerce international", q: "Qu'est-ce que le protectionnisme ?", a: "Un ensemble de politiques visant à restreindre le commerce international, généralement pour protéger les producteurs et l'emploi nationaux de la concurrence étrangère.", options: ["Une politique visant à supprimer toutes les barrières commerciales", "Un ensemble de politiques visant à restreindre le commerce international", "Une politique exclusivement monétaire de soutien à l'exportation", "Un synonyme exact du libre-échange"], correct: 1 },
  { id: 353, deck: "macro", sub: "Commerce international", q: "Que mesurent les termes de l'échange d'un pays ?", a: "Le rapport entre le prix moyen des exportations et celui des importations d'un pays ; une amélioration signifie que le pays peut importer davantage pour une même quantité exportée.", options: ["Le volume total des échanges commerciaux d'un pays", "Le rapport entre le prix des exportations et celui des importations", "Le solde de la balance commerciale en valeur absolue", "Le taux de change nominal moyen d'une devise"], correct: 1 },
  { id: 354, deck: "macro", sub: "Commerce international", q: "Qu'est-ce qu'un investissement direct étranger (IDE) ?", a: "Un investissement réalisé par une entité étrangère visant à obtenir une participation durable et un contrôle significatif dans une entreprise située dans un autre pays.", options: ["Un simple achat d'actions cotées en bourse sans intention de contrôle", "Un investissement visant une participation durable et un contrôle significatif dans une entreprise étrangère", "Un prêt accordé par une banque étrangère à un gouvernement", "Un transfert de fonds entre filiales d'une même entreprise nationale"], correct: 1 },
  { id: 355, deck: "macro", sub: "Commerce international", q: "Qu'est-ce qu'une 'guerre des monnaies' (currency war) ?", a: "Une situation où plusieurs pays procèdent successivement à des dépréciations compétitives de leur devise, cherchant chacun un avantage commercial via une monnaie plus faible.", options: ["Un conflit militaire déclenché pour des raisons monétaires", "Des dépréciations compétitives successives entre pays cherchant un avantage commercial", "Une appréciation coordonnée et volontaire de toutes les devises mondiales", "Un accord international fixant définitivement tous les taux de change"], correct: 1 },
  { id: 356, deck: "macro", sub: "Commerce international", q: "Qu'est-ce que la mondialisation des chaînes de valeur ?", a: "La fragmentation internationale du processus de production d'un bien, où différentes étapes de fabrication sont réalisées dans différents pays selon leurs avantages respectifs.", options: ["La production d'un bien entièrement réalisée dans un seul pays", "La fragmentation internationale du processus de production d'un bien entre plusieurs pays", "Un synonyme exact du protectionnisme", "La suppression totale des échanges internationaux de biens intermédiaires"], correct: 1 },
  { id: 357, deck: "macro", sub: "Commerce international", q: "Qu'est-ce que le compte courant d'un pays ?", a: "Le solde des échanges de biens, de services, de revenus (salaires, dividendes, intérêts) et de transferts courants entre un pays et le reste du monde.", options: ["Le solde des seuls mouvements de capitaux financiers", "Le solde des échanges de biens, services, revenus et transferts courants", "Le montant total des réserves de change détenues par la banque centrale", "Le solde budgétaire de l'État uniquement"], correct: 1 },
  { id: 358, deck: "macro", sub: "Commerce international", q: "Qu'est-ce que la 'maladie hollandaise' (Dutch disease) ?", a: "Un phénomène où l'exploitation intensive de ressources naturelles fait apprécier la devise nationale, ce qui nuit à la compétitivité des autres secteurs exportateurs du pays.", options: ["Une crise sanitaire affectant l'économie néerlandaise", "L'exploitation de ressources naturelles qui, via l'appréciation de la devise, nuit aux autres exportateurs", "Une dépréciation excessive de la devise due à un excès d'importations", "Un synonyme exact du protectionnisme commercial"], correct: 1 },
  { id: 359, deck: "macro", sub: "Commerce international", q: "Qu'est-ce qu'un accord de libre-échange ?", a: "Un accord conclu entre plusieurs pays visant à réduire ou supprimer les barrières tarifaires et non tarifaires sur le commerce entre eux.", options: ["Un accord instaurant des tarifs douaniers communs élevés envers tous les pays tiers", "Un accord réduisant ou supprimant les barrières commerciales entre pays signataires", "Un accord fixant définitivement les taux de change entre pays membres", "Un accord limitant les investissements directs étrangers entre pays membres"], correct: 1 },
  { id: 360, deck: "macro", sub: "Commerce international", q: "Que décrit le triangle d'incompatibilité de Mundell ?", a: "L'impossibilité pour un pays de maintenir simultanément un régime de change fixe, une libre circulation des capitaux et une politique monétaire pleinement indépendante.", options: ["L'impossibilité de mener simultanément une politique budgétaire et monétaire", "L'impossibilité de maintenir simultanément change fixe, libre circulation des capitaux et politique monétaire indépendante", "L'impossibilité pour un pays d'avoir à la fois inflation et croissance", "Un concept réservé uniquement aux pays de la zone euro"], correct: 1 },
  { id: 361, deck: "brainteasers", sub: "Calcul mental", q: "Combien font 17 × 23 ?", a: "391. Astuce : 17×23 = 17×20 + 17×3 = 340 + 51 = 391.", options: ["381", "391", "401", "371"], correct: 1 },
  { id: 362, deck: "brainteasers", sub: "Calcul mental", q: "Combien font 8% de 350 ?", a: "28. Astuce : 10% de 350 = 35, donc 8% = 35 × 0,8 = 28.", options: ["24", "28", "32", "35"], correct: 1 },
  { id: 363, deck: "brainteasers", sub: "Calcul mental", q: "Quelle est la racine carrée de 1936 ?", a: "44, car 44² = 1936 (on peut vérifier : 40²=1600, 45²=2025, donc la réponse est entre les deux, proche de 44).", options: ["42", "44", "46", "48"], correct: 1 },
  { id: 364, deck: "brainteasers", sub: "Calcul mental", q: "Combien font 15² ?", a: "225. Astuce : pour un nombre finissant par 5, n5² = n×(n+1) suivi de 25 ; ici 1×2=2, donc 225.", options: ["205", "215", "225", "235"], correct: 2 },
  { id: 365, deck: "brainteasers", sub: "Calcul mental", q: "Un actif passe de 80 à 100. Quelle est sa performance en pourcentage ?", a: "+25%, car (100−80)/80 = 20/80 = 0,25.", options: ["+20%", "+25%", "+30%", "+22%"], correct: 1 },
  { id: 366, deck: "brainteasers", sub: "Calcul mental", q: "Un actif baisse de 20% puis remonte de 20%. Revient-il exactement à son niveau initial ?", a: "Non : il finit à 96% de son niveau initial (0,8 × 1,2 = 0,96), car les pourcentages successifs ne s'annulent pas simplement.", options: ["Oui, il revient exactement à 100%", "Non, il finit à 96% du niveau initial", "Non, il finit à 104% du niveau initial", "Non, il finit à 90% du niveau initial"], correct: 1 },
  { id: 367, deck: "brainteasers", sub: "Calcul mental", q: "Combien font 7 × 8 × 9 ?", a: "504, car 7×8=56, puis 56×9 = 504.", options: ["484", "494", "504", "514"], correct: 2 },
  { id: 368, deck: "brainteasers", sub: "Calcul mental", q: "Combien vaut environ 1/7 en pourcentage ?", a: "Environ 14,3%, une valeur utile à connaître par cœur pour les calculs rapides de marché.", options: ["Environ 12,5%", "Environ 14,3%", "Environ 16,7%", "Environ 10%"], correct: 1 },
  { id: 369, deck: "brainteasers", sub: "Calcul mental", q: "Avec la règle des 72, en combien de temps un capital double-t-il à 8% par an ?", a: "Environ 9 ans, car 72 / 8 ≈ 9 (la règle des 72 est une approximation rapide très utilisée en finance).", options: ["Environ 6 ans", "Environ 9 ans", "Environ 12 ans", "Environ 15 ans"], correct: 1 },
  { id: 370, deck: "brainteasers", sub: "Calcul mental", q: "Combien font 125 × 8 ?", a: "1000. Astuce : 125 × 8 = 125 × 8 = 1000 (125 est un huitième de 1000).", options: ["900", "1000", "1100", "1250"], correct: 1 },
  { id: 371, deck: "brainteasers", sub: "Calcul mental", q: "Quelle est la moyenne géométrique de 4 et 9 ?", a: "6, car la moyenne géométrique de deux nombres est la racine carrée de leur produit : √(4×9) = √36 = 6.", options: ["5", "6", "6,5", "7"], correct: 1 },
  { id: 372, deck: "brainteasers", sub: "Calcul mental", q: "Combien font 99 × 101 ?", a: "9999. Astuce : (100−1)×(100+1) = 100² − 1² = 10000 − 1 = 9999.", options: ["9989", "9999", "10099", "9899"], correct: 1 },
  { id: 373, deck: "brainteasers", sub: "Calcul mental", q: "Un taux annuel composé est de 12%. Quel est approximativement le taux mensuel équivalent ?", a: "Environ 0,95% par mois, car (1+0,12)^(1/12) − 1 ≈ 0,0095, légèrement inférieur à 12%/12=1%.", options: ["Exactement 1%", "Environ 0,95%", "Environ 1,2%", "Environ 0,8%"], correct: 1 },
  { id: 374, deck: "brainteasers", sub: "Calcul mental", q: "Combien font 2 puissance 10 (2^10) ?", a: "1024, une valeur très utile à connaître par cœur (notamment en informatique et en calcul rapide).", options: ["1000", "1024", "1048", "1012"], correct: 1 },
  { id: 375, deck: "brainteasers", sub: "Calcul mental", q: "Combien font 45 × 45 ?", a: "2025. Astuce : pour un nombre finissant par 5, n5² = n×(n+1) suivi de 25 ; ici 4×5=20, donc 2025.", options: ["1975", "2005", "2025", "2045"], correct: 2 },
  { id: 376, deck: "brainteasers", sub: "Probabilités & logique", q: "On lance deux dés à 6 faces. Quelle est la probabilité d'obtenir une somme égale à 7 ?", a: "6/36 = 1/6, car il existe 6 combinaisons possibles donnant 7 (1-6, 2-5, 3-4, 4-3, 5-2, 6-1) sur 36 combinaisons totales.", options: ["1/12", "1/6", "1/8", "1/4"], correct: 1 },
  { id: 377, deck: "brainteasers", sub: "Probabilités & logique", q: "Problème de Monty Hall : après l'ouverture d'une porte vide par le présentateur, faut-il changer de porte pour maximiser ses chances de gagner ?", a: "Oui : changer de porte double la probabilité de gagner, la faisant passer de 1/3 (porte initiale) à 2/3 (porte alternative après ouverture).", options: ["Non, cela ne change rien à la probabilité", "Oui, cela double la probabilité de gagner (2/3 contre 1/3)", "Non, la probabilité initiale de 1/3 devient meilleure en gardant son choix", "Cela dépend uniquement du nombre total de portes proposées"], correct: 1 },
  { id: 378, deck: "brainteasers", sub: "Probabilités & logique", q: "Quelle est approximativement la probabilité d'obtenir au moins un 6 en lançant un dé 4 fois de suite ?", a: "Environ 51,8% : la probabilité de ne jamais obtenir de 6 est (5/6)^4 ≈ 48,2%, donc la probabilité d'en obtenir au moins un est d'environ 51,8%.", options: ["Environ 33%", "Environ 51,8%", "Environ 66%", "Environ 75%"], correct: 1 },
  { id: 379, deck: "brainteasers", sub: "Probabilités & logique", q: "Dans un groupe de 23 personnes, quelle est approximativement la probabilité que deux personnes partagent le même jour anniversaire ?", a: "Environ 50%, un résultat contre-intuitif connu sous le nom de 'paradoxe des anniversaires', dû au grand nombre de paires possibles dans le groupe.", options: ["Environ 6%", "Environ 25%", "Environ 50%", "Environ 90%"], correct: 2 },
  { id: 380, deck: "brainteasers", sub: "Probabilités & logique", q: "On tire deux cartes d'un jeu de 52 cartes, sans remise. Quelle est approximativement la probabilité d'obtenir deux as ?", a: "Environ 0,45%, car P = (4/52) × (3/51) ≈ 0,0045.", options: ["Environ 0,45%", "Environ 2%", "Environ 7,7%", "Environ 15%"], correct: 0 },
  { id: 381, deck: "brainteasers", sub: "Probabilités & logique", q: "On lance 3 fois une pièce équitable. Quelle est la probabilité d'obtenir exactement 2 piles ?", a: "3/8, calculée avec la loi binomiale : C(3,2) × 0,5² × 0,5¹ = 3 × 0,125 = 0,375.", options: ["1/4", "3/8", "1/2", "5/8"], correct: 1 },
  { id: 382, deck: "brainteasers", sub: "Probabilités & logique", q: "Un pari offre 30% de chances de gagner 100€ et 70% de chances de perdre 20€. Quelle est son espérance de gain ?", a: "16€, car 0,3×100 − 0,7×20 = 30 − 14 = 16€.", options: ["10€", "16€", "22€", "30€"], correct: 1 },
  { id: 383, deck: "brainteasers", sub: "Probabilités & logique", q: "Un père a deux enfants, et l'on sait que l'un d'eux est une fille. Quelle est la probabilité que l'autre soit aussi une fille ?", a: "1/3, car parmi les 4 combinaisons équiprobables initiales (GG, GF, FG, FF), 3 sont compatibles avec l'information donnée, et une seule (FF) correspond à 'l'autre est aussi une fille'.", options: ["1/4", "1/3", "1/2", "2/3"], correct: 1 },
  { id: 384, deck: "brainteasers", sub: "Probabilités & logique", q: "Combien de façons différentes existe-t-il d'arranger 5 objets distincts en ligne ?", a: "5! = 120, soit 5×4×3×2×1.", options: ["60", "100", "120", "125"], correct: 2 },
  { id: 385, deck: "brainteasers", sub: "Probabilités & logique", q: "Une pièce truquée a une probabilité de 0,6 de tomber sur face. Quelle est la probabilité d'obtenir 3 fois de suite face ?", a: "0,216, car 0,6³ = 0,6 × 0,6 × 0,6 = 0,216.", options: ["0,18", "0,216", "0,24", "0,36"], correct: 1 },

  { id: 387, deck: "brainteasers", sub: "Probabilités & logique", q: "Une urne contient 3 boules rouges et 2 boules bleues. Quelle est la probabilité de tirer 2 boules rouges de suite, sans remise ?", a: "3/10, car P = (3/5) × (2/4) = 6/20 = 3/10.", options: ["1/5", "3/10", "2/5", "1/2"], correct: 1 },

  { id: 390, deck: "brainteasers", sub: "Probabilités & logique", q: "Un événement a 1% de chance de se produire chaque jour. Quelle est approximativement la probabilité qu'il se produise au moins une fois en 100 jours ?", a: "Environ 63%, car P(au moins un) = 1 − (0,99)^100 ≈ 1 − 0,366 ≈ 0,634.", options: ["Environ 37%", "Environ 50%", "Environ 63%", "Environ 99%"], correct: 2 },

  { id: 401, deck: "prog", sub: "Python pour la finance", q: "Qu'est-ce qu'un DataFrame dans la librairie pandas ?", a: "Une structure tabulaire à deux dimensions avec index et colonnes typées, très largement utilisée pour manipuler des séries de données financières.", options: ["Un tableau à une seule dimension équivalent à une liste", "Une structure tabulaire 2D avec index et colonnes typées", "Une base de données SQL intégrée à Python", "Un type de graphique de visualisation uniquement"], correct: 1 },
  { id: 402, deck: "prog", sub: "Python pour la finance", q: "Quelle est la principale différence entre une liste Python et un array NumPy ?", a: "L'array NumPy est typé de manière homogène et optimisé pour le calcul vectorisé, contrairement à la liste Python qui est hétérogène et plus lente pour les calculs numériques.", options: ["Il n'existe aucune différence de performance entre les deux", "L'array NumPy est homogène et optimisé pour le calcul vectorisé", "La liste Python est toujours plus rapide pour le calcul numérique", "L'array NumPy ne peut contenir que des entiers"], correct: 1 },

  { id: 404, deck: "prog", sub: "Python pour la finance", q: "Qu'est-ce qu'un générateur (generator) en Python ?", a: "Une fonction qui produit une séquence de valeurs à la demande via le mot-clé 'yield', sans stocker l'intégralité de la séquence en mémoire.", options: ["Une fonction qui retourne toujours une liste complète en mémoire", "Une fonction produisant des valeurs à la demande via 'yield', sans tout stocker en mémoire", "Un synonyme exact d'une compréhension de liste", "Une fonction générant automatiquement des nombres aléatoires"], correct: 1 },
  { id: 405, deck: "prog", sub: "Python pour la finance", q: "Quelle est la différence entre .loc et .iloc dans pandas ?", a: ".loc sélectionne les données par label (nom d'index ou de colonne), tandis que .iloc sélectionne par position numérique entière.", options: ["Ce sont deux méthodes strictement identiques", ".loc sélectionne par label, .iloc sélectionne par position numérique", ".iloc sélectionne par label, .loc par position numérique", ".loc ne fonctionne que sur les colonnes, .iloc que sur les lignes"], correct: 1 },
  { id: 406, deck: "prog", sub: "Python pour la finance", q: "Qu'est-ce qu'un décorateur en Python ?", a: "Une fonction qui modifie ou étend le comportement d'une autre fonction, sans avoir à modifier directement le code source de cette dernière.", options: ["Une fonction qui formate uniquement l'affichage du code", "Une fonction qui modifie ou étend le comportement d'une autre fonction", "Un type de commentaire spécial en Python", "Un synonyme exact d'une classe abstraite"], correct: 1 },
  { id: 407, deck: "prog", sub: "Python pour la finance", q: "Qu'est-ce que le GIL (Global Interpreter Lock) en Python ?", a: "Un verrou interne empêchant l'exécution simultanée de plusieurs threads Python natifs, ce qui limite le parallélisme réel obtenu via le multithreading classique.", options: ["Un outil de débogage intégré à Python", "Un verrou empêchant l'exécution simultanée de plusieurs threads Python natifs", "Une bibliothèque de calcul parallèle standard", "Un synonyme exact du garbage collector"], correct: 1 },
  { id: 408, deck: "prog", sub: "Python pour la finance", q: "Comment gère-t-on généralement les valeurs manquantes (NaN) dans un DataFrame pandas ?", a: "Avec dropna() pour supprimer les lignes/colonnes concernées, ou fillna()/interpolate() pour les remplacer par une valeur ou une estimation.", options: ["Elles sont automatiquement supprimées par Python sans intervention", "Avec dropna() pour supprimer, ou fillna()/interpolate() pour remplacer", "Elles provoquent systématiquement une erreur bloquante", "Uniquement en réécrivant manuellement chaque valeur une par une"], correct: 1 },
  { id: 409, deck: "prog", sub: "Python pour la finance", q: "Qu'est-ce qu'une compréhension de liste (list comprehension) en Python ?", a: "Une syntaxe concise permettant de créer une liste en une seule ligne, à partir d'une itération et d'une condition optionnelle.", options: ["Une méthode de compression de fichiers", "Une syntaxe concise pour créer une liste en une ligne, avec itération et condition", "Un synonyme exact d'un dictionnaire Python", "Une fonction intégrée de tri des listes"], correct: 1 },
  { id: 410, deck: "prog", sub: "Python pour la finance", q: "Pourquoi utiliser le multiprocessing en Python malgré l'existence du GIL ?", a: "Le multiprocessing crée des processus séparés, chacun avec son propre interpréteur Python, ce qui contourne le GIL et permet une réelle parallélisation des calculs intensifs en CPU.", options: ["Le multiprocessing ne fonctionne pas en présence du GIL", "Il crée des processus séparés avec leur propre interpréteur, contournant le GIL", "Il remplace totalement le besoin de threads en Python", "Il ne sert qu'à paralléliser des opérations d'entrée-sortie"], correct: 1 },

  { id: 414, deck: "prog", sub: "Python pour la finance", q: "Que fait la méthode resample() sur une série temporelle pandas ?", a: "Elle rééchantillonne la série vers une fréquence temporelle différente (ex. de données journalières vers mensuelles), en appliquant une fonction d'agrégation.", options: ["Elle supprime les valeurs aberrantes de la série", "Elle rééchantillonne la série vers une fréquence temporelle différente", "Elle inverse l'ordre chronologique de la série", "Elle calcule uniquement la moyenne globale de la série"], correct: 1 },

  { id: 416, deck: "prog", sub: "Structures de données & algorithmes", q: "Quelle est la complexité temporelle moyenne d'une recherche dans une table de hachage (hash table) ?", a: "O(1) en moyenne, car l'accès à une valeur se fait directement via sa clé hachée, sans avoir à parcourir l'ensemble de la structure.", options: ["O(n)", "O(1) en moyenne", "O(log n)", "O(n²)"], correct: 1 },
  { id: 417, deck: "prog", sub: "Structures de données & algorithmes", q: "Quelle est la complexité temporelle moyenne du tri rapide (quicksort) ?", a: "O(n log n) en moyenne, bien que son pire cas théorique soit O(n²) pour des données déjà triées avec un mauvais choix de pivot.", options: ["O(n)", "O(n log n) en moyenne", "O(log n)", "O(n²) systématiquement"], correct: 1 },
  { id: 418, deck: "prog", sub: "Structures de données & algorithmes", q: "Qu'est-ce qu'une pile (stack) et son principe LIFO ?", a: "Une structure de données où le dernier élément ajouté est le premier retiré (Last In, First Out), comme une pile d'assiettes.", options: ["Une structure où le premier élément ajouté est le premier retiré", "Une structure où le dernier élément ajouté est le premier retiré (LIFO)", "Une structure sans ordre de retrait défini", "Un synonyme exact d'une table de hachage"], correct: 1 },
  { id: 419, deck: "prog", sub: "Structures de données & algorithmes", q: "Qu'est-ce qu'une file (queue) et son principe FIFO ?", a: "Une structure de données où le premier élément ajouté est le premier retiré (First In, First Out), comme une file d'attente.", options: ["Une structure où le dernier élément ajouté est le premier retiré", "Une structure où le premier élément ajouté est le premier retiré (FIFO)", "Un synonyme exact d'une pile (stack)", "Une structure réservée uniquement aux nombres entiers"], correct: 1 },
  { id: 420, deck: "prog", sub: "Structures de données & algorithmes", q: "Qu'est-ce qu'un arbre binaire de recherche (BST) ?", a: "Une structure arborescente où chaque nœud possède au plus deux enfants, avec toutes les valeurs du sous-arbre gauche inférieures au nœud et celles de droite supérieures.", options: ["Un arbre où chaque nœud a exactement trois enfants", "Une structure arborescente où les valeurs de gauche sont inférieures et celles de droite supérieures au nœud", "Un synonyme exact d'une liste chaînée", "Une structure ne pouvant contenir que des valeurs entières positives"], correct: 1 },
  { id: 421, deck: "prog", sub: "Structures de données & algorithmes", q: "Quelle est la complexité de recherche dans un arbre binaire de recherche équilibré ?", a: "O(log n), car à chaque niveau de l'arbre, l'espace de recherche est divisé approximativement par deux.", options: ["O(n)", "O(log n)", "O(1)", "O(n log n)"], correct: 1 },
  { id: 422, deck: "prog", sub: "Structures de données & algorithmes", q: "Quelle est la complexité de la recherche dichotomique (binary search) sur un tableau trié ?", a: "O(log n), car l'algorithme divise l'espace de recherche par deux à chaque itération.", options: ["O(n)", "O(log n)", "O(n²)", "O(1)"], correct: 1 },
  { id: 423, deck: "prog", sub: "Structures de données & algorithmes", q: "Qu'est-ce qu'une table de hachage (hash table) ?", a: "Une structure de données associant des clés à des valeurs via une fonction de hachage, permettant un accès quasi instantané en moyenne.", options: ["Une structure triée conservant l'ordre d'insertion strict", "Une structure associant des clés à des valeurs via une fonction de hachage", "Un synonyme exact d'un arbre binaire de recherche", "Une structure réservée exclusivement aux chaînes de caractères"], correct: 1 },
  { id: 424, deck: "prog", sub: "Structures de données & algorithmes", q: "Qu'est-ce que la programmation dynamique en algorithmique ?", a: "Une technique résolvant un problème complexe en le décomposant en sous-problèmes plus simples, dont les résultats sont mémorisés pour éviter de les recalculer plusieurs fois.", options: ["Une technique de génération de code dynamique à l'exécution", "Une technique décomposant un problème en sous-problèmes avec mémorisation des résultats", "Un synonyme exact de la récursivité simple", "Une méthode réservée exclusivement au tri de données"], correct: 1 },
  { id: 425, deck: "prog", sub: "Structures de données & algorithmes", q: "Qu'est-ce qu'un algorithme glouton (greedy) ?", a: "Un algorithme qui fait, à chaque étape, le choix localement optimal sans jamais revenir en arrière, sans garantie d'obtenir la solution globalement optimale.", options: ["Un algorithme qui teste systématiquement toutes les solutions possibles", "Un algorithme faisant à chaque étape le choix localement optimal, sans revenir en arrière", "Un synonyme exact de la programmation dynamique", "Un algorithme garantissant toujours la solution optimale globale"], correct: 1 },
  { id: 426, deck: "prog", sub: "Structures de données & algorithmes", q: "Quelle est la complexité du tri fusion (merge sort), dans le pire cas comme en moyenne ?", a: "O(n log n) dans tous les cas, y compris le pire cas, contrairement au quicksort dont le pire cas peut atteindre O(n²).", options: ["O(n) dans tous les cas", "O(n log n) dans tous les cas, y compris le pire cas", "O(n²) dans le meilleur des cas seulement", "O(log n) dans tous les cas"], correct: 1 },
  { id: 427, deck: "prog", sub: "Structures de données & algorithmes", q: "Quel est l'avantage principal d'une liste chaînée (linked list) par rapport à un tableau classique ?", a: "Elle permet une insertion et une suppression rapides (O(1) à une position connue), au prix d'un accès séquentiel plus lent qu'un tableau pour atteindre un élément donné.", options: ["Elle offre toujours un accès plus rapide à un élément donné qu'un tableau", "Elle permet une insertion/suppression rapide, mais un accès séquentiel plus lent", "Elle consomme systématiquement moins de mémoire qu'un tableau", "Elle ne peut contenir que des éléments de même type"], correct: 1 },
  { id: 428, deck: "prog", sub: "Structures de données & algorithmes", q: "Qu'est-ce que la récursivité en programmation ?", a: "Une technique où une fonction s'appelle elle-même pour résoudre un problème en le décomposant en sous-problèmes plus petits de nature identique.", options: ["Une technique interdisant tout appel de fonction imbriqué", "Une technique où une fonction s'appelle elle-même pour résoudre des sous-problèmes de même nature", "Un synonyme exact d'une boucle for classique", "Une méthode réservée exclusivement au tri de tableaux"], correct: 1 },
  { id: 429, deck: "prog", sub: "Structures de données & algorithmes", q: "À quoi sert principalement un tas binaire (heap) ?", a: "À accéder rapidement (en O(1)) au minimum ou au maximum d'un ensemble de valeurs, ce qui en fait la structure de base des files de priorité.", options: ["À trier des données par ordre alphabétique uniquement", "À accéder rapidement au minimum ou maximum, base des files de priorité", "À stocker des données sous forme de graphe orienté", "À remplacer systématiquement les tables de hachage"], correct: 1 },
  { id: 430, deck: "prog", sub: "Structures de données & algorithmes", q: "Que décrit la notation Big O en algorithmique ?", a: "Elle décrit la complexité asymptotique d'un algorithme (en temps ou en mémoire) en fonction de la taille de l'entrée, généralement dans le pire cas.", options: ["Le nombre exact de lignes de code d'un algorithme", "La complexité asymptotique d'un algorithme en fonction de la taille de l'entrée", "Le langage de programmation utilisé pour l'implémenter", "Le temps d'exécution exact mesuré en secondes"], correct: 1 },
  { id: 431, deck: "prog", sub: "SQL & bases de données", q: "Que fait une clause SQL GROUP BY ?", a: "Elle regroupe les lignes partageant une même valeur dans une ou plusieurs colonnes, afin d'y appliquer des fonctions d'agrégation comme SUM, COUNT ou AVG.", options: ["Elle trie les résultats par ordre croissant uniquement", "Elle regroupe les lignes selon une ou plusieurs colonnes pour appliquer des agrégations", "Elle supprime automatiquement les doublons de la table", "Elle filtre les lignes avant toute agrégation"], correct: 1 },
  { id: 432, deck: "prog", sub: "SQL & bases de données", q: "Quelle est la différence entre un INNER JOIN et un LEFT JOIN en SQL ?", a: "L'INNER JOIN ne conserve que les lignes ayant une correspondance dans les deux tables, tandis que le LEFT JOIN conserve toutes les lignes de la table de gauche, même sans correspondance.", options: ["Ce sont deux syntaxes strictement équivalentes", "L'INNER JOIN garde les correspondances des deux tables, le LEFT JOIN garde toute la table de gauche", "Le LEFT JOIN ne garde que les correspondances des deux tables", "L'INNER JOIN garde systématiquement plus de lignes que le LEFT JOIN"], correct: 1 },
  { id: 433, deck: "prog", sub: "SQL & bases de données", q: "Qu'est-ce qu'une clé primaire (primary key) dans une table SQL ?", a: "Une colonne, ou un ensemble de colonnes, permettant d'identifier de façon unique chaque ligne d'une table.", options: ["Une colonne pouvant contenir des valeurs dupliquées librement", "Une colonne identifiant de façon unique chaque ligne de la table", "Un synonyme exact d'une clé étrangère", "Une colonne obligatoirement de type texte"], correct: 1 },
  { id: 434, deck: "prog", sub: "SQL & bases de données", q: "Qu'est-ce qu'une clé étrangère (foreign key) ?", a: "Une colonne référençant la clé primaire d'une autre table, garantissant l'intégrité référentielle entre les deux tables liées.", options: ["Une colonne identifiant de façon unique chaque ligne de sa propre table", "Une colonne référençant la clé primaire d'une autre table pour garantir l'intégrité référentielle", "Un synonyme exact d'un index de base de données", "Une colonne qui ne peut jamais contenir de valeur nulle"], correct: 1 },
  { id: 435, deck: "prog", sub: "SQL & bases de données", q: "À quoi sert une fonction de fenêtrage (window function) SQL comme ROW_NUMBER() OVER(...) ?", a: "Elle effectue un calcul sur un ensemble de lignes liées à la ligne courante (une 'fenêtre'), sans regrouper physiquement les résultats comme le ferait un GROUP BY classique.", options: ["Elle regroupe systématiquement les résultats comme un GROUP BY", "Elle effectue un calcul sur une fenêtre de lignes liées à la ligne courante, sans les regrouper", "Elle sert uniquement à trier les résultats d'une requête", "Elle ne peut être utilisée qu'avec des colonnes numériques"], correct: 1 },
  { id: 436, deck: "prog", sub: "SQL & bases de données", q: "À quoi sert un index dans une base de données ?", a: "À accélérer significativement la recherche de données dans une table, au prix d'un coût de maintenance supplémentaire lors des opérations d'écriture (insertion, mise à jour).", options: ["À stocker une copie complète de la table pour la sécurité", "À accélérer la recherche de données, avec un coût supplémentaire lors des écritures", "À garantir automatiquement l'unicité de toutes les colonnes", "À chiffrer les données sensibles de la table"], correct: 1 },
  { id: 437, deck: "prog", sub: "SQL & bases de données", q: "Que garantissent les propriétés ACID d'une transaction en base de données ?", a: "Atomicité, Cohérence, Isolation et Durabilité — un ensemble de garanties essentielles pour assurer la fiabilité des transactions, même en cas de panne ou d'accès concurrents.", options: ["Uniquement la vitesse d'exécution des requêtes", "Atomicité, Cohérence, Isolation, Durabilité", "L'absence totale d'index dans la base de données", "La compression automatique des données stockées"], correct: 1 },
  { id: 438, deck: "prog", sub: "SQL & bases de données", q: "Quelle est la différence entre les clauses WHERE et HAVING en SQL ?", a: "WHERE filtre les lignes individuelles avant toute agrégation, tandis que HAVING filtre les groupes résultants après application d'un GROUP BY.", options: ["Ce sont deux clauses strictement équivalentes en SQL", "WHERE filtre avant l'agrégation, HAVING filtre les groupes après GROUP BY", "HAVING filtre avant l'agrégation, WHERE filtre après GROUP BY", "WHERE ne peut être utilisée qu'avec des colonnes numériques"], correct: 1 },
  { id: 439, deck: "prog", sub: "SQL & bases de données", q: "Quelle est la principale différence entre une base de données relationnelle et une base NoSQL ?", a: "La relationnelle organise les données en tables structurées avec des relations définies par des clés, tandis que la NoSQL propose des modèles plus flexibles (documents, clé-valeur, graphes), souvent adaptés à de gros volumes non structurés.", options: ["Il n'existe aucune différence structurelle entre les deux", "La relationnelle utilise des tables structurées, la NoSQL des modèles plus flexibles", "La NoSQL utilise toujours exclusivement des tables SQL classiques", "La relationnelle ne peut jamais gérer de grands volumes de données"], correct: 1 },
  { id: 440, deck: "prog", sub: "SQL & bases de données", q: "Quelle est la différence entre UNION et UNION ALL en SQL ?", a: "UNION combine les résultats de deux requêtes en supprimant les doublons, tandis que UNION ALL conserve tous les doublons, ce qui le rend généralement plus rapide.", options: ["Ce sont deux clauses strictement identiques en SQL", "UNION supprime les doublons, UNION ALL les conserve", "UNION ALL supprime les doublons, UNION les conserve", "UNION ne fonctionne que sur des tables de même nom"], correct: 1 },
  { id: 441, deck: "prog", sub: "SQL & bases de données", q: "Qu'est-ce qu'une sous-requête (subquery) en SQL ?", a: "Une requête imbriquée à l'intérieur d'une autre requête SQL, souvent utilisée au sein d'une clause WHERE, FROM ou SELECT.", options: ["Une requête exécutée obligatoirement avant toutes les autres", "Une requête imbriquée à l'intérieur d'une autre requête SQL", "Un synonyme exact d'une jointure (JOIN)", "Une requête qui ne peut jamais retourner de valeur unique"], correct: 1 },
  { id: 442, deck: "prog", sub: "SQL & bases de données", q: "Qu'est-ce que la normalisation d'une base de données relationnelle ?", a: "Un processus organisant les tables selon des règles précises (formes normales) afin de réduire la redondance des données et d'améliorer leur intégrité.", options: ["Un processus qui duplique systématiquement les données pour la sécurité", "Un processus réduisant la redondance des données et améliorant leur intégrité", "Un synonyme exact de l'indexation d'une table", "Un processus consistant à supprimer toutes les clés étrangères"], correct: 1 },
  { id: 443, deck: "prog", sub: "Complexité & performance", q: "Quelle est la différence pratique entre un algorithme en O(n) et un en O(n²) sur un grand jeu de données ?", a: "O(n) croît linéairement avec la taille des données, tandis que O(n²) croît de façon quadratique, devenant rapidement impraticable lorsque n devient grand (ex. millions de lignes).", options: ["Il n'existe aucune différence significative en pratique", "O(n) croît linéairement, O(n²) croît quadratiquement et devient vite impraticable", "O(n²) est toujours plus rapide que O(n) en pratique", "Les deux complexités sont équivalentes pour de grands jeux de données"], correct: 1 },
  { id: 444, deck: "prog", sub: "Complexité & performance", q: "Pourquoi préférer une opération vectorisée NumPy à une boucle for en Python pour des calculs financiers intensifs ?", a: "Parce qu'elle exploite du code C compilé sous-jacent, ce qui la rend bien plus rapide que l'interprétation ligne par ligne d'une boucle Python classique.", options: ["Une boucle for est toujours plus rapide qu'une opération vectorisée", "Elle exploite du code C compilé, bien plus rapide qu'une boucle Python interprétée", "Il n'existe aucune différence de performance mesurable entre les deux", "La vectorisation ne fonctionne que sur des données textuelles"], correct: 1 },
  { id: 445, deck: "prog", sub: "Complexité & performance", q: "À quoi sert le profiling de code ?", a: "À mesurer précisément le temps d'exécution ou la consommation mémoire des différentes parties d'un programme, afin d'identifier les goulots d'étranglement à optimiser en priorité.", options: ["À corriger automatiquement les erreurs de syntaxe du code", "À mesurer le temps d'exécution ou la mémoire consommée pour identifier les goulots d'étranglement", "À générer automatiquement la documentation du code", "À compresser le code source pour réduire sa taille"], correct: 1 },
  { id: 446, deck: "prog", sub: "Complexité & performance", q: "Pourquoi la mise en cache (caching) est-elle utile en finance quantitative ?", a: "Elle permet de stocker temporairement le résultat de calculs coûteux (comme un pricing complexe) pour éviter de le recalculer inutilement lors d'appels répétés avec les mêmes paramètres.", options: ["Elle sert uniquement à sécuriser les données sensibles", "Elle stocke temporairement des résultats coûteux pour éviter de les recalculer inutilement", "Elle remplace totalement le besoin de bases de données", "Elle ralentit systématiquement l'exécution du programme"], correct: 1 },
  { id: 447, deck: "prog", sub: "Complexité & performance", q: "Qu'est-ce que le calcul parallèle (parallel computing) ?", a: "L'exécution simultanée de plusieurs calculs indépendants sur plusieurs cœurs de processeur ou plusieurs machines, afin d'accélérer un traitement global.", options: ["L'exécution séquentielle de calculs sur un seul cœur de processeur", "L'exécution simultanée de calculs indépendants sur plusieurs cœurs ou machines", "Un synonyme exact de la programmation asynchrone", "Une technique réservée exclusivement au traitement d'images"], correct: 1 },
  { id: 448, deck: "prog", sub: "Complexité & performance", q: "Pourquoi utilise-t-on des outils comme Cython ou Numba avec Python en finance quantitative ?", a: "Ils permettent de compiler du code Python (ou proche) pour obtenir des performances proches du C, cruciales pour des calculs intensifs comme le pricing par simulation Monte-Carlo.", options: ["Ils servent uniquement à améliorer la lisibilité du code Python", "Ils permettent de compiler le code pour des performances proches du C, utiles pour des calculs intensifs", "Ils remplacent totalement le besoin d'utiliser NumPy", "Ils ne fonctionnent que sur des données textuelles"], correct: 1 },
  { id: 449, deck: "prog", sub: "Complexité & performance", q: "Qu'est-ce que la latence dans un système de trading ?", a: "Le délai entre l'émission d'un ordre ou la réception d'une donnée de marché et son traitement effectif par le système, un enjeu critique notamment en trading haute fréquence.", options: ["Le nombre total de transactions exécutées par jour", "Le délai entre l'émission d'un ordre/donnée et son traitement effectif", "Un synonyme exact du bid-ask spread", "Le coût moyen d'une transaction exécutée"], correct: 1 },
  { id: 450, deck: "prog", sub: "Complexité & performance", q: "Qu'est-ce qu'une architecture orientée événements (event-driven) en trading algorithmique ?", a: "Une architecture où le système réagit directement à des événements (arrivée d'un nouveau prix, exécution d'un ordre) plutôt que de vérifier en boucle et en continu l'état du marché.", options: ["Une architecture qui vérifie en boucle continue l'état du marché", "Une architecture où le système réagit directement à des événements survenant", "Un synonyme exact d'une architecture purement séquentielle", "Une architecture réservée exclusivement aux bases de données"], correct: 1 },
  { id: 451, deck: "prog", sub: "Complexité & performance", q: "Que mesure la complexité en espace (space complexity) d'un algorithme ?", a: "La quantité de mémoire supplémentaire requise par l'algorithme en fonction de la taille de son entrée, en complément de sa complexité temporelle.", options: ["Le temps d'exécution total de l'algorithme", "La quantité de mémoire supplémentaire requise en fonction de la taille de l'entrée", "Le nombre de lignes de code nécessaires à son implémentation", "Un synonyme exact de la complexité temporelle"], correct: 1 },
  { id: 452, deck: "prog", sub: "Complexité & performance", q: "Pourquoi privilégier un traitement 'in-place' pour de grands jeux de données financières ?", a: "Il évite de dupliquer inutilement les données en mémoire, réduisant significativement la consommation mémoire lors du traitement de très larges datasets.", options: ["Il rend systématiquement le code plus lisible, sans impact sur la mémoire", "Il évite de dupliquer les données, réduisant la consommation mémoire", "Il accélère toujours l'exécution indépendamment de la mémoire disponible", "Il n'a aucun impact réel sur la performance du programme"], correct: 1 },
  { id: 453, deck: "prog", sub: "Outils & bonnes pratiques", q: "À quoi sert Git dans le développement d'un système de trading ou de recherche quantitative ?", a: "À suivre l'historique des modifications du code, permettre le travail collaboratif entre plusieurs développeurs, et pouvoir revenir facilement à une version antérieure en cas de problème.", options: ["Uniquement à exécuter automatiquement des tests unitaires", "À suivre l'historique des modifications, permettre le travail collaboratif et revenir en arrière si besoin", "À accélérer l'exécution du code en production", "À remplacer totalement le besoin de documentation du code"], correct: 1 },
  { id: 454, deck: "prog", sub: "Outils & bonnes pratiques", q: "Qu'est-ce qu'un test unitaire (unit test) et pourquoi est-il crucial en finance quantitative ?", a: "Un test vérifiant qu'une petite unité de code (une fonction précise) se comporte comme attendu ; il est essentiel pour garantir la fiabilité d'un modèle de pricing ou de gestion des risques avant sa mise en production.", options: ["Un test vérifiant l'ensemble du système dans son intégralité", "Un test vérifiant qu'une petite unité de code se comporte comme attendu", "Un synonyme exact du profiling de performance", "Un test réservé exclusivement aux interfaces utilisateur"], correct: 1 },
  { id: 455, deck: "prog", sub: "Outils & bonnes pratiques", q: "Qu'est-ce que l'intégration continue (CI/CD) ?", a: "Un processus automatisant l'exécution des tests et le déploiement du code à chaque modification, permettant de détecter rapidement d'éventuelles régressions introduites.", options: ["Une méthode de rédaction manuelle de la documentation du code", "Un processus automatisant les tests et le déploiement à chaque modification du code", "Un synonyme exact d'un environnement virtuel Python", "Une technique réservée exclusivement au développement web"], correct: 1 },
  { id: 456, deck: "prog", sub: "Outils & bonnes pratiques", q: "Qu'est-ce qu'une API REST et à quoi peut-elle servir en finance ?", a: "Une interface permettant à des applications de communiquer entre elles via des requêtes HTTP standardisées, par exemple pour récupérer des données de marché ou transmettre des ordres à un broker.", options: ["Un langage de programmation spécifique à la finance", "Une interface permettant la communication entre applications via des requêtes HTTP standardisées", "Un synonyme exact d'une base de données relationnelle", "Un protocole réservé exclusivement aux transactions bancaires"], correct: 1 },
  { id: 457, deck: "prog", sub: "Outils & bonnes pratiques", q: "Qu'est-ce que le versionnement sémantique (semantic versioning) d'un logiciel ?", a: "Une convention de numérotation des versions (majeur.mineur.patch) indiquant la nature et l'ampleur des changements apportés à chaque nouvelle version.", options: ["Une méthode de chiffrement du code source", "Une convention de numérotation des versions indiquant la nature des changements", "Un synonyme exact de l'intégration continue", "Une technique de compression des fichiers de code"], correct: 1 },
  { id: 458, deck: "prog", sub: "Outils & bonnes pratiques", q: "Pourquoi la reproductibilité est-elle essentielle en recherche quantitative ?", a: "Pour garantir qu'un résultat de backtest ou d'un modèle puisse être retrouvé exactement à l'identique, notamment via la fixation des seeds aléatoires et une gestion rigoureuse des versions de code et de données.", options: ["Elle n'a qu'un intérêt esthétique sans impact réel sur les résultats", "Elle garantit qu'un résultat puisse être retrouvé exactement à l'identique", "Elle concerne uniquement la présentation visuelle des graphiques", "Elle n'est utile que pour le code destiné à la production"], correct: 1 },
  { id: 459, deck: "prog", sub: "Outils & bonnes pratiques", q: "Qu'est-ce qu'un pipeline de données (data pipeline) ?", a: "Un enchaînement automatisé d'étapes de collecte, nettoyage, transformation et stockage des données, essentiel pour alimenter de façon fiable des modèles quantitatifs.", options: ["Un synonyme exact d'une base de données relationnelle", "Un enchaînement automatisé de collecte, nettoyage, transformation et stockage des données", "Une méthode de visualisation de données financières uniquement", "Un outil réservé exclusivement à l'exécution d'ordres de trading"], correct: 1 },
  { id: 460, deck: "prog", sub: "Outils & bonnes pratiques", q: "Qu'est-ce que le 'code review' et pourquoi est-il important en finance quantitative ?", a: "La relecture du code par un ou plusieurs pairs avant son intégration, permettant de détecter des erreurs potentielles, d'améliorer la qualité du code et de partager la connaissance au sein d'une équipe.", options: ["Une vérification purement automatique sans intervention humaine", "La relecture du code par des pairs avant intégration, pour détecter des erreurs et partager la connaissance", "Un synonyme exact des tests unitaires automatisés", "Une pratique réservée exclusivement aux grandes équipes de plus de 50 développeurs"], correct: 1 },
];
