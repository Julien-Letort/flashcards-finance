  { id: 742, deck: "entretien", sub: "Repères marché à connaître", q: "Quelle est la volatilité annualisée historique typique de l'indice S&P 500 ?", a: "Environ 15 à 20% par an en moyenne de long terme, bien que très variable selon les périodes (pouvant dépasser 40% en période de crise aiguë).", options: ["Environ 5%", "Environ 15 à 20%", "Environ 40 à 50%", "Environ 2 à 3%"], correct: 1 },
  { id: 743, deck: "entretien", sub: "Repères marché à connaître", q: "Quel est l'ordre de grandeur du rendement moyen historique des obligations d'État américaines à 10 ans (Treasuries) ?", a: "Environ 4 à 5% en moyenne nominale de long terme, nettement inférieur aux actions mais avec une volatilité bien moindre.", options: ["Environ 1%", "Environ 4 à 5%", "Environ 10%", "Environ 15%"], correct: 1 },
  { id: 744, deck: "entretien", sub: "Repères marché à connaître", q: "Quel ratio de Sharpe est généralement considéré comme 'bon' pour un hedge fund établi sur la durée ?", a: "Un Sharpe autour de 1 est généralement considéré comme solide ; au-delà de 2 de façon soutenue est considéré comme exceptionnel et rare.", options: ["Environ 0,1", "Environ 1", "Environ 5", "Environ 10"], correct: 1 },
  { id: 745, deck: "entretien", sub: "Repères marché à connaître", q: "Quel est l'ordre de grandeur du maximum drawdown typique d'un grand indice actions lors d'une crise majeure (2008, 2000) ?", a: "Entre −40% et −55% pour les indices actions larges lors des crises les plus sévères des dernières décennies.", options: ["Entre −10% et −15%", "Entre −40% et −55%", "Entre −70% et −90%", "Entre −5% et −10%"], correct: 1 },
  { id: 746, deck: "entretien", sub: "Repères marché à connaître", q: "Combien de jours de bourse (jours ouvrés) compte-t-on typiquement dans une année, convention standard utilisée en finance ?", a: "Environ 252 jours ouvrés, une convention standard utilisée notamment pour annualiser les calculs de volatilité et de rendement.", options: ["Environ 200 jours", "Environ 252 jours", "Environ 300 jours", "365 jours"], correct: 1 },
  { id: 747, deck: "entretien", sub: "Repères marché à connaître", q: "Quel est l'objectif d'inflation cible standard de la plupart des grandes banques centrales occidentales (Fed, BCE) ?", a: "Environ 2% d'inflation annuelle à moyen terme, un objectif largement partagé depuis les années 1990-2000.", options: ["0%", "Environ 2%", "Environ 5%", "Environ 10%"], correct: 1 },
  { id: 748, deck: "entretien", sub: "Repères marché à connaître", q: "Quel est l'ordre de grandeur du ratio dette publique/PIB souvent considéré comme un seuil d'alerte pour un pays développé ?", a: "Autour de 90 à 100% du PIB, seuil au-delà duquel la soutenabilité de la dette est généralement davantage scrutée par les marchés, sans être un seuil strict ou universel.", options: ["Autour de 30%", "Autour de 90 à 100%", "Autour de 200%", "Il n'existe aucun seuil de référence communément cité"], correct: 1 },
  { id: 749, deck: "entretien", sub: "Repères marché à connaître", q: "Quel est l'ordre de grandeur du rendement du dividende moyen historique de l'indice S&P 500 ?", a: "Environ 1,5 à 2% par an en moyenne sur les dernières décennies, en tendance longue plutôt baissière en raison de la hausse des rachats d'actions comme alternative de retour aux actionnaires.", options: ["Environ 0,1%", "Environ 1,5 à 2%", "Environ 5 à 6%", "Environ 10%"], correct: 1 },
  { id: 750, deck: "entretien", sub: "Repères marché à connaître", q: "Quelle est la duration approximative typique d'une obligation d'État à 10 ans portant un coupon standard ?", a: "Environ 7 à 8 ans, la duration étant généralement inférieure à la maturité nominale du fait de la présence de coupons versés avant l'échéance finale.", options: ["Environ 2 à 3 ans", "Environ 7 à 8 ans", "Exactement 10 ans", "Environ 15 ans"], correct: 1 },
  { id: 751, deck: "entretien", sub: "Repères marché à connaître", q: "Quel est l'ordre de grandeur du spread de crédit typique d'une obligation 'investment grade' par rapport au taux sans risque, hors période de stress ?", a: "Environ 50 à 150 points de base (0,5% à 1,5%) en conditions de marché normales.", options: ["Environ 5 à 10 points de base", "Environ 50 à 150 points de base", "Environ 500 à 1000 points de base", "Environ 2000 points de base"], correct: 1 },
  { id: 752, deck: "entretien", sub: "Repères marché à connaître", q: "Quel est l'ordre de grandeur du spread de crédit typique d'une obligation 'high yield' (spéculative) par rapport au taux sans risque, hors période de stress ?", a: "Environ 300 à 500 points de base (3% à 5%) en conditions de marché normales, nettement plus élevé que pour l'investment grade.", options: ["Environ 50 points de base", "Environ 300 à 500 points de base", "Environ 2000 points de base", "Environ 10 000 points de base"], correct: 1 },
  { id: 753, deck: "entretien", sub: "Repères marché à connaître", q: "Quel niveau de VIX est généralement considéré comme séparant un marché 'calme' d'un marché 'stressé' ?", a: "En dessous de 15-20 pour un marché calme, au-dessus de 30 pour un marché nettement stressé, avec des pics historiques ayant dépassé 80 lors des crises majeures (2008, 2020).", options: ["En dessous de 5 pour calme, au-dessus de 10 pour stressé", "En dessous de 15-20 pour calme, au-dessus de 30 pour stressé", "En dessous de 50 pour calme, au-dessus de 100 pour stressé", "Le VIX ne mesure pas le niveau de stress de marché"], correct: 1 },
  { id: 754, deck: "entretien", sub: "Repères marché à connaître", q: "Quel est l'ordre de grandeur typique de la structure de frais '2 and 20' d'un hedge fund traditionnel ?", a: "2% de frais de gestion annuels sur les actifs sous gestion, plus 20% de commission de performance au-delà d'un seuil de rendement (hurdle rate) ou d'un high-water mark.", options: ["0,5% de frais de gestion, sans commission de performance", "2% de frais de gestion, plus 20% de commission de performance", "20% de frais de gestion, plus 2% de commission de performance", "10% de frais de gestion fixes uniquement"], correct: 1 },
  { id: 755, deck: "entretien", sub: "Repères marché à connaître", q: "Quel est l'ordre de grandeur de la marge nette moyenne d'une entreprise du S&P 500, tous secteurs confondus ?", a: "Environ 10 à 12% en moyenne historique récente, bien que très variable selon les secteurs d'activité représentés.", options: ["Environ 1 à 2%", "Environ 10 à 12%", "Environ 30 à 40%", "Environ 50%"], correct: 1 },
  { id: 756, deck: "entretien", sub: "Repères marché à connaître", q: "Quel est l'ordre de grandeur du PER (P/E ratio) moyen historique de long terme de l'indice S&P 500 ?", a: "Environ 15 à 17 en moyenne historique de long terme, bien que ce niveau ait souvent été dépassé lors des dernières décennies.", options: ["Environ 5", "Environ 15 à 17", "Environ 40", "Environ 100"], correct: 1 },
  { id: 757, deck: "entretien", sub: "Repères marché à connaître", q: "Combien de temps dure généralement un cycle économique complet (expansion + récession) aux États-Unis, en moyenne historique ?", a: "Environ 5 à 7 ans en moyenne, bien que la durée varie fortement d'un cycle à l'autre selon le contexte économique.", options: ["Environ 1 an", "Environ 5 à 7 ans", "Environ 20 ans", "Environ 50 ans"], correct: 1 },
  { id: 758, deck: "entretien", sub: "Repères marché à connaître", q: "Quel est l'ordre de grandeur typique du taux de rotation (turnover) annuel d'un fonds actions activement géré ?", a: "Entre 30% et 80% par an en moyenne pour un fonds actif classique, bien au-delà de celui d'un fonds indiciel passif (souvent inférieur à 5%).", options: ["Entre 1% et 5%", "Entre 30% et 80%", "Entre 200% et 300%", "Entre 500% et 1000%"], correct: 1 },
  { id: 759, deck: "entretien", sub: "Repères marché à connaître", q: "Quelle est la maturité de référence la plus couramment suivie sur la courbe des taux souverains pour évaluer une inversion annonciatrice de récession ?", a: "L'écart entre les taux à 10 ans et à 2 ans (spread 10Y-2Y) est le plus couramment surveillé comme signal avancé de récession potentielle.", options: ["L'écart entre les taux à 30 ans et à 25 ans", "L'écart entre les taux à 10 ans et à 2 ans", "L'écart entre les taux au jour le jour et à 1 semaine", "Aucune maturité particulière n'est privilégiée en pratique"], correct: 1 },
  { id: 760, deck: "entretien", sub: "Repères marché à connaître", q: "Quel est l'ordre de grandeur du nombre de hedge funds actifs dans le monde aujourd'hui ?", a: "De l'ordre de 8 000 à 10 000 fonds actifs à l'échelle mondiale, gérant collectivement plusieurs milliers de milliards de dollars d'actifs.", options: ["Environ 500", "Environ 8 000 à 10 000", "Environ 100 000", "Environ 1 million"], correct: 1 },
  { id: 761, deck: "entretien", sub: "Glossaire jargon front office", q: "Que signifie être 'flat' sur une position, en jargon de trading ?", a: "N'avoir aucune exposition nette (position nulle) sur l'actif concerné.", options: ["Avoir une position fortement gagnante", "N'avoir aucune exposition nette sur l'actif concerné", "Avoir une position fortement perdante", "Avoir doublé sa position initiale"], correct: 1 },
  { id: 762, deck: "entretien", sub: "Glossaire jargon front office", q: "Que signifie 'square' une position, en jargon de trading ?", a: "Synonyme de 'flat' — avoir soldé ou neutralisé complètement sa position, sans exposition résiduelle.", options: ["Avoir une position exactement carrée en taille (ex. 100x100)", "Avoir soldé ou neutralisé complètement sa position", "Avoir une position couverte à 50% seulement", "Avoir doublé le sizing d'une position"], correct: 1 },
  { id: 763, deck: "entretien", sub: "Glossaire jargon front office", q: "Que signifie 'avoir un axe' sur un nom, en jargon de desk (ex. 'j'ai un axe vendeur sur cette obligation') ?", a: "Un intérêt ou une préférence particulière du desk à traiter dans un sens donné (ici, à vendre), souvent parce que le desk cherche à réduire une position existante.", options: ["Une recommandation officielle publiée par l'équipe de recherche", "Un intérêt particulier du desk à traiter dans un sens donné, lié à sa propre position", "Un ordre client qui doit être exécuté en priorité absolue", "Une limite réglementaire imposée sur ce titre"], correct: 1 },
  { id: 764, deck: "entretien", sub: "Glossaire jargon front office", q: "Que signifie 'running the book' pour un trader ?", a: "Gérer activement l'ensemble des positions et du risque de son portefeuille de trading au jour le jour.", options: ["Tenir la comptabilité officielle du desk", "Gérer activement l'ensemble des positions et du risque de son portefeuille au quotidien", "Exécuter uniquement les ordres clients sans position propre", "Clôturer définitivement toutes ses positions en fin de journée"], correct: 1 },
  { id: 765, deck: "entretien", sub: "Glossaire jargon front office", q: "Que signifie 'off the run' pour une obligation du Trésor américain ?", a: "Une obligation qui n'est plus la plus récemment émise de sa maturité (par opposition à 'on the run'), généralement moins liquide et se traitant à un léger spread différent.", options: ["Une obligation arrivée à échéance et déjà remboursée", "Une obligation qui n'est plus la plus récemment émise de sa maturité", "Une obligation en défaut de paiement", "Une obligation indexée sur l'inflation uniquement"], correct: 1 },
  { id: 766, deck: "entretien", sub: "Glossaire jargon front office", q: "Que signifie 'show me a market' en langage de desk ?", a: "Demander à une contrepartie ou un market maker d'afficher ses prix d'achat et de vente (bid/ask) sur un instrument donné.", options: ["Demander l'historique complet des prix d'un actif", "Demander à une contrepartie d'afficher ses prix bid/ask sur un instrument donné", "Demander une analyse fondamentale détaillée d'un titre", "Demander l'ouverture d'un nouveau compte de trading"], correct: 1 },
  { id: 767, deck: "entretien", sub: "Glossaire jargon front office", q: "Que signifie 'the market is wide' en jargon de desk ?", a: "Un écart important entre le prix d'achat (bid) et de vente (ask), signalant généralement une faible liquidité ou une forte incertitude sur le titre.", options: ["Le marché traite un volume de transactions très élevé", "Un écart important entre bid et ask, signalant une faible liquidité", "Le marché concerne un grand nombre de participants actifs", "Le prix de l'actif a fortement varié durant la séance"], correct: 1 },
  { id: 768, deck: "entretien", sub: "Glossaire jargon front office", q: "Que signifie 'the market is tight' en jargon de desk ?", a: "Un écart faible entre le prix bid et le prix ask, signalant généralement une bonne liquidité et un marché efficient sur le titre concerné.", options: ["Un marché avec très peu de participants actifs", "Un écart faible entre bid et ask, signalant une bonne liquidité", "Un marché fermé temporairement à la négociation", "Un marché avec une forte volatilité intraday"], correct: 1 },
  { id: 769, deck: "entretien", sub: "Glossaire jargon front office", q: "Que signifie 'donne-moi du color' en langage de desk ?", a: "Demander des informations qualitatives ou du contexte supplémentaire (flux, sentiment de marché, actualité) sur un actif, au-delà du simple prix affiché.", options: ["Demander uniquement le dernier prix traité sur le titre", "Demander des informations qualitatives et du contexte supplémentaire sur l'actif", "Demander une analyse technique graphique détaillée", "Demander le nom de la contrepartie ayant traité en dernier"], correct: 1 },
  { id: 770, deck: "entretien", sub: "Glossaire jargon front office", q: "Que signifie 'the street' en jargon financier ?", a: "L'ensemble de la communauté des professionnels de marché (banques, brokers, investisseurs institutionnels), au sens large de 'le marché' ou 'les acteurs professionnels'.", options: ["Une rue spécifique à New York où se trouvent les banques", "L'ensemble de la communauté des professionnels de marché", "Un type spécifique d'ordre de marché", "Le nom d'une plateforme de trading électronique particulière"], correct: 1 },
  { id: 771, deck: "entretien", sub: "Glossaire jargon front office", q: "Que signifie un 'print' en jargon de trading (ex. 'there was a big print in that name') ?", a: "Une transaction exécutée et rapportée sur le marché, le terme étant généralement utilisé pour signaler une transaction de taille notable.", options: ["Un rapport de recherche publié par une banque", "Une transaction exécutée et rapportée sur le marché, souvent de taille notable", "Un ordre passé mais non encore exécuté", "Une erreur de saisie détectée sur un ordre"], correct: 1 },
  { id: 772, deck: "entretien", sub: "Glossaire jargon front office", q: "Que signifient les expressions 'risk on' et 'risk off' pour décrire le sentiment de marché ?", a: "'Risk on' désigne un environnement où les investisseurs privilégient les actifs risqués (actions, crédit) ; 'risk off' désigne l'inverse, une fuite vers les actifs perçus comme sûrs (obligations d'État, or, cash).", options: ["Elles décrivent uniquement le statut d'ouverture ou de fermeture d'un marché", "Risk on = préférence pour les actifs risqués, risk off = fuite vers les actifs sûrs", "Elles concernent exclusivement le marché des changes", "Risk off désigne un marché en forte hausse et risk on un marché en forte baisse"], correct: 1 },
  { id: 773, deck: "entretien", sub: "Glossaire jargon front office", q: "Que signifie le 'top of book' dans un carnet d'ordres ?", a: "Les meilleurs prix d'achat et de vente actuellement affichés dans le carnet d'ordres, c'est-à-dire les prix les plus proches du marché à un instant donné.", options: ["L'historique complet de tous les ordres passés dans la journée", "Les meilleurs prix d'achat et de vente actuellement affichés dans le carnet", "Le premier ordre exécuté à l'ouverture du marché", "Le volume total échangé depuis le début de la séance"], correct: 1 },
  { id: 774, deck: "entretien", sub: "Glossaire jargon front office", q: "Que mesure le DV01 (ou PV01) d'une position obligataire ?", a: "La variation de valeur (en devise) de la position pour une variation de 1 point de base (0,01%) des taux d'intérêt, une mesure clé de sensibilité au risque de taux.", options: ["Le rendement quotidien moyen de la position", "La variation de valeur de la position pour 1 point de base de variation des taux", "Le volume quotidien de transactions sur l'obligation", "La probabilité de défaut annualisée de l'émetteur"], correct: 1 },
  { id: 775, deck: "entretien", sub: "Glossaire jargon front office", q: "Que signifie 'lift the offer' en jargon de trading ?", a: "Acheter immédiatement au prix demandé (ask/offer) affiché par la contrepartie, plutôt que de négocier ou d'attendre un meilleur prix.", options: ["Annuler un ordre de vente en attente", "Acheter immédiatement au prix demandé (ask) affiché par la contrepartie", "Retirer une offre de vente précédemment affichée", "Placer un ordre limite en dessous du marché actuel"], correct: 1 },
  { id: 776, deck: "entretien", sub: "Glossaire jargon front office", q: "Que signifie 'hit the bid' en jargon de trading ?", a: "Vendre immédiatement au prix d'achat (bid) affiché par la contrepartie, plutôt que d'attendre un meilleur prix de vente.", options: ["Acheter immédiatement au prix demandé (ask)", "Vendre immédiatement au prix d'achat (bid) affiché par la contrepartie", "Placer un ordre d'achat au-dessus du marché actuel", "Annuler un ordre d'achat précédemment placé"], correct: 1 },
  { id: 777, deck: "entretien", sub: "Glossaire jargon front office", q: "Que signifie 'un clip' en jargon de trading (ex. 'un clip de 10 millions') ?", a: "Une unité ou tranche de taille standard d'une transaction, souvent utilisée pour désigner un montant notionnel typique traité en une seule fois sur un marché donné.", options: ["Un extrait vidéo d'une analyse de marché", "Une unité ou tranche de taille standard d'une transaction", "Une commission fixe prélevée sur chaque transaction", "Un type d'ordre annulé automatiquement après quelques secondes"], correct: 1 },
  { id: 778, deck: "entretien", sub: "Glossaire jargon front office", q: "Que signifie l'expression 'the book is long/short' pour décrire un portefeuille de trading ?", a: "Le portefeuille a une exposition nette positive (long) ou négative (short) au risque de marché ou à un facteur de risque donné.", options: ["Le portefeuille contient un grand nombre de positions (long) ou peu de positions (short)", "Le portefeuille a une exposition nette positive (long) ou négative (short) au risque de marché", "Le portefeuille est détenu depuis longtemps (long) ou récemment (short)", "Le portefeuille a une maturité longue (long) ou courte (short) uniquement"], correct: 1 },
  { id: 779, deck: "entretien", sub: "Glossaire jargon front office", q: "Que signifie le 'carry' d'une position, en langage de desk ?", a: "Le revenu (ou coût) généré par la simple détention d'une position dans le temps, indépendamment des mouvements de prix (ex. différentiel de taux, dividendes, coût de financement).", options: ["Le gain en capital réalisé lors de la clôture de la position", "Le revenu ou coût généré par la simple détention de la position dans le temps", "Le montant du dépôt de garantie exigé sur la position", "La commission facturée par le broker pour exécuter la transaction"], correct: 1 },
  { id: 780, deck: "entretien", sub: "Glossaire jargon front office", q: "Que signifie 'rouler' une position (ex. 'rouler un future'), en langage de desk ?", a: "Clôturer une position arrivant à échéance et en ouvrir simultanément une nouvelle de même nature sur une échéance ultérieure, pour maintenir l'exposition sans interruption.", options: ["Doubler la taille d'une position existante", "Clôturer une position à échéance et en ouvrir une nouvelle sur une échéance ultérieure", "Transférer une position vers un autre desk de la banque", "Convertir une position en devise étrangère"], correct: 1 },
  { id: 781, deck: "entretien", sub: "Glossaire jargon front office", q: "Que signifie être 'in the money' pour une option ?", a: "Une option ayant une valeur intrinsèque positive si elle était exercée immédiatement (un call avec un strike sous le prix spot, ou un put avec un strike au-dessus du spot).", options: ["Une option qui a déjà généré un profit réalisé pour son détenteur", "Une option ayant une valeur intrinsèque positive si elle était exercée immédiatement", "Une option dont la prime a été intégralement payée", "Une option qui arrive à échéance le jour même"], correct: 1 },
  { id: 782, deck: "entretien", sub: "Glossaire jargon front office", q: "Que signifie être 'underwater' sur une position ?", a: "Être en situation de perte latente non réalisée sur cette position, par rapport à son prix d'entrée initial.", options: ["Détenir une position dans une devise étrangère uniquement", "Être en situation de perte latente non réalisée par rapport au prix d'entrée", "Avoir une position totalement couverte contre tout risque", "Détenir une position sur des matières premières uniquement"], correct: 1 },
  { id: 783, deck: "entretien", sub: "Glossaire jargon front office", q: "Que désigne le terme 'PnL' en jargon de desk ?", a: "Profit and Loss, c'est-à-dire le résultat financier (gain ou perte) réalisé et/ou latent d'une position ou d'un portefeuille sur une période donnée.", options: ["Price and Liquidity, une mesure de la qualité d'exécution", "Profit and Loss, le résultat financier réalisé et/ou latent d'une position", "Position and Leverage, le niveau d'effet de levier appliqué", "Par and Level, l'écart entre le prix actuel et la valeur nominale"], correct: 1 },
  { id: 784, deck: "entretien", sub: "Glossaire jargon front office", q: "Que signifie 'mark to market' un portefeuille ?", a: "Réévaluer un portefeuille à sa valeur de marché actuelle plutôt qu'à son coût d'acquisition historique, reflétant ainsi fidèlement le profit ou la perte latente du portefeuille.", options: ["Fixer définitivement la valeur d'un portefeuille pour l'exercice comptable", "Réévaluer un portefeuille à sa valeur de marché actuelle plutôt qu'à son coût historique", "Convertir la valeur d'un portefeuille dans une devise de référence unique", "Comparer la performance du portefeuille à celle de son benchmark"], correct: 1 },
  { id: 785, deck: "entretien", sub: "Glossaire jargon front office", q: "Que signifie 'unwind' une position ou une stratégie ?", a: "Dénouer progressivement ou totalement une position existante, généralement en la vendant ou en la fermant via une transaction inverse à celle d'origine.", options: ["Augmenter progressivement la taille d'une position existante", "Dénouer progressivement ou totalement une position existante", "Transférer une position vers un fonds affilié", "Renégocier les termes contractuels d'une position dérivée"], correct: 1 },
  { id: 786, deck: "entretien", sub: "Glossaire jargon front office", q: "Que signifie 'le skew est raide sur ce nom', en langage de trading d'options ?", a: "Cela fait référence à l'asymétrie de la volatilité implicite selon le strike ; un skew prononcé signale généralement une forte demande relative pour la protection à la baisse (achats de puts).", options: ["Le prix de l'action a fortement chuté récemment", "L'asymétrie de la volatilité implicite selon le strike est prononcée, signalant une forte demande de protection", "L'action verse un dividende exceptionnellement élevé", "L'option arrive à échéance dans un délai très court"], correct: 1 },
  { id: 787, deck: "entretien", sub: "Glossaire jargon front office", q: "Que signifie 'trade the basis' en langage de trading ?", a: "Exploiter l'écart de prix (basis) entre deux instruments théoriquement liés (ex. prix spot vs future, ou deux instruments de crédit similaires), en pariant sur sa convergence ou sa divergence.", options: ["Trader uniquement les instruments de base du marché monétaire", "Exploiter l'écart de prix entre deux instruments théoriquement liés", "Négocier exclusivement en devise de base (ex. USD)", "Trader uniquement à l'ouverture du marché"], correct: 1 },
  { id: 788, deck: "entretien", sub: "Glossaire jargon front office", q: "Que signifie un 'haircut' appliqué à un collatéral, par exemple en repo ?", a: "Une décote appliquée à la valeur du collatéral apporté en garantie, permettant de se protéger contre une baisse de sa valeur pendant la durée de l'opération.", options: ["Une commission additionnelle facturée sur la transaction", "Une décote appliquée à la valeur du collatéral, en protection contre sa baisse de valeur", "Un délai de règlement supplémentaire accordé à la contrepartie", "Une prime versée en échange du collatéral apporté"], correct: 1 },
  { id: 789, deck: "entretien", sub: "Glossaire jargon front office", q: "Que signifie être 'long gamma' ou 'short gamma' pour un book d'options ?", a: "Être long gamma signifie bénéficier de la volatilité réalisée du sous-jacent (profiter des mouvements via le rééquilibrage delta) ; être short gamma signifie en pâtir, subissant une perte accrue lors de mouvements de marché importants.", options: ["Long gamma signifie détenir des options à long terme uniquement", "Long gamma bénéficie de la volatilité réalisée, short gamma en pâtit lors de grands mouvements", "Ces termes ne concernent que les positions sur devises", "Short gamma signifie détenir une position sans aucune option"], correct: 1 },
  { id: 790, deck: "entretien", sub: "Glossaire jargon front office", q: "Qu'est-ce qu'un 'block trade' ?", a: "Une transaction de très grande taille négociée en bloc, souvent en dehors du carnet d'ordres public, afin de limiter l'impact de marché lors de son exécution.", options: ["Une transaction annulée avant son règlement définitif", "Une transaction de très grande taille négociée en bloc pour limiter l'impact de marché", "Un ordre limite fixé à un prix rond (ex. 100,00€)", "Une transaction interdite par la réglementation en vigueur"], correct: 1 },
  { id: 791, deck: "entretien", sub: "Grandes crises financières", q: "Qu'est-ce qui a principalement causé le krach de 1987 ('Black Monday') ?", a: "Une combinaison de surévaluation des marchés et de programmes automatisés d'assurance de portefeuille (portfolio insurance) amplifiant les ventes, provoquant une chute de plus de 20% du Dow Jones en une seule journée.", options: ["Une faillite bancaire majeure annoncée ce jour-là", "Une surévaluation des marchés amplifiée par des programmes automatisés d'assurance de portefeuille", "Une hausse surprise et brutale des taux directeurs de la Fed", "Un défaut de paiement d'un pays émergent majeur"], correct: 1 },
  { id: 792, deck: "entretien", sub: "Grandes crises financières", q: "Quelle est la cause principale de la crise financière asiatique de 1997 ?", a: "L'effondrement de plusieurs devises asiatiques (notamment le baht thaïlandais) suite à des attaques spéculatives, aggravé par un endettement excessif en devises étrangères et des régimes de change quasi-fixes intenables.", options: ["Une bulle immobilière déclenchée par des taux d'intérêt négatifs", "L'effondrement de devises asiatiques suite à des attaques spéculatives et un endettement excessif en devises étrangères", "Un défaut de paiement du gouvernement japonais", "Une chute des cours du pétrole affectant les économies exportatrices asiatiques"], correct: 1 },
  { id: 793, deck: "entretien", sub: "Grandes crises financières", q: "Qu'illustre la crise du fonds LTCM en 1998 en matière de gestion du risque ?", a: "Qu'un fonds très fortement levé, même géré par des experts reconnus (dont des prix Nobel), peut s'effondrer rapidement lorsque des positions supposées décorrélées deviennent fortement corrélées en période de stress extrême — ici déclenché par le défaut de la Russie.", options: ["Que la diversification élimine toujours totalement le risque de perte", "Qu'un levier élevé peut s'effondrer rapidement quand des positions supposées décorrélées deviennent corrélées en stress", "Que seuls les fonds peu expérimentés sont exposés au risque systémique", "Que la Russie n'a jamais eu d'impact sur les marchés financiers occidentaux"], correct: 1 },
  { id: 794, deck: "entretien", sub: "Grandes crises financières", q: "Qu'est-ce qui a déclenché l'éclatement de la bulle internet (dot-com) en 2000 ?", a: "Une valorisation excessive et déconnectée des fondamentaux de nombreuses entreprises technologiques souvent non rentables, suivie d'un repricing brutal une fois la croissance des profits attendue non matérialisée.", options: ["Une hausse soudaine et massive des taux d'intérêt directeurs", "Une valorisation excessive d'entreprises technologiques non rentables, suivie d'un repricing brutal", "Une cyberattaque majeure ayant paralysé les marchés boursiers", "Un défaut de paiement massif du secteur bancaire américain"], correct: 1 },
  { id: 795, deck: "entretien", sub: "Grandes crises financières", q: "Quelle est la cause principale de la crise financière mondiale de 2008 ?", a: "L'effondrement du marché des subprimes américains, amplifié par la titrisation massive de créances risquées (CDO) et un système bancaire mondial fortement interconnecté et sous-capitalisé face à ces risques.", options: ["Une crise de change généralisée dans les pays émergents", "L'effondrement des subprimes, amplifié par la titrisation massive de créances risquées", "Un défaut de paiement souverain des États-Unis", "Une chute brutale et isolée du prix des matières premières"], correct: 1 },
  { id: 796, deck: "entretien", sub: "Grandes crises financières", q: "Quel événement emblématique a marqué l'acmé de la crise financière de 2008 ?", a: "La faillite de la banque d'investissement Lehman Brothers en septembre 2008, provoquant une crise de confiance systémique et un gel du crédit interbancaire mondial.", options: ["La faillite de Bear Stearns en début d'année 2008", "La faillite de Lehman Brothers en septembre 2008", "L'intervention massive de la Fed dès janvier 2008", "La chute du cours du pétrole en fin d'année 2008"], correct: 1 },
  { id: 797, deck: "entretien", sub: "Grandes crises financières", q: "Quelle est la cause principale de la crise de la dette souveraine européenne (2010-2012) ?", a: "L'endettement public excessif de plusieurs pays de la zone euro (notamment la Grèce), aggravé par l'absence de politique budgétaire unifiée et l'impossibilité de dévaluer une devise nationale au sein de l'union monétaire.", options: ["Une chute brutale et généralisée des marchés actions européens", "L'endettement public excessif de plusieurs pays de la zone euro, aggravé par l'absence de politique budgétaire unifiée", "Une attaque spéculative coordonnée contre le dollar américain", "Une faillite bancaire majeure aux États-Unis affectant l'Europe"], correct: 1 },
  { id: 798, deck: "entretien", sub: "Grandes crises financières", q: "Que s'est-il passé lors du 'Flash Crash' du 6 mai 2010 ?", a: "Une chute soudaine et brutale de près de 9% du Dow Jones en quelques minutes, suivie d'un rebond tout aussi rapide, largement attribuée à l'interaction du trading algorithmique à haute fréquence dans des conditions de liquidité dégradée.", options: ["Une panne informatique généralisée ayant fermé la bourse pour la journée", "Une chute brutale de près de 9% en quelques minutes, liée au trading algorithmique en conditions de liquidité dégradée", "Une annonce surprise de faillite d'une grande banque américaine", "Une cyberattaque ayant directement manipulé les cours de bourse"], correct: 1 },
  { id: 799, deck: "entretien", sub: "Grandes crises financières", q: "Qu'est-ce que le 'Taper Tantrum' de 2013 ?", a: "Une forte hausse des taux d'intérêt et une vive réaction négative des marchés émergents suite à l'annonce par la Fed d'un ralentissement futur (tapering) de son programme de quantitative easing.", options: ["Une baisse surprise des taux directeurs par la Fed", "Une forte hausse des taux et une réaction négative des émergents suite à l'annonce du tapering de la Fed", "Une crise bancaire majeure en Europe", "Un défaut de paiement du gouvernement américain"], correct: 1 },
  { id: 800, deck: "entretien", sub: "Grandes crises financières", q: "Quelle est la cause principale du krach pétrolier de 2014-2016 ?", a: "Une surproduction mondiale de pétrole (notamment liée à l'essor du pétrole de schiste américain), combinée à une décision de l'OPEP de ne pas réduire sa production, provoquant un effondrement des prix.", options: ["Une chute soudaine de la demande mondiale liée à une récession globale", "Une surproduction mondiale combinée à la décision de l'OPEP de ne pas réduire sa production", "Un embargo pétrolier généralisé décidé par les pays producteurs", "Une crise de change majeure dans les pays exportateurs de pétrole"], correct: 1 },
  { id: 801, deck: "entretien", sub: "Grandes crises financières", q: "Qu'est-ce que le 'Volmageddon' de février 2018 ?", a: "Un effondrement brutal de produits structurés short volatilité (notamment des ETN inverses sur le VIX) suite à un pic soudain de volatilité, entraînant leur liquidation totale et des pertes massives pour les investisseurs positionnés short vol.", options: ["Une hausse continue et progressive de la volatilité sur plusieurs mois", "Un effondrement de produits structurés short volatilité suite à un pic soudain de volatilité", "Une faillite bancaire majeure liée à des produits dérivés de crédit", "Un défaut de paiement d'un grand émetteur obligataire"], correct: 1 },
  { id: 802, deck: "entretien", sub: "Grandes crises financières", q: "Qu'est-ce qui a déclenché le krach boursier de mars 2020 lié au Covid-19 ?", a: "L'anticipation d'un choc économique mondial majeur lié aux confinements et à l'arrêt brutal de l'activité économique, provoquant l'une des chutes de marché les plus rapides de l'histoire (environ −35% en quelques semaines).", options: ["Une hausse surprise et massive des taux directeurs mondiaux", "L'anticipation d'un choc économique mondial majeur lié aux confinements et à l'arrêt de l'activité", "Un défaut de paiement généralisé des pays émergents", "Une cyberattaque ayant paralysé les infrastructures de marché mondiales"], correct: 1 },
  { id: 803, deck: "entretien", sub: "Grandes crises financières", q: "Comment les banques centrales ont-elles principalement réagi au choc de marché de mars 2020 ?", a: "Par des baisses de taux massives et des programmes de quantitative easing d'ampleur inédite, injectant des liquidités considérables pour stabiliser les marchés financiers et soutenir l'économie réelle.", options: ["En augmentant fortement les taux directeurs pour contenir l'inflation anticipée", "Par des baisses de taux massives et des programmes de quantitative easing d'ampleur inédite", "En restant totalement passives, laissant les marchés s'ajuster seuls", "En imposant un contrôle strict des capitaux dans la plupart des pays développés"], correct: 1 },
  { id: 804, deck: "entretien", sub: "Grandes crises financières", q: "Qu'est-ce que l'épisode GameStop de janvier 2021 illustre principalement ?", a: "La capacité d'investisseurs particuliers coordonnés via les réseaux sociaux à provoquer un short squeeze massif contre des hedge funds fortement vendeurs à découvert, causant des pertes colossales à certains d'entre eux.", options: ["Une intervention directe et coordonnée des banques centrales sur une action individuelle", "La capacité d'investisseurs particuliers coordonnés à provoquer un short squeeze massif contre des hedge funds", "Une fraude comptable majeure découverte au sein de l'entreprise GameStop", "Une faillite bancaire déclenchée par l'exposition à une seule action"], correct: 1 },
  { id: 805, deck: "entretien", sub: "Grandes crises financières", q: "Quelle est la cause principale de l'effondrement du fonds Archegos en mars 2021 ?", a: "Un usage massif de levier via des total return swaps auprès de plusieurs banques (sans divulgation croisée entre elles), sur des positions très concentrées, provoquant des appels de marge impossibles à honorer lors d'une baisse des titres concernés.", options: ["Une fraude comptable détectée par un régulateur externe", "Un usage massif de levier via des swaps non divulgués entre banques, sur des positions très concentrées", "Un défaut de paiement d'une contrepartie souveraine", "Une cyberattaque ayant directement visé les systèmes du fonds"], correct: 1 },
  { id: 806, deck: "entretien", sub: "Grandes crises financières", q: "Qu'est-ce qui a causé la crise obligataire britannique (Gilt) de septembre 2022 ?", a: "L'annonce d'un plan budgétaire massivement non financé par le gouvernement britannique, provoquant une chute brutale de la livre et une flambée des taux longs, menaçant la solvabilité de fonds de pension utilisant du levier via des stratégies LDI (Liability-Driven Investment).", options: ["Une hausse coordonnée des taux directeurs par toutes les grandes banques centrales", "L'annonce d'un plan budgétaire massivement non financé, provoquant une flambée des taux menaçant des fonds LDI leveragés", "Un défaut de paiement du gouvernement britannique sur sa dette existante", "Une chute du secteur bancaire britannique liée à des pertes sur crédits immobiliers"], correct: 1 },
  { id: 807, deck: "entretien", sub: "Grandes crises financières", q: "Quelle est la cause principale de la faillite de la Silicon Valley Bank (SVB) en mars 2023 ?", a: "Une exposition massive à des obligations longues non couvertes contre le risque de taux, dont la valeur s'est fortement dépréciée avec la hausse des taux, combinée à une fuite de dépôts rapide et concentrée (bank run) chez une clientèle très corrélée (startups technologiques).", options: ["Une fraude comptable majeure découverte par les régulateurs", "Une forte exposition à des obligations longues non couvertes, combinée à une fuite de dépôts rapide chez une clientèle corrélée", "Un défaut de paiement sur des prêts hypothécaires subprimes", "Une cyberattaque ayant directement vidé les comptes de la banque"], correct: 1 },
  { id: 808, deck: "entretien", sub: "Grandes crises financières", q: "Que retenir de la faillite de FTX en 2022 en matière de gestion du risque et de gouvernance ?", a: "L'absence de séparation claire entre les fonds clients et ceux de l'entité de trading propriétaire liée illustre l'importance cruciale des contrôles internes, de la gouvernance et de la ségrégation stricte des actifs.", options: ["Que les cryptomonnaies sont intrinsèquement plus sûres que les actifs traditionnels", "L'absence de ségrégation entre fonds clients et trading propriétaire illustre l'importance cruciale de la gouvernance", "Que seule la réglementation bancaire traditionnelle peut prévenir ce type d'événement", "Que ce type de défaillance ne peut se produire que dans le secteur crypto"], correct: 1 },

/* ------------------------------------------------------------------ */
/* STOCKAGE (localStorage)                                             */
/* ------------------------------------------------------------------ */
function loadBestScores() {
  try { return JSON.parse(localStorage.getItem("ff-best-scores") || "{}"); }
  catch { return {}; }
}
function saveBestScores(scores) {
  try { localStorage.setItem("ff-best-scores", JSON.stringify(scores)); }
  catch (e) { console.error(e); }
}

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

/* ------------------------------------------------------------------ */
/* STATE                                                                */
/* ------------------------------------------------------------------ */
let bestScores = loadBestScores();
let state = { view: "home", deckKey: "marche", sub: "Toutes" };
const app = document.getElementById("app");

function setState(patch) { state = { ...state, ...patch }; render(); }

/* ------------------------------------------------------------------ */
/* RENDER: HOME                                                        */
/* ------------------------------------------------------------------ */
function renderHome() {
  const deckKey = state.deckKey, sub = state.sub;
  const deck = DECKS[deckKey];
  const subs = ["Toutes", ...deck.subs];

  const tickerItems = Object.entries(DECKS).flatMap(([key, d]) => {
    const cardCount = CARDS.filter(c => c.deck === key).length;
    const best = bestScores[key];
    const label = best ? `${best.score}/${best.total}` : "—";
    const up = best && best.score / best.total >= 0.7;
    return [{ short: d.short, cards: cardCount, best: label, up }];
  });
  const loop = [...tickerItems, ...tickerItems, ...tickerItems];

  app.innerHTML = `
    <div class="home">
      <div class="hero-eyebrow">DOSSIER D'ÉTUDE — SESSION ${new Date().getFullYear()}</div>
      <h1 class="hero-title">Le grimoire du <span class="hero-accent">trading desk</span></h1>
      <p class="hero-sub">${CARDS.length} fiches. Deux dossiers : marché et quantitatif. Révisez en mode fiches, testez-vous en mode quiz.</p>

      <div class="ticker-wrap"><div class="ticker-track">
        ${loop.map(it => `
          <span class="ticker-item">
            <span class="ticker-sym">${it.short}</span>
            <span>${it.cards} fiches</span>
            ${it.up ? ICONS.up : ICONS.down}
            <span class="${it.up ? "ticker-up" : "ticker-down"}">${it.best}</span>
          </span>`).join("")}
      </div></div>

      <div class="deck-select">
        ${Object.entries(DECKS).map(([key, d]) => `
          <button class="deck-tab ${deckKey === key ? "active" : ""}" style="--accent:${d.accent}" data-deck="${key}">
            ${ICONS[d.icon]} ${d.label}
          </button>`).join("")}
      </div>

      <div class="sub-chips">
        ${subs.map(s => `
          <button class="chip ${sub === s ? "chip-active" : ""}" style="--accent:${deck.accent}" data-sub="${s}">${s}</button>
        `).join("")}
      </div>

      <div class="mode-cards">
        <div class="mode-card" style="--accent:${deck.accent}">
          <div class="mode-card-label">MODE 01</div>
          <h3>Fiches</h3>
          <p>Retournez chaque carte, à votre rythme.</p>
          <button class="mode-btn" data-start="flash">Réviser ${ICONS.chevronRight}</button>
        </div>
        <div class="mode-card" style="--accent:${deck.accent}">
          <div class="mode-card-label">MODE 02</div>
          <h3>Quiz</h3>
          <p>QCM chronométré par votre propre mémoire.</p>
          <button class="mode-btn" data-start="quiz">Démarrer ${ICONS.chevronRight}</button>
        </div>
      </div>
    </div>
    <footer class="site-footer">flashcards-finance · fait avec Claude</footer>
  `;

  app.querySelectorAll("[data-deck]").forEach(btn =>
    btn.addEventListener("click", () => setState({ deckKey: btn.dataset.deck, sub: "Toutes" })));
  app.querySelectorAll("[data-sub]").forEach(btn =>
    btn.addEventListener("click", () => setState({ sub: btn.dataset.sub })));
  app.querySelectorAll("[data-start]").forEach(btn =>
    btn.addEventListener("click", () => startSession(deckKey, sub, btn.dataset.start)));
}

function startSession(deckKey, sub, mode) {
  const filtered = CARDS.filter(c => c.deck === deckKey && (sub === "Toutes" || c.sub === sub));
  const accent = DECKS[deckKey].accent;
  if (mode === "flash") {
    setState({ view: "flash", deckKey, cards: filtered, accent, order: filtered.map((_, i) => i), pos: 0, flipped: false });
  } else {
    setState({ view: "quiz", deckKey, cards: filtered, accent, order: shuffle(filtered.map((_, i) => i)), pos: 0, selected: null, score: 0, missed: [] });
  }
}

/* ------------------------------------------------------------------ */
/* RENDER: FLASHCARDS                                                   */
/* ------------------------------------------------------------------ */
function renderFlash() {
  const { cards, order, pos, flipped, accent } = state;
  const card = cards[order[pos]];

  app.innerHTML = `
    <div class="mode-screen" style="--accent:${accent}">
      <div class="mode-header">
        <button class="exit-btn" id="exit">${ICONS.chevronLeft} Retour</button>
        <div class="progress-label">${pos + 1} / ${order.length}</div>
        <button class="exit-btn" id="shuffleBtn">${ICONS.shuffle} Mélanger</button>
      </div>
      <div class="card-stage">
        <div class="flash-card ${flipped ? "is-flipped" : ""}" id="flashCard">
          <div class="flash-face flash-front">
            <div class="flash-tag">${card.sub}</div>
            <div class="flash-q">${card.q}</div>
            <div class="flash-hint">Touchez pour retourner</div>
          </div>
          <div class="flash-face flash-back">
            <div class="flash-tag flash-tag-back">Réponse</div>
            <div class="flash-a">${card.a}</div>
          </div>
        </div>
      </div>
      <div class="nav-row">
        <button class="nav-btn" id="prevBtn">${ICONS.chevronLeft}</button>
        <button class="nav-btn nav-btn-flip" id="flipBtn">${ICONS.rotate} Retourner</button>
        <button class="nav-btn" id="nextBtn">${ICONS.chevronRight}</button>
      </div>
    </div>
  `;

  document.getElementById("exit").addEventListener("click", () => setState({ view: "home" }));
  document.getElementById("flashCard").addEventListener("click", () => setState({ flipped: !flipped }));
  document.getElementById("flipBtn").addEventListener("click", () => setState({ flipped: !flipped }));
  document.getElementById("shuffleBtn").addEventListener("click", () =>
    setState({ order: shuffle(cards.map((_, i) => i)), pos: 0, flipped: false }));
  document.getElementById("prevBtn").addEventListener("click", () =>
    setState({ pos: (pos - 1 + order.length) % order.length, flipped: false }));
  document.getElementById("nextBtn").addEventListener("click", () =>
    setState({ pos: (pos + 1) % order.length, flipped: false }));
}

/* ------------------------------------------------------------------ */
/* RENDER: QUIZ                                                        */
/* ------------------------------------------------------------------ */
function renderQuiz() {
  const { cards, order, pos, selected, score, missed, accent, deckKey } = state;
  const card = cards[order[pos]];

  app.innerHTML = `
    <div class="mode-screen" style="--accent:${accent}">
      <div class="mode-header">
        <button class="exit-btn" id="exit">${ICONS.chevronLeft} Quitter</button>
        <div class="progress-label">Question ${pos + 1} / ${order.length} — Score ${score}</div>
        <div style="width:70px"></div>
      </div>
      <div class="progress-bar"><div class="progress-fill" style="width:${(pos / order.length) * 100}%"></div></div>
      <div class="quiz-card">
        <div class="flash-tag">${card.sub}</div>
        <div class="quiz-q">${card.q}</div>
        <div class="quiz-options">
          ${card.options.map((opt, i) => {
            let cls = "quiz-option";
            let icon = "";
            if (selected !== null) {
              if (i === card.correct) { cls += " opt-correct"; icon = `<span class="opt-icon">${ICONS.check}</span>`; }
              else if (i === selected) { cls += " opt-wrong"; icon = `<span class="opt-icon">${ICONS.x}</span>`; }
            }
            return `<button class="${cls}" data-opt="${i}" ${selected !== null ? "disabled" : ""}>
              <span class="opt-letter">${String.fromCharCode(65 + i)}</span><span>${opt}</span>${icon}
            </button>`;
          }).join("")}
        </div>
        ${selected !== null ? `<div class="quiz-explain"><div class="quiz-explain-label">Explication</div>${card.a}</div>` : ""}
      </div>
      ${selected !== null ? `<div class="nav-row">
        <button class="mode-btn quiz-next" id="nextQ">${pos + 1 >= order.length ? "Voir le résultat" : "Question suivante"} ${ICONS.chevronRight}</button>
      </div>` : ""}
    </div>
  `;

  document.getElementById("exit").addEventListener("click", () => setState({ view: "home" }));
  if (selected === null) {
    app.querySelectorAll("[data-opt]").forEach(btn =>
      btn.addEventListener("click", () => {
        const idx = Number(btn.dataset.opt);
        const correct = idx === card.correct;
        setState({ selected: idx, score: score + (correct ? 1 : 0), missed: correct ? missed : [...missed, card] });
      }));
  } else {
    document.getElementById("nextQ").addEventListener("click", () => {
      if (pos + 1 >= order.length) {
        finishQuiz(deckKey, score, order.length, missed);
      } else {
        setState({ pos: pos + 1, selected: null });
      }
    });
  }
}

function finishQuiz(deckKey, score, total, missed) {
  const cur = bestScores[deckKey];
  if (!cur || score / total > cur.score / cur.total) {
    bestScores = { ...bestScores, [deckKey]: { score, total } };
    saveBestScores(bestScores);
  }
  setState({ view: "result", score, total, missed });
}

function renderResult() {
  const { score, total, missed, accent } = state;
  const pct = Math.round((score / total) * 100);
  app.innerHTML = `
    <div class="mode-screen" style="--accent:${accent}">
      <div class="result-panel">
        <div class="result-eyebrow">CLÔTURE DE SÉANCE</div>
        <div class="result-score">${score}<span class="result-total">/${total}</span></div>
        <div class="result-pct">${pct}% de réussite</div>
        ${missed.length > 0 ? `
          <div class="missed-list">
            <div class="missed-title">À revoir</div>
            ${missed.slice(0, 5).map(m => `<div class="missed-item">${m.q}</div>`).join("")}
            ${missed.length > 5 ? `<div class="missed-more">+${missed.length - 5} autres</div>` : ""}
          </div>` : ""}
        <button class="mode-btn result-btn" id="backHome">Retour à l'accueil</button>
      </div>
    </div>
  `;
  document.getElementById("backHome").addEventListener("click", () => setState({ view: "home" }));
}

/* ------------------------------------------------------------------ */
/* MAIN RENDER DISPATCH                                                 */
/* ------------------------------------------------------------------ */
function renderMath() {
  if (window.renderMathInElement) {
    renderMathInElement(app, {
      delimiters: [
        { left: "$$", right: "$$", display: true },
        { left: "$", right: "$", display: false },
      ],
      throwOnError: false,
    });
  }
}

function render() {
  if (state.view === "home") renderHome();
  else if (state.view === "flash") renderFlash();
  else if (state.view === "quiz") renderQuiz();
  else if (state.view === "result") renderResult();
  renderMath();
}

render();
</script>
