  { id: 150, deck: "marche", sub: "Change", q: "Qu'est-ce qu'une crise de change ?", a: "Une attaque spéculative massive contre une devise, souvent liée à un régime de change jugé intenable par les marchés, forçant parfois une dévaluation ou un abandon de la parité.", options: ["Une simple fluctuation normale du marché des changes", "Une attaque spéculative massive forçant souvent l'abandon d'un régime de change", "Une hausse coordonnée de toutes les devises mondiales", "Un accord multilatéral de stabilisation monétaire"], correct: 1 },
  { id: 151, deck: "marche", sub: "Gestion des risques", q: "Qu'est-ce que le risque de base en couverture ?", a: "Le risque résiduel qui subsiste lorsque l'instrument utilisé pour couvrir une exposition n'est pas parfaitement corrélé à celle-ci.", options: ["Le risque total avant toute couverture", "Le risque résiduel dû à une corrélation imparfaite entre exposition et couverture", "Le risque de contrepartie sur l'instrument de couverture", "Le risque lié uniquement aux devises"], correct: 1 },
  { id: 152, deck: "marche", sub: "Gestion des risques", q: "Qu'est-ce que le ratio de couverture (hedge ratio) ?", a: "La quantité d'instrument de couverture nécessaire pour neutraliser au mieux une exposition donnée au risque.", options: ["Le rapport entre gains et pertes réalisés", "La quantité d'instrument de couverture nécessaire pour neutraliser une exposition", "Le taux de change utilisé pour convertir une exposition", "Le montant du dépôt de garantie exigé"], correct: 1 },
  { id: 153, deck: "marche", sub: "Gestion des risques", q: "Qu'est-ce que le risque de modèle ?", a: "Le risque de pertes financières résultant d'erreurs, d'hypothèses inadaptées ou de limites dans les modèles de pricing ou de gestion du risque utilisés.", options: ["Le risque lié uniquement à la volatilité du marché", "Le risque de pertes lié à des erreurs ou limites des modèles utilisés", "Le risque de défaut d'une contrepartie", "Le risque lié aux changements réglementaires"], correct: 1 },
  { id: 154, deck: "marche", sub: "Gestion des risques", q: "À quoi sert le backtesting d'un modèle de VaR ?", a: "À comparer a posteriori les pertes réellement observées aux VaR prédites par le modèle, afin de valider ou remettre en cause sa fiabilité.", options: ["À calculer la VaR future du portefeuille", "À comparer les pertes réelles aux VaR prédites pour valider le modèle", "À fixer les limites de trading quotidiennes", "À estimer la corrélation entre actifs"], correct: 1 },
  { id: 155, deck: "marche", sub: "Gestion des risques", q: "Qu'est-ce que le risque systémique ?", a: "Le risque qu'une défaillance isolée (institution, marché) se propage et menace la stabilité de l'ensemble du système financier.", options: ["Le risque propre à un seul actif ou secteur", "Le risque qu'une défaillance isolée se propage à tout le système financier", "Le risque de change sur un portefeuille international", "Le risque lié à un seul type de produit dérivé"], correct: 1 },
  { id: 156, deck: "marche", sub: "Gestion des risques", q: "Qu'est-ce que le 'wrong-way risk' ?", a: "Une situation où l'exposition à une contrepartie augmente précisément au moment où la qualité de crédit de cette contrepartie se dégrade.", options: ["Un risque de change mal couvert", "Une situation où l'exposition augmente quand le risque de la contrepartie augmente aussi", "Un risque de liquidité classique", "Une erreur systématique dans le calcul de la VaR"], correct: 1 },
  { id: 157, deck: "marche", sub: "Gestion des risques", q: "Qu'est-ce que la VaR marginale d'une position ?", a: "La contribution d'une position individuelle à la VaR totale du portefeuille, utile pour identifier les principales sources de risque.", options: ["La VaR calculée sur un seul jour", "La contribution d'une position individuelle à la VaR totale du portefeuille", "La VaR après diversification complète", "La VaR minimale théorique atteignable"], correct: 1 },
  { id: 158, deck: "marche", sub: "Gestion des risques", q: "Qu'est-ce que le LCR (Liquidity Coverage Ratio) ?", a: "Le ratio actifs liquides de haute qualité / sorties nettes de trésorerie sur 30 jours, exigé par la réglementation Bâle III pour assurer la résilience de liquidité d'une banque.", options: ["Le ratio de solvabilité réglementaire CET1", "Le ratio actifs liquides / sorties nettes de trésorerie sur 30 jours", "Le ratio de levier réglementaire", "Le ratio dette / capitaux propres"], correct: 1 },
  { id: 159, deck: "marche", sub: "Gestion des risques", q: "Qu'est-ce que la titrisation ?", a: "La transformation d'un portefeuille de créances (prêts, crédits) en titres financiers négociables, vendus ensuite à des investisseurs.", options: ["L'émission d'actions nouvelles", "La transformation de créances en titres négociables vendus à des investisseurs", "Le rachat d'une dette par l'émetteur", "La couverture d'un portefeuille via des dérivés"], correct: 1 },
  { id: 160, deck: "marche", sub: "Marchés monétaires", q: "Qu'était historiquement le taux LIBOR ?", a: "Un taux interbancaire de référence à Londres, basé sur des déclarations bancaires (non des transactions réelles), aujourd'hui largement remplacé par des taux fondés sur des transactions effectives (SOFR, €STR).", options: ["Le taux directeur de la Banque d'Angleterre", "Un taux interbancaire de référence basé sur des déclarations bancaires", "Un indice boursier britannique", "Le taux appliqué aux obligations souveraines"], correct: 1 },
  { id: 161, deck: "marche", sub: "Marchés monétaires", q: "Qu'est-ce qu'un billet de trésorerie (commercial paper) ?", a: "Un titre de créance court terme émis directement par une entreprise pour financer ses besoins de trésorerie, sans passer par un prêt bancaire classique.", options: ["Une obligation d'État à long terme", "Un titre de créance court terme émis par une entreprise", "Un dépôt bancaire garanti", "Une action cotée en continu"], correct: 1 },
  { id: 162, deck: "marche", sub: "Marchés monétaires", q: "Qu'est-ce qu'un certificat de dépôt (CD) ?", a: "Un titre de créance négociable, court terme, émis par une banque en contrepartie d'un dépôt.", options: ["Une action bancaire cotée", "Un titre de créance négociable court terme émis par une banque", "Une obligation subordonnée bancaire", "Un produit d'épargne réglementé"], correct: 1 },
  { id: 163, deck: "marche", sub: "Marchés monétaires", q: "Qu'est-ce que le 'tapering' ?", a: "La réduction progressive du rythme des achats d'actifs par une banque centrale dans le cadre d'un programme de quantitative easing.", options: ["Une hausse brutale des taux directeurs", "La réduction progressive du rythme des achats d'actifs (QE)", "Une intervention sur le marché des changes", "Une augmentation des réserves obligatoires"], correct: 1 },
  { id: 164, deck: "marche", sub: "Marchés monétaires", q: "Qu'est-ce que le taux de facilité de dépôt d'une banque centrale ?", a: "Le taux rémunérant (ou pénalisant) les liquidités que les banques commerciales placent au jour le jour auprès de la banque centrale.", options: ["Le taux appliqué aux prêts interbancaires classiques", "Le taux rémunérant les liquidités placées au jour le jour à la banque centrale", "Le taux directeur principal", "Le taux appliqué aux obligations d'État courtes"], correct: 1 },
  { id: 165, deck: "marche", sub: "Marchés monétaires", q: "Qu'est-ce qu'une opération de refinancement à long terme (LTRO) ?", a: "Un prêt accordé par la banque centrale aux banques commerciales sur une durée plus longue que les opérations de refinancement classiques, pour soutenir le crédit.", options: ["Un prêt interbancaire de très court terme", "Un prêt de la banque centrale aux banques sur une durée plus longue", "Un achat définitif d'obligations d'État", "Une intervention sur le marché des changes"], correct: 1 },
  { id: 166, deck: "marche", sub: "Marchés monétaires", q: "Qu'est-ce que le resserrement quantitatif (Quantitative Tightening, QT) ?", a: "Une réduction progressive du bilan de la banque centrale, à l'inverse du quantitative easing, généralement en laissant arriver à échéance les titres détenus sans les renouveler.", options: ["Une hausse des taux directeurs uniquement", "Une réduction du bilan de la banque centrale, inverse du QE", "Une baisse des réserves obligatoires", "Une intervention massive sur le marché des changes"], correct: 1 },
  { id: 167, deck: "marche", sub: "Marchés monétaires", q: "Qu'est-ce que la courbe des taux OIS (Overnight Index Swap) ?", a: "Une courbe reflétant les anticipations de taux directeur futur, souvent utilisée comme référence pour actualiser des flux à un taux considéré comme quasi sans risque.", options: ["La courbe des rendements obligataires souverains", "Une courbe reflétant les anticipations de taux directeur, référence pour l'actualisation", "La courbe de volatilité implicite du marché des taux", "La courbe des spreads de crédit corporate"], correct: 1 },
  { id: 168, deck: "marche", sub: "Produits structurés", q: "Qu'est-ce qu'un reverse convertible ?", a: "Un produit structuré offrant un coupon élevé, mais exposant l'investisseur au risque de recevoir des actions du sous-jacent (ou une perte en capital) si celui-ci chute sous une barrière.", options: ["Un produit à capital garanti sans risque", "Un produit offrant un coupon élevé mais avec risque de perte si le sous-jacent chute", "Une obligation classique à taux fixe", "Un ETF à effet de levier"], correct: 1 },
  { id: 169, deck: "marche", sub: "Produits structurés", q: "Qu'est-ce qu'un certificat tracker ?", a: "Un produit répliquant simplement la performance d'un sous-jacent (indice, panier), sans effet de levier ni protection particulière.", options: ["Un produit à effet de levier élevé", "Un produit répliquant simplement la performance d'un sous-jacent, sans levier", "Un produit garantissant un rendement fixe", "Une option sur indice à barrière"], correct: 1 },
  { id: 170, deck: "marche", sub: "Produits structurés", q: "Qu'est-ce qu'un turbo (certificat à effet de levier) ?", a: "Un produit dérivé amplifiant les mouvements du sous-jacent grâce à un effet de levier, généralement assorti d'une barrière désactivante (knock-out).", options: ["Un produit sans aucun risque de perte en capital", "Un produit amplifiant les mouvements du sous-jacent, avec barrière knock-out", "Un fonds indiciel classique à faible coût", "Une obligation convertible en actions"], correct: 1 },
  { id: 171, deck: "marche", sub: "Produits structurés", q: "Qu'est-ce qu'une note de participation (participation note) ?", a: "Un produit structuré offrant une participation, parfois plafonnée, à la performance haussière d'un sous-jacent, généralement sans garantie de capital.", options: ["Un produit garantissant systématiquement le capital investi", "Un produit offrant une participation à la hausse d'un sous-jacent, sans garantie de capital", "Une obligation à taux fixe classique", "Un dérivé de crédit sur une entité de référence"], correct: 1 },
  { id: 172, deck: "marche", sub: "Produits structurés", q: "Qu'est-ce qu'un produit phoenix autocall ?", a: "Une variante d'autocall qui verse des coupons conditionnels périodiques (même sans remboursement anticipé), sous réserve que le sous-jacent reste au-dessus d'une barrière.", options: ["Un produit sans versement de coupon avant l'échéance", "Une variante d'autocall versant des coupons conditionnels périodiques", "Un produit garantissant toujours le remboursement anticipé", "Une option barrière simple sans coupon"], correct: 1 },
  { id: 173, deck: "marche", sub: "Produits structurés", q: "Qu'est-ce qu'un ETN (Exchange Traded Note) ?", a: "Un titre de dette coté en bourse répliquant la performance d'un indice, mais portant un risque de crédit sur son émetteur, contrairement à un ETF classique.", options: ["Un fonds indiciel physiquement répliqué sans risque de crédit", "Un titre de dette coté portant un risque de crédit sur l'émetteur", "Une action ordinaire cotée en continu", "Un produit garanti par un collatéral physique complet"], correct: 1 },
  { id: 174, deck: "marche", sub: "Produits structurés", q: "Qu'est-ce qu'un certificat discount ?", a: "Un produit structuré offrant l'exposition au sous-jacent à un prix réduit par rapport au marché, en contrepartie d'un potentiel de gain plafonné (cap).", options: ["Un produit offrant un gain potentiel illimité", "Un produit offrant une exposition à prix réduit, avec gain plafonné", "Une obligation à taux variable", "Un produit garantissant un dividende fixe"], correct: 1 },
  { id: 175, deck: "marche", sub: "Produits structurés", q: "Qu'est-ce qu'une obligation convertible ?", a: "Une obligation pouvant être convertie en actions de l'émetteur à des conditions prédéfinies, combinant les caractéristiques d'une dette et d'une option d'achat sur action.", options: ["Une obligation strictement remboursable en cash uniquement", "Une obligation convertible en actions de l'émetteur à conditions prédéfinies", "Une obligation zéro-coupon classique", "Un produit dérivé sans lien avec le capital de l'émetteur"], correct: 1 },
  { id: 176, deck: "marche", sub: "Trading & microstructure", q: "Qu'est-ce que le carnet d'ordres (order book) ?", a: "La liste en temps réel des ordres d'achat et de vente en attente sur un titre, classés par niveau de prix.", options: ["L'historique des transactions déjà exécutées", "La liste des ordres d'achat et de vente en attente, classés par prix", "Le registre des actionnaires d'une société", "Le calendrier des publications de résultats"], correct: 1 },
  { id: 177, deck: "marche", sub: "Trading & microstructure", q: "Qu'est-ce que le bid-ask spread ?", a: "L'écart entre le meilleur prix d'achat affiché (bid) et le meilleur prix de vente affiché (ask) sur le marché pour un titre donné.", options: ["L'écart entre le prix d'ouverture et de clôture", "L'écart entre le meilleur prix d'achat et le meilleur prix de vente", "La commission prélevée par le broker", "L'écart entre le prix spot et le prix forward"], correct: 1 },
  { id: 178, deck: "marche", sub: "Trading & microstructure", q: "Qu'est-ce qu'un 'iceberg order' ?", a: "Un ordre de grande taille dont seule une petite partie est visible dans le carnet d'ordres, le reste restant caché et révélé progressivement.", options: ["Un ordre annulé automatiquement après un délai", "Un ordre de grande taille dont seule une petite partie est visible", "Un ordre exécuté uniquement à la clôture", "Un ordre réservé aux investisseurs institutionnels étrangers"], correct: 1 },
  { id: 179, deck: "marche", sub: "Trading & microstructure", q: "Qu'est-ce que le 'slippage' en trading ?", a: "La différence entre le prix auquel un ordre était attendu être exécuté et le prix réellement obtenu lors de l'exécution.", options: ["La commission facturée par le courtier", "La différence entre le prix attendu et le prix réellement obtenu", "L'écart entre bid et ask", "Le délai entre l'envoi et la réception d'un ordre"], correct: 1 },
  { id: 180, deck: "marche", sub: "Trading & microstructure", q: "Qu'est-ce que le 'market impact' d'un ordre ?", a: "L'effet qu'a l'exécution d'un ordre de grande taille sur le déplacement défavorable du prix de marché du titre concerné.", options: ["L'effet des annonces macroéconomiques sur le marché", "L'effet d'un ordre de grande taille sur le déplacement du prix", "La volatilité implicite moyenne d'un titre", "Le rendement attendu d'une stratégie"], correct: 1 },
  { id: 181, deck: "marche", sub: "Trading & microstructure", q: "Qu'est-ce qu'un algorithme d'exécution VWAP ?", a: "Une stratégie visant à exécuter un ordre au prix moyen pondéré par les volumes échangés sur une période donnée, pour minimiser l'impact de marché.", options: ["Un algorithme exécutant tout l'ordre instantanément", "Une stratégie visant le prix moyen pondéré par les volumes sur une période", "Un algorithme de détection de fraude", "Une stratégie de couverture d'options uniquement"], correct: 1 },
  { id: 182, deck: "marche", sub: "Trading & microstructure", q: "Qu'est-ce qu'un 'wash trade' ?", a: "Une transaction fictive où l'acheteur et le vendeur sont en réalité liés, créant une fausse impression d'activité sur un titre — pratique interdite.", options: ["Une transaction légitime entre deux investisseurs indépendants", "Une transaction fictive créant une fausse impression d'activité", "Un ordre annulé avant exécution", "Un arbitrage triangulaire sur devises"], correct: 1 },
  { id: 183, deck: "marche", sub: "Trading & microstructure", q: "Qu'est-ce que le 'front running' ?", a: "Une pratique illégale consistant à exécuter un ordre pour son propre compte en profitant d'une connaissance préalable d'un ordre client important à venir.", options: ["Une stratégie légale d'anticipation des tendances de marché", "Une pratique illégale exploitant la connaissance préalable d'un ordre client", "Un type d'ordre stop-loss automatique", "Une méthode de calcul du VWAP"], correct: 1 },
  { id: 184, deck: "marche", sub: "Trading & microstructure", q: "À quoi sert un 'circuit breaker' en bourse ?", a: "À suspendre automatiquement la cotation d'un titre ou d'un marché entier en cas de mouvement de prix jugé extrême, pour limiter la panique.", options: ["À garantir un cours plancher permanent", "À suspendre automatiquement la cotation en cas de mouvement de prix extrême", "À fixer le prix d'ouverture quotidien", "À calculer l'indice de référence du marché"], correct: 1 },
  { id: 185, deck: "marche", sub: "Trading & microstructure", q: "Qu'est-ce que la profondeur de marché (market depth) ?", a: "Le volume total d'ordres disponibles à l'achat et à la vente à différents niveaux de prix dans le carnet d'ordres.", options: ["Le nombre total de titres cotés sur une place", "Le volume total d'ordres disponibles à différents niveaux de prix", "La durée moyenne de détention d'un titre", "Le nombre de market makers actifs sur un titre"], correct: 1 },
  { id: 186, deck: "marche", sub: "Trading & microstructure", q: "Qu'est-ce qu'un 'flash crash' ?", a: "Une chute brutale et très rapide des prix, souvent suivie d'un rebond tout aussi rapide, fréquemment associée au trading algorithmique à haute fréquence.", options: ["Une baisse progressive du marché sur plusieurs semaines", "Une chute brutale et rapide des prix suivie d'un rebond rapide", "Une suspension définitive de la cotation d'un titre", "Un défaut de paiement d'une chambre de compensation"], correct: 1 },
  { id: 187, deck: "marche", sub: "Trading & microstructure", q: "Quel est le rôle d'un teneur de marché désigné (specialist / DMM) ?", a: "Assurer la liquidité continue d'un titre sur certaines places boursières, en ayant l'obligation d'afficher des prix d'achat et de vente en permanence.", options: ["Réguler l'ensemble du marché financier", "Assurer la liquidité continue d'un titre avec obligation de coter", "Auditer les comptes de l'entreprise cotée", "Fixer le taux directeur applicable au titre"], correct: 1 },
  { id: 188, deck: "marche", sub: "Trading & microstructure", q: "Qu'est-ce que le 'payment for order flow' ?", a: "Une pratique où un broker reçoit une rémunération d'un market maker en échange du routage des ordres de ses clients vers celui-ci.", options: ["Une commission payée par le client au broker", "Une rémunération versée au broker par un market maker pour router les ordres clients", "Un dividende versé aux actionnaires d'un broker", "Une taxe sur les transactions financières"], correct: 1 },
  { id: 189, deck: "marche", sub: "Trading & microstructure", q: "Qu'est-ce qu'un ordre 'stop-loss' ?", a: "Un ordre qui déclenche automatiquement une vente (ou un achat) une fois qu'un seuil de prix défavorable prédéfini est atteint, pour limiter les pertes.", options: ["Un ordre garantissant toujours l'exécution au meilleur prix", "Un ordre déclenchant automatiquement une transaction à un seuil de prix défavorable", "Un ordre réservé aux marchés obligataires", "Un ordre annulant automatiquement une position gagnante"], correct: 1 },
  { id: 190, deck: "marche", sub: "Trading & microstructure", q: "Qu'est-ce que le 'latency arbitrage' ?", a: "Une stratégie exploitant des écarts de prix temporaires entre différentes plateformes de négociation, grâce à une vitesse de transmission d'information supérieure.", options: ["Un arbitrage entre deux devises différentes", "Une stratégie exploitant des écarts de prix grâce à une vitesse de transmission supérieure", "Un arbitrage entre taux fixe et taux variable", "Une stratégie de couverture delta-neutre"], correct: 1 },
  { id: 191, deck: "marche", sub: "Économie financière & valorisation", q: "Qu'est-ce que l'EBITDA ?", a: "Le bénéfice avant intérêts, impôts, dépréciation et amortissement — un indicateur de la rentabilité opérationnelle brute d'une entreprise.", options: ["Le bénéfice net après impôts", "Le bénéfice avant intérêts, impôts, dépréciation et amortissement", "Le chiffre d'affaires net de charges variables", "La trésorerie disponible après investissements"], correct: 1 },
  { id: 192, deck: "marche", sub: "Économie financière & valorisation", q: "Qu'est-ce que la valeur d'entreprise (Enterprise Value) ?", a: "La capitalisation boursière plus la dette nette, représentant la valeur totale de l'activité indépendamment de sa structure de financement.", options: ["La capitalisation boursière seule", "La capitalisation boursière plus la dette nette", "Le chiffre d'affaires multiplié par un multiple sectoriel", "La valeur comptable des actifs nets"], correct: 1 },
  { id: 193, deck: "marche", sub: "Économie financière & valorisation", q: "Qu'est-ce que le WACC (coût moyen pondéré du capital) ?", a: "Le coût moyen du financement d'une entreprise, pondéré entre le coût des fonds propres et le coût de la dette après impôt.", options: ["Le taux sans risque du marché", "Le coût moyen pondéré entre fonds propres et dette après impôt", "Le rendement exigé par les actionnaires uniquement", "Le taux d'intérêt moyen des obligations d'État"], correct: 1 },
  { id: 194, deck: "marche", sub: "Économie financière & valorisation", q: "Sur quel principe repose la méthode des DCF (discounted cash flows) ?", a: "Elle valorise une entreprise en actualisant ses flux de trésorerie disponibles futurs au coût moyen pondéré du capital (WACC).", options: ["Elle compare l'entreprise à des sociétés similaires cotées", "Elle actualise les flux de trésorerie futurs au WACC", "Elle se base uniquement sur la valeur comptable des actifs", "Elle utilise exclusivement les multiples de résultat passés"], correct: 1 },
  { id: 195, deck: "marche", sub: "Économie financière & valorisation", q: "À quoi sert un multiple de valorisation comme l'EV/EBITDA ?", a: "À comparer la valeur d'une entreprise à un agrégat financier (ici l'EBITDA), généralement pour la comparer à des sociétés similaires du même secteur.", options: ["À calculer directement le prix de l'action", "À comparer la valeur d'une entreprise à un agrégat financier entre sociétés comparables", "À mesurer uniquement la rentabilité des capitaux propres", "À estimer le coût de la dette de l'entreprise"], correct: 1 },
  { id: 196, deck: "marche", sub: "Économie financière & valorisation", q: "Qu'est-ce que le levier financier (leverage) ?", a: "L'utilisation de la dette pour financer des investissements, ce qui amplifie à la fois les gains et les pertes potentielles pour les actionnaires.", options: ["Le rapport entre chiffre d'affaires et bénéfice net", "L'utilisation de la dette, qui amplifie gains et pertes pour les actionnaires", "La diversification des sources de financement uniquement", "Le ratio de liquidité à court terme"], correct: 1 },
  { id: 197, deck: "marche", sub: "Économie financière & valorisation", q: "Qu'est-ce qu'un LBO (Leveraged Buy-Out) ?", a: "Une acquisition d'entreprise financée majoritairement par de la dette, celle-ci étant ensuite remboursée grâce aux flux de trésorerie générés par la cible elle-même.", options: ["Une acquisition financée uniquement en cash disponible", "Une acquisition financée majoritairement par dette, remboursée par les flux de la cible", "Une fusion entre deux entreprises de taille égale", "Une introduction en bourse classique"], correct: 1 },
  { id: 198, deck: "marche", sub: "Économie financière & valorisation", q: "Que définit la structure de capital optimale d'une entreprise ?", a: "La combinaison de dette et de capitaux propres qui minimise le coût moyen pondéré du capital (WACC) de l'entreprise.", options: ["La combinaison maximisant uniquement la dette", "La combinaison de dette/capitaux propres minimisant le WACC", "L'absence totale de dette dans le bilan", "Le niveau de trésorerie disponible maximal"], correct: 1 },
  { id: 199, deck: "marche", sub: "Économie financière & valorisation", q: "Que dit le théorème de Modigliani-Miller (sans impôt ni frictions) ?", a: "En marché parfait, la valeur d'une entreprise est indépendante de sa structure de financement (dette vs capitaux propres).", options: ["Plus une entreprise s'endette, plus sa valeur augmente mécaniquement", "En marché parfait, la valeur d'une entreprise est indépendante de sa structure de financement", "La dette est toujours moins coûteuse que les capitaux propres", "La structure de capital optimale est toujours 100% dette"], correct: 1 },
  { id: 200, deck: "marche", sub: "Économie financière & valorisation", q: "Qu'est-ce que le fonds de roulement (working capital) ?", a: "La différence entre les actifs circulants (stocks, créances clients...) et les passifs circulants (dettes fournisseurs...), mesurant la capacité à financer le cycle d'exploitation.", options: ["Le total des immobilisations de l'entreprise", "La différence entre actifs circulants et passifs circulants", "Le montant total de la dette long terme", "La trésorerie disponible en fin d'exercice uniquement"], correct: 1 },
  { id: 201, deck: "marche", sub: "Économie financière & valorisation", q: "Qu'est-ce qu'un covenant bancaire ?", a: "Une clause contractuelle imposant des contraintes financières (ratios à respecter) à l'emprunteur, afin de protéger les intérêts du prêteur.", options: ["Une garantie physique donnée en collatéral", "Une clause contractuelle imposant des contraintes financières à l'emprunteur", "Un taux d'intérêt bonifié accordé à l'emprunteur", "Une assurance contre le risque de change du prêt"], correct: 1 },
  { id: 202, deck: "marche", sub: "Économie financière & valorisation", q: "Qu'est-ce que la due diligence dans une opération de fusion-acquisition ?", a: "Un audit approfondi de la situation financière, juridique et opérationnelle d'une entreprise cible, réalisé avant de finaliser son acquisition.", options: ["La négociation finale du prix d'acquisition", "Un audit approfondi de la cible avant finalisation de l'acquisition", "Le financement de l'opération par la dette", "L'intégration post-acquisition des équipes"], correct: 1 },
  { id: 203, deck: "marche", sub: "Économie financière & valorisation", q: "Qu'est-ce qu'une synergie dans une opération de fusion-acquisition ?", a: "Un gain de valeur résultant de la combinaison de deux entités, supérieur à la simple somme de leurs valeurs individuelles avant l'opération.", options: ["La perte de valeur liée aux coûts d'intégration", "Un gain de valeur résultant de la combinaison, supérieur à la somme des parties", "Le prix payé en prime par l'acquéreur", "Le coût du financement de l'acquisition"], correct: 1 },
  { id: 204, deck: "marche", sub: "Économie financière & valorisation", q: "Que mesure le ratio dette nette / EBITDA ?", a: "Le niveau d'endettement d'une entreprise rapporté à sa capacité de génération de trésorerie opérationnelle, indicateur clé de solvabilité.", options: ["La rentabilité des capitaux propres", "Le niveau d'endettement rapporté à la capacité de génération de cash opérationnel", "Le rendement du dividende", "La marge nette de l'entreprise"], correct: 1 },
  { id: 205, deck: "quant", sub: "Calcul stochastique", q: "Qu'est-ce qu'un processus de Lévy ?", a: "Un processus stochastique à accroissements indépendants et stationnaires, généralisant le mouvement brownien en autorisant notamment des sauts.", options: ["Un synonyme exact du mouvement brownien", "Un processus à accroissements indépendants et stationnaires, autorisant des sauts", "Un processus toujours borné dans le temps", "Un processus purement déterministe"], correct: 1 },
  { id: 206, deck: "quant", sub: "Calcul stochastique", q: "Qu'est-ce que le mouvement brownien géométrique ?", a: "Un processus où $S_t$ suit $$dS_t = \\mu S_t\\,dt + \\sigma S_t\\,dW_t$$ de solution explicite $S_t = S_0\\,e^{(\\mu-\\sigma^2/2)t+\\sigma W_t}$, garantissant $S_t>0$.", options: ["Un processus où le prix peut devenir négatif", "Un processus où le log du prix suit un brownien avec dérive, prix toujours positif", "Un processus à volatilité nulle", "Un processus purement discret dans le temps"], correct: 1 },
  { id: 207, deck: "quant", sub: "Calcul stochastique", q: "Qu'est-ce que l'intégrale stochastique d'Itô ?", a: "Une généralisation de l'intégrale classique notée $\\int_0^t \\sigma_s\\,dW_s$, définie comme limite de sommes de Riemann évaluées au point gauche de chaque intervalle, adaptée aux trajectoires non dérivables du brownien.", options: ["Une intégrale identique à l'intégrale de Riemann classique", "Une généralisation de l'intégrale adaptée aux processus non dérivables comme le brownien", "Une méthode de résolution d'EDP uniquement", "Une technique de réduction de variance en Monte-Carlo"], correct: 1 },
  { id: 208, deck: "quant", sub: "Calcul stochastique", q: "Qu'est-ce qu'un processus de Poisson ?", a: "Un processus de comptage tel que $$P(N_t = k) = \\frac{(\\lambda t)^k}{k!}e^{-\\lambda t}$$ utilisé pour modéliser l'arrivée d'événements discrets comme les défauts de crédit.", options: ["Un processus continu sans saut", "Un processus de comptage à sauts, modélisant l'arrivée d'événements discrets", "Un processus toujours décroissant", "Un synonyme du mouvement brownien"], correct: 1 },
  { id: 209, deck: "quant", sub: "Calcul stochastique", q: "Qu'est-ce que la volatilité locale (modèle de Dupire) ?", a: "Un modèle où la volatilité instantanée du sous-jacent dépend à la fois de son niveau de prix et du temps, calibré pour reproduire exactement le smile de volatilité observé.", options: ["Un modèle où la volatilité est strictement constante", "Un modèle où la volatilité dépend du niveau de prix et du temps", "Un modèle où la volatilité suit elle-même un processus aléatoire indépendant", "Un modèle réservé aux options sur taux d'intérêt"], correct: 1 },
  { id: 210, deck: "quant", sub: "Calcul stochastique", q: "Qu'est-ce que le modèle de Heston (volatilité stochastique) ?", a: "Un modèle à deux facteurs : $$dS_t = \\mu S_t\\,dt + \\sqrt{v_t}\\,S_t\\,dW_t^1, \\qquad dv_t = \\kappa(\\theta-v_t)\\,dt + \\xi\\sqrt{v_t}\\,dW_t^2$$ où la variance $v_t$ suit elle-même un processus stochastique.", options: ["Un modèle où la volatilité est une fonction déterministe du temps", "Un modèle où la volatilité suit un processus stochastique propre", "Un modèle sans aucune volatilité", "Un modèle exclusivement discret (arbre binomial)"], correct: 1 },
  { id: 211, deck: "quant", sub: "Calcul stochastique", q: "Qu'apporte le modèle de Merton avec sauts ?", a: "Il ajoute une composante de sauts au GBM : $$\\frac{dS_t}{S_t} = \\mu\\,dt + \\sigma\\,dW_t + dJ_t$$ où $J_t$ est un processus de sauts (souvent composé de type Poisson), capturant les chocs brutaux de marché.", options: ["Il supprime toute composante aléatoire du modèle", "Il ajoute des sauts discontinus au mouvement brownien pour capturer les chocs de marché", "Il suppose une volatilité nulle en dehors des sauts", "Il ne s'applique qu'aux obligations d'État"], correct: 1 },
  { id: 212, deck: "quant", sub: "Calcul stochastique", q: "Que dit le théorème de représentation des martingales ?", a: "Sous certaines conditions, toute martingale peut être représentée comme une intégrale stochastique par rapport au mouvement brownien.", options: ["Toute martingale est nécessairement constante", "Toute martingale peut être représentée comme une intégrale stochastique par rapport au brownien", "Les martingales n'existent que pour des processus discrets", "Ce théorème ne s'applique qu'aux options américaines"], correct: 1 },
  { id: 213, deck: "quant", sub: "Pricing d'options", q: "Qu'est-ce que la 'volatility surface' ?", a: "Une représentation tridimensionnelle de la volatilité implicite en fonction du strike et de la maturité des options.", options: ["Une courbe de volatilité historique uniquement", "Une représentation 3D de la volatilité implicite selon strike et maturité", "Le prix des options sur un seul strike donné", "La corrélation entre plusieurs sous-jacents"], correct: 1 },
  { id: 214, deck: "quant", sub: "Pricing d'options", q: "À quoi sert la formule de Black pour les options sur futures ?", a: "Une variante de Black-Scholes pour un call sur future : $$C = e^{-rT}\\left[F\\,N(d_1) - K\\,N(d_2)\\right], \\quad d_1 = \\frac{\\ln(F/K)+\\sigma^2T/2}{\\sigma\\sqrt{T}}$$", options: ["Elle ne s'applique qu'aux options américaines", "C'est une variante de Black-Scholes adaptée au pricing d'options sur futures", "Elle remplace totalement le modèle binomial", "Elle ignore la volatilité du sous-jacent"], correct: 1 },
  { id: 215, deck: "quant", sub: "Pricing d'options", q: "À quoi sert le modèle SABR en pricing d'options ?", a: "C'est un modèle de volatilité stochastique très utilisé en pratique, notamment sur les marchés de taux, pour calibrer efficacement le smile de volatilité.", options: ["Un modèle uniquement utilisé pour les actions", "Un modèle de volatilité stochastique très utilisé pour calibrer le smile, notamment sur les taux", "Un modèle sans paramètres calibrables", "Un modèle remplaçant totalement Black-Scholes sur toutes les classes d'actifs"], correct: 1 },
  { id: 216, deck: "quant", sub: "Pricing d'options", q: "Qu'est-ce qu'une option asiatique ?", a: "Une option dont le payoff dépend de la moyenne du sous-jacent : $$\\text{payoff} = \\max\\left(\\frac{1}{n}\\sum_{i=1}^n S_{t_i} - K,\\ 0\\right)$$", options: ["Une option réservée aux marchés asiatiques", "Une option dont le payoff dépend de la moyenne du prix sur une période", "Une option toujours moins chère qu'une option européenne", "Une option sans strike défini"], correct: 1 },
  { id: 217, deck: "quant", sub: "Pricing d'options", q: "Qu'est-ce qu'une option lookback ?", a: "Une option dont le payoff dépend du prix extrême atteint, par exemple $$\\text{payoff} = S_T - \\min_{0\\le t\\le T} S_t$$", options: ["Une option dont le payoff dépend uniquement du prix final", "Une option dont le payoff dépend du prix extrême atteint durant sa vie", "Une option ne pouvant jamais être exercée", "Une option dont le strike change chaque jour aléatoirement"], correct: 1 },
  { id: 218, deck: "quant", sub: "Pricing d'options", q: "À quoi servent les techniques de réduction de variance en Monte-Carlo ?", a: "À réduire le bruit statistique (la variance) des estimateurs simulés, comme les variables antithétiques ou de contrôle, sans introduire de biais dans le résultat.", options: ["À accélérer artificiellement la convergence en biaisant le résultat", "À réduire la variance des estimateurs simulés sans introduire de biais", "À remplacer entièrement la simulation par une formule fermée", "À augmenter le nombre de trajectoires simulées uniquement"], correct: 1 },
  { id: 219, deck: "quant", sub: "Pricing d'options", q: "Que se passe-t-il quand le nombre de pas de l'arbre binomial tend vers l'infini ?", a: "Le prix calculé par l'arbre binomial converge vers le prix donné par le modèle de Black-Scholes en temps continu.", options: ["Le prix diverge et devient incalculable", "Le prix converge vers celui du modèle de Black-Scholes", "Le prix devient indépendant de la volatilité", "Le prix converge toujours vers zéro"], correct: 1 },
  { id: 220, deck: "quant", sub: "Pricing d'options", q: "Qu'est-ce que le 'skew' de volatilité, par opposition au smile ?", a: "Une asymétrie systématique où la volatilité implicite décroît quand le strike augmente, typique des marchés actions reflétant la crainte de krach.", options: ["Une volatilité implicite parfaitement symétrique autour du prix spot", "Une asymétrie où la volatilité implicite décroît avec le strike, typique des actions", "Un phénomène observé uniquement sur le marché des changes", "Une volatilité implicite constante quel que soit le strike"], correct: 1 },
  { id: 221, deck: "quant", sub: "Grecques", q: "Que mesure le Vanna d'une option ?", a: "La sensibilité croisée $$\\text{Vanna} = \\frac{\\partial^2 V}{\\partial S\\,\\partial \\sigma} = \\frac{\\partial \\Delta}{\\partial \\sigma}$$", options: ["La sensibilité du Delta au temps qui passe", "La sensibilité croisée du Delta à la volatilité", "La sensibilité du Theta au taux d'intérêt", "La convexité pure du Gamma"], correct: 1 },
  { id: 222, deck: "quant", sub: "Grecques", q: "Que mesure le Volga (ou Vomma) d'une option ?", a: "La convexité de l'exposition à la volatilité : $$\\text{Volga} = \\frac{\\partial^2 V}{\\partial \\sigma^2} = \\frac{\\partial \\nu}{\\partial \\sigma}$$", options: ["La sensibilité du Delta au sous-jacent", "La sensibilité du Vega à une variation de la volatilité", "La sensibilité du Theta au temps restant", "La sensibilité du Rho au taux d'intérêt"], correct: 1 },
  { id: 223, deck: "quant", sub: "Grecques", q: "Qu'est-ce que le Charm (Delta decay) ?", a: "La variation du Delta au fil du temps : $$\\text{Charm} = -\\frac{\\partial \\Delta}{\\partial t} = -\\frac{\\partial^2 V}{\\partial S\\,\\partial t}$$", options: ["La variation du Gamma en fonction du sous-jacent", "La variation du Delta au fil du temps qui passe", "La sensibilité du Vega au temps restant", "Un synonyme exact du Theta"], correct: 1 },
  { id: 224, deck: "quant", sub: "Grecques", q: "Que mesure le Speed d'une option ?", a: "La dérivée troisième du prix par rapport au sous-jacent : $$\\text{Speed} = \\frac{\\partial \\Gamma}{\\partial S} = \\frac{\\partial^3 V}{\\partial S^3}$$", options: ["La vitesse d'exécution d'un ordre sur l'option", "La sensibilité du Gamma à une variation du sous-jacent", "La sensibilité du Delta au taux sans risque", "Un synonyme du Vega"], correct: 1 },
  { id: 225, deck: "quant", sub: "Grecques", q: "Comment calcule-t-on les grecques d'un portefeuille d'options ?", a: "En sommant les grecques individuelles de chaque position, pondérées par leurs quantités respectives, ce qui permet une couverture agrégée du portefeuille.", options: ["En prenant la moyenne simple des grecques de chaque position", "En sommant les grecques individuelles pondérées par les quantités", "En ne considérant que la position la plus importante", "Les grecques ne peuvent pas s'additionner entre positions"], correct: 1 },
  { id: 226, deck: "quant", sub: "Grecques", q: "Qu'est-ce que la couverture Gamma ?", a: "L'utilisation d'options supplémentaires pour neutraliser le Gamma d'un portefeuille, en complément de la couverture Delta classique via le sous-jacent seul.", options: ["Une couverture uniquement réalisable avec le sous-jacent", "L'utilisation d'options supplémentaires pour neutraliser le Gamma du portefeuille", "Une stratégie annulant systématiquement le Vega", "Une couverture qui ignore totalement le Delta"], correct: 1 },
  { id: 227, deck: "quant", sub: "Grecques", q: "Pourquoi un vendeur net d'options a-t-il généralement un Theta positif ?", a: "Parce qu'il bénéficie, toutes choses égales par ailleurs, de la décroissance de la valeur temps des options qu'il a vendues au fil du temps qui passe.", options: ["Parce qu'il est toujours exposé positivement au sous-jacent", "Parce qu'il bénéficie de la décroissance de la valeur temps des options vendues", "Parce que son Vega est nécessairement positif aussi", "Parce que le Theta est toujours positif par convention"], correct: 1 },
  { id: 228, deck: "quant", sub: "Grecques", q: "Qu'est-ce qu'une position 'long Vega' ?", a: "Une position qui bénéficie d'une hausse de la volatilité implicite du marché, typiquement celle d'un acheteur net d'options.", options: ["Une position qui bénéficie d'une baisse de la volatilité implicite", "Une position qui bénéficie d'une hausse de la volatilité implicite", "Une position totalement insensible à la volatilité", "Une position exclusivement composée de sous-jacent"], correct: 1 },
  { id: 229, deck: "quant", sub: "Portefeuille", q: "Qu'est-ce que le portefeuille de variance minimale ?", a: "Le portefeuille résolvant $$w^* = \\frac{\\Sigma^{-1}\\mathbf{1}}{\\mathbf{1}^T\\Sigma^{-1}\\mathbf{1}}$$ où $\\Sigma$ est la matrice de covariance, minimisant $w^T\\Sigma w$ sans contrainte de rendement.", options: ["Le portefeuille offrant le rendement espéré maximal", "Le portefeuille de la frontière efficiente ayant le risque le plus faible possible", "Le portefeuille composé uniquement de l'actif sans risque", "Le portefeuille de marché pondéré par capitalisation"], correct: 1 },
  { id: 230, deck: "quant", sub: "Portefeuille", q: "Que dit le théorème de séparation des fonds (two-fund separation) ?", a: "Tout portefeuille efficient peut être construit comme une combinaison de l'actif sans risque et d'un seul et même portefeuille risqué optimal (le portefeuille de marché).", options: ["Chaque investisseur doit détenir un portefeuille risqué différent", "Tout portefeuille efficient combine l'actif sans risque et un seul portefeuille risqué optimal", "Il n'existe pas de portefeuille sans risque en pratique", "La diversification n'a aucun effet sur le risque du portefeuille"], correct: 1 },
  { id: 231, deck: "quant", sub: "Portefeuille", q: "Comment calcule-t-on le beta d'un portefeuille ?", a: "C'est la moyenne pondérée des betas individuels : $$\\beta_p = \\sum_{i=1}^n w_i\\,\\beta_i$$", options: ["La somme simple des betas individuels sans pondération", "La moyenne pondérée des betas individuels des actifs du portefeuille", "Le beta de l'actif le plus risqué du portefeuille uniquement", "Un beta toujours égal à 1 par construction"], correct: 1 },
  { id: 232, deck: "quant", sub: "Portefeuille", q: "Quelle est la différence entre value investing et growth investing ?", a: "Le value investing recherche des actifs jugés sous-valorisés selon des ratios fondamentaux, tandis que le growth investing privilégie les entreprises à forte croissance attendue, même à valorisation élevée.", options: ["Ce sont deux termes strictement synonymes", "Le value cherche des actifs sous-valorisés, le growth privilégie la forte croissance attendue", "Le growth ne s'intéresse qu'aux obligations", "Le value investing ignore totalement les fondamentaux"], correct: 1 },
  { id: 233, deck: "quant", sub: "Portefeuille", q: "Quelle est la différence entre risque idiosyncratique et risque systématique ?", a: "Le risque idiosyncratique est propre à un actif et peut être éliminé par diversification, tandis que le risque systématique est lié au marché global et n'est pas diversifiable.", options: ["Les deux types de risque sont totalement diversifiables", "L'idiosyncratique est diversifiable, le systématique ne l'est pas", "Le systématique est diversifiable, l'idiosyncratique ne l'est pas", "Ils désignent exactement la même chose"], correct: 1 },
  { id: 234, deck: "quant", sub: "Portefeuille", q: "Que propose le modèle multi-facteurs APT (Arbitrage Pricing Theory) ?", a: "Il explique le rendement par plusieurs facteurs : $$E[R_i] = R_f + \\sum_{k=1}^K \\beta_{i,k}\\,\\lambda_k$$ sans hypothèse restrictive sur les préférences des investisseurs, contrairement au CAPM.", options: ["Il n'utilise qu'un seul facteur, comme le CAPM", "Il explique le rendement par plusieurs facteurs de risque, avec moins d'hypothèses restrictives", "Il ignore totalement la notion de risque systématique", "Il s'applique uniquement aux obligations d'État"], correct: 1 },
  { id: 235, deck: "quant", sub: "Portefeuille", q: "Que mesure l'alpha de Jensen ?", a: "La surperformance par rapport au CAPM : $$\\alpha_p = E[R_p] - \\left[R_f + \\beta_p(E[R_m]-R_f)\\right]$$", options: ["Le rendement total brut du portefeuille", "La surperformance par rapport à ce que prédit le CAPM pour ce niveau de risque", "Le risque total du portefeuille mesuré par son écart-type", "La corrélation du portefeuille avec le marché"], correct: 1 },
  { id: 236, deck: "quant", sub: "Portefeuille", q: "Quelle est la différence entre gestion active et gestion passive ?", a: "La gestion active vise à battre un indice de référence via la sélection de titres, tandis que la gestion passive vise simplement à le répliquer au moindre coût.", options: ["Elles visent toutes deux à battre systématiquement l'indice", "L'active vise à battre l'indice, la passive vise à le répliquer au moindre coût", "La gestion passive utilise toujours plus de titres que l'active", "Il n'existe aucune différence de coût entre les deux"], correct: 1 },
  { id: 237, deck: "quant", sub: "Séries temporelles", q: "Qu'est-ce qu'un bruit blanc en séries temporelles ?", a: "Une série $\\epsilon_t \\sim iid(0,\\sigma^2)$ telle que $$\\text{Cov}(\\epsilon_t,\\epsilon_s) = 0 \\quad \\text{pour } t\\ne s$$", options: ["Une série parfaitement prévisible et déterministe", "Une série sans autocorrélation, de moyenne nulle et variance constante", "Une série avec une tendance forte et persistante", "Un synonyme exact de marche aléatoire"], correct: 1 },
  { id: 238, deck: "quant", sub: "Séries temporelles", q: "Qu'apporte le modèle EGARCH par rapport au GARCH classique ?", a: "Il capture l'asymétrie via $$\\ln\\sigma_t^2 = \\omega + \\beta\\ln\\sigma_{t-1}^2 + \\alpha\\left(\\frac{|\\epsilon_{t-1}|}{\\sigma_{t-1}}-\\sqrt{2/\\pi}\\right) + \\gamma\\frac{\\epsilon_{t-1}}{\\sigma_{t-1}}$$ le terme en $\\gamma$ captant l'effet de levier (choc négatif vs positif).", options: ["Il ignore totalement la volatilité conditionnelle", "Il capture l'asymétrie de la volatilité selon le signe du choc (effet de levier)", "Il ne s'applique qu'aux séries stationnaires en niveau", "Il remplace entièrement la notion de volatilité par la variance historique"], correct: 1 },
  { id: 239, deck: "quant", sub: "Séries temporelles", q: "À quoi sert le test de Ljung-Box ?", a: "À vérifier statistiquement l'absence d'autocorrélation significative dans les résidus d'un modèle de série temporelle.", options: ["À tester la présence d'une racine unitaire", "À vérifier l'absence d'autocorrélation significative dans les résidus d'un modèle", "À estimer les paramètres d'un modèle ARMA", "À mesurer la volatilité conditionnelle d'une série"], correct: 1 },
  { id: 240, deck: "quant", sub: "Séries temporelles", q: "Que permet la décomposition tendance-saisonnalité-résidu d'une série temporelle ?", a: "Elle sépare, par exemple sous forme additive : $$y_t = T_t + S_t + R_t$$ une tendance $T_t$, une composante saisonnière $S_t$, et un résidu $R_t$.", options: ["Elle transforme la série en processus stationnaire automatiquement", "Elle sépare la série en tendance, saisonnalité et résidu", "Elle calcule uniquement la moyenne mobile de la série", "Elle élimine totalement le bruit de la série"], correct: 1 },
  { id: 241, deck: "quant", sub: "Séries temporelles", q: "Que mesure la fonction d'autocorrélation partielle (PACF) ?", a: "La corrélation entre une série et une de ses valeurs décalées, après avoir retiré l'effet des décalages intermédiaires — utile pour identifier l'ordre d'un modèle AR.", options: ["La corrélation brute entre deux séries différentes", "La corrélation entre une série et son décalage, après retrait de l'effet des décalages intermédiaires", "La variance totale de la série", "La corrélation entre les résidus et le temps"], correct: 1 },
  { id: 242, deck: "quant", sub: "Séries temporelles", q: "Qu'est-ce qu'un processus intégré d'ordre 1, noté I(1) ?", a: "Une série $y_t$ non-stationnaire telle que sa différence première $\\Delta y_t = y_t - y_{t-1}$ soit stationnaire.", options: ["Une série déjà stationnaire en niveau", "Une série non-stationnaire dont la différence première devient stationnaire", "Une série sans aucune tendance possible", "Un synonyme exact de bruit blanc"], correct: 1 },
  { id: 243, deck: "quant", sub: "Séries temporelles", q: "Qu'est-ce qu'un modèle VAR (Vector Autoregression) ?", a: "Un modèle multivarié où, par exemple à l'ordre 1 : $$Y_t = c + A\\,Y_{t-1} + \\epsilon_t$$ chaque composante de $Y_t$ dépendant de ses propres retards et de ceux des autres séries.", options: ["Un modèle univarié classique sans interaction entre séries", "Un modèle multivarié où chaque série dépend de ses retards et de ceux des autres séries", "Un synonyme exact du modèle GARCH", "Un modèle réservé uniquement aux séries stationnaires en différence seconde"], correct: 1 },
  { id: 244, deck: "quant", sub: "Séries temporelles", q: "À quoi sert le test de causalité de Granger ?", a: "À évaluer statistiquement si les valeurs passées d'une série aident significativement à prédire les valeurs futures d'une autre série.", options: ["À tester une causalité économique fondamentale au sens strict", "À évaluer si les valeurs passées d'une série aident à prédire une autre série", "À mesurer la corrélation contemporaine entre deux séries", "À tester la stationnarité d'une seule série isolée"], correct: 1 },
  { id: 245, deck: "quant", sub: "Modèles de risque avancés", q: "Qu'est-ce que l'Expected Shortfall (CVaR) ?", a: "La perte moyenne au-delà du seuil de VaR : $$ES_\\alpha = \\mathbb{E}\\left[L \\mid L \\ge VaR_\\alpha\\right]$$ capturant mieux le risque de queue que la VaR seule.", options: ["Un synonyme exact de la VaR classique", "La perte moyenne attendue au-delà du seuil de la VaR", "La perte maximale théorique absolue d'un portefeuille", "Le capital réglementaire minimum exigé par Bâle III"], correct: 1 },
  { id: 246, deck: "quant", sub: "Modèles de risque avancés", q: "À quoi sert la théorie des valeurs extrêmes (EVT) ?", a: "À modéliser spécifiquement le comportement des queues de distribution, particulièrement utile pour estimer le risque d'événements rares et extrêmes.", options: ["À modéliser le comportement moyen d'une distribution", "À modéliser spécifiquement le comportement des queues de distribution", "À calculer uniquement la volatilité implicite", "À tester la stationnarité d'une série temporelle"], correct: 1 },
  { id: 247, deck: "quant", sub: "Modèles de risque avancés", q: "À quoi sert la distribution de Pareto généralisée en gestion des risques ?", a: "Elle est souvent utilisée dans le cadre de la théorie des valeurs extrêmes pour modéliser les excès de pertes au-delà d'un seuil élevé.", options: ["Elle modélise uniquement les rendements moyens d'un portefeuille", "Elle modélise les excès de pertes au-delà d'un seuil élevé en théorie des valeurs extrêmes", "Elle remplace totalement la loi normale dans tous les modèles", "Elle s'applique uniquement aux séries temporelles stationnaires"], correct: 1 },
  { id: 248, deck: "quant", sub: "Modèles de risque avancés", q: "Comment le modèle structurel de Merton modélise-t-il le défaut d'une entreprise ?", a: "Le défaut survient lorsque la valeur des actifs de l'entreprise passe en dessous de la valeur de sa dette, modélisée comme une option sur les actifs.", options: ["Le défaut est un événement purement aléatoire indépendant du bilan", "Le défaut survient quand la valeur des actifs passe sous la valeur de la dette", "Le défaut ne dépend que de la notation externe de l'entreprise", "Le défaut est modélisé uniquement par un processus de Poisson"], correct: 1 },
  { id: 249, deck: "quant", sub: "Modèles de risque avancés", q: "Qu'est-ce qu'un modèle à intensité de défaut (modèle réduit) ?", a: "Un modèle qui traite le défaut comme un événement aléatoire gouverné par un processus à intensité variable, sans référence explicite à la structure du bilan de l'émetteur.", options: ["Un modèle basé exclusivement sur la valeur des actifs de l'entreprise", "Un modèle traitant le défaut comme un événement aléatoire à intensité variable, sans lien direct au bilan", "Un modèle réservé uniquement aux obligations d'État", "Un synonyme exact du modèle structurel de Merton"], correct: 1 },
  { id: 250, deck: "quant", sub: "Modèles de risque avancés", q: "Pourquoi la corrélation de défaut est-elle importante en gestion du risque de crédit ?", a: "Parce qu'elle mesure la tendance de plusieurs émetteurs à faire défaut simultanément, ce qui est crucial pour évaluer le risque des portefeuilles diversifiés et des tranches de CDO.", options: ["Elle n'a aucun impact sur le pricing des produits de crédit structurés", "Elle mesure la tendance de plusieurs émetteurs à faire défaut simultanément", "Elle mesure uniquement le risque de taux d'intérêt", "Elle est toujours égale à zéro par construction"], correct: 1 },
  { id: 251, deck: "quant", sub: "Modèles de risque avancés", q: "Comment la copule gaussienne a-t-elle historiquement été utilisée en finance de crédit ?", a: "Pour modéliser la structure de dépendance des défauts entre plusieurs émetteurs au sein d'un portefeuille, notamment dans le pricing des CDO avant la crise de 2008.", options: ["Pour calculer directement le prix d'une option européenne", "Pour modéliser la dépendance des défauts entre plusieurs émetteurs d'un portefeuille", "Pour estimer uniquement la volatilité historique d'un actif", "Pour remplacer totalement le modèle de Black-Scholes"], correct: 1 },
  { id: 252, deck: "quant", sub: "Modèles de risque avancés", q: "Qu'est-ce que le risque de concentration ?", a: "Le risque résultant d'une exposition excessive d'un portefeuille à un même émetteur, secteur d'activité, ou zone géographique.", options: ["Le risque lié à une diversification excessive du portefeuille", "Le risque résultant d'une exposition excessive à un même émetteur, secteur ou zone", "Le risque de change sur les positions internationales uniquement", "Le risque de liquidité d'un actif isolé"], correct: 1 },
  { id: 253, deck: "quant", sub: "Modèles de risque avancés", q: "Qu'est-ce que la Stress VaR ?", a: "Une VaR calculée à partir d'une période historique de forte tension de marché plutôt que sur les données récentes, pour capturer le risque en conditions extrêmes.", options: ["La VaR moyenne calculée sur plusieurs années normales", "Une VaR calculée sur une période historique de forte tension de marché", "Un synonyme exact de l'Expected Shortfall", "La VaR calculée uniquement sur les positions les plus liquides"], correct: 1 },
  { id: 254, deck: "quant", sub: "Modèles de risque avancés", q: "Qu'apporte l'approche Delta-Gamma pour le calcul de la VaR ?", a: "Elle approxime la variation de valeur d'un portefeuille non-linéaire par $$\\Delta V \\approx \\Delta \\cdot \\Delta S + \\frac{1}{2}\\Gamma\\,(\\Delta S)^2$$ intégrant la convexité en plus de la sensibilité de premier ordre.", options: ["Elle ignore totalement les positions en options", "Elle intègre le Delta et le Gamma pour approximer un portefeuille non-linéaire", "Elle ne s'applique qu'aux portefeuilles purement linéaires", "Elle remplace entièrement la simulation historique"], correct: 1 },
  { id: 255, deck: "quant", sub: "Modèles de risque avancés", q: "En quoi consiste la méthode de simulation historique pour calculer la VaR ?", a: "Elle applique directement les variations de marché effectivement observées dans le passé au portefeuille actuel, pour en déduire la distribution empirique des pertes possibles.", options: ["Elle suppose une distribution normale des rendements", "Elle applique les variations de marché historiques observées au portefeuille actuel", "Elle simule des scénarios purement aléatoires sans lien avec l'historique", "Elle ne considère qu'un seul jour de marché passé"], correct: 1 },
  { id: 256, deck: "quant", sub: "Modèles de risque avancés", q: "Comment la diversification réduit-elle le risque de crédit d'un portefeuille ?", a: "En multipliant les émetteurs peu corrélés entre eux en termes de risque de défaut, réduisant ainsi la probabilité de pertes simultanées importantes.", options: ["En concentrant les expositions sur un seul secteur solide", "En multipliant les émetteurs peu corrélés en termes de risque de défaut", "En n'investissant que dans des obligations d'État", "Elle n'a aucun effet sur le risque de crédit global"], correct: 1 },
  { id: 257, deck: "quant", sub: "Modèles de risque avancés", q: "Qu'est-ce que le risque de base de corrélation ?", a: "Le risque lié à l'incertitude sur le paramètre de corrélation utilisé pour pricer des produits de crédit structurés comme les tranches de CDO.", options: ["Le risque de change sur un produit de crédit", "Le risque lié à l'incertitude sur le paramètre de corrélation utilisé dans le pricing", "Le risque de taux d'intérêt sur une obligation", "Un synonyme du risque de contrepartie classique"], correct: 1 },
  { id: 258, deck: "quant", sub: "Modèles de risque avancés", q: "Que mesure le ratio de Sortino ?", a: "Une variante du Sharpe ne pénalisant que la volatilité à la baisse : $$Sortino = \\frac{E[R_p]-R_f}{\\sigma_{downside}}$$", options: ["Le même concept que le ratio de Sharpe sans aucune différence", "Une variante du Sharpe ne pénalisant que la volatilité à la baisse", "Le rendement rapporté uniquement au beta du portefeuille", "La performance ajustée du seul risque de crédit"], correct: 1 },
  { id: 259, deck: "quant", sub: "Modèles de risque avancés", q: "Qu'est-ce que le maximum drawdown ?", a: "La perte maximale observée entre un sommet et un creux : $$MDD = \\max_{t}\\left(\\frac{\\text{Pic}_t - \\text{Valeur}_t}{\\text{Pic}_t}\\right)$$", options: ["La perte moyenne quotidienne d'un portefeuille", "La perte maximale observée entre un sommet et un creux ultérieur", "Le gain maximal théorique atteignable", "La volatilité annualisée d'un portefeuille"], correct: 1 },
  { id: 260, deck: "quant", sub: "Modèles de risque avancés", q: "Qu'est-ce que la contribution marginale à l'Expected Shortfall ?", a: "La contribution d'un actif individuel à l'Expected Shortfall total d'un portefeuille, utile pour identifier les principaux facteurs de risque de queue.", options: ["La VaR totale du portefeuille sans décomposition", "La contribution d'un actif individuel à l'Expected Shortfall total", "Un synonyme exact du ratio de Sharpe", "La contribution au rendement moyen du portefeuille"], correct: 1 },
  { id: 261, deck: "quant", sub: "Modèles de risque avancés", q: "Quelle est la différence entre risque de liquidité de marché et risque de liquidité de financement ?", a: "Le premier concerne la difficulté à vendre un actif sans impact de prix significatif, le second la difficulté à obtenir du financement à court terme pour honorer ses engagements.", options: ["Ce sont deux termes strictement identiques", "L'un concerne la vente d'actifs sans impact de prix, l'autre l'accès au financement court terme", "Le risque de financement concerne uniquement les actions", "Le risque de marché concerne uniquement les obligations d'État"], correct: 1 },
  { id: 262, deck: "quant", sub: "Modèles de risque avancés", q: "À quoi sert le test de Kupiec en validation de modèle de VaR ?", a: "À comparer statistiquement le taux d'exceptions (dépassements de la VaR) observé au taux théorique attendu, pour valider la fiabilité du modèle.", options: ["À calculer directement la VaR d'un portefeuille", "À comparer le taux d'exceptions observé au taux théorique attendu", "À mesurer la corrélation entre plusieurs actifs", "À tester la normalité des rendements du portefeuille"], correct: 1 },
  { id: 263, deck: "quant", sub: "Modèles de risque avancés", q: "Qu'est-ce que l'approche IRB (Internal Ratings-Based) sous Bâle ?", a: "Une méthode réglementaire permettant aux banques d'utiliser leurs propres modèles internes pour estimer le risque de crédit et le capital réglementaire associé.", options: ["Une méthode imposant un modèle unique identique à toutes les banques", "Une méthode permettant aux banques d'utiliser leurs propres modèles internes de risque de crédit", "Une méthode réservée au calcul du risque de marché uniquement", "Un synonyme exact du ratio de levier"], correct: 1 },
  { id: 264, deck: "quant", sub: "Modèles de risque avancés", q: "Qu'est-ce que le risque de spread de crédit ?", a: "Le risque de perte de valeur d'une obligation dû à l'élargissement de son spread de crédit, indépendamment de la survenance effective d'un défaut.", options: ["Le risque lié uniquement à un défaut effectif de l'émetteur", "Le risque de perte de valeur dû à l'élargissement du spread, sans défaut effectif", "Le risque de change sur une obligation étrangère", "Le risque de taux d'intérêt sans risque de crédit"], correct: 1 },
  { id: 265, deck: "quant", sub: "Optimisation & finance algorithmique", q: "À quoi sert l'optimisation quadratique en gestion de portefeuille ?", a: "Elle résout le problème de Markowitz : $$\\min_w \\frac{1}{2}w^T\\Sigma w \\quad \\text{s.c. } w^T\\mu \\ge \\mu_{cible},\\ w^T\\mathbf{1}=1$$", options: ["Elle maximise uniquement le rendement sans considérer le risque", "Elle minimise la variance du portefeuille sous contrainte de rendement", "Elle calcule uniquement les grecques d'un portefeuille d'options", "Elle sert exclusivement à l'exécution des ordres"], correct: 1 },
  { id: 266, deck: "quant", sub: "Optimisation & finance algorithmique", q: "Pourquoi ajoute-t-on des contraintes réalistes à la frontière efficiente de Markowitz ?", a: "Pour intégrer des limitations pratiques comme l'interdiction de vente à découvert ou un poids maximum par actif, rendant le portefeuille optimal réellement implémentable.", options: ["Pour maximiser artificiellement le rendement théorique", "Pour intégrer des limitations pratiques et rendre le portefeuille réellement implémentable", "Pour éliminer totalement le risque du portefeuille", "Ces contraintes ne changent jamais le portefeuille optimal obtenu"], correct: 1 },
  { id: 267, deck: "quant", sub: "Optimisation & finance algorithmique", q: "Quel arbitrage guide le rebalancement optimal avec coûts de transaction ?", a: "L'arbitrage entre le bénéfice attendu de revenir à l'allocation cible et le coût des transactions nécessaires pour y parvenir.", options: ["Il n'existe aucun arbitrage, il faut toujours rebalancer immédiatement", "L'arbitrage entre le bénéfice de revenir à l'allocation cible et le coût des transactions", "L'arbitrage entre deux devises différentes", "L'arbitrage entre volatilité implicite et historique"], correct: 1 },
  { id: 268, deck: "quant", sub: "Optimisation & finance algorithmique", q: "Sur quel principe repose une stratégie de trading pairs (pair trading) ?", a: "On calcule le z-score du spread entre deux actifs cointégrés : $$z_t = \\frac{spread_t - \\mu_{spread}}{\\sigma_{spread}}$$ et l'on entre en position quand $|z_t|$ dépasse un seuil, en pariant sur le retour à la moyenne.", options: ["Elle parie sur la hausse simultanée de deux actifs non corrélés", "Elle exploite l'écart entre deux actifs cointégrés, en pariant sur le retour à la moyenne du spread", "Elle nécessite systématiquement un effet de levier élevé", "Elle ne fonctionne que sur des devises"], correct: 1 },
  { id: 269, deck: "quant", sub: "Optimisation & finance algorithmique", q: "Sur quel pari repose une stratégie momentum ?", a: "Elle achète les actifs ayant récemment surperformé, en pariant sur la persistance à court/moyen terme de cette tendance.", options: ["Elle parie sur le retour immédiat à la moyenne des prix", "Elle parie sur la persistance à court/moyen terme d'une tendance récente", "Elle ne s'applique qu'aux obligations d'État", "Elle nécessite l'absence totale de volatilité du marché"], correct: 1 },
  { id: 270, deck: "quant", sub: "Optimisation & finance algorithmique", q: "Sur quel principe repose une stratégie mean-reversion ?", a: "Elle parie sur le retour d'un prix vers sa moyenne historique après un écart jugé excessif, à l'inverse d'une stratégie momentum.", options: ["Elle parie sur la poursuite indéfinie de la tendance actuelle", "Elle parie sur le retour du prix vers sa moyenne historique après un écart excessif", "Elle ne peut s'appliquer qu'à un seul actif isolé", "Elle est identique en tout point à une stratégie momentum"], correct: 1 },
  { id: 271, deck: "quant", sub: "Optimisation & finance algorithmique", q: "En quoi consiste le market making algorithmique ?", a: "Une stratégie automatisée cotant en continu des prix d'achat et de vente pour capter le spread bid-ask, tout en gérant activement le risque d'inventaire résultant.", options: ["Une stratégie purement directionnelle sans gestion d'inventaire", "Une stratégie automatisée captant le spread bid-ask en gérant l'inventaire", "Une stratégie réservée uniquement aux obligations souveraines", "Une stratégie n'impliquant aucun risque de marché"], correct: 1 },
  { id: 272, deck: "quant", sub: "Optimisation & finance algorithmique", q: "Que cherche à équilibrer le cadre d'exécution optimale d'Almgren-Chriss ?", a: "Il minimise $$\\mathbb{E}[\\text{Coût}] + \\lambda\\,\\text{Var}[\\text{Coût}]$$ équilibrant le coût d'impact de marché (exécuter vite) et le risque de timing (exécuter lentement), pondéré par l'aversion au risque $\\lambda$.", options: ["Le taux de change et le taux d'intérêt sans risque", "Le coût d'impact de marché et le risque de timing de l'exécution", "La volatilité implicite et la volatilité historique", "Le risque de crédit et le risque de liquidité"], correct: 1 },
  { id: 273, deck: "quant", sub: "Optimisation & finance algorithmique", q: "Que reflète l'écart entre slippage attendu et slippage réalisé ?", a: "La différence entre le coût d'exécution anticipé par un modèle et celui effectivement observé lors de l'exécution réelle de l'ordre.", options: ["La différence entre volatilité implicite et historique", "La différence entre le coût d'exécution anticipé par le modèle et celui réellement observé", "Un synonyme exact du bid-ask spread", "La différence entre prix spot et prix forward"], correct: 1 },
  { id: 274, deck: "quant", sub: "Optimisation & finance algorithmique", q: "Qu'est-ce que le 'statistical arbitrage' ?", a: "Un ensemble de stratégies quantitatives exploitant des inefficiences statistiques de court terme entre des actifs historiquement corrélés.", options: ["Une stratégie purement fondamentale sans usage de statistiques", "Un ensemble de stratégies exploitant des inefficiences statistiques entre actifs corrélés", "Une stratégie réservée exclusivement au marché des changes", "Un synonyme exact de l'arbitrage cash-and-carry"], correct: 1 },
  { id: 275, deck: "quant", sub: "Optimisation & finance algorithmique", q: "Qu'est-ce qu'un facteur de risque en gestion quantitative (ex. momentum, value) ?", a: "Une variable systématique dans un modèle du type $$R_i = \\alpha_i + \\sum_{k=1}^K \\beta_{i,k}\\,F_k + \\epsilon_i$$ expliquant une part du rendement d'un large ensemble d'actifs.", options: ["Un indicateur purement spécifique à un seul actif isolé", "Une variable systématique expliquant le rendement d'un large ensemble d'actifs", "Un synonyme exact du taux sans risque", "Un indicateur uniquement utilisé en analyse macroéconomique"], correct: 1 },
  { id: 276, deck: "quant", sub: "Optimisation & finance algorithmique", q: "Quel est le principe d'un portefeuille à risque parité (risk parity) ?", a: "Chaque actif a la même contribution au risque total : $$w_i\\,\\frac{(\\Sigma w)_i}{\\sigma_p} = w_j\\,\\frac{(\\Sigma w)_j}{\\sigma_p} \\quad \\forall i,j$$ plutôt qu'un poids égal en capital.", options: ["Chaque actif reçoit un poids en capital strictement identique", "Chaque actif contribue de manière égale au risque total du portefeuille", "Seuls les actifs sans risque sont inclus dans le portefeuille", "Le portefeuille est pondéré uniquement par capitalisation boursière"], correct: 1 },
  { id: 277, deck: "quant", sub: "Optimisation & finance algorithmique", q: "Que détermine le critère de Kelly en dimensionnement de position ?", a: "La fraction du capital maximisant la croissance géométrique : $$f^* = \\frac{bp - q}{b}$$ où $p$ = proba de gain, $q=1-p$, $b$ = ratio gain/perte.", options: ["La taille maximale autorisée par la réglementation", "La taille optimale d'une position pour maximiser la croissance géométrique du capital", "Un montant fixe indépendant de la probabilité de gain", "La taille minimale pour couvrir les frais de transaction"], correct: 1 },
  { id: 278, deck: "quant", sub: "Optimisation & finance algorithmique", q: "Qu'est-ce que la sur-optimisation (curve fitting) d'une stratégie quantitative ?", a: "Un excès de calibration des paramètres d'une stratégie sur les données historiques passées, ce qui réduit sa robustesse et sa performance sur des données futures.", options: ["Une calibration insuffisante des paramètres de la stratégie", "Un excès de calibration sur le passé, réduisant la robustesse future", "Une stratégie totalement indépendante des données historiques", "Un synonyme exact du backtesting classique"], correct: 1 },
  { id: 279, deck: "quant", sub: "Optimisation & finance algorithmique", q: "Qu'est-ce que le slippage lié à la latence ?", a: "Un coût d'exécution additionnel causé par le délai entre le moment de la décision de trading et celui de son exécution effective sur le marché.", options: ["Un coût lié uniquement aux commissions du broker", "Un coût additionnel causé par le délai entre décision et exécution effective", "Un synonyme exact du bid-ask spread", "Un coût fixe indépendant de la vitesse d'exécution"], correct: 1 },
  { id: 280, deck: "quant", sub: "Optimisation & finance algorithmique", q: "Qu'est-ce que l''alpha decay' d'une stratégie ?", a: "La diminution progressive de l'efficacité d'un signal ou d'une stratégie à mesure qu'il devient plus largement connu et exploité par d'autres acteurs du marché.", options: ["Une amélioration progressive de la performance d'une stratégie dans le temps", "La diminution progressive de l'efficacité d'un signal à mesure qu'il est plus exploité", "Un synonyme exact du maximum drawdown", "La disparition immédiate et totale d'une stratégie dès sa découverte"], correct: 1 },
  { id: 281, deck: "quant", sub: "Optimisation & finance algorithmique", q: "Qu'est-ce que la contrainte de capacité d'une stratégie quantitative ?", a: "Une limite au-delà de laquelle l'augmentation des capitaux gérés dégrade la performance de la stratégie, notamment via un impact de marché croissant.", options: ["Une limite réglementaire fixée par les autorités de marché", "Une limite au-delà de laquelle augmenter les capitaux dégrade la performance via l'impact de marché", "Un synonyme exact du ratio de Sharpe maximal atteignable", "Une contrainte qui n'existe que pour les stratégies obligataires"], correct: 1 },
  { id: 282, deck: "quant", sub: "Optimisation & finance algorithmique", q: "Que mesure le ratio de Calmar ?", a: "Le rendement annualisé rapporté au drawdown maximal : $$Calmar = \\frac{R_{annualisé}}{|MDD|}$$", options: ["Le rendement divisé par le beta de la stratégie", "Le rendement annualisé divisé par le maximum drawdown", "La volatilité divisée par le rendement moyen", "Un synonyme exact du ratio de Sharpe"], correct: 1 },
  { id: 283, deck: "quant", sub: "Optimisation & finance algorithmique", q: "Quelle est la différence entre rebalancement calendaire et rebalancement par seuil ?", a: "Le rebalancement calendaire intervient à intervalles de temps fixes, tandis que le rebalancement par seuil n'intervient que lorsque l'allocation dévie au-delà d'un seuil prédéfini.", options: ["Ce sont deux termes strictement identiques en pratique", "Le calendaire est à intervalles fixes, le par seuil dépend d'une dérive prédéfinie de l'allocation", "Le par seuil intervient toujours plus souvent que le calendaire", "Le rebalancement calendaire n'existe pas en gestion de portefeuille"], correct: 1 },
  { id: 284, deck: "quant", sub: "Optimisation & finance algorithmique", q: "Qu'est-ce que le biais du survivant (survivorship bias) ?", a: "Un biais statistique résultant de l'exclusion des entités ayant disparu (faillites, fonds fermés) dans une analyse historique, surestimant souvent la performance moyenne observée.", options: ["Un biais lié à un excès de diversification du portefeuille", "Un biais résultant de l'exclusion des entités disparues, surestimant la performance historique moyenne", "Un biais qui sous-estime systématiquement la performance historique", "Un synonyme exact du biais de sur-optimisation"], correct: 1 },
  { id: 285, deck: "quant", sub: "Statistiques & probabilités", q: "Qu'est-ce que l'inégalité de Jensen ?", a: "Pour une fonction convexe $f$ : $$\\mathbb{E}[f(X)] \\ge f(\\mathbb{E}[X])$$ l'inégalité s'inversant pour une fonction concave.", options: ["Une égalité valable uniquement pour les fonctions linéaires", "Pour une fonction convexe, E[f(X)] ≥ f(E[X])", "Une inégalité réservée au calcul de la VaR", "Un synonyme du théorème central limite"], correct: 1 },
  { id: 286, deck: "quant", sub: "Statistiques & probabilités", q: "Qu'est-ce que l'estimateur du maximum de vraisemblance ?", a: "L'estimateur $$\\hat\\theta = \\arg\\max_\\theta \\sum_{i=1}^n \\ln f(x_i;\\theta)$$ choisissant les paramètres maximisant la log-vraisemblance des données observées.", options: ["Une méthode minimisant uniquement la variance des résidus", "Une méthode choisissant les paramètres maximisant la probabilité d'observer les données", "Un synonyme exact de la régression linéaire", "Une méthode réservée aux séries temporelles stationnaires"], correct: 1 },
  { id: 287, deck: "quant", sub: "Statistiques & probabilités", q: "Qu'est-ce que l'intervalle de confiance à 95% d'une estimation ?", a: "Pour une moyenne, typiquement $$\\bar{X} \\pm 1{,}96\\,\\frac{\\sigma}{\\sqrt{n}}$$ tel que 95% de ces intervalles, sur des échantillons répétés, contiendraient la vraie valeur du paramètre.", options: ["Une plage garantissant à 95% que la vraie valeur y figure toujours pour un seul tirage", "Une plage telle qu'environ 95% des intervalles calculés sur des échantillons répétés contiendraient la vraie valeur", "Un synonyme exact de l'écart-type de l'échantillon", "Une plage contenant systématiquement la moyenne empirique observée"], correct: 1 },
  { id: 288, deck: "quant", sub: "Statistiques & probabilités", q: "Qu'est-ce que l'hétéroscédasticité dans une régression ?", a: "Une situation où la variance des résidus n'est pas constante le long des observations, contredisant une hypothèse clé de la régression linéaire classique (OLS).", options: ["Une situation où les résidus sont parfaitement constants", "Une variance des résidus qui n'est pas constante le long des observations", "Un synonyme exact de la multicolinéarité", "Une propriété toujours vérifiée en pratique par les données financières"], correct: 1 },
  { id: 289, deck: "quant", sub: "Statistiques & probabilités", q: "Qu'est-ce que la multicolinéarité dans une régression multiple ?", a: "Une forte corrélation entre plusieurs variables explicatives, rendant l'estimation individuelle de leurs coefficients instable et peu fiable.", options: ["Une corrélation parfaite entre la variable expliquée et les résidus", "Une forte corrélation entre plusieurs variables explicatives du modèle", "L'absence totale de corrélation entre les variables explicatives", "Un synonyme exact de l'hétéroscédasticité"], correct: 1 },
  { id: 290, deck: "quant", sub: "Statistiques & probabilités", q: "Qu'est-ce qu'une loi de Student (t-distribution) et pourquoi est-elle utile en finance ?", a: "Une distribution similaire à la loi normale mais avec des queues plus épaisses, souvent utilisée pour mieux représenter le risque d'événements extrêmes sur les rendements financiers.", options: ["Une distribution identique à la loi normale en tout point", "Une distribution aux queues plus épaisses que la loi normale, utile pour les événements extrêmes", "Une distribution utilisée uniquement pour les petits échantillons de sondages", "Une distribution ne s'appliquant jamais aux rendements financiers"], correct: 1 },
  { id: 291, deck: "quant", sub: "Statistiques & probabilités", q: "Qu'est-ce que le biais d'un estimateur statistique ?", a: "L'écart systématique entre la valeur moyenne attendue d'un estimateur et la vraie valeur du paramètre qu'il cherche à estimer.", options: ["La variance de l'estimateur autour de sa propre moyenne", "L'écart systématique entre l'espérance de l'estimateur et la vraie valeur du paramètre", "Un synonyme exact de l'écart-type de l'échantillon", "Une propriété toujours nulle pour tout estimateur statistique"], correct: 1 },
  { id: 292, deck: "quant", sub: "Statistiques & probabilités", q: "Quelle est la différence entre probabilité conditionnelle et probabilité jointe ?", a: "La jointe est $P(A\\cap B)$, la conditionnelle est $$P(A\\mid B) = \\frac{P(A\\cap B)}{P(B)}$$ la probabilité de A sachant B déjà réalisé.", options: ["Ce sont deux termes strictement synonymes en probabilités", "La jointe concerne deux événements simultanés, la conditionnelle un événement sachant un autre déjà réalisé", "La conditionnelle est toujours supérieure à la probabilité jointe", "La jointe ne s'applique qu'à des événements indépendants"], correct: 1 },
  { id: 293, deck: "quant", sub: "Machine learning", q: "Qu'est-ce que le sous-apprentissage (underfitting) ?", a: "Un modèle trop simple qui ne parvient pas à capturer le signal sous-jacent des données, ce qui dégrade sa performance à la fois sur les données d'entraînement et de test.", options: ["Un modèle qui colle parfaitement aux données d'entraînement uniquement", "Un modèle trop simple qui ne capture pas le signal sous-jacent des données", "Un synonyme exact du surapprentissage", "Un modèle avec un nombre excessif de paramètres"], correct: 1 },
  { id: 294, deck: "quant", sub: "Machine learning", q: "Qu'est-ce que la validation croisée (cross-validation) ?", a: "Une technique divisant les données en plusieurs sous-ensembles, utilisés tour à tour pour entraîner et tester un modèle, afin d'évaluer sa capacité de généralisation.", options: ["Une méthode utilisant uniquement toutes les données pour l'entraînement", "Une technique divisant les données en sous-ensembles pour entraîner et tester tour à tour un modèle", "Un synonyme exact du backtesting d'une stratégie", "Une méthode réservée exclusivement aux séries temporelles"], correct: 1 },
  { id: 295, deck: "quant", sub: "Machine learning", q: "Qu'est-ce que la régularisation (ex. Ridge, Lasso) en machine learning ?", a: "Une technique pénalisant la complexité d'un modèle (via ses coefficients) pour réduire le risque de surapprentissage et améliorer sa généralisation.", options: ["Une technique augmentant systématiquement le nombre de variables du modèle", "Une technique pénalisant la complexité du modèle pour réduire le surapprentissage", "Un synonyme exact de la validation croisée", "Une méthode réservée uniquement aux réseaux de neurones"], correct: 1 },
  { id: 296, deck: "quant", sub: "Machine learning", q: "Qu'est-ce qu'un arbre de décision en machine learning ?", a: "Un modèle prédictif structuré comme une série de règles de décision hiérarchiques, découpant successivement les données selon les variables les plus discriminantes.", options: ["Un modèle purement linéaire sans règles de décision", "Un modèle structuré comme une série de règles de décision hiérarchiques", "Un synonyme exact de la régression linéaire", "Un modèle utilisable uniquement pour des données textuelles"], correct: 1 },
