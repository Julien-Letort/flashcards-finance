  { id: 400, deck: "brainteasers", sub: "Estimation (Fermi)", q: "Combien de secondes se sont écoulées depuis la naissance d'une personne de 25 ans ?", a: "Environ 789 millions de secondes, calculé via 25 × 365,25 jours × 24 heures × 3600 secondes.", options: ["Environ 79 millions", "Environ 260 millions", "Environ 789 millions", "Environ 2,5 milliards"], correct: 2 },
  { id: 401, deck: "prog", sub: "Python pour la finance", q: "Qu'est-ce qu'un DataFrame dans la librairie pandas ?", a: "Une structure tabulaire à deux dimensions avec index et colonnes typées, très largement utilisée pour manipuler des séries de données financières.", options: ["Un tableau à une seule dimension équivalent à une liste", "Une structure tabulaire 2D avec index et colonnes typées", "Une base de données SQL intégrée à Python", "Un type de graphique de visualisation uniquement"], correct: 1 },
  { id: 402, deck: "prog", sub: "Python pour la finance", q: "Quelle est la principale différence entre une liste Python et un array NumPy ?", a: "L'array NumPy est typé de manière homogène et optimisé pour le calcul vectorisé, contrairement à la liste Python qui est hétérogène et plus lente pour les calculs numériques.", options: ["Il n'existe aucune différence de performance entre les deux", "L'array NumPy est homogène et optimisé pour le calcul vectorisé", "La liste Python est toujours plus rapide pour le calcul numérique", "L'array NumPy ne peut contenir que des entiers"], correct: 1 },
  { id: 403, deck: "prog", sub: "Python pour la finance", q: "Qu'est-ce que la vectorisation avec NumPy ou pandas ?", a: "Le fait d'appliquer des opérations directement sur des tableaux entiers sans boucle explicite en Python, en exploitant du code compilé (C) sous-jacent pour la performance.", options: ["Une méthode de visualisation de données en 3D", "Appliquer des opérations sur des tableaux entiers sans boucle explicite, via du code compilé", "Une technique de compression de données", "Un synonyme exact du multiprocessing"], correct: 1 },
  { id: 404, deck: "prog", sub: "Python pour la finance", q: "Qu'est-ce qu'un générateur (generator) en Python ?", a: "Une fonction qui produit une séquence de valeurs à la demande via le mot-clé 'yield', sans stocker l'intégralité de la séquence en mémoire.", options: ["Une fonction qui retourne toujours une liste complète en mémoire", "Une fonction produisant des valeurs à la demande via 'yield', sans tout stocker en mémoire", "Un synonyme exact d'une compréhension de liste", "Une fonction générant automatiquement des nombres aléatoires"], correct: 1 },
  { id: 405, deck: "prog", sub: "Python pour la finance", q: "Quelle est la différence entre .loc et .iloc dans pandas ?", a: ".loc sélectionne les données par label (nom d'index ou de colonne), tandis que .iloc sélectionne par position numérique entière.", options: ["Ce sont deux méthodes strictement identiques", ".loc sélectionne par label, .iloc sélectionne par position numérique", ".iloc sélectionne par label, .loc par position numérique", ".loc ne fonctionne que sur les colonnes, .iloc que sur les lignes"], correct: 1 },
  { id: 406, deck: "prog", sub: "Python pour la finance", q: "Qu'est-ce qu'un décorateur en Python ?", a: "Une fonction qui modifie ou étend le comportement d'une autre fonction, sans avoir à modifier directement le code source de cette dernière.", options: ["Une fonction qui formate uniquement l'affichage du code", "Une fonction qui modifie ou étend le comportement d'une autre fonction", "Un type de commentaire spécial en Python", "Un synonyme exact d'une classe abstraite"], correct: 1 },
  { id: 407, deck: "prog", sub: "Python pour la finance", q: "Qu'est-ce que le GIL (Global Interpreter Lock) en Python ?", a: "Un verrou interne empêchant l'exécution simultanée de plusieurs threads Python natifs, ce qui limite le parallélisme réel obtenu via le multithreading classique.", options: ["Un outil de débogage intégré à Python", "Un verrou empêchant l'exécution simultanée de plusieurs threads Python natifs", "Une bibliothèque de calcul parallèle standard", "Un synonyme exact du garbage collector"], correct: 1 },
  { id: 408, deck: "prog", sub: "Python pour la finance", q: "Comment gère-t-on généralement les valeurs manquantes (NaN) dans un DataFrame pandas ?", a: "Avec dropna() pour supprimer les lignes/colonnes concernées, ou fillna()/interpolate() pour les remplacer par une valeur ou une estimation.", options: ["Elles sont automatiquement supprimées par Python sans intervention", "Avec dropna() pour supprimer, ou fillna()/interpolate() pour remplacer", "Elles provoquent systématiquement une erreur bloquante", "Uniquement en réécrivant manuellement chaque valeur une par une"], correct: 1 },
  { id: 409, deck: "prog", sub: "Python pour la finance", q: "Qu'est-ce qu'une compréhension de liste (list comprehension) en Python ?", a: "Une syntaxe concise permettant de créer une liste en une seule ligne, à partir d'une itération et d'une condition optionnelle.", options: ["Une méthode de compression de fichiers", "Une syntaxe concise pour créer une liste en une ligne, avec itération et condition", "Un synonyme exact d'un dictionnaire Python", "Une fonction intégrée de tri des listes"], correct: 1 },
  { id: 410, deck: "prog", sub: "Python pour la finance", q: "Pourquoi utiliser le multiprocessing en Python malgré l'existence du GIL ?", a: "Le multiprocessing crée des processus séparés, chacun avec son propre interpréteur Python, ce qui contourne le GIL et permet une réelle parallélisation des calculs intensifs en CPU.", options: ["Le multiprocessing ne fonctionne pas en présence du GIL", "Il crée des processus séparés avec leur propre interpréteur, contournant le GIL", "Il remplace totalement le besoin de threads en Python", "Il ne sert qu'à paralléliser des opérations d'entrée-sortie"], correct: 1 },
  { id: 411, deck: "prog", sub: "Python pour la finance", q: "Qu'est-ce qu'une fonction lambda en Python ?", a: "Une fonction anonyme définie en une seule ligne, souvent utilisée pour de courtes opérations passées directement en argument d'une autre fonction.", options: ["Une fonction obligatoirement récursive", "Une fonction anonyme définie en une seule ligne", "Un synonyme exact d'un décorateur", "Une fonction qui ne peut retourner que des booléens"], correct: 1 },
  { id: 412, deck: "prog", sub: "Python pour la finance", q: "À quoi sert typiquement le module scipy.optimize en finance ?", a: "À résoudre des problèmes d'optimisation numérique, comme la calibration de modèles de pricing ou l'optimisation de portefeuille selon Markowitz.", options: ["À uniquement tracer des graphiques financiers", "À résoudre des problèmes d'optimisation, comme la calibration de modèles ou l'optimisation de portefeuille", "À gérer les connexions aux bases de données", "À exécuter des ordres de trading en temps réel"], correct: 1 },
  { id: 413, deck: "prog", sub: "Python pour la finance", q: "Que permet une opération groupby en pandas ?", a: "Elle regroupe les données selon une ou plusieurs clés (colonnes), permettant ensuite d'appliquer des fonctions d'agrégation (somme, moyenne...) par groupe.", options: ["Elle trie simplement les données par ordre alphabétique", "Elle regroupe les données selon une ou plusieurs clés pour appliquer des agrégations par groupe", "Elle fusionne deux DataFrames différents", "Elle supprime automatiquement les doublons"], correct: 1 },
  { id: 414, deck: "prog", sub: "Python pour la finance", q: "Que fait la méthode resample() sur une série temporelle pandas ?", a: "Elle rééchantillonne la série vers une fréquence temporelle différente (ex. de données journalières vers mensuelles), en appliquant une fonction d'agrégation.", options: ["Elle supprime les valeurs aberrantes de la série", "Elle rééchantillonne la série vers une fréquence temporelle différente", "Elle inverse l'ordre chronologique de la série", "Elle calcule uniquement la moyenne globale de la série"], correct: 1 },
  { id: 415, deck: "prog", sub: "Python pour la finance", q: "À quoi sert un environnement virtuel Python (venv) ?", a: "À isoler les dépendances spécifiques à un projet, évitant les conflits de versions avec d'autres projets ou avec l'installation Python globale du système.", options: ["À accélérer l'exécution du code Python", "À isoler les dépendances d'un projet pour éviter les conflits de versions", "À chiffrer le code source d'un projet", "À exécuter du code Python dans un navigateur web"], correct: 1 },
  { id: 416, deck: "prog", sub: "Structures de données & algorithmes", q: "Quelle est la complexité temporelle moyenne d'une recherche dans une table de hachage (hash table) ?", a: "O(1) en moyenne, car l'accès à une valeur se fait directement via sa clé hachée, sans avoir à parcourir l'ensemble de la structure.", options: ["O(n)", "O(1) en moyenne", "O(log n)", "O(n²)"], correct: 1 },
  { id: 417, deck: "prog", sub: "Structures de données & algorithmes", q: "Quelle est la complexité temporelle moyenne du tri rapide (quicksort) ?", a: "O(n log n) en moyenne, bien que son pire cas théorique soit O(n²) pour des données déjà triées avec un mauvais choix de pivot.", options: ["O(n)", "O(n log n) en moyenne", "O(log n)", "O(n²) systématiquement"], correct: 1 },
  { id: 418, deck: "prog", sub: "Structures de données & algorithmes", q: "Qu'est-ce qu'une pile (stack) et son principe LIFO ?", a: "Une structure de données où le dernier élément ajouté est le premier retiré (Last In, First Out), comme une pile d'assiettes.", options: ["Une structure où le premier élément ajouté est le premier retiré", "Une structure où le dernier élément ajouté est le premier retiré (LIFO)", "Une structure sans ordre de retrait défini", "Un synonyme exact d'une table de hachage"], correct: 1 },
  { id: 419, deck: "prog", sub: "Structures de données & algorithmes", q: "Qu'est-ce qu'une file (queue) et son principe FIFO ?", a: "Une structure de données où le premier élément ajouté est le premier retiré (First In, First Out), comme une file d'attente.", options: ["Une structure où le dernier élément ajouté est le premier retiré", "Une structure où le premier élément ajouté est le premier retiré (FIFO)", "Un synonyme exact d'une pile (stack)", "Une structure réservée uniquement aux nombres entiers"], correct: 1 },
  { id: 420, deck: "prog", sub: "Structures de données & algorithmes", q: "Qu'est-ce qu'un arbre binaire de recherche (BST) ?", a: "Une structure arborescente où chaque nœud possède au plus deux enfants, avec toutes les valeurs du sous-arbre gauche inférieures au nœud et celles de droite supérieures.", options: ["Un arbre où chaque nœud a exactement trois enfants", "Une structure arborescente où les valeurs de gauche sont inférieures et celles de droite supérieures au nœud", "Un synonyme exact d'une liste chaînée", "Une structure ne pouvant contenir que des valeurs entières positives"], correct: 1 },
  { id: 421, deck: "prog", sub: "Structures de données & algorithmes", q: "Quelle est la complexité de recherche dans un arbre binaire de recherche équilibré ?", a: "O(log n), car à chaque niveau de l'arbre, l'espace de recherche est divisé approximativement par deux.", options: ["O(n)", "O(log n)", "O(1)", "O(n log n)"], correct: 1 },
  { id: 422, deck: "prog", sub: "Structures de données & algorithmes", q: "Quelle est la complexité de la recherche dichotomique (binary search) sur un tableau trié ?", a: "O(log n), car l'algorithme divise l'espace de recherche par deux à chaque itération.", options: ["O(n)", "O(log n)", "O(n²)", "O(1)"], correct: 1 },
  { id: 423, deck: "prog", sub: "Structures de données & algorithmes", q: "Qu'est-ce qu'une table de hachage (hash table) ?", a: "Une structure de données associant des clés à des valeurs via une fonction de hachage, permettant un accès quasi instantané en moyenne.", options: ["Une structure triée conservant l'ordre d'insertion strict", "Une structure associant des clés à des valeurs via une fonction de hachage", "Un synonyme exact d'un arbre binaire de recherche", "Une structure réservée exclusivement aux chaînes de caractères"], correct: 1 },
  { id: 424, deck: "prog", sub: "Structures de données & algorithmes", q: "Qu'est-ce que la programmation dynamique en algorithmique ?", a: "Une technique résolvant un problème complexe en le décomposant en sous-problèmes plus simples, dont les résultats sont mémorisés pour éviter de les recalculer plusieurs fois.", options: ["Une technique de génération de code dynamique à l'exécution", "Une technique décomposant un problème en sous-problèmes avec mémorisation des résultats", "Un synonyme exact de la récursivité simple", "Une méthode réservée exclusivement au tri de données"], correct: 1 },
  { id: 425, deck: "prog", sub: "Structures de données & algorithmes", q: "Qu'est-ce qu'un algorithme glouton (greedy) ?", a: "Un algorithme qui fait, à chaque étape, le choix localement optimal sans jamais revenir en arrière, sans garantie d'obtenir la solution globalement optimale.", options: ["Un algorithme qui teste systématiquement toutes les solutions possibles", "Un algorithme faisant à chaque étape le choix localement optimal, sans revenir en arrière", "Un synonyme exact de la programmation dynamique", "Un algorithme garantissant toujours la solution optimale globale"], correct: 1 },
  { id: 426, deck: "prog", sub: "Structures de données & algorithmes", q: "Quelle est la complexité du tri fusion (merge sort), dans le pire cas comme en moyenne ?", a: "O(n log n) dans tous les cas, y compris le pire cas, contrairement au quicksort dont le pire cas peut atteindre O(n²).", options: ["O(n) dans tous les cas", "O(n log n) dans tous les cas, y compris le pire cas", "O(n²) dans le meilleur des cas seulement", "O(log n) dans tous les cas"], correct: 1 },
  { id: 427, deck: "prog", sub: "Structures de données & algorithmes", q: "Quel est l'avantage principal d'une liste chaînée (linked list) par rapport à un tableau classique ?", a: "Elle permet une insertion et une suppression rapides (O(1) à une position connue), au prix d'un accès séquentiel plus lent qu'un tableau pour atteindre un élément donné.", options: ["Elle offre toujours un accès plus rapide à un élément donné qu'un tableau", "Elle permet une insertion/suppression rapide, mais un accès séquentiel plus lent", "Elle consomme systématiquement moins de mémoire qu'un tableau", "Elle ne peut contenir que des éléments de même type"], correct: 1 },
  { id: 428, deck: "prog", sub: "Structures de données & algorithmes", q: "Qu'est-ce que la récursivité en programmation ?", a: "Une technique où une fonction s'appelle elle-même pour résoudre un problème en le décomposant en sous-problèmes plus petits de nature identique.", options: ["Une technique interdisant tout appel de fonction imbriqué", "Une technique où une fonction s'appelle elle-même pour résoudre des sous-problèmes de même nature", "Un synonyme exact d'une boucle for classique", "Une méthode réservée exclusivement au tri de tableaux"], correct: 1 },
  { id: 429, deck: "prog", sub: "Structures de données & algorithmes", q: "À quoi sert principalement un tas binaire (heap) ?", a: "À accéder rapidement (en O(1)) au minimum ou au maximum d'un ensemble de valeurs, ce qui en fait la structure de base des files de priorité.", options: ["À trier des données par ordre alphabétique uniquement", "À accéder rapidement au minimum ou maximum, base des files de priorité", "À stocker des données sous forme de graphe orienté", "À remplacer systématiquement les tables de hachage"], correct: 1 },
  { id: 430, deck: "prog", sub: "Structures de données & algorithmes", q: "Que décrit la notation Big O en algorithmique ?", a: "Elle décrit la complexité asymptotique d'un algorithme (en temps ou en mémoire) en fonction de la taille de l'entrée, généralement dans le pire cas.", options: ["Le nombre exact de lignes de code d'un algorithme", "La complexité asymptotique d'un algorithme en fonction de la taille de l'entrée", "Le langage de programmation utilisé pour l'implémenter", "Le temps d'exécution exact mesuré en secondes"], correct: 1 },
  { id: 431, deck: "prog", sub: "SQL & bases de données", q: "Que fait une clause SQL GROUP BY ?", a: "Elle regroupe les lignes partageant une même valeur dans une ou plusieurs colonnes, afin d'y appliquer des fonctions d'agrégation comme SUM, COUNT ou AVG.", options: ["Elle trie les résultats par ordre croissant uniquement", "Elle regroupe les lignes selon une ou plusieurs colonnes pour appliquer des agrégations", "Elle supprime automatiquement les doublons de la table", "Elle filtre les lignes avant toute agrégation"], correct: 1 },
  { id: 432, deck: "prog", sub: "SQL & bases de données", q: "Quelle est la différence entre un INNER JOIN et un LEFT JOIN en SQL ?", a: "L'INNER JOIN ne conserve que les lignes ayant une correspondance dans les deux tables, tandis que le LEFT JOIN conserve toutes les lignes de la table de gauche, même sans correspondance.", options: ["Ce sont deux syntaxes strictement équivalentes", "L'INNER JOIN garde les correspondances des deux tables, le LEFT JOIN garde toute la table de gauche", "Le LEFT JOIN ne garde que les correspondances des deux tables", "L'INNER JOIN garde systématiquement plus de lignes que le LEFT JOIN"], correct: 1 },
  { id: 433, deck: "prog", sub: "SQL & bases de données", q: "Qu'est-ce qu'une clé primaire (primary key) dans une table SQL ?", a: "Une colonne, ou un ensemble de colonnes, permettant d'identifier de façon unique chaque ligne d'une table.", options: ["Une colonne pouvant contenir des valeurs dupliquées librement", "Une colonne identifiant de façon unique chaque ligne de la table", "Un synonyme exact d'une clé étrangère", "Une colonne obligatoirement de type texte"], correct: 1 },
  { id: 434, deck: "prog", sub: "SQL & bases de données", q: "Qu'est-ce qu'une clé étrangère (foreign key) ?", a: "Une colonne référençant la clé primaire d'une autre table, garantissant l'intégrité référentielle entre les deux tables liées.", options: ["Une colonne identifiant de façon unique chaque ligne de sa propre table", "Une colonne référençant la clé primaire d'une autre table pour garantir l'intégrité référentielle", "Un synonyme exact d'un index de base de données", "Une colonne qui ne peut jamais contenir de valeur nulle"], correct: 1 },
  { id: 435, deck: "prog", sub: "SQL & bases de données", q: "À quoi sert une fonction de fenêtrage (window function) SQL comme ROW_NUMBER() OVER(...) ?", a: "Elle effectue un calcul sur un ensemble de lignes liées à la ligne courante (une 'fenêtre'), sans regrouper physiquement les résultats comme le ferait un GROUP BY classique.", options: ["Elle regroupe systématiquement les résultats comme un GROUP BY", "Elle effectue un calcul sur une fenêtre de lignes liées à la ligne courante, sans les regrouper", "Elle sert uniquement à trier les résultats d'une requête", "Elle ne peut être utilisée qu'avec des colonnes numériques"], correct: 1 },
  { id: 436, deck: "prog", sub: "SQL & bases de données", q: "À quoi sert un index dans une base de données ?", a: "À accélérer significativement la recherche de données dans une table, au prix d'un coût de maintenance supplémentaire lors des opérations d'écriture (insertion, mise à jour).", options: ["À stocker une copie complète de la table pour la sécurité", "À accélérer la recherche de données, avec un coût supplémentaire lors des écritures", "À garantir automatiquement l'unicité de toutes les colonnes", "À chiffrer les données sensibles de la table"], correct: 1 },
  { id: 437, deck: "prog", sub: "SQL & bases de données", q: "Que garantissent les propriétés ACID d'une transaction en base de données ?", a: "Atomicité, Cohérence, Isolation et Durabilité — un ensemble de garanties essentielles pour assurer la fiabilité des transactions, même en cas de panne ou d'accès concurrents.", options: ["Uniquement la vitesse d'exécution des requêtes", "Atomicité, Cohérence, Isolation, Durabilité", "L'absence totale d'index dans la base de données", "La compression automatique des données stockées"], correct: 1 },
  { id: 438, deck: "prog", sub: "SQL & bases de données", q: "Quelle est la différence entre les clauses WHERE et HAVING en SQL ?", a: "WHERE filtre les lignes individuelles avant toute agrégation, tandis que HAVING filtre les groupes résultants après application d'un GROUP BY.", options: ["Ce sont deux clauses strictement équivalentes en SQL", "WHERE filtre avant l'agrégation, HAVING filtre les groupes après GROUP BY", "HAVING filtre avant l'agrégation, WHERE filtre après GROUP BY", "WHERE ne peut être utilisée qu'avec des colonnes numériques"], correct: 1 },
  { id: 439, deck: "prog", sub: "SQL & bases de données", q: "Quelle est la principale différence entre une base de données relationnelle et une base NoSQL ?", a: "La relationnelle organise les données en tables structurées avec des relations définies par des clés, tandis que la NoSQL propose des modèles plus flexibles (documents, clé-valeur, graphes), souvent adaptés à de gros volumes non structurés.", options: ["Il n'existe aucune différence structurelle entre les deux", "La relationnelle utilise des tables structurées, la NoSQL des modèles plus flexibles", "La NoSQL utilise toujours exclusivement des tables SQL classiques", "La relationnelle ne peut jamais gérer de grands volumes de données"], correct: 1 },
  { id: 440, deck: "prog", sub: "SQL & bases de données", q: "Quelle est la différence entre UNION et UNION ALL en SQL ?", a: "UNION combine les résultats de deux requêtes en supprimant les doublons, tandis que UNION ALL conserve tous les doublons, ce qui le rend généralement plus rapide.", options: ["Ce sont deux clauses strictement identiques en SQL", "UNION supprime les doublons, UNION ALL les conserve", "UNION ALL supprime les doublons, UNION les conserve", "UNION ne fonctionne que sur des tables de même nom"], correct: 1 },
  { id: 441, deck: "prog", sub: "SQL & bases de données", q: "Qu'est-ce qu'une sous-requête (subquery) en SQL ?", a: "Une requête imbriquée à l'intérieur d'une autre requête SQL, souvent utilisée au sein d'une clause WHERE, FROM ou SELECT.", options: ["Une requête exécutée obligatoirement avant toutes les autres", "Une requête imbriquée à l'intérieur d'une autre requête SQL", "Un synonyme exact d'une jointure (JOIN)", "Une requête qui ne peut jamais retourner de valeur unique"], correct: 1 },
  { id: 442, deck: "prog", sub: "SQL & bases de données", q: "Qu'est-ce que la normalisation d'une base de données relationnelle ?", a: "Un processus organisant les tables selon des règles précises (formes normales) afin de réduire la redondance des données et d'améliorer leur intégrité.", options: ["Un processus qui duplique systématiquement les données pour la sécurité", "Un processus réduisant la redondance des données et améliorant leur intégrité", "Un synonyme exact de l'indexation d'une table", "Un processus consistant à supprimer toutes les clés étrangères"], correct: 1 },
  { id: 443, deck: "prog", sub: "Complexité & performance", q: "Quelle est la différence pratique entre un algorithme en O(n) et un en O(n²) sur un grand jeu de données ?", a: "O(n) croît linéairement avec la taille des données, tandis que O(n²) croît de façon quadratique, devenant rapidement impraticable lorsque n devient grand (ex. millions de lignes).", options: ["Il n'existe aucune différence significative en pratique", "O(n) croît linéairement, O(n²) croît quadratiquement et devient vite impraticable", "O(n²) est toujours plus rapide que O(n) en pratique", "Les deux complexités sont équivalentes pour de grands jeux de données"], correct: 1 },
  { id: 444, deck: "prog", sub: "Complexité & performance", q: "Pourquoi préférer une opération vectorisée NumPy à une boucle for en Python pour des calculs financiers intensifs ?", a: "Parce qu'elle exploite du code C compilé sous-jacent, ce qui la rend bien plus rapide que l'interprétation ligne par ligne d'une boucle Python classique.", options: ["Une boucle for est toujours plus rapide qu'une opération vectorisée", "Elle exploite du code C compilé, bien plus rapide qu'une boucle Python interprétée", "Il n'existe aucune différence de performance mesurable entre les deux", "La vectorisation ne fonctionne que sur des données textuelles"], correct: 1 },
  { id: 445, deck: "prog", sub: "Complexité & performance", q: "À quoi sert le profiling de code ?", a: "À mesurer précisément le temps d'exécution ou la consommation mémoire des différentes parties d'un programme, afin d'identifier les goulots d'étranglement à optimiser en priorité.", options: ["À corriger automatiquement les erreurs de syntaxe du code", "À mesurer le temps d'exécution ou la mémoire consommée pour identifier les goulots d'étranglement", "À générer automatiquement la documentation du code", "À compresser le code source pour réduire sa taille"], correct: 1 },
  { id: 446, deck: "prog", sub: "Complexité & performance", q: "Pourquoi la mise en cache (caching) est-elle utile en finance quantitative ?", a: "Elle permet de stocker temporairement le résultat de calculs coûteux (comme un pricing complexe) pour éviter de le recalculer inutilement lors d'appels répétés avec les mêmes paramètres.", options: ["Elle sert uniquement à sécuriser les données sensibles", "Elle stocke temporairement des résultats coûteux pour éviter de les recalculer inutilement", "Elle remplace totalement le besoin de bases de données", "Elle ralentit systématiquement l'exécution du programme"], correct: 1 },
  { id: 447, deck: "prog", sub: "Complexité & performance", q: "Qu'est-ce que le calcul parallèle (parallel computing) ?", a: "L'exécution simultanée de plusieurs calculs indépendants sur plusieurs cœurs de processeur ou plusieurs machines, afin d'accélérer un traitement global.", options: ["L'exécution séquentielle de calculs sur un seul cœur de processeur", "L'exécution simultanée de calculs indépendants sur plusieurs cœurs ou machines", "Un synonyme exact de la programmation asynchrone", "Une technique réservée exclusivement au traitement d'images"], correct: 1 },
  { id: 448, deck: "prog", sub: "Complexité & performance", q: "Pourquoi utilise-t-on des outils comme Cython ou Numba avec Python en finance quantitative ?", a: "Ils permettent de compiler du code Python (ou proche) pour obtenir des performances proches du C, cruciales pour des calculs intensifs comme le pricing par simulation Monte-Carlo.", options: ["Ils servent uniquement à améliorer la lisibilité du code Python", "Ils permettent de compiler le code pour des performances proches du C, utiles pour des calculs intensifs", "Ils remplacent totalement le besoin d'utiliser NumPy", "Ils ne fonctionnent que sur des données textuelles"], correct: 1 },
  { id: 449, deck: "prog", sub: "Complexité & performance", q: "Qu'est-ce que la latence dans un système de trading ?", a: "Le délai entre l'émission d'un ordre ou la réception d'une donnée de marché et son traitement effectif par le système, un enjeu critique notamment en trading haute fréquence.", options: ["Le nombre total de transactions exécutées par jour", "Le délai entre l'émission d'un ordre/donnée et son traitement effectif", "Un synonyme exact du bid-ask spread", "Le coût moyen d'une transaction exécutée"], correct: 1 },
  { id: 450, deck: "prog", sub: "Complexité & performance", q: "Qu'est-ce qu'une architecture orientée événements (event-driven) en trading algorithmique ?", a: "Une architecture où le système réagit directement à des événements (arrivée d'un nouveau prix, exécution d'un ordre) plutôt que de vérifier en boucle et en continu l'état du marché.", options: ["Une architecture qui vérifie en boucle continue l'état du marché", "Une architecture où le système réagit directement à des événements survenant", "Un synonyme exact d'une architecture purement séquentielle", "Une architecture réservée exclusivement aux bases de données"], correct: 1 },
  { id: 451, deck: "prog", sub: "Complexité & performance", q: "Que mesure la complexité en espace (space complexity) d'un algorithme ?", a: "La quantité de mémoire supplémentaire requise par l'algorithme en fonction de la taille de son entrée, en complément de sa complexité temporelle.", options: ["Le temps d'exécution total de l'algorithme", "La quantité de mémoire supplémentaire requise en fonction de la taille de l'entrée", "Le nombre de lignes de code nécessaires à son implémentation", "Un synonyme exact de la complexité temporelle"], correct: 1 },
  { id: 452, deck: "prog", sub: "Complexité & performance", q: "Pourquoi privilégier un traitement 'in-place' pour de grands jeux de données financières ?", a: "Il évite de dupliquer inutilement les données en mémoire, réduisant significativement la consommation mémoire lors du traitement de très larges datasets.", options: ["Il rend systématiquement le code plus lisible, sans impact sur la mémoire", "Il évite de dupliquer les données, réduisant la consommation mémoire", "Il accélère toujours l'exécution indépendamment de la mémoire disponible", "Il n'a aucun impact réel sur la performance du programme"], correct: 1 },
  { id: 453, deck: "prog", sub: "Outils & bonnes pratiques", q: "À quoi sert Git dans le développement d'un système de trading ou de recherche quantitative ?", a: "À suivre l'historique des modifications du code, permettre le travail collaboratif entre plusieurs développeurs, et pouvoir revenir facilement à une version antérieure en cas de problème.", options: ["Uniquement à exécuter automatiquement des tests unitaires", "À suivre l'historique des modifications, permettre le travail collaboratif et revenir en arrière si besoin", "À accélérer l'exécution du code en production", "À remplacer totalement le besoin de documentation du code"], correct: 1 },
  { id: 454, deck: "prog", sub: "Outils & bonnes pratiques", q: "Qu'est-ce qu'un test unitaire (unit test) et pourquoi est-il crucial en finance quantitative ?", a: "Un test vérifiant qu'une petite unité de code (une fonction précise) se comporte comme attendu ; il est essentiel pour garantir la fiabilité d'un modèle de pricing ou de gestion des risques avant sa mise en production.", options: ["Un test vérifiant l'ensemble du système dans son intégralité", "Un test vérifiant qu'une petite unité de code se comporte comme attendu", "Un synonyme exact du profiling de performance", "Un test réservé exclusivement aux interfaces utilisateur"], correct: 1 },
  { id: 455, deck: "prog", sub: "Outils & bonnes pratiques", q: "Qu'est-ce que l'intégration continue (CI/CD) ?", a: "Un processus automatisant l'exécution des tests et le déploiement du code à chaque modification, permettant de détecter rapidement d'éventuelles régressions introduites.", options: ["Une méthode de rédaction manuelle de la documentation du code", "Un processus automatisant les tests et le déploiement à chaque modification du code", "Un synonyme exact d'un environnement virtuel Python", "Une technique réservée exclusivement au développement web"], correct: 1 },
  { id: 456, deck: "prog", sub: "Outils & bonnes pratiques", q: "Qu'est-ce qu'une API REST et à quoi peut-elle servir en finance ?", a: "Une interface permettant à des applications de communiquer entre elles via des requêtes HTTP standardisées, par exemple pour récupérer des données de marché ou transmettre des ordres à un broker.", options: ["Un langage de programmation spécifique à la finance", "Une interface permettant la communication entre applications via des requêtes HTTP standardisées", "Un synonyme exact d'une base de données relationnelle", "Un protocole réservé exclusivement aux transactions bancaires"], correct: 1 },
  { id: 457, deck: "prog", sub: "Outils & bonnes pratiques", q: "Qu'est-ce que le versionnement sémantique (semantic versioning) d'un logiciel ?", a: "Une convention de numérotation des versions (majeur.mineur.patch) indiquant la nature et l'ampleur des changements apportés à chaque nouvelle version.", options: ["Une méthode de chiffrement du code source", "Une convention de numérotation des versions indiquant la nature des changements", "Un synonyme exact de l'intégration continue", "Une technique de compression des fichiers de code"], correct: 1 },
  { id: 458, deck: "prog", sub: "Outils & bonnes pratiques", q: "Pourquoi la reproductibilité est-elle essentielle en recherche quantitative ?", a: "Pour garantir qu'un résultat de backtest ou d'un modèle puisse être retrouvé exactement à l'identique, notamment via la fixation des seeds aléatoires et une gestion rigoureuse des versions de code et de données.", options: ["Elle n'a qu'un intérêt esthétique sans impact réel sur les résultats", "Elle garantit qu'un résultat puisse être retrouvé exactement à l'identique", "Elle concerne uniquement la présentation visuelle des graphiques", "Elle n'est utile que pour le code destiné à la production"], correct: 1 },
  { id: 459, deck: "prog", sub: "Outils & bonnes pratiques", q: "Qu'est-ce qu'un pipeline de données (data pipeline) ?", a: "Un enchaînement automatisé d'étapes de collecte, nettoyage, transformation et stockage des données, essentiel pour alimenter de façon fiable des modèles quantitatifs.", options: ["Un synonyme exact d'une base de données relationnelle", "Un enchaînement automatisé de collecte, nettoyage, transformation et stockage des données", "Une méthode de visualisation de données financières uniquement", "Un outil réservé exclusivement à l'exécution d'ordres de trading"], correct: 1 },
  { id: 460, deck: "prog", sub: "Outils & bonnes pratiques", q: "Qu'est-ce que le 'code review' et pourquoi est-il important en finance quantitative ?", a: "La relecture du code par un ou plusieurs pairs avant son intégration, permettant de détecter des erreurs potentielles, d'améliorer la qualité du code et de partager la connaissance au sein d'une équipe.", options: ["Une vérification purement automatique sans intervention humaine", "La relecture du code par des pairs avant intégration, pour détecter des erreurs et partager la connaissance", "Un synonyme exact des tests unitaires automatisés", "Une pratique réservée exclusivement aux grandes équipes de plus de 50 développeurs"], correct: 1 },

  { id: 513, deck: "brainteasers", sub: "Calcul mental", q: "Combien font 17 + 18 + 19 + 20 + 21 ?", a: "95. Astuce : c'est 5 nombres consécutifs autour de 19 (la moyenne), donc 19 × 5 = 95.", options: ["85", "90", "95", "100"], correct: 2 },
  { id: 514, deck: "brainteasers", sub: "Calcul mental", q: "Combien font 12 × 15 ?", a: "180, car 12 × 15 = 12 × 10 + 12 × 5 = 120 + 60 = 180.", options: ["160", "170", "180", "190"], correct: 2 },
  { id: 515, deck: "brainteasers", sub: "Calcul mental", q: "Combien font 2,5 × 4 ?", a: "10, car 2,5 × 4 = 10 (2,5 est un quart de 10).", options: ["8", "10", "12", "9"], correct: 1 },
  { id: 516, deck: "brainteasers", sub: "Probabilités & logique", q: "Deux personnes lancent chacune une pièce équitable. Quelle est la probabilité qu'elles obtiennent le même résultat ?", a: "1/2, car il y a 2 issues favorables (pile-pile, face-face) sur 4 combinaisons possibles au total.", options: ["1/4", "1/2", "3/4", "1"], correct: 1 },
  { id: 517, deck: "brainteasers", sub: "Probabilités & logique", q: "Combien de façons existe-t-il de choisir 2 éléments parmi 5, sans tenir compte de l'ordre ?", a: "10, car C(5,2) = 5!/(2!×3!) = 10.", options: ["5", "10", "20", "25"], correct: 1 },
  { id: 518, deck: "brainteasers", sub: "Probabilités & logique", q: "Combien de façons distinctes existe-t-il d'arranger les lettres du mot 'AAB' ?", a: "3, car il y a 3!/2! = 3 arrangements distincts en tenant compte de la répétition du A.", options: ["2", "3", "6", "1"], correct: 1 },
  { id: 519, deck: "brainteasers", sub: "Probabilités & logique", q: "Quelle est la probabilité de tirer un roi dans un jeu de 52 cartes ?", a: "1/13, car il y a 4 rois sur 52 cartes, soit 4/52 = 1/13.", options: ["1/52", "1/13", "1/4", "4/13"], correct: 1 },
  { id: 520, deck: "brainteasers", sub: "Probabilités & logique", q: "On lance deux dés à 6 faces. Quelle est la probabilité que le produit des deux résultats soit pair ?", a: "3/4, car le produit n'est impair que si les deux dés tombent sur un nombre impair (probabilité 1/4), donc pair dans les 3/4 restants.", options: ["1/2", "2/3", "3/4", "5/6"], correct: 2 },
  { id: 521, deck: "brainteasers", sub: "Probabilités & logique", q: "On tire une carte au hasard. Quelle est la probabilité qu'elle soit un cœur ou un roi ?", a: "4/13, par inclusion-exclusion : 13/52 (cœurs) + 4/52 (rois) − 1/52 (le roi de cœur compté deux fois) = 16/52 = 4/13.", options: ["17/52", "16/52", "13/52", "1/4 exactement sans ajustement"], correct: 1 },
  { id: 522, deck: "brainteasers", sub: "Probabilités & logique", q: "Dans un jeu équitable de 'pile ou face, double ou rien' répété indéfiniment, quelle est l'espérance de gain à long terme ?", a: "0, car un jeu parfaitement équitable a par définition une espérance de gain nulle, quel que soit le nombre de répétitions.", options: ["Positive et croissante", "0", "Négative", "Infinie"], correct: 1 },
  { id: 523, deck: "brainteasers", sub: "Probabilités & logique", q: "Combien de façons existe-t-il de répartir 10 personnes en deux groupes de 5 (sans distinguer l'ordre des groupes eux-mêmes) ?", a: "126, car C(10,5)/2 = 252/2 = 126 (on divise par 2 car les deux groupes de 5 ne sont pas ordonnés entre eux).", options: ["252", "126", "100", "50"], correct: 1 },
  { id: 524, deck: "brainteasers", sub: "Probabilités & logique", q: "Un dé pipé donne la face 6 deux fois plus souvent que chacune des 5 autres faces. Quelle est la probabilité d'obtenir un 6 ?", a: "2/7, car en attribuant un poids de 1 aux 5 faces normales et 2 à la face 6, le total des poids est 7, et le 6 en représente 2/7.", options: ["1/6", "1/7", "2/7", "1/3"], correct: 2 },
  { id: 525, deck: "brainteasers", sub: "Probabilités & logique", q: "Deux événements indépendants A (p=0,3) et B (p=0,4). Quelle est la probabilité qu'ils se produisent tous les deux ?", a: "0,12, car pour des événements indépendants, P(A∩B) = P(A) × P(B) = 0,3 × 0,4 = 0,12.", options: ["0,07", "0,1", "0,12", "0,7"], correct: 2 },
  { id: 526, deck: "brainteasers", sub: "Probabilités & logique", q: "Deux événements indépendants A (p=0,3) et B (p=0,4). Quelle est la probabilité qu'au moins un des deux se produise ?", a: "0,58, car P(au moins un) = 1 − P(aucun) = 1 − (0,7 × 0,6) = 1 − 0,42 = 0,58.", options: ["0,42", "0,5", "0,58", "0,7"], correct: 2 },
  { id: 527, deck: "brainteasers", sub: "Probabilités & logique", q: "Selon la loi binomiale, quelle est la probabilité d'obtenir exactement 3 succès sur 5 essais indépendants avec p=0,5 pour chaque essai ?", a: "0,3125, car C(5,3) × 0,5³ × 0,5² = 10 × 0,03125 = 0,3125.", options: ["0,25", "0,3125", "0,5", "0,625"], correct: 1 },
  { id: 528, deck: "brainteasers", sub: "Probabilités & logique", q: "Qu'est-ce que l'indépendance de deux événements A et B en probabilité ?", a: "Deux événements sont indépendants si la probabilité qu'ils se produisent ensemble est égale au produit de leurs probabilités individuelles : P(A∩B) = P(A) × P(B).", options: ["Ils ne peuvent jamais se produire simultanément", "P(A∩B) = P(A) × P(B)", "Ils ont nécessairement la même probabilité", "L'un dépend toujours de l'autre par définition"], correct: 1 },
  { id: 529, deck: "brainteasers", sub: "Probabilités & logique", q: "Que dit le théorème de Bayes, sous sa forme générale ?", a: "P(A|B) = P(B|A) × P(A) / P(B), permettant de calculer une probabilité conditionnelle inversée à partir de probabilités connues.", options: ["P(A|B) = P(A) × P(B)", "P(A|B) = P(B|A) × P(A) / P(B)", "P(A|B) = P(A) / P(B)", "P(A|B) = P(A) + P(B) − P(A∩B)"], correct: 1 },
  { id: 530, deck: "brainteasers", sub: "Probabilités & logique", q: "Un test médical a 99% de sensibilité et 95% de spécificité, pour une maladie touchant 1% de la population. La probabilité d'être réellement malade sachant un test positif est-elle proche de 99% ?", a: "Non, elle est bien plus faible (environ 17%) : à cause de la rareté de la maladie, les faux positifs (5% des 99% de personnes saines) dominent largement les vrais positifs, un résultat classique lié au théorème de Bayes.", options: ["Oui, environ 99%", "Non, environ 17% seulement", "Oui, environ 95%", "Non, environ 50%"], correct: 1 },
  { id: 531, deck: "brainteasers", sub: "Probabilités & logique", q: "Quelle est la probabilité d'obtenir une paire (les deux dés identiques) en lançant deux dés à 6 faces ?", a: "1/6, car il y a 6 combinaisons favorables (1-1, 2-2, ..., 6-6) sur 36 combinaisons possibles au total.", options: ["1/12", "1/6", "1/4", "1/3"], correct: 1 },
  { id: 532, deck: "brainteasers", sub: "Probabilités & logique", q: "Un pari propose de doubler la mise avec une probabilité de 45%, ou de la perdre entièrement sinon. Ce pari est-il favorable en espérance ?", a: "Non, son espérance est négative : pour une mise de 1, l'espérance de gain net est 0,45×1 − 0,55×1 = −0,1, donc défavorable en moyenne.", options: ["Oui, l'espérance est positive", "Non, l'espérance est négative", "Le pari est parfaitement équitable (espérance nulle)", "Impossible à déterminer sans plus d'information"], correct: 1 },
  { id: 533, deck: "brainteasers", sub: "Probabilités & logique", q: "Un jeu fait gagner 1€ sur pile et perdre 1€ sur face, avec une pièce parfaitement équilibrée. Quelle est son espérance de gain ?", a: "0, car le jeu est parfaitement symétrique et équitable : 0,5×1 + 0,5×(−1) = 0.", options: ["+0,5€", "0€", "−0,5€", "+1€"], correct: 1 },
  { id: 534, deck: "brainteasers", sub: "Probabilités & logique", q: "Que signifie que deux événements A et B soient mutuellement exclusifs ?", a: "Qu'ils ne peuvent jamais se produire simultanément, ce qui implique que P(A∩B) = 0.", options: ["Qu'ils sont nécessairement indépendants", "Qu'ils ne peuvent jamais se produire simultanément (P(A∩B)=0)", "Qu'ils ont toujours la même probabilité", "Qu'ils se produisent toujours ensemble"], correct: 1 },
  { id: 535, deck: "brainteasers", sub: "Probabilités & logique", q: "Combien de mains différentes de 5 cartes peut-on tirer d'un jeu de 52 cartes ?", a: "2 598 960, car C(52,5) = 52!/(5!×47!) = 2 598 960.", options: ["Environ 300 000", "Environ 1 million", "2 598 960", "Environ 5 millions"], correct: 2 },
  { id: 536, deck: "brainteasers", sub: "Probabilités & logique", q: "Qu'est-ce que la probabilité conditionnelle P(A|B) ?", a: "La probabilité que l'événement A se produise, sachant que l'événement B s'est déjà produit.", options: ["La probabilité que A et B se produisent tous les deux simultanément", "La probabilité que A se produise sachant que B s'est déjà produit", "La probabilité que ni A ni B ne se produisent", "Un synonyme exact de la probabilité jointe de A et B"], correct: 1 },
  { id: 537, deck: "brainteasers", sub: "Probabilités & logique", q: "Combien de façons existe-t-il d'ordonner totalement 3 objets distincts ?", a: "6, car 3! = 3×2×1 = 6.", options: ["3", "6", "9", "27"], correct: 1 },
  { id: 538, deck: "brainteasers", sub: "Probabilités & logique", q: "On lance deux dés à 6 faces. Quelle est la probabilité que leur somme soit strictement supérieure à 9 ?", a: "1/6, car les sommes possibles supérieures à 9 sont 10, 11 et 12, représentant 6 combinaisons sur 36 (3+2+1).", options: ["1/12", "1/6", "1/4", "1/3"], correct: 1 },
  { id: 539, deck: "brainteasers", sub: "Probabilités & logique", q: "À quoi sert typiquement la loi de Poisson en modélisation probabiliste ?", a: "À modéliser le nombre d'occurrences d'un événement rare sur un intervalle de temps ou d'espace donné, comme le nombre de défauts de crédit dans un portefeuille sur une année.", options: ["À modéliser une distribution parfaitement symétrique de type gaussienne", "À modéliser le nombre d'occurrences d'un événement rare sur un intervalle donné", "À modéliser exclusivement des variables continues bornées", "À modéliser uniquement des variables certaines et déterministes"], correct: 1 },
  { id: 540, deck: "brainteasers", sub: "Probabilités & logique", q: "Qu'est-ce que l'espérance conditionnelle E[X|Y] ?", a: "La valeur moyenne attendue de la variable X, sachant la valeur (ou la réalisation) de la variable Y.", options: ["La variance de X sachant Y", "La valeur moyenne attendue de X, sachant Y", "La probabilité que X soit égal à Y", "Un synonyme exact de la covariance entre X et Y"], correct: 1 },
  { id: 541, deck: "brainteasers", sub: "Probabilités & logique", q: "Qu'est-ce que le paradoxe de Simpson ?", a: "Un phénomène statistique où une tendance apparaît dans plusieurs groupes de données pris séparément, mais s'inverse ou disparaît lorsque ces groupes sont combinés en un seul ensemble.", options: ["Un paradoxe purement lié à la théorie des jeux", "Une tendance présente dans des sous-groupes qui s'inverse une fois les groupes combinés", "Un synonyme exact du paradoxe des anniversaires", "Un paradoxe qui ne s'applique qu'aux séries temporelles financières"], correct: 1 },
  { id: 542, deck: "brainteasers", sub: "Probabilités & logique", q: "Deux tireurs indépendants, A touche sa cible avec une probabilité de 0,7 et B avec 0,6. Quelle est la probabilité qu'au moins l'un des deux touche sa cible ?", a: "0,88, car P(au moins un) = 1 − P(aucun) = 1 − (0,3 × 0,4) = 1 − 0,12 = 0,88.", options: ["0,42", "0,7", "0,82", "0,88"], correct: 3 },
  { id: 543, deck: "brainteasers", sub: "Probabilités & logique", q: "Quelle est la différence entre une variable aléatoire discrète et une variable aléatoire continue ?", a: "La discrète ne peut prendre qu'un nombre fini ou dénombrable de valeurs (ex. résultat d'un dé), tandis que la continue peut prendre une infinité de valeurs sur un intervalle (ex. un rendement financier).", options: ["Ce sont deux termes strictement synonymes", "La discrète prend un nombre fini/dénombrable de valeurs, la continue une infinité sur un intervalle", "La continue ne peut prendre que des valeurs entières", "La discrète ne s'applique jamais aux probabilités financières"], correct: 1 },
  { id: 544, deck: "brainteasers", sub: "Probabilités & logique", q: "Combien de combinaisons de 3 chiffres (de 0 à 9), avec répétition possible, existe-t-il ?", a: "1000, car chaque chiffre a 10 possibilités indépendantes : 10 × 10 × 10 = 1000.", options: ["100", "720", "1000", "10000"], correct: 2 },
  { id: 545, deck: "brainteasers", sub: "Probabilités & logique", q: "Combien de codes PIN à 4 chiffres distincts (de 0 à 9, sans répétition) existe-t-il ?", a: "5040, car 10 × 9 × 8 × 7 = 5040 (arrangement de 4 chiffres parmi 10, sans répétition, avec ordre).", options: ["10000", "5040", "210", "3024"], correct: 1 },
  { id: 546, deck: "brainteasers", sub: "Probabilités & logique", q: "Qu'est-ce que la loi des grands nombres illustre concrètement dans un casino ?", a: "Plus un joueur répète les mises, plus la fréquence de ses gains observés se rapproche de l'espérance théorique du jeu (souvent légèrement négative pour le joueur), assurant au casino un profit stable sur le long terme.", options: ["Elle garantit qu'un joueur finira toujours par gagner à long terme", "Elle explique pourquoi la fréquence de gains observée converge vers l'espérance théorique du jeu", "Elle n'a aucune application pratique dans les jeux de hasard", "Elle s'applique uniquement à un nombre limité de parties"], correct: 1 },
  { id: 547, deck: "brainteasers", sub: "Probabilités & logique", q: "Un dé à 20 faces est lancé deux fois. Quelle est la probabilité d'obtenir deux fois le même résultat ?", a: "1/20, car il y a 20 combinaisons favorables (identiques) sur 400 combinaisons possibles au total (20×20), soit 20/400 = 1/20.", options: ["1/400", "1/20", "1/10", "1/2"], correct: 1 },
  { id: 548, deck: "brainteasers", sub: "Probabilités & logique", q: "Combien de façons existe-t-il de tirer 2 cartes de même couleur (rouge ou noire) dans un jeu de 52 cartes, sans remise ?", a: "Environ 49%, car P = 2 × (26/52 × 25/51) ≈ 0,49 (deux fois la probabilité de tirer deux cartes rouges, par symétrie avec le noir).", options: ["Environ 25%", "Environ 49%", "Environ 65%", "Environ 75%"], correct: 1 },
  { id: 549, deck: "brainteasers", sub: "Probabilités & logique", q: "Qu'est-ce que le principe d'inclusion-exclusion en probabilités, pour deux événements A et B ?", a: "P(A∪B) = P(A) + P(B) − P(A∩B), permettant de calculer la probabilité qu'au moins un des deux événements se produise sans compter deux fois leur intersection commune.", options: ["P(A∪B) = P(A) × P(B)", "P(A∪B) = P(A) + P(B) − P(A∩B)", "P(A∪B) = P(A) − P(B)", "P(A∪B) = P(A) + P(B) toujours, sans ajustement"], correct: 1 },
  { id: 550, deck: "brainteasers", sub: "Probabilités & logique", q: "Dans un groupe de 10 personnes, combien de poignées de main différentes seraient échangées si chacune serrait la main de toutes les autres exactement une fois ?", a: "45, car C(10,2) = 10×9/2 = 45.", options: ["20", "45", "90", "100"], correct: 1 },
  { id: 551, deck: "brainteasers", sub: "Probabilités & logique", q: "Une pièce est lancée jusqu'à l'obtention du premier pile. Quelle est la probabilité que cela prenne exactement 3 lancers ?", a: "1/8, car il faut deux faces suivies d'un pile : 0,5 × 0,5 × 0,5 = 0,125 = 1/8.", options: ["1/2", "1/4", "1/8", "1/16"], correct: 2 },
  { id: 552, deck: "brainteasers", sub: "Probabilités & logique", q: "Qu'est-ce qu'un processus de Markov, intuitivement ?", a: "Un processus stochastique où l'évolution future ne dépend que de l'état présent, et non de la manière dont cet état a été atteint (absence de mémoire du passé).", options: ["Un processus dont l'évolution dépend de tout l'historique passé", "Un processus dont l'évolution future ne dépend que de l'état présent", "Un processus totalement déterministe sans aléa", "Un synonyme exact d'un processus stationnaire"], correct: 1 },
  { id: 553, deck: "brainteasers", sub: "Probabilités & logique", q: "Dans une classe de 30 élèves, si l'on choisit 2 élèves au hasard, combien de paires distinctes sont possibles ?", a: "435, car C(30,2) = 30×29/2 = 435.", options: ["60", "300", "435", "900"], correct: 2 },
  { id: 554, deck: "brainteasers", sub: "Probabilités & logique", q: "Qu'est-ce que la fonction de répartition (CDF) d'une variable aléatoire ?", a: "La fonction donnant, pour chaque valeur x, la probabilité que la variable aléatoire soit inférieure ou égale à x.", options: ["La probabilité exacte que la variable soit égale à x", "La probabilité que la variable soit inférieure ou égale à x", "La valeur moyenne (espérance) de la variable", "Un synonyme exact de la densité de probabilité"], correct: 1 },
  { id: 555, deck: "brainteasers", sub: "Probabilités & logique", q: "Combien de façons différentes existe-t-il de répartir 4 cadeaux distincts entre 4 personnes différentes, chacune en recevant exactement un ?", a: "24, car il s'agit d'une permutation totale de 4 éléments : 4! = 24.", options: ["4", "16", "24", "256"], correct: 2 },
  { id: 556, deck: "brainteasers", sub: "Estimation (Fermi)", q: "Quel est l'ordre de grandeur du nombre de taxis en circulation à New York ?", a: "De l'ordre de 10 000 à 15 000, un chiffre correspondant approximativement au nombre réel de licences de taxis jaunes ('medallions') dans la ville.", options: ["Environ 500", "Environ 1 000", "Environ 10 000 à 15 000", "Environ 100 000"], correct: 2 },
  { id: 557, deck: "brainteasers", sub: "Estimation (Fermi)", q: "Quel est l'ordre de grandeur du nombre de stations-service en France ?", a: "De l'ordre de 10 000 à 11 000, estimé en croisant le nombre de communes, la densité du réseau routier et le nombre moyen de véhicules par station.", options: ["Environ 1 000", "Environ 10 000 à 11 000", "Environ 50 000", "Environ 100 000"], correct: 1 },

  { id: 578, deck: "brainteasers", sub: "Estimation (Fermi)", q: "Quel est l'ordre de grandeur du temps nécessaire à la lumière du Soleil pour atteindre la Terre ?", a: "Environ 8 minutes, une distance Terre-Soleil d'environ 150 millions de km parcourue à la vitesse de la lumière (~300 000 km/s).", options: ["Environ 8 secondes", "Environ 8 minutes", "Environ 8 heures", "Environ 8 jours"], correct: 1 },

  { id: 580, deck: "brainteasers", sub: "Estimation (Fermi)", q: "Quel est l'ordre de grandeur de la surface totale des terres émergées sur Terre, en km² ?", a: "Environ 150 millions de km², soit environ 29% de la surface totale du globe (environ 510 millions de km²).", options: ["Environ 15 millions de km²", "Environ 150 millions de km²", "Environ 500 millions de km²", "Environ 1,5 milliard de km²"], correct: 1 },

  { id: 582, deck: "brainteasers", sub: "Estimation (Fermi)", q: "Quel est l'ordre de grandeur du nombre de kilomètres parcourus en moyenne par une voiture particulière en France chaque année ?", a: "Environ 12 000 à 13 000 km par an, une moyenne représentative pour un véhicule particulier en France.", options: ["Environ 1 000 km", "Environ 12 000 à 13 000 km", "Environ 50 000 km", "Environ 100 000 km"], correct: 1 },
  { id: 583, deck: "brainteasers", sub: "Estimation (Fermi)", q: "Quel est l'ordre de grandeur du nombre de messages électroniques envoyés chaque jour dans le monde ?", a: "De l'ordre de 300 milliards de messages par jour, tous types d'emails confondus (professionnels et personnels).", options: ["Environ 1 milliard", "Environ 30 milliards", "Environ 300 milliards", "Environ 3 000 milliards"], correct: 2 },
  { id: 584, deck: "brainteasers", sub: "Estimation (Fermi)", q: "Quel est l'ordre de grandeur de la vitesse moyenne de rotation de la Terre à l'équateur (en km/h) ?", a: "Environ 1670 km/h, calculée à partir de la circonférence de la Terre à l'équateur (~40 000 km) divisée par la durée d'une journée (24h).", options: ["Environ 100 km/h", "Environ 500 km/h", "Environ 1670 km/h", "Environ 10 000 km/h"], correct: 2 },
  { id: 585, deck: "brainteasers", sub: "Probabilités & logique", q: "On tire 5 cartes d'un jeu de 52. Quelle est approximativement la probabilité d'obtenir au moins un as ?", a: "Environ 34%, car P(aucun as) = (48/52)×(47/51)×(46/50)×(45/49)×(44/48) ≈ 0,66, donc P(au moins un as) ≈ 1 − 0,66 = 0,34.", options: ["Environ 8%", "Environ 20%", "Environ 34%", "Environ 50%"], correct: 2 },
  { id: 586, deck: "brainteasers", sub: "Probabilités & logique", q: "Une urne contient 4 boules blanches et 6 boules noires. On tire une boule, on la remet, puis on en tire une autre. Quelle est la probabilité de tirer deux boules blanches ?", a: "0,16, car avec remise les tirages sont indépendants : P = (4/10) × (4/10) = 0,16.", options: ["0,12", "0,16", "0,24", "0,4"], correct: 1 },
  { id: 587, deck: "brainteasers", sub: "Probabilités & logique", q: "Combien de façons existe-t-il de former un comité de 3 personnes parmi un groupe de 8, sans distinction de rôle ?", a: "56, car C(8,3) = 8!/(3!×5!) = 56.", options: ["24", "56", "336", "512"], correct: 1 },
  { id: 588, deck: "brainteasers", sub: "Probabilités & logique", q: "Qu'est-ce que la variance d'une variable aléatoire mesure intuitivement ?", a: "La dispersion moyenne des valeurs de la variable autour de son espérance (sa moyenne théorique) ; plus elle est élevée, plus les résultats sont dispersés.", options: ["La valeur la plus probable de la variable", "La dispersion moyenne des valeurs autour de l'espérance", "La probabilité maximale atteignable par la variable", "Un synonyme exact de l'espérance elle-même"], correct: 1 },
  { id: 589, deck: "brainteasers", sub: "Probabilités & logique", q: "On lance une pièce équitable 10 fois. Quelle est la probabilité d'obtenir exactement 5 piles ?", a: "Environ 24,6%, car C(10,5) × 0,5^10 = 252/1024 ≈ 0,246.", options: ["Environ 10%", "Environ 24,6%", "Environ 50%", "Environ 78%"], correct: 1 },
  { id: 590, deck: "brainteasers", sub: "Estimation (Fermi)", q: "Quel est l'ordre de grandeur de la population mondiale actuelle ?", a: "Environ 8 milliards d'habitants, une valeur de référence essentielle pour toute estimation à l'échelle mondiale.", options: ["Environ 2 milliards", "Environ 5 milliards", "Environ 8 milliards", "Environ 15 milliards"], correct: 2 },
  { id: 591, deck: "brainteasers", sub: "Logique & énigmes", q: "Un fermier doit faire traverser une rivière à un loup, une chèvre et un chou, avec une barque ne pouvant transporter que lui et un seul élément à la fois. Le loup mangerait la chèvre et la chèvre mangerait le chou si laissés seuls ensemble. Combien de traversées minimum sont nécessaires ?", a: "7 traversées : la solution classique consiste à emmener d'abord la chèvre, revenir seul, emmener le loup (ou le chou), ramener la chèvre, emmener le chou (ou le loup), revenir seul, puis ramener la chèvre.", options: ["3 traversées", "5 traversées", "7 traversées", "9 traversées"], correct: 2 },
  { id: 592, deck: "brainteasers", sub: "Logique & énigmes", q: "Vous avez 12 boules identiques en apparence, mais une seule a un poids différent (plus lourde ou plus légère, on ne sait pas). Avec une balance à deux plateaux, combien de pesées minimum permettent de l'identifier à coup sûr, avec son écart de poids ?", a: "3 pesées suffisent, grâce à une stratégie de division astucieuse des boules en groupes de 4 à chaque étape, en exploitant aussi les cas où la balance reste équilibrée.", options: ["2 pesées", "3 pesées", "4 pesées", "6 pesées"], correct: 1 },
  { id: 593, deck: "brainteasers", sub: "Logique & énigmes", q: "Sur une île, certains habitants disent toujours la vérité et d'autres mentent toujours. Vous croisez une personne et lui demandez si elle est un menteur. Que peut-elle répondre ?", a: "Elle répondra toujours 'non' : un menteur mentirait en niant être menteur, et un dire-vrai dirait honnêtement qu'il n'est pas menteur — la réponse 'oui' est donc logiquement impossible.", options: ["Elle répondra toujours 'oui'", "Elle répondra toujours 'non'", "Elle ne peut pas répondre du tout", "Cela dépend uniquement du jour de la semaine"], correct: 1 },
  { id: 594, deck: "brainteasers", sub: "Logique & énigmes", q: "Vous avez deux cordes qui brûlent chacune en exactement 60 minutes, mais de façon non uniforme (certaines portions brûlent plus vite que d'autres). Comment mesurer exactement 45 minutes ?", a: "Allumez la première corde aux deux extrémités et la seconde à une seule extrémité simultanément. Quand la première corde est entièrement consumée (30 minutes), allumez l'autre extrémité de la seconde corde : elle finira de brûler en 15 minutes, totalisant 45 minutes.", options: ["En allumant simplement les deux cordes à une extrémité chacune", "En allumant la première aux deux bouts et la seconde à un bout, puis en allumant le second bout de la deuxième corde au bon moment", "Ce n'est pas possible avec seulement deux cordes", "En coupant chaque corde exactement en deux"], correct: 1 },
  { id: 595, deck: "brainteasers", sub: "Logique & énigmes", q: "Trois interrupteurs sont dans une pièce, chacun contrôlant une ampoule dans une autre pièce fermée que vous ne pouvez visiter qu'une seule fois. Comment déterminer quel interrupteur correspond à quelle ampoule ?", a: "Allumez le premier interrupteur quelques minutes puis éteignez-le, allumez le second et laissez-le allumé, puis entrez dans la pièce : l'ampoule allumée correspond au second interrupteur, celle éteinte mais chaude correspond au premier, celle éteinte et froide au troisième.", options: ["C'est impossible en une seule visite", "En utilisant la chaleur des ampoules en plus de leur état allumé/éteint", "En allumant simplement les trois interrupteurs un par un", "En comptant uniquement le nombre d'ampoules allumées"], correct: 1 },
  { id: 596, deck: "brainteasers", sub: "Logique & énigmes", q: "Un escargot au fond d'un puits de 10 mètres grimpe 3 mètres chaque jour, mais glisse de 2 mètres chaque nuit. En combien de jours atteint-il le sommet ?", a: "8 jours : chaque jour complet, il progresse net d'1 mètre, mais le dernier jour il grimpe les 3 mètres restants sans glisser la nuit suivante puisqu'il est déjà sorti, ce qui donne 8 jours et non 10.", options: ["7 jours", "8 jours", "10 jours", "13 jours"], correct: 1 },
  { id: 597, deck: "brainteasers", sub: "Logique & énigmes", q: "Vous avez une balance à deux plateaux et 9 pièces d'or identiques en apparence, dont une est plus légère que les autres (contrefaçon). Combien de pesées minimum permettent de l'identifier ?", a: "2 pesées suffisent : en divisant les pièces en trois groupes de 3 à chaque étape, on identifie le groupe contenant la pièce légère, puis la pièce elle-même.", options: ["1 pesée", "2 pesées", "3 pesées", "4 pesées"], correct: 1 },
  { id: 598, deck: "brainteasers", sub: "Logique & énigmes", q: "100 prisonniers doivent chacun trouver leur propre numéro caché dans l'une de 100 boîtes fermées, en n'ouvrant que 50 boîtes maximum chacun. S'ils choisissent tous des boîtes au hasard, quelle stratégie collective maximise significativement leurs chances de succès total ?", a: "La stratégie des cycles : chaque prisonnier commence par ouvrir la boîte portant son propre numéro, puis suit la chaîne des numéros trouvés à l'intérieur — cette méthode porte le taux de succès collectif à environ 31%, contre une probabilité quasi nulle avec un choix purement aléatoire.", options: ["Il n'existe aucune stratégie améliorant les chances par rapport au hasard pur", "La stratégie des cycles, suivant la chaîne des numéros trouvés, porte le succès à environ 31%", "Chaque prisonnier doit ouvrir les boîtes dans l'ordre croissant de leur numéro", "La meilleure stratégie consiste à ce que tous ouvrent les mêmes 50 boîtes"], correct: 1 },
  { id: 599, deck: "brainteasers", sub: "Logique & énigmes", q: "Deux trains partent de villes distantes de 100 km l'une de l'autre, roulant l'un vers l'autre à 50 km/h chacun. Un oiseau part en même temps du premier train à 75 km/h, fait des allers-retours entre les deux trains jusqu'à leur collision. Quelle distance totale l'oiseau parcourt-il ?", a: "75 km : les deux trains se rapprochent à une vitesse combinée de 100 km/h, ils se rencontrent donc après 1 heure ; l'oiseau vole pendant cette même heure à 75 km/h, parcourant ainsi 75 km, sans qu'il soit nécessaire de sommer une série infinie d'allers-retours.", options: ["50 km", "75 km", "100 km", "150 km"], correct: 1 },
  { id: 600, deck: "brainteasers", sub: "Logique & énigmes", q: "Vous devez traverser un pont la nuit avec une seule lampe torche, en un temps maximal de 17 minutes. Quatre personnes marchent à des vitesses de 1, 2, 5 et 10 minutes chacune, et le pont ne supporte que deux personnes à la fois. Comment tous traverser en 17 minutes ?", a: "1 et 2 traversent ensemble (2 min), 1 revient (1 min), 5 et 10 traversent ensemble (10 min), 2 revient (2 min), puis 1 et 2 traversent à nouveau ensemble (2 min) : total 2+1+10+2+2 = 17 minutes.", options: ["En faisant traverser chaque personne individuellement à tour de rôle", "En associant systématiquement les deux plus lents ensemble en premier", "En faisant traverser les deux plus rapides ensemble, puis en optimisant les retours de la lampe", "Ce n'est pas possible en 17 minutes avec ces contraintes"], correct: 2 },
  { id: 601, deck: "brainteasers", sub: "Logique & énigmes", q: "Combien de fois par jour les aiguilles d'une horloge (heures et minutes) se superposent-elles exactement ?", a: "22 fois par jour (11 fois par période de 12 heures), et non 24 comme on pourrait naïvement le penser, car les aiguilles ne se rattrapent pas exactement à chaque heure pleine.", options: ["12 fois", "22 fois", "24 fois", "48 fois"], correct: 1 },
  { id: 602, deck: "brainteasers", sub: "Logique & énigmes", q: "Un homme regarde une photo et dit : 'Je n'ai ni frère ni sœur, mais le père de cet homme est le fils de mon père.' Qui est sur la photo ?", a: "Son propre fils : puisqu'il n'a pas de frère, 'le fils de mon père' ne peut être que lui-même, donc 'le père de cet homme' sur la photo, c'est lui — l'homme sur la photo est donc son fils.", options: ["Son père", "Son fils", "Lui-même", "Son neveu"], correct: 1 },
  { id: 603, deck: "brainteasers", sub: "Logique & énigmes", q: "Vous avez deux seaux, l'un de 3 litres et l'autre de 5 litres, sans aucune autre graduation. Comment mesurer exactement 4 litres d'eau ?", a: "Remplir le seau de 5L, en verser 3L dans le seau de 3L (il reste 2L dans le seau de 5L), vider le seau de 3L, y verser les 2L restants, puis remplir à nouveau le seau de 5L et compléter le seau de 3L (qui contient déjà 2L) avec 1L seulement — il reste alors exactement 4L dans le seau de 5L.", options: ["Ce n'est pas possible avec ces deux seaux", "En transvasant méthodiquement entre les deux seaux selon une séquence précise", "En remplissant simplement les deux seaux en même temps", "En utilisant uniquement le seau de 3 litres trois fois"], correct: 1 },
  { id: 604, deck: "brainteasers", sub: "Logique & énigmes", q: "Dans une pièce sombre, vous avez un tiroir contenant 10 chaussettes noires et 10 chaussettes blanches. Combien devez-vous en tirer, au minimum, pour être certain d'avoir une paire assortie ?", a: "3 chaussettes suffisent : avec seulement deux couleurs possibles, dès la troisième chaussette tirée, deux d'entre elles seront nécessairement de la même couleur (principe des tiroirs de Dirichlet).", options: ["2 chaussettes", "3 chaussettes", "11 chaussettes", "21 chaussettes"], correct: 1 },
  { id: 605, deck: "brainteasers", sub: "Logique & énigmes", q: "Que dit le principe des tiroirs de Dirichlet (pigeonhole principle) ?", a: "Si l'on répartit n+1 objets dans n tiroirs, alors au moins un tiroir contiendra nécessairement au moins deux objets.", options: ["Chaque tiroir doit contenir exactement le même nombre d'objets", "Si n+1 objets sont répartis dans n tiroirs, au moins un tiroir contient au moins deux objets", "Il est toujours possible de répartir les objets sans qu'aucun tiroir ne soit vide", "Ce principe ne s'applique qu'à des ensembles infinis d'objets"], correct: 1 },
  { id: 606, deck: "brainteasers", sub: "Logique & énigmes", q: "Une grenouille tombe dans un puits de 20 mètres. Chaque jour elle grimpe 5 mètres, mais glisse de 3 mètres chaque nuit. En combien de jours sort-elle du puits ?", a: "9 jours : la progression nette est de 2 mètres par jour complet, mais au 9ème jour elle grimpe les 5 mètres restants (étant à 18m après 8 jours) et sort avant de glisser, donc 9 jours et non davantage.", options: ["7 jours", "8 jours", "9 jours", "10 jours"], correct: 2 },
  { id: 607, deck: "brainteasers", sub: "Logique & énigmes", q: "Vous avez 5 chapeaux (3 noirs, 2 blancs) et 3 personnes en file indienne, chacune ne voyant que les chapeaux des personnes devant elle. La personne du fond, voyant les deux chapeaux devant elle, ne peut pas déterminer sa couleur. Que peut-on en déduire pour la personne du milieu ?", a: "Le fait que la personne du fond ne puisse pas deviner sa couleur signifie que les deux chapeaux visibles devant elle ne sont pas de la même couleur (sinon elle aurait pu déduire la sienne par élimination) — la personne du milieu peut alors en déduire sa propre couleur en observant le chapeau de la personne devant elle.", options: ["Aucune déduction supplémentaire n'est possible", "Cela permet à la personne du milieu de déduire sa propre couleur de chapeau", "Cela signifie que tous les chapeaux restants sont noirs", "Cela ne concerne que la personne à l'avant de la file"], correct: 1 },
  { id: 608, deck: "brainteasers", sub: "Logique & énigmes", q: "Combien de fois faut-il couper un gâteau en ligne droite pour obtenir 8 parts, si les coupes peuvent se croiser ?", a: "3 coupes suffisent, en utilisant des coupes qui se croisent astucieusement plutôt que des coupes parallèles (qui ne donneraient que 4 parts avec 3 coupes).", options: ["2 coupes", "3 coupes", "4 coupes", "7 coupes"], correct: 1 },
  { id: 609, deck: "brainteasers", sub: "Logique & énigmes", q: "Un ascenseur descend toujours d'un étage à la fois avant de pouvoir remonter. S'il part du rez-de-chaussée (étage 0) et doit atteindre exactement l'étage 10 en alternant strictement montées et descentes d'un étage, est-ce possible ?", a: "Non : en partant de 0 et en alternant strictement montée/descente d'un étage, la position après un nombre pair de mouvements reste toujours paire et après un nombre impair reste toujours impaire par rapport au point de départ — mais surtout, une stricte alternance ne permet jamais de progresser net vers le haut au-delà d'un mouvement.", options: ["Oui, en un nombre pair de mouvements", "Non, une alternance stricte empêche toute progression nette", "Oui, mais uniquement en un nombre impair de mouvements", "Cela dépend uniquement de la vitesse de l'ascenseur"], correct: 1 },
  { id: 610, deck: "brainteasers", sub: "Logique & énigmes", q: "Vous devez peser un objet dont le poids exact (en kg, entier) est inconnu entre 1 et 40 kg, avec une balance à deux plateaux et un jeu de poids que vous choisissez à l'avance. Quel est le nombre minimal de poids nécessaires si on peut les placer sur les deux plateaux ?", a: "4 poids suffisent (1, 3, 9, 27 kg), en exploitant le système en base 3 équilibrée, où chaque poids peut être placé du même côté que l'objet, de l'autre côté, ou non utilisé.", options: ["3 poids", "4 poids", "6 poids", "10 poids"], correct: 1 },
  { id: 611, deck: "brainteasers", sub: "Logique & énigmes", q: "Deux personnes doivent partager équitablement un gâteau, sans qu'aucune ne puisse tricher. Quelle méthode simple garantit un partage perçu comme juste par les deux ?", a: "La méthode 'je coupe, tu choisis' : une personne coupe le gâteau en deux parts qu'elle juge égales, et l'autre personne choisit la part qu'elle préfère, incitant ainsi la première à couper le plus équitablement possible.", options: ["Chacun coupe sa propre moitié indépendamment", "La méthode 'je coupe, tu choisis'", "Un tiers neutre doit obligatoirement trancher", "Il n'existe aucune méthode garantissant l'équité"], correct: 1 },
  { id: 612, deck: "brainteasers", sub: "Logique & énigmes", q: "Un menteur (qui ment toujours) et un dire-vrai (qui dit toujours la vérité) se tiennent devant deux portes, l'une menant à la liberté, l'autre à un piège. Vous ne savez pas qui est qui. Quelle question unique posée à l'un des deux vous permet de trouver la porte de la liberté ?", a: "Demander : 'Si je demandais à l'autre personne quelle porte mène à la liberté, que répondrait-elle ?' — puis choisir la porte opposée à la réponse donnée, car les deux mensonges/vérités s'annulent pour désigner systématiquement la mauvaise porte.", options: ["Demander directement quelle porte mène à la liberté", "Demander ce que l'autre personne répondrait à la même question, puis choisir l'opposé", "Il est impossible de résoudre cette énigme avec une seule question", "Demander qui est le menteur entre les deux"], correct: 1 },
  { id: 613, deck: "brainteasers", sub: "Logique & énigmes", q: "Vous avez un damier 8×8 dont deux cases opposées (coins diagonaux) ont été retirées. Peut-on le recouvrir exactement avec 31 dominos de taille 1×2 ?", a: "Non, c'est impossible : les deux coins diagonaux retirés sont nécessairement de la même couleur (les coins opposés d'un échiquier sont toujours de même couleur), alors que chaque domino couvre exactement une case noire et une case blanche — il resterait donc un déséquilibre de 2 cases de la même couleur impossible à couvrir.", options: ["Oui, c'est toujours possible quel que soit l'arrangement", "Non, car les deux coins retirés sont de la même couleur, créant un déséquilibre insurmontable", "Cela dépend uniquement de l'orientation des dominos", "Oui, mais seulement avec des dominos de taille différente"], correct: 1 },
  { id: 614, deck: "brainteasers", sub: "Logique & énigmes", q: "Trois boîtes contiennent chacune soit des pommes, soit des oranges, soit un mélange des deux, mais toutes les étiquettes sont incorrectes (aucune ne correspond à son contenu réel). En tirant un seul fruit d'une seule boîte, comment identifier le contenu exact des trois boîtes ?", a: "Il faut tirer un fruit de la boîte étiquetée 'Mélange' : puisque cette étiquette est fausse, la boîte ne contient en réalité qu'un seul type de fruit, révélé par le tirage, ce qui permet ensuite de déduire logiquement le contenu réel des deux autres boîtes par élimination des étiquettes incorrectes.", options: ["Il faut obligatoirement tirer un fruit de chaque boîte", "Il faut tirer un fruit de la boîte étiquetée 'Mélange', qui contient en réalité un seul type de fruit", "C'est impossible avec un seul tirage", "Il faut tirer un fruit de la boîte étiquetée 'Pommes' uniquement"], correct: 1 },
  { id: 615, deck: "brainteasers", sub: "Logique & énigmes", q: "Un escalier a 10 marches. Vous pouvez monter 1 ou 2 marches à chaque pas. Combien de façons différentes existe-t-il de monter l'escalier entier ?", a: "89, un résultat correspondant au 11ème nombre de la suite de Fibonacci, car le nombre de façons d'atteindre la marche n est la somme des façons d'atteindre les marches n-1 et n-2.", options: ["55", "89", "144", "100"], correct: 1 },
  { id: 616, deck: "brainteasers", sub: "Logique & énigmes", q: "Vous avez 3 boîtes d'allumettes et devez déterminer laquelle contient des allumettes défectueuses (plus légères) en une seule pesée sur une balance électronique donnant un poids exact, sachant qu'une seule boîte est entièrement défectueuse. Comment procéder ?", a: "Prendre un nombre différent d'allumettes de chaque boîte (par exemple 1 de la première, 2 de la deuxième, 3 de la troisième), peser l'ensemble, puis déduire la boîte défectueuse à partir de l'écart de poids total par rapport au poids attendu.", options: ["En pesant chaque boîte séparément à tour de rôle", "En prenant un nombre différent d'allumettes de chaque boîte pour identifier l'écart via une seule pesée globale", "Ce n'est pas possible en une seule pesée", "En pesant uniquement deux boîtes sur trois"], correct: 1 },
  { id: 617, deck: "brainteasers", sub: "Logique & énigmes", q: "Combien de carrés au total (de toutes tailles) peut-on compter sur un échiquier standard de 8×8 cases ?", a: "204, en sommant les carrés de chaque taille possible : 8²+7²+6²+...+1² = 64+49+36+25+16+9+4+1 = 204.", options: ["64", "120", "204", "256"], correct: 2 },
  { id: 618, deck: "brainteasers", sub: "Logique & énigmes", q: "Un train quitte une gare toutes les 15 minutes. Vous arrivez à un moment aléatoire. Quel est le temps d'attente moyen jusqu'au prochain train ?", a: "7,5 minutes, soit la moitié de l'intervalle entre deux trains, en supposant une arrivée uniformément aléatoire dans cet intervalle.", options: ["5 minutes", "7,5 minutes", "10 minutes", "15 minutes"], correct: 1 },
  { id: 619, deck: "brainteasers", sub: "Logique & énigmes", q: "Vous avez 8 pièces identiques en apparence, sauf une plus lourde que les autres. Avec une balance à deux plateaux, combien de pesées minimum permettent de l'identifier ?", a: "2 pesées suffisent, en divisant les pièces en trois groupes (3, 3, 2) et en appliquant une stratégie de division successive similaire au problème classique des 9 pièces.", options: ["1 pesée", "2 pesées", "3 pesées", "4 pesées"], correct: 1 },
  { id: 620, deck: "brainteasers", sub: "Logique & énigmes", q: "Un homme vit au 20ème étage d'un immeuble. Chaque matin il prend l'ascenseur jusqu'au rez-de-chaussée. Le soir, il ne remonte en ascenseur que jusqu'au 10ème étage, puis prend les escaliers pour les 10 étages restants — sauf les jours de pluie où il remonte directement au 20ème. Pourquoi ?", a: "Parce qu'il est trop petit pour atteindre le bouton du 20ème étage dans l'ascenseur, mais peut atteindre le bouton du 10ème ; les jours de pluie, il utilise son parapluie pour appuyer sur le bouton du haut.", options: ["Il fait de l'exercice volontairement chaque jour sauf quand il pleut", "Il est trop petit pour atteindre le bouton du 20ème étage, sauf avec son parapluie les jours de pluie", "L'ascenseur est en panne au-delà du 10ème étage habituellement", "Il rend visite à un ami au 10ème étage tous les jours sauf quand il pleut"], correct: 1 },
  { id: 621, deck: "entretien", sub: "Motivation & fit", q: "En entretien : 'Pourquoi voulez-vous devenir Portfolio Manager ?' Quelle est la meilleure approche ?", a: "Articuler un intérêt authentique pour la prise de décision d'investissement sous incertitude, étayé par une expérience concrète (stage, projet personnel, trading), plutôt qu'une réponse générique centrée sur l'argent ou le prestige.", options: ["Insister sur le salaire élevé et le prestige du poste", "Articuler un intérêt authentique étayé par une expérience concrète et personnelle", "Répondre que n'importe quel poste en finance conviendrait", "Éviter de répondre précisément pour rester flexible"], correct: 1 },
  { id: 622, deck: "entretien", sub: "Motivation & fit", q: "En entretien : 'Pourquoi la gestion quantitative plutôt que discrétionnaire ?' Quelle est la meilleure approche ?", a: "Mettre en avant le goût pour la rigueur statistique, la reproductibilité des décisions et la volonté de retirer le biais émotionnel du processus d'investissement, avec un exemple concret à l'appui.", options: ["Dire que le quant est simplement plus lucratif", "Mettre en avant la rigueur statistique et la réduction du biais émotionnel, avec un exemple", "Affirmer que la gestion discrétionnaire est dépassée et inutile", "Éviter de comparer les deux approches"], correct: 1 },
  { id: 623, deck: "entretien", sub: "Motivation & fit", q: "En entretien : 'Quelle est votre plus grande faiblesse ?' Quelle est la meilleure approche ?", a: "Choisir une vraie faiblesse pertinente, montrer une prise de conscience claire et des actions concrètes entreprises pour la corriger, plutôt qu'une fausse faiblesse déguisée en qualité.", options: ["Répondre 'je suis trop perfectionniste' sans exemple concret", "Choisir une vraie faiblesse, montrer la prise de conscience et les actions correctives entreprises", "Affirmer ne pas avoir de faiblesse notable", "Décrire une faiblesse sans lien avec le poste visé"], correct: 1 },
  { id: 624, deck: "entretien", sub: "Motivation & fit", q: "En entretien : 'Parlez-moi d'un échec et de ce que vous en avez appris.' Quelle est la meilleure approche ?", a: "Structurer la réponse autour d'une situation concrète, de la décision prise, du résultat obtenu, et surtout de la leçon appliquée depuis, en assumant pleinement sa part de responsabilité.", options: ["Choisir un échec mineur pour minimiser l'impact perçu", "Structurer autour d'une situation concrète, en assumant sa responsabilité et la leçon appliquée depuis", "Rejeter la responsabilité sur des facteurs externes incontrôlables", "Éviter de citer un échec réel et personnel"], correct: 1 },
  { id: 625, deck: "entretien", sub: "Motivation & fit", q: "En entretien : 'Où vous voyez-vous dans 5 ans ?' Quelle est la meilleure approche ?", a: "Montrer une trajectoire cohérente et ambitieuse vers le rôle de PM, tout en restant réaliste sur les étapes intermédiaires (analyste, gérant junior) nécessaires pour y parvenir.", options: ["Affirmer vouloir être PM dès la première année sans étapes intermédiaires", "Montrer une trajectoire cohérente et réaliste passant par des étapes intermédiaires vers le PM", "Répondre de façon vague pour ne pas s'engager", "Dire que l'on souhaite changer de secteur à moyen terme"], correct: 1 },
