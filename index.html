  { id: 626, deck: "entretien", sub: "Motivation & fit", q: "En entretien : 'Pourquoi notre fonds en particulier ?' Quelle est la meilleure approche ?", a: "Démontrer une recherche approfondie sur la stratégie, la philosophie d'investissement et la performance récente du fonds, en expliquant précisément l'adéquation avec son propre profil.", options: ["Répondre que le fonds a bonne réputation, sans plus de détails", "Démontrer une recherche approfondie sur la stratégie et la philosophie du fonds, avec adéquation personnelle", "Dire que l'on postule dans plusieurs fonds similaires sans distinction", "Se concentrer uniquement sur la rémunération proposée"], correct: 1 },
  { id: 627, deck: "entretien", sub: "Motivation & fit", q: "En entretien : 'Comment gérez-vous le stress et la pression des marchés ?' Quelle est la meilleure approche ?", a: "Donner un exemple concret de situation de forte pression gérée efficacement, en insistant sur la méthode et le processus mis en place plutôt que sur la seule résilience émotionnelle.", options: ["Affirmer ne jamais ressentir de stress", "Donner un exemple concret, en insistant sur la méthode et le process plutôt que la seule résilience", "Décrire une situation où le stress a mené à une erreur, sans apprentissage tiré", "Éviter de donner un exemple précis"], correct: 1 },
  { id: 628, deck: "entretien", sub: "Motivation & fit", q: "En entretien : 'Que faites-vous en dehors du travail pour suivre les marchés ?' Quelle est la meilleure approche ?", a: "Mentionner un portefeuille personnel, une veille active (newsletters, papers de recherche) ou des projets quantitatifs personnels, démontrant une passion authentique au-delà du cadre professionnel.", options: ["Répondre que l'on ne suit pas les marchés en dehors du travail", "Mentionner un portefeuille personnel, une veille active ou des projets quantitatifs personnels", "Citer uniquement des sources d'information généralistes non financières", "Dire que cela relève uniquement de la vie privée"], correct: 1 },
  { id: 629, deck: "entretien", sub: "Motivation & fit", q: "En entretien : 'Comment réagissez-vous face à un désaccord avec un collègue senior sur une position ?' Quelle est la meilleure approche ?", a: "Illustrer une capacité à défendre son analyse avec des arguments factuels, tout en restant ouvert à la remise en question et au consensus final de l'équipe.", options: ["Affirmer que l'on s'aligne systématiquement sur l'avis du senior sans discussion", "Défendre son analyse avec des faits, tout en restant ouvert à la remise en question", "Décrire une insistance ferme sur sa position jusqu'à obtenir gain de cause", "Éviter tout désaccord en pratique en entretien comme au travail"], correct: 1 },
  { id: 630, deck: "entretien", sub: "Motivation & fit", q: "En entretien : 'Quelles sont vos principales sources d'information sur les marchés ?' Quelle est la meilleure approche ?", a: "Citer des sources variées et crédibles (Bloomberg, papers académiques, comptes-rendus de banques centrales), démontrant une veille structurée et régulière plutôt que superficielle.", options: ["Citer uniquement les réseaux sociaux comme source principale", "Citer des sources variées et crédibles, démontrant une veille structurée et régulière", "Répondre que l'on ne suit pas de source particulière", "Mentionner une seule source généraliste sans justification"], correct: 1 },
  { id: 631, deck: "entretien", sub: "Motivation & fit", q: "En entretien : 'Pourquoi devrions-nous vous embaucher plutôt qu'un autre candidat ?' Quelle est la meilleure approche ?", a: "Synthétiser ses atouts différenciants concrets (compétences techniques spécifiques, expérience pertinente, fit culturel) sans tomber ni dans l'arrogance ni dans la fausse modestie.", options: ["Affirmer être objectivement le meilleur candidat sans justification précise", "Synthétiser des atouts différenciants concrets, sans arrogance ni fausse modestie", "Répondre qu'il n'y a pas de raison particulière de le préférer", "Se comparer directement et négativement aux autres candidats"], correct: 1 },
  { id: 632, deck: "entretien", sub: "Motivation & fit", q: "En entretien : 'Quel est votre plus grand accomplissement professionnel ou académique ?' Quelle est la meilleure approche ?", a: "Choisir un accomplissement mesurable et pertinent pour le poste visé, en détaillant clairement sa contribution personnelle et l'impact concret obtenu.", options: ["Citer un accomplissement d'équipe sans préciser sa contribution personnelle", "Choisir un accomplissement mesurable et pertinent, en détaillant sa contribution et l'impact obtenu", "Éviter de citer un exemple concret par modestie", "Choisir un accomplissement sans lien avec les compétences recherchées pour le poste"], correct: 1 },
  { id: 633, deck: "entretien", sub: "Pitch d'investissement", q: "En entretien, on vous demande de 'pitcher une action ou un trade'. Quelle structure est attendue ?", a: "La thèse en une phrase, le catalyseur identifié, l'analyse de valorisation/edge, le risque principal, et le sizing ou l'horizon de temps recommandé.", options: ["Décrire uniquement les fondamentaux de l'entreprise sans conclusion actionnable", "La thèse, le catalyseur, la valorisation/edge, le risque principal, et le sizing/horizon", "Se concentrer uniquement sur le cours de bourse récent de l'action", "Présenter plusieurs idées vagues sans en approfondir aucune"], correct: 1 },
  { id: 634, deck: "entretien", sub: "Pitch d'investissement", q: "Pourquoi est-il essentiel de préciser un catalyseur dans un pitch d'investissement en entretien ?", a: "Parce que même une thèse de valorisation correcte peut ne jamais se matérialiser en performance dans un horizon de temps raisonnable si aucun catalyseur clair ne vient réévaluer l'actif.", options: ["Le catalyseur n'a aucune réelle importance dans un pitch", "Sans catalyseur, la thèse peut ne jamais se matérialiser en performance dans un délai raisonnable", "Le catalyseur sert uniquement à impressionner l'intervieweur", "Seul le catalyseur compte, la valorisation étant secondaire"], correct: 1 },
  { id: 635, deck: "entretien", sub: "Pitch d'investissement", q: "En entretien : 'Quel est le risque principal de votre idée d'investissement ?' Quelle est la meilleure approche ?", a: "Identifier honnêtement le scénario qui invaliderait la thèse, démontrant une capacité d'auto-critique plutôt qu'une conviction aveugle et non nuancée.", options: ["Affirmer que l'idée ne comporte quasiment aucun risque", "Identifier honnêtement le scénario invalidant la thèse, avec auto-critique", "Citer un risque générique sans lien direct avec la thèse présentée", "Éviter de répondre pour ne pas affaiblir son propre pitch"], correct: 1 },
  { id: 636, deck: "entretien", sub: "Pitch d'investissement", q: "En entretien : 'Comment dimensionnez-vous la position dans votre pitch ?' Quelle est la meilleure approche ?", a: "Relier explicitement la taille de la position au niveau de conviction, à la volatilité de l'actif, et au risque de perte maximal acceptable, plutôt que de proposer un chiffre arbitraire.", options: ["Proposer un chiffre arbitraire sans justification précise", "Relier la taille au niveau de conviction, à la volatilité et au risque de perte acceptable", "Toujours recommander la taille de position maximale autorisée", "Éviter de répondre à cette question précise"], correct: 1 },
  { id: 637, deck: "entretien", sub: "Pitch d'investissement", q: "Pourquoi faut-il éviter un pitch basé uniquement sur des multiples de valorisation, sans catalyseur ni analyse qualitative ?", a: "Parce que cela ignore le 'pourquoi maintenant' et le mécanisme précis par lequel le marché va effectivement réévaluer l'actif dans le temps.", options: ["Les multiples de valorisation ne sont jamais pertinents en pitch", "Cela ignore le mécanisme et le timing par lequel le marché réévaluerait l'actif", "Un pitch ne doit contenir aucune donnée chiffrée", "Les intervieweurs ne s'intéressent jamais à la valorisation"], correct: 1 },
  { id: 638, deck: "entretien", sub: "Pitch d'investissement", q: "En entretien : 'Comment réagissez-vous si l'intervieweur contre-argumente fortement votre thèse ?' Quelle est la meilleure approche ?", a: "Défendre son analyse avec des faits précis, tout en montrant une ouverture réelle à intégrer une information nouvelle et pertinente si elle change véritablement la donne.", options: ["Abandonner immédiatement sa thèse dès la première objection", "Défendre son analyse avec des faits, tout en restant ouvert à une information réellement pertinente", "Maintenir sa position de façon rigide sans jamais l'ajuster", "Changer de sujet pour éviter la confrontation"], correct: 1 },
  { id: 639, deck: "entretien", sub: "Pitch d'investissement", q: "Quel horizon de temps est généralement attendu dans un pitch de trade en entretien PM ?", a: "Un horizon clair et cohérent avec le catalyseur identifié, justifié explicitement plutôt que laissé vague ou non mentionné.", options: ["Aucun horizon précis n'est nécessaire dans un pitch", "Un horizon clair et cohérent avec le catalyseur identifié", "Toujours un horizon de très long terme par défaut", "Un horizon systématiquement inférieur à une semaine"], correct: 1 },
  { id: 640, deck: "entretien", sub: "Pitch d'investissement", q: "Quelle est la principale différence structurelle entre un pitch 'long' et un pitch 'short' en entretien ?", a: "Le pitch short doit en plus aborder explicitement le risque de short squeeze et le coût de portage (borrow cost, dividendes à verser), en complément de la thèse de surévaluation.", options: ["Il n'existe aucune différence structurelle entre les deux", "Le short doit en plus aborder le risque de squeeze et le coût de portage", "Le pitch long ne nécessite jamais de mentionner de risque", "Le short ne nécessite pas de catalyseur, contrairement au long"], correct: 1 },
  { id: 641, deck: "entretien", sub: "Pitch d'investissement", q: "Pourquoi les intervieweurs valorisent-ils généralement une vue contrariante (non-consensus) dans un pitch ?", a: "Parce qu'une thèse déjà largement intégrée dans le prix par le marché offre généralement peu de potentiel de surperformance résiduelle par rapport au consensus.", options: ["Une vue contrariante est toujours plus risquée et donc moins valorisée", "Une thèse déjà intégrée dans le prix offre peu de potentiel de surperformance résiduelle", "Le consensus de marché est toujours faux par définition", "Les intervieweurs préfèrent uniquement des idées déjà connues et populaires"], correct: 1 },
  { id: 642, deck: "entretien", sub: "Pitch d'investissement", q: "Que faire si vous n'avez pas d'idée de trade parfaitement prête en entretien ?", a: "Proposer une méthode structurée de génération d'idées ou discuter d'un thème macro/sectoriel réfléchi, plutôt que d'improviser une thèse mal maîtrisée et peu crédible.", options: ["Improviser une thèse rapidement sans réelle réflexion préalable", "Proposer une méthode de génération d'idées ou un thème macro/sectoriel réfléchi", "Admettre ne pas avoir d'idée et changer immédiatement de sujet", "Répéter une idée déjà largement médiatisée sans valeur ajoutée"], correct: 1 },
  { id: 643, deck: "entretien", sub: "Pitch d'investissement", q: "Quelle erreur fréquente les candidats commettent-ils en pitchant une thèse macro trop vague ?", a: "L'absence d'un mécanisme de transmission clair reliant la vue macro exprimée à un instrument financier précis et tradable, avec un horizon de temps défini.", options: ["Ils fournissent systématiquement trop de détails chiffrés précis", "L'absence d'un mécanisme clair reliant la vue macro à un instrument tradable précis", "Ils choisissent toujours un horizon de temps trop court", "Ils négligent systématiquement de citer une source macroéconomique"], correct: 1 },
  { id: 644, deck: "entretien", sub: "Pitch d'investissement", q: "Pourquoi est-il important de mentionner explicitement le scénario de sortie ('exit') dans un pitch d'investissement ?", a: "Parce qu'il précise concrètement les conditions (prix cible, événement) qui matérialiseraient le gain ou déclencheraient une sortie en cas de thèse invalidée, démontrant une réflexion complète du trade.", options: ["Le scénario de sortie n'a aucune importance réelle dans un pitch", "Il précise les conditions matérialisant le gain ou déclenchant une sortie en cas d'échec", "Seul le prix d'entrée compte réellement dans un pitch", "Il sert uniquement à impressionner l'intervieweur sans utilité pratique"], correct: 1 },
  { id: 645, deck: "entretien", sub: "Vue marché & macro", q: "En entretien : 'Quelle est votre vue sur les marchés actuellement ?' Quelle est la meilleure approche ?", a: "Structurer une réponse synthétique combinant le contexte macro actuel, le positionnement qui en découle, et l'implication concrète pour un portefeuille, plutôt qu'une opinion isolée sans justification.", options: ["Donner une opinion isolée sans la relier à une implication de portefeuille", "Structurer une réponse combinant contexte macro, positionnement et implication pour un portefeuille", "Répondre que les marchés sont globalement imprévisibles sans plus de détail", "Éviter de prendre position sur le sujet"], correct: 1 },
  { id: 646, deck: "entretien", sub: "Vue marché & macro", q: "Pourquoi est-il important de connaître les niveaux clés des indices/taux avant un entretien PM ou quant ?", a: "Cela démontre un engagement réel et actuel avec les marchés, une condition de crédibilité de base attendue pour ce type de poste orienté marché.", options: ["Ce n'est jamais vérifié en entretien, donc peu important", "Cela démontre un engagement réel et actuel avec les marchés, condition de crédibilité de base", "Seuls les niveaux historiques comptent, pas les niveaux actuels", "Cela n'intéresse que les postes de trading pur, pas les PM"], correct: 1 },
  { id: 647, deck: "entretien", sub: "Vue marché & macro", q: "En entretien : 'Que pensez-vous de la politique actuelle de la Fed ou de la BCE ?' Quelle est la meilleure approche ?", a: "Montrer une compréhension du mandat de la banque centrale, s'appuyer sur des données récentes justifiant sa position actuelle, et en tirer des implications concrètes pour les classes d'actifs.", options: ["Critiquer systématiquement la politique monétaire sans argumentation factuelle", "Montrer la compréhension du mandat, s'appuyer sur des données récentes et en tirer des implications", "Répondre que la politique monétaire n'a pas d'impact sur les marchés", "Éviter tout avis personnel sur le sujet"], correct: 1 },
  { id: 648, deck: "entretien", sub: "Vue marché & macro", q: "Pourquoi faut-il éviter de donner une opinion macro sans indiquer son degré de conviction et un scénario alternatif ?", a: "Parce que cela traduit un manque de gestion du risque de conviction, une qualité pourtant essentielle chez un Portfolio Manager appelé à arbitrer entre plusieurs scénarios possibles.", options: ["Un scénario alternatif n'a aucune utilité pratique en gestion", "Cela traduit un manque de gestion du risque de conviction, qualité essentielle chez un PM", "Seule la conviction maximale doit être exprimée en entretien", "Les scénarios alternatifs ne concernent que les analystes juniors"], correct: 1 },
  { id: 649, deck: "entretien", sub: "Vue marché & macro", q: "En entretien : 'Quel est selon vous le principal risque macro actuel ?' Quelle est la meilleure approche ?", a: "Donner une réponse actuelle et argumentée, directement reliée à une implication de marché concrète, plutôt qu'une réponse générique et intemporelle sans lien avec le contexte présent.", options: ["Citer un risque générique valable à n'importe quelle période", "Donner une réponse actuelle et argumentée, reliée à une implication de marché concrète", "Répondre qu'il n'existe aucun risque macro significatif actuellement", "Citer plusieurs risques sans en approfondir aucun"], correct: 1 },
  { id: 650, deck: "entretien", sub: "Vue marché & macro", q: "Pourquoi les candidats PM sont-ils souvent testés sur leur capacité à changer d'avis rapidement en entretien ?", a: "Parce que la flexibilité face à une information nouvelle et pertinente est une compétence clé en gestion de portefeuille, contrairement à l'entêtement rigide dans une thèse déjà formée.", options: ["Pour évaluer uniquement la résistance au stress du candidat", "Car la flexibilité face à une nouvelle information est une compétence clé, contrairement à l'entêtement", "Cela n'a en réalité aucun lien avec les compétences réelles de PM", "Pour vérifier uniquement la connaissance théorique des marchés"], correct: 1 },
  { id: 651, deck: "entretien", sub: "Vue marché & macro", q: "En entretien : 'Comment vous tenez-vous informé de l'actualité macroéconomique au quotidien ?' Quelle est la meilleure approche ?", a: "Décrire une routine structurée et concrète (calendrier économique, publications spécialisées, presse financière) plutôt qu'une réponse vague et peu convaincante.", options: ["Répondre que l'on consulte les réseaux sociaux de façon occasionnelle", "Décrire une routine structurée avec calendrier économique et publications spécialisées", "Dire que l'on ne suit pas l'actualité macro de façon régulière", "Mentionner uniquement une source d'information non financière"], correct: 1 },
  { id: 652, deck: "entretien", sub: "Vue marché & macro", q: "Pourquoi un candidat doit-il être capable de discuter d'un scénario macro contraire à sa propre conviction ?", a: "Cela démontre une compréhension équilibrée et nuancée du marché, plutôt qu'un biais de confirmation excessif limitant la qualité de la prise de décision future en gestion.", options: ["Ce n'est jamais attendu ni pertinent en entretien", "Cela démontre une compréhension équilibrée du marché, sans biais de confirmation excessif", "Seule la conviction personnelle du candidat doit être exprimée", "Cela concerne uniquement les postes de recherche macro pure"], correct: 1 },
  { id: 653, deck: "entretien", sub: "Vue marché & macro", q: "En entretien : 'Quel indicateur économique surveillez-vous en priorité en ce moment ?' Quelle est la meilleure approche ?", a: "Justifier le choix de l'indicateur par un lien direct et actuel avec le contexte de marché (ex. inflation, marché de l'emploi), plutôt qu'une réponse générique déconnectée de l'actualité.", options: ["Citer un indicateur sans le relier au contexte de marché actuel", "Justifier le choix par un lien direct et actuel avec le contexte de marché", "Répondre qu'aucun indicateur n'est plus pertinent qu'un autre", "Citer tous les indicateurs macro possibles sans hiérarchisation"], correct: 1 },
  { id: 654, deck: "entretien", sub: "Vue marché & macro", q: "Pourquoi est-il risqué de baser une vue macro uniquement sur les gros titres médiatiques ?", a: "Parce que les médias généralistes simplifient souvent excessivement des dynamiques complexes, ce qui peut mener à des conclusions de marché erronées ou déjà obsolètes au moment de la publication.", options: ["Les médias généralistes sont toujours parfaitement fiables en finance", "Les médias simplifient souvent des dynamiques complexes, menant à des conclusions erronées ou obsolètes", "Cela n'a aucune importance tant que la source est citée", "Seuls les médias spécialisés existent en pratique"], correct: 1 },
  { id: 655, deck: "entretien", sub: "Vue marché & macro", q: "En entretien : 'Quelle classe d'actifs privilégiez-vous dans l'environnement actuel et pourquoi ?' Quelle est la meilleure approche ?", a: "Relier explicitement le choix de la classe d'actifs à la vue macro exprimée précédemment, afin de démontrer la cohérence globale et logique de tout le raisonnement présenté.", options: ["Choisir une classe d'actifs sans lien avec la vue macro exprimée auparavant", "Relier explicitement le choix à la vue macro exprimée, pour montrer la cohérence du raisonnement", "Répondre que toutes les classes d'actifs se valent actuellement", "Éviter de justifier le choix de la classe d'actifs"], correct: 1 },
  { id: 656, deck: "entretien", sub: "Vue marché & macro", q: "Pourquoi faut-il éviter les réponses macro trop consensuelles en entretien PM ?", a: "Parce qu'elles ne démontrent aucune capacité d'analyse différenciante, une qualité pourtant essentielle chez un gérant appelé à générer de l'alpha au-delà du consensus de marché.", options: ["Les réponses consensuelles sont toujours les plus sûres et donc préférables", "Elles ne démontrent aucune capacité d'analyse différenciante, essentielle pour générer de l'alpha", "Le consensus de marché est toujours faux par principe", "Cela n'a aucune importance tant que la réponse est bien argumentée"], correct: 1 },
  { id: 657, deck: "entretien", sub: "Technique : portefeuille & risque", q: "En entretien : 'Comment construiriez-vous un portefeuille avec un budget de risque donné ?' Quelle est la meilleure approche ?", a: "Expliquer une approche structurée : allocation par facteur de risque, prise en compte des corrélations entre positions, et respect de contraintes de diversification, plutôt qu'une simple liste d'actifs.", options: ["Proposer une simple liste d'actifs sans structuration du risque", "Expliquer une approche structurée par facteur de risque, corrélations et contraintes de diversification", "Répondre qu'il suffit de répartir équitablement le capital entre tous les actifs", "Ignorer complètement la question des corrélations entre positions"], correct: 1 },
  { id: 658, deck: "entretien", sub: "Technique : portefeuille & risque", q: "En entretien : 'Comment définissez-vous votre edge en tant que gérant quantitatif ?' Quelle est la meilleure approche ?", a: "Articuler précisément la source de l'avantage informationnel ou méthodologique (données propriétaires, vitesse d'exécution, modèle différenciant) plutôt que de donner une réponse vague et générique.", options: ["Répondre que l'edge vient uniquement de l'expérience générale accumulée", "Articuler précisément la source de l'avantage informationnel ou méthodologique", "Affirmer ne pas avoir besoin d'edge particulier pour réussir", "Décrire un edge identique à celui de tous les concurrents du marché"], correct: 1 },
  { id: 659, deck: "entretien", sub: "Technique : portefeuille & risque", q: "En entretien : 'Comment mesurez-vous la performance ajustée du risque d'une stratégie ?' Quelle est la meilleure approche ?", a: "Citer plusieurs métriques pertinentes (Sharpe, Sortino, maximum drawdown, Calmar) et savoir expliquer dans quel contexte privilégier l'une plutôt qu'une autre selon le profil de la stratégie évaluée.", options: ["Se limiter uniquement au rendement brut de la stratégie", "Citer plusieurs métriques pertinentes et savoir les contextualiser selon le profil de la stratégie", "Répondre qu'une seule métrique universelle suffit dans tous les cas", "Ignorer totalement la dimension du risque dans l'évaluation"], correct: 1 },
  { id: 660, deck: "entretien", sub: "Technique : portefeuille & risque", q: "En entretien : 'Que faites-vous si votre stratégie sous-performe pendant plusieurs mois consécutifs ?' Quelle est la meilleure approche ?", a: "Décrire un processus rigoureux de diagnostic (vérification du modèle, du régime de marché, des hypothèses sous-jacentes) avant toute décision hâtive d'arrêt ou de changement de la stratégie.", options: ["Arrêter immédiatement la stratégie dès les premiers signes de sous-performance", "Décrire un processus rigoureux de diagnostic avant toute décision hâtive", "Continuer sans jamais remettre en question la stratégie initiale", "Augmenter systématiquement l'exposition pour compenser la perte"], correct: 1 },
  { id: 661, deck: "entretien", sub: "Technique : portefeuille & risque", q: "En entretien : 'Comment gérez-vous le risque de corrélation entre vos positions ?' Quelle est la meilleure approche ?", a: "Expliquer une approche de gestion du risque appréhendée au niveau du portefeuille global, plutôt qu'une analyse position par position réalisée de façon isolée.", options: ["Analyser chaque position isolément, sans considérer les interactions entre elles", "Expliquer une approche de gestion du risque au niveau du portefeuille global", "Affirmer que la corrélation entre positions n'a pas d'importance réelle", "Éviter systématiquement toute position corrélée, sans nuance"], correct: 1 },
  { id: 662, deck: "entretien", sub: "Technique : portefeuille & risque", q: "En entretien : 'Quelle est la différence entre alpha et beta dans votre approche d'investissement ?' Quelle est la meilleure approche ?", a: "Distinguer clairement la performance liée à la simple exposition au marché (beta) de celle réellement générée par la compétence de sélection ou de timing du gérant (alpha).", options: ["Affirmer que alpha et beta désignent en réalité la même chose", "Distinguer clairement la performance liée au marché (beta) de celle générée par la compétence (alpha)", "Dire que seul le beta compte réellement en pratique", "Répondre que l'alpha ne peut jamais être mesuré objectivement"], correct: 1 },
  { id: 663, deck: "entretien", sub: "Technique : portefeuille & risque", q: "En entretien : 'Comment décideriez-vous de couper une position perdante ?' Quelle est la meilleure approche ?", a: "Définir des règles de gestion du risque prédéfinies (stop-loss, seuils de réévaluation de la thèse initiale) plutôt qu'une décision purement émotionnelle et improvisée au moment de la perte.", options: ["Attendre systématiquement que la position redevienne positive avant d'agir", "Définir des règles prédéfinies de stop-loss et de réévaluation de la thèse", "Couper immédiatement toute position dès la première perte, sans analyse", "Laisser la décision entièrement à l'intuition du moment"], correct: 1 },
  { id: 664, deck: "entretien", sub: "Technique : portefeuille & risque", q: "En entretien : 'Comment évaluez-vous la capacité (capacity) d'une stratégie quantitative ?' Quelle est la meilleure approche ?", a: "Expliquer la notion de dégradation progressive de la performance liée à l'impact de marché croissant, à mesure que les capitaux gérés par la stratégie augmentent.", options: ["Affirmer que la capacité d'une stratégie est toujours illimitée", "Expliquer la dégradation de performance liée à l'impact de marché croissant avec les capitaux gérés", "Dire que la capacité ne concerne que les stratégies obligataires", "Ignorer totalement cette dimension dans l'évaluation d'une stratégie"], correct: 1 },
  { id: 665, deck: "entretien", sub: "Technique : portefeuille & risque", q: "En entretien : 'Comment intégrez-vous les coûts de transaction dans le pilotage de votre stratégie ?' Quelle est la meilleure approche ?", a: "Montrer une compréhension précise de leur impact réel sur la performance nette de la stratégie, en particulier pour les approches à rotation de portefeuille élevée.", options: ["Affirmer que les coûts de transaction sont toujours négligeables", "Montrer une compréhension précise de leur impact sur la performance nette, notamment à rotation élevée", "Ignorer systématiquement les coûts dans le calcul de la performance", "Considérer les coûts uniquement pour les stratégies obligataires"], correct: 1 },
  { id: 666, deck: "entretien", sub: "Technique : portefeuille & risque", q: "En entretien : 'Quelle est votre approche du backtesting et de ses limites ?' Quelle est la meilleure approche ?", a: "Reconnaître explicitement les risques de surapprentissage (overfitting) et de biais du survivant, tout en expliquant précisément les précautions méthodologiques mises en place pour les limiter.", options: ["Affirmer qu'un backtest bien réalisé garantit toujours une performance future identique", "Reconnaître explicitement les risques d'overfitting et de biais du survivant, avec précautions méthodologiques", "Dire que le backtesting n'a aucune utilité pratique en gestion", "Ignorer totalement les limites méthodologiques du backtesting"], correct: 1 },
  { id: 667, deck: "entretien", sub: "Technique : portefeuille & risque", q: "En entretien : 'Comment expliqueriez-vous une perte importante à un investisseur (LP) ?' Quelle est la meilleure approche ?", a: "Adopter une communication transparente et factuelle, en distinguant clairement une perte liée au processus normal de prise de risque assumé d'une véritable erreur de gestion.", options: ["Minimiser systématiquement l'ampleur réelle de la perte subie", "Adopter une communication transparente, distinguant perte normale et erreur réelle de gestion", "Attribuer systématiquement la perte à des facteurs externes incontrôlables", "Éviter toute explication détaillée pour ne pas inquiéter l'investisseur"], correct: 1 },
  { id: 668, deck: "entretien", sub: "Technique : portefeuille & risque", q: "En entretien : 'Quelle est la différence entre gérer un portefeuille long-only et un portefeuille long/short ?' Quelle est la meilleure approche ?", a: "Expliquer que le long/short permet de découpler la performance du bêta de marché pour générer un alpha plus pur, tout en impliquant une plus grande complexité opérationnelle et de risque (short squeeze, borrow).", options: ["Affirmer qu'il n'existe aucune différence significative entre les deux approches", "Expliquer que le long/short découple la performance du bêta, avec une complexité accrue en contrepartie", "Dire que le long/short est systématiquement moins risqué que le long-only", "Répondre que le long-only ne permet jamais de générer d'alpha"], correct: 1 },
  { id: 669, deck: "entretien", sub: "Comportemental & mise en situation", q: "En entretien : 'Décrivez une situation où vous avez dû prendre une décision rapide avec des informations incomplètes.' Quelle est la meilleure approche ?", a: "Structurer la réponse avec la méthode STAR (Situation, Tâche, Action, Résultat), en insistant particulièrement sur le raisonnement suivi pour décider malgré l'incertitude.", options: ["Décrire uniquement le résultat final, sans détailler le raisonnement suivi", "Structurer la réponse avec la méthode STAR, en insistant sur le raisonnement sous incertitude", "Éviter de donner un exemple concret et réel", "Affirmer que l'on dispose toujours de toutes les informations nécessaires avant de décider"], correct: 1 },
  { id: 670, deck: "entretien", sub: "Comportemental & mise en situation", q: "En entretien : 'Comment réagiriez-vous si vous découvriez une erreur dans votre modèle déjà déployé en production ?' Quelle est la meilleure approche ?", a: "Décrire une réaction transparente et rapide : alerter immédiatement l'équipe concernée, quantifier précisément l'impact de l'erreur, puis la corriger sans délai, plutôt que de la dissimuler.", options: ["Corriger discrètement l'erreur sans en informer l'équipe", "Alerter rapidement l'équipe, quantifier l'impact, puis corriger l'erreur sans délai", "Attendre de voir si l'erreur a un réel impact avant d'agir", "Minimiser la gravité de l'erreur auprès de la hiérarchie"], correct: 1 },
  { id: 671, deck: "entretien", sub: "Comportemental & mise en situation", q: "En entretien : 'Parlez-moi d'un moment où vous avez dû convaincre quelqu'un de votre point de vue.' Quelle est la meilleure approche ?", a: "Illustrer une argumentation basée sur des données factuelles précises et une écoute active du point de vue opposé, plutôt qu'une simple insistance répétée sur sa propre position.", options: ["Décrire une situation où l'on a simplement insisté jusqu'à obtenir gain de cause", "Illustrer une argumentation basée sur des faits et une écoute active du point de vue opposé", "Choisir un exemple où l'on n'a jamais réussi à convaincre personne", "Éviter de donner un exemple concret sur ce sujet"], correct: 1 },
  { id: 672, deck: "entretien", sub: "Comportemental & mise en situation", q: "En entretien : 'Comment travaillez-vous en équipe sur une décision d'investissement collective ?' Quelle est la meilleure approche ?", a: "Décrire un exemple concret de contribution constructive, montrant la capacité à la fois de défendre une analyse personnelle et d'accepter une décision collective finale différente de son avis initial.", options: ["Décrire une préférence marquée pour le travail exclusivement individuel", "Décrire une contribution constructive, capable de défendre son analyse et d'accepter la décision collective", "Affirmer imposer systématiquement son avis au reste de l'équipe", "Éviter de citer un exemple concret de travail en équipe"], correct: 1 },
  { id: 673, deck: "entretien", sub: "Comportemental & mise en situation", q: "En entretien : 'Que feriez-vous si vous étiez en désaccord total avec la stratégie du fonds ?' Quelle est la meilleure approche ?", a: "Montrer la capacité à exprimer un désaccord de façon constructive et argumentée, dans les canaux appropriés, sans pour autant chercher à saboter l'exécution collective de la stratégie décidée.", options: ["Affirmer que l'on exécuterait la stratégie sans jamais exprimer son désaccord", "Montrer la capacité à exprimer un désaccord constructif dans les canaux appropriés, sans saboter l'exécution", "Dire que l'on quitterait immédiatement le fonds en cas de désaccord", "Répondre que l'on ignorerait simplement la stratégie du fonds"], correct: 1 },
  { id: 674, deck: "entretien", sub: "Comportemental & mise en situation", q: "En entretien : 'Décrivez un projet quantitatif personnel que vous avez mené.' Quelle est la meilleure approche ?", a: "Présenter un projet concret avec sa méthodologie précise, les résultats réellement obtenus, et surtout un regard critique honnête sur ses propres limites méthodologiques.", options: ["Présenter un projet théorique jamais réellement mis en œuvre", "Présenter un projet concret avec méthodologie, résultats et regard critique honnête sur ses limites", "Décrire uniquement les résultats positifs sans mentionner les limites", "Éviter de mentionner un projet personnel spécifique"], correct: 1 },
  { id: 675, deck: "entretien", sub: "Comportemental & mise en situation", q: "En entretien : 'Comment priorisez-vous vos tâches lorsque plusieurs urgences surviennent simultanément ?' Quelle est la meilleure approche ?", a: "Décrire une méthode claire et structurée de priorisation (par exemple selon l'impact et l'urgence de chaque tâche) plutôt qu'une réponse improvisée sans structure définie.", options: ["Répondre que l'on traite toujours les tâches dans leur ordre d'arrivée", "Décrire une méthode claire de priorisation selon l'impact et l'urgence", "Affirmer traiter systématiquement toutes les tâches simultanément", "Éviter de décrire une méthode précise de priorisation"], correct: 1 },
  { id: 676, deck: "entretien", sub: "Comportemental & mise en situation", q: "En entretien : 'Qu'avez-vous appris de votre pire trade ou décision d'investissement personnelle ?' Quelle est la meilleure approche ?", a: "Assumer honnêtement l'erreur commise, analyser sa cause profonde (biais cognitif, manque de discipline...) et expliquer clairement le changement de processus mis en place depuis lors.", options: ["Attribuer systématiquement l'échec à des facteurs de marché incontrôlables", "Assumer honnêtement l'erreur, analyser sa cause profonde et expliquer le changement de processus mis en place", "Affirmer n'avoir jamais commis de mauvaise décision d'investissement", "Décrire l'échec sans en tirer de leçon concrète et appliquée"], correct: 1 },
  { id: 677, deck: "entretien", sub: "Comportemental & mise en situation", q: "En entretien : 'Comment géreriez-vous un désaccord avec votre PM sur le sizing d'une position ?' Quelle est la meilleure approche ?", a: "Proposer d'exposer son raisonnement de façon argumentée avec des données à l'appui, tout en respectant en dernier ressort la hiérarchie de décision finale du PM sur le portefeuille global.", options: ["Modifier discrètement le sizing sans en informer le PM", "Exposer son raisonnement avec des données, tout en respectant la décision finale du PM", "Refuser catégoriquement d'exécuter la décision du PM", "Éviter systématiquement d'exprimer son désaccord au PM"], correct: 1 },
  { id: 678, deck: "entretien", sub: "Comportemental & mise en situation", q: "En entretien : 'Que faites-vous quand vous ne comprenez pas complètement un instrument financier qu'on vous demande de trader ?' Quelle est la meilleure approche ?", a: "Privilégier une démarche rigoureuse d'apprentissage et de questionnement structuré avant toute prise de position, plutôt que de risquer une improvisation dangereuse et mal maîtrisée.", options: ["Trader l'instrument immédiatement en apprenant sur le tas", "Privilégier une démarche rigoureuse d'apprentissage et de questionnement avant toute prise de position", "Refuser catégoriquement de traiter tout instrument non parfaitement maîtrisé", "Déléguer systématiquement la décision sans chercher à comprendre"], correct: 1 },
  { id: 679, deck: "entretien", sub: "Comportemental & mise en situation", q: "En entretien : 'Comment restez-vous objectif quand une position que vous avez recommandée devient perdante ?' Quelle est la meilleure approche ?", a: "Illustrer une capacité à réévaluer honnêtement la thèse initiale à la lumière des faits nouveaux disponibles, sans biais d'ancrage excessif sur sa décision passée déjà prise.", options: ["Maintenir la position coûte que coûte pour ne pas admettre une erreur", "Réévaluer honnêtement la thèse à la lumière des faits nouveaux, sans biais d'ancrage", "Couper systématiquement la position dès le premier signe de perte, sans analyse", "Éviter de reconsidérer la thèse initiale une fois qu'elle est formée"], correct: 1 },
  { id: 680, deck: "entretien", sub: "Comportemental & mise en situation", q: "En entretien : 'Pourquoi pensez-vous être fait pour un rôle à forte responsabilité comme celui de Portfolio Manager ?' Quelle est la meilleure approche ?", a: "Structurer une réponse démontrant à la fois compétence technique, discipline de gestion du risque, et capacité réelle de décision sous pression, étayée par des exemples concrets et vécus.", options: ["Affirmer sa légitimité sans exemple concret à l'appui", "Démontrer compétence technique, discipline de risque et capacité de décision, avec exemples concrets", "Insister uniquement sur son ambition personnelle sans preuve tangible", "Comparer directement ses qualités à celles d'autres candidats"], correct: 1 },
  { id: 681, deck: "entretien", sub: "Questions techniques avancées", q: "Expliquez la signification de N(d1) et N(d2) dans la formule de Black-Scholes.", a: "N(d2) représente la probabilité risque-neutre que l'option soit exercée à maturité ; N(d1) intervient dans la pondération du prix du sous-jacent et correspond au Delta du call sous les hypothèses du modèle.", options: ["N(d1) et N(d2) sont deux mesures identiques de la volatilité implicite", "N(d2) est la probabilité risque-neutre d'exercice ; N(d1) pondère le sous-jacent et correspond au Delta", "N(d1) est le taux sans risque et N(d2) le taux de dividende", "N(d1) et N(d2) ne s'appliquent qu'aux options américaines"], correct: 1 },
  { id: 682, deck: "entretien", sub: "Questions techniques avancées", q: "Comment démontre-t-on la relation de parité call-put par arbitrage ?", a: "En comparant deux portefeuilles de payoff identique à maturité : un call plus du cash actualisé au strike, contre un put plus le sous-jacent ; l'absence d'opportunité d'arbitrage impose l'égalité de leurs prix aujourd'hui, d'où C − P = S − Ke^(−rT).", options: ["En supposant que la volatilité implicite est toujours constante", "En comparant deux portefeuilles de payoff identique à maturité et en invoquant l'absence d'arbitrage", "En résolvant directement l'équation aux dérivées partielles de Black-Scholes", "En utilisant uniquement des données historiques de volatilité"], correct: 1 },
  { id: 683, deck: "entretien", sub: "Questions techniques avancées", q: "Comment couvrir un portefeuille actions contre un risque de krach à l'aide d'options ?", a: "Via un 'protective put' (achat de puts sur l'indice ou le portefeuille) pour plafonner la perte, ou un collar (achat de put financé par la vente d'un call) pour réduire le coût de la couverture au prix d'un potentiel de hausse limité.", options: ["En vendant systématiquement des calls sans autre position", "Via un protective put ou un collar (achat de put financé par vente de call)", "En augmentant simplement la diversification sectorielle du portefeuille", "En vendant à découvert l'intégralité du portefeuille actions"], correct: 1 },
  { id: 684, deck: "entretien", sub: "Questions techniques avancées", q: "Qu'est-ce que le 'gamma scalping' ?", a: "Une stratégie consistant à ajuster dynamiquement la couverture delta d'une position longue en options (Gamma positif), en achetant le sous-jacent quand il baisse et en le vendant quand il monte, monétisant ainsi la volatilité réalisée au fil des rééquilibrages.", options: ["Une stratégie consistant à ne jamais rééquilibrer sa couverture delta", "Un rééquilibrage dynamique de la couverture delta monétisant la volatilité réalisée sur une position Gamma positif", "Une stratégie exclusivement applicable aux positions Gamma négatif", "Un synonyme exact du delta hedging statique"], correct: 1 },
  { id: 685, deck: "entretien", sub: "Questions techniques avancées", q: "Quelle est la différence entre VaR historique, paramétrique et Monte-Carlo ?", a: "La VaR historique applique directement les variations de marché passées observées ; la paramétrique suppose une distribution (souvent normale) des rendements calibrée sur moyenne et écart-type ; la Monte-Carlo simule un grand nombre de trajectoires selon un modèle stochastique choisi.", options: ["Ce sont trois noms différents pour une méthode strictement identique", "Historique utilise le passé observé, paramétrique suppose une distribution, Monte-Carlo simule des trajectoires", "Seule la VaR Monte-Carlo est utilisée en pratique par les institutions financières", "La VaR paramétrique ne peut jamais être calculée sans simulation"], correct: 1 },
  { id: 686, deck: "entretien", sub: "Questions techniques avancées", q: "Que ne capture pas le ratio de Sharpe dans l'évaluation d'une stratégie ?", a: "Il ne capture ni l'asymétrie (skewness) des rendements, ni le risque de queue (tail risk), et pénalise également la volatilité positive et négative, ce qui peut être trompeur pour des stratégies au profil de rendement non-gaussien.", options: ["Le Sharpe capture parfaitement tous les aspects du risque d'une stratégie", "Il ne capture ni l'asymétrie ni le risque de queue, pénalisant également volatilité positive et négative", "Le Sharpe ne peut être calculé que sur des rendements annuels", "Le Sharpe surestime systématiquement le risque réel d'une stratégie"], correct: 1 },
  { id: 687, deck: "entretien", sub: "Questions techniques avancées", q: "Comment construit-on mathématiquement un portefeuille de variance minimale ?", a: "En résolvant w = (Σ⁻¹ × 1) / (1' × Σ⁻¹ × 1), où Σ est la matrice de covariance des actifs et 1 un vecteur de uns, ce qui minimise la variance du portefeuille w'Σw sous la contrainte que la somme des poids soit égale à 1.", options: ["En pondérant chaque actif par l'inverse de sa capitalisation boursière", "En résolvant w = (Σ⁻¹×1)/(1'×Σ⁻¹×1) à partir de la matrice de covariance", "En donnant un poids strictement égal à chaque actif du portefeuille", "En maximisant uniquement le rendement espéré sans contrainte de risque"], correct: 1 },
  { id: 688, deck: "entretien", sub: "Questions techniques avancées", q: "Expliquez le principe du 'risk parity' en construction de portefeuille.", a: "Chaque actif contribue de façon égale à la variance totale du portefeuille, plutôt que d'être pondéré par le capital investi ; cela conduit généralement à surpondérer les actifs peu volatils (souvent avec du levier) pour équilibrer leur contribution au risque global.", options: ["Chaque actif reçoit un poids en capital strictement identique", "Chaque actif contribue de façon égale à la variance totale du portefeuille", "Seuls les actifs sans risque sont inclus dans l'allocation", "Le portefeuille est pondéré uniquement selon la capitalisation boursière"], correct: 1 },
  { id: 689, deck: "entretien", sub: "Questions techniques avancées", q: "Comment couvrir le risque de taux d'une position obligataire ?", a: "Via un matching de duration, en vendant des futures de taux ou des obligations pour neutraliser la duration nette du portefeuille, ou via un swap de taux d'intérêt échangeant le flux fixe contre un flux variable.", options: ["En diversifiant uniquement entre plusieurs émetteurs obligataires", "Via un matching de duration (futures de taux, swap de taux) pour neutraliser l'exposition", "En augmentant systématiquement la maturité des obligations détenues", "Le risque de taux ne peut pas être couvert efficacement"], correct: 1 },
  { id: 690, deck: "entretien", sub: "Questions techniques avancées", q: "Quelle est la différence entre réplication physique et synthétique d'un ETF ?", a: "La réplication physique détient réellement les titres du sous-jacent (ou un échantillon représentatif), tandis que la réplication synthétique utilise un swap de performance totale avec une contrepartie pour répliquer la performance de l'indice, introduisant un risque de contrepartie.", options: ["Il n'existe aucune différence de risque entre les deux approches", "La physique détient les titres réels, la synthétique utilise un swap de performance avec risque de contrepartie", "La synthétique est toujours moins coûteuse et sans risque additionnel", "La réplication physique utilise systématiquement des produits dérivés"], correct: 1 },
  { id: 691, deck: "entretien", sub: "Questions techniques avancées", q: "Comment estimeriez-vous le beta d'un actif illiquide ou non coté ?", a: "En utilisant des comparables cotés du même secteur (peer beta), en ajustant du niveau d'endettement respectif (beta unlevered puis relevered), ou via une régression utilisant des rendements décalés (lagged) pour tenir compte de l'asynchronisme de valorisation de l'actif illiquide.", options: ["C'est impossible à estimer sans cotation directe de l'actif", "Via des comparables cotés ajustés du levier, ou une régression avec rendements décalés", "En utilisant systématiquement un beta égal à 1 par défaut", "En se basant uniquement sur le secteur d'activité sans ajustement financier"], correct: 1 },
  { id: 692, deck: "entretien", sub: "Questions techniques avancées", q: "Qu'est-ce que le 'tail risk hedging' et comment le met-on en place ?", a: "Une couverture contre les événements extrêmes rares, mise en place via des options très hors de la monnaie (far out-of-the-money puts), des futures sur indices de volatilité (VIX), ou des stratégies de convexité longue peu coûteuses en régime de marché normal.", options: ["Une couverture systématique contre toute variation normale du marché", "Une couverture contre les événements extrêmes via options très hors de la monnaie ou futures VIX", "Une stratégie consistant à ne jamais détenir de couverture explicite", "Une méthode réservée exclusivement aux portefeuilles obligataires"], correct: 1 },
  { id: 693, deck: "entretien", sub: "Questions techniques avancées", q: "Quels sont les principaux risques d'une stratégie de market making ?", a: "Le risque d'inventaire (mouvement défavorable du sous-jacent pendant la détention de la position), le risque de sélection adverse (contreparties mieux informées que le market maker), et le risque de liquidité accru en cas de stress de marché.", options: ["Le market making n'implique aucun risque significatif en pratique", "Risque d'inventaire, risque de sélection adverse, et risque de liquidité en stress de marché", "Uniquement le risque de change sur les positions détenues", "Le seul risque est celui lié aux commissions de courtage"], correct: 1 },
  { id: 694, deck: "entretien", sub: "Questions techniques avancées", q: "Comment décomposeriez-vous l'exposition factorielle d'un portefeuille, à la manière d'un modèle Barra ?", a: "En régressant les rendements du portefeuille sur un ensemble de facteurs de risque connus (marché, taille, value, momentum, secteur...), ce qui permet d'isoler la contribution de chaque facteur ainsi que l'alpha résiduel non expliqué.", options: ["En calculant uniquement le beta de marché global du portefeuille", "En régressant les rendements sur des facteurs de risque connus pour isoler leur contribution et l'alpha résiduel", "En listant simplement les secteurs représentés dans le portefeuille", "Cette décomposition n'est pas réalisable en pratique"], correct: 1 },
  { id: 695, deck: "entretien", sub: "Questions techniques avancées", q: "Que se passe-t-il pour un portefeuille delta-neutre avec un Gamma négatif lors d'un mouvement de marché important ?", a: "Le portefeuille devient progressivement 'short' delta si le marché monte fortement (ou 'long' delta s'il baisse fortement), amplifiant les pertes en l'absence de rééquilibrage rapide de la couverture.", options: ["Le portefeuille reste parfaitement neutre quelle que soit l'ampleur du mouvement", "Le portefeuille devient progressivement short (ou long) delta, amplifiant les pertes sans rééquilibrage", "Un Gamma négatif protège automatiquement contre les grands mouvements de marché", "Cela n'affecte que le Vega du portefeuille, pas son exposition directionnelle"], correct: 1 },
  { id: 696, deck: "entretien", sub: "Questions techniques avancées", q: "Qu'est-ce que la convexité obligataire et pourquoi est-elle un profil de risque recherché ?", a: "Elle mesure la courbure de la relation prix/taux ; une convexité positive signifie que le gain de prix sur une baisse de taux dépasse la perte symétrique sur une hausse équivalente de taux, un profil asymétriquement favorable pour le détenteur.", options: ["Elle mesure uniquement la maturité résiduelle de l'obligation", "Une convexité positive signifie un gain sur baisse de taux supérieur à la perte sur hausse symétrique", "La convexité est toujours défavorable au détenteur de l'obligation", "Elle n'a aucun impact pratique sur la gestion d'un portefeuille obligataire"], correct: 1 },
  { id: 697, deck: "entretien", sub: "Questions techniques avancées", q: "Comment la corrélation entre actifs évolue-t-elle typiquement en période de crise de marché ?", a: "Elle tend à augmenter fortement, convergeant souvent vers des niveaux proches de 1, ce qui réduit fortement l'efficacité de la diversification précisément au moment où elle serait la plus nécessaire.", options: ["Elle diminue systématiquement en période de crise, renforçant la diversification", "Elle tend à augmenter fortement, réduisant l'efficacité de la diversification", "Elle reste toujours parfaitement stable, quel que soit le contexte de marché", "La corrélation entre actifs n'a aucun lien avec les périodes de crise"], correct: 1 },
  { id: 698, deck: "entretien", sub: "Questions techniques avancées", q: "Qu'est-ce que le 'risk budgeting' en gestion de portefeuille ?", a: "Une approche allouant le risque total du portefeuille entre différentes stratégies ou classes d'actifs selon un budget de risque prédéfini, plutôt que de se limiter à une simple allocation en capital.", options: ["Une allocation basée uniquement sur le capital disponible pour chaque stratégie", "Une allocation du risque total entre stratégies selon un budget de risque prédéfini", "Un synonyme exact de la diversification simple par nombre d'actifs", "Une méthode réservée exclusivement aux portefeuilles obligataires"], correct: 1 },
  { id: 699, deck: "entretien", sub: "Questions techniques avancées", q: "Comment détecter un surapprentissage (overfitting) dans le backtest d'une stratégie quantitative ?", a: "Par une performance nettement dégradée en test out-of-sample ou en walk-forward par rapport à l'in-sample, une sensibilité excessive aux petites variations de paramètres, et un nombre de paramètres calibrés élevé par rapport à la taille de l'échantillon de données.", options: ["Un backtest avec une performance très élevée est toujours fiable et à déployer", "Une performance dégradée en out-of-sample, une forte sensibilité aux paramètres, trop de paramètres calibrés", "Le surapprentissage ne peut jamais être détecté avant le déploiement réel", "Seule la durée du backtest permet de détecter un surapprentissage"], correct: 1 },
  { id: 700, deck: "entretien", sub: "Questions techniques avancées", q: "Expliquez le critère de Kelly et son usage pratique en dimensionnement de position.", a: "La formule f* = (bp − q)/b (où p = probabilité de gain, q = probabilité de perte, b = ratio gain/perte) détermine la fraction du capital maximisant la croissance géométrique à long terme ; en pratique, on utilise souvent une fraction du Kelly (ex. half-Kelly) pour réduire le risque de ruine lié aux erreurs d'estimation.", options: ["Le critère de Kelly recommande toujours de miser 100% du capital disponible", "La formule f*=(bp−q)/b maximise la croissance géométrique ; on utilise souvent une fraction (half-Kelly) en pratique", "Le critère de Kelly ne s'applique qu'aux paris sportifs, pas à la finance", "Il détermine uniquement le stop-loss optimal d'une position"], correct: 1 },
  { id: 701, deck: "entretien", sub: "Questions techniques avancées", q: "Qu'entend-on par 'changement de régime' pour une stratégie quantitative ?", a: "Un changement structurel dans la dynamique du marché (niveau de volatilité, corrélations, liquidité) qui invalide les hypothèses statistiques sous-jacentes du modèle, calibré initialement sur une période antérieure différente.", options: ["Un simple changement de personnel au sein de l'équipe de gestion", "Un changement structurel de la dynamique de marché invalidant les hypothèses du modèle calibré", "Un changement de la réglementation fiscale applicable au fonds", "Un synonyme exact du rebalancement périodique du portefeuille"], correct: 1 },
  { id: 702, deck: "entretien", sub: "Questions techniques avancées", q: "Décrivez les étapes clés de construction d'une stratégie de pairs trading.", a: "Identifier des paires d'actifs cointégrées, estimer les paramètres statistiques du spread (moyenne, écart-type), définir des seuils d'entrée/sortie basés sur le z-score du spread, puis gérer activement le risque de rupture durable de la relation historique entre les deux actifs.", options: ["Choisir deux actifs au hasard dans le même secteur sans analyse statistique", "Identifier des paires cointégrées, estimer le spread, définir des seuils via le z-score, gérer le risque de rupture", "Se baser uniquement sur la corrélation instantanée entre les deux actifs", "Trader systématiquement dans le sens de la tendance de chaque actif pris séparément"], correct: 1 },
  { id: 703, deck: "entretien", sub: "Questions techniques avancées", q: "Quelle est la différence entre significativité statistique et significativité économique d'une stratégie de trading ?", a: "La significativité statistique concerne la fiabilité du signal détecté (p-value, t-statistique), tandis que la significativité économique évalue si le profit net, après coûts de transaction et impact de marché, est suffisant pour justifier réellement le déploiement de capital.", options: ["Ce sont deux termes strictement synonymes en pratique", "La statistique concerne la fiabilité du signal, l'économique évalue le profit net réel après coûts", "Seule la significativité statistique compte pour décider de déployer une stratégie", "L'économique ne concerne que les stratégies macro, pas les stratégies quantitatives"], correct: 1 },
  { id: 704, deck: "entretien", sub: "Questions techniques avancées", q: "Comment le levier financier amplifie-t-il les drawdowns d'un portefeuille ?", a: "Il multiplie proportionnellement les pertes (comme les gains) par rapport au capital propre engagé, et peut en plus déclencher des appels de marge forçant des ventes procycliques qui aggravent la perte réelle au-delà du simple effet de multiplication linéaire.", options: ["Le levier n'affecte que les gains potentiels, jamais les pertes", "Il multiplie les pertes par rapport au capital propre et peut déclencher des ventes forcées procycliques", "Le levier réduit systématiquement le risque de drawdown d'un portefeuille", "L'effet du levier est toujours strictement identique quel que soit le contexte de marché"], correct: 1 },
  { id: 705, deck: "entretien", sub: "Questions techniques avancées", q: "Qu'est-ce qu'un 'crowded trade' et pourquoi représente-t-il un risque particulier ?", a: "Une position largement détenue simultanément par de nombreux acteurs du marché ; en cas de retournement, le dénouement simultané de positions similaires ('unwind') amplifie fortement et brutalement les mouvements de prix défavorables.", options: ["Une position détenue par un seul et unique investisseur institutionnel", "Une position largement détenue par de nombreux acteurs, dont le dénouement simultané amplifie les mouvements de prix", "Un synonyme exact d'une position illiquide isolée", "Une stratégie qui ne concerne que les marchés émergents"], correct: 1 },
  { id: 706, deck: "entretien", sub: "Questions techniques avancées", q: "Expliquez le concept de 'factor timing' en gestion quantitative.", a: "Le fait de tenter d'ajuster dynamiquement l'exposition d'un portefeuille à différents facteurs de risque (value, momentum, qualité...) selon le cycle économique ou le régime de marché anticipé, plutôt que de maintenir une exposition factorielle statique dans le temps.", options: ["Un synonyme exact du rebalancement calendaire classique d'un portefeuille", "Ajuster dynamiquement l'exposition aux facteurs de risque selon le cycle ou régime de marché anticipé", "Une stratégie consistant à ignorer totalement les facteurs de risque", "Une méthode réservée exclusivement aux stratégies obligataires"], correct: 1 },
  { id: 707, deck: "entretien", sub: "Questions techniques avancées", q: "Comment un swap de taux d'intérêt vanille est-il pricé à son initiation ?", a: "En égalisant la valeur actualisée de la jambe fixe et de la jambe variable, cette dernière étant valorisée à partir des taux forward implicites déduits de la courbe des taux ; le taux swap fixe est celui qui rend la valeur nette du contrat nulle à l'initiation.", options: ["En fixant arbitrairement le taux fixe au niveau du taux directeur actuel", "En égalisant la valeur actualisée des deux jambes, la variable étant valorisée via les taux forward implicites", "Le pricing d'un swap ne dépend que de sa maturité, indépendamment des taux de marché", "En utilisant exclusivement le modèle de Black-Scholes standard"], correct: 1 },
  { id: 708, deck: "entretien", sub: "Questions techniques avancées", q: "Qu'est-ce qu'un 'short squeeze' et pourquoi se produit-il ?", a: "Une hausse rapide et auto-alimentée du prix d'un actif fortement vendu à découvert, provoquée par le rachat forcé des positions courtes (appels de marge, stop-loss déclenchés), ce qui amplifie encore davantage la hausse initiale du prix.", options: ["Une baisse progressive et anticipée du prix d'un actif largement détenu à l'achat", "Une hausse auto-alimentée du prix causée par le rachat forcé de positions courtes sous pression", "Un mécanisme réglementaire limitant automatiquement la vente à découvert", "Un phénomène qui ne peut se produire que sur le marché obligataire"], correct: 1 },
  { id: 709, deck: "entretien", sub: "Questions techniques avancées", q: "Expliquez le mécanisme du marché repo et son rôle typique en gestion de portefeuille.", a: "Un repo est un financement collatéralisé de court terme où un titre est vendu avec engagement de rachat à terme ; il permet d'obtenir des liquidités contre collatéral (ou d'emprunter un titre spécifique via un repo inversé), largement utilisé pour le financement du levier et la gestion de trésorerie court terme.", options: ["Un repo est un prêt bancaire non garanti à long terme", "Un financement collatéralisé court terme, utilisé notamment pour le levier et la gestion de trésorerie", "Un repo ne concerne que les transactions sur devises étrangères", "Un synonyme exact d'un swap de taux d'intérêt classique"], correct: 1 },
  { id: 710, deck: "entretien", sub: "Questions techniques avancées", q: "Pourquoi deux stratégies ayant le même ratio de Sharpe peuvent-elles présenter des profils de risque très différents ?", a: "Le Sharpe ne capture que la moyenne et l'écart-type des rendements ; deux stratégies peuvent différer fortement en asymétrie (skewness), en épaisseur de queue (kurtosis) ou en corrélation avec le reste du portefeuille, rendant leur risque réel très différent malgré un Sharpe identique.", options: ["Un Sharpe identique garantit toujours un profil de risque strictement identique", "Le Sharpe ne capture ni l'asymétrie, ni le risque de queue, ni la corrélation avec le reste du portefeuille", "Cette situation ne peut mathématiquement jamais se produire en pratique", "Seule la volatilité annualisée peut expliquer une telle différence de profil"], correct: 1 },
  { id: 711, deck: "entretien", sub: "Études de cas de portefeuille", q: "Vous disposez de 50M€ à allouer entre actions, obligations et cash, avec une contrainte de volatilité annuelle maximale de 8%. Quelle démarche est la plus appropriée ?", a: "Définir d'abord un budget de risque explicite puis optimiser l'allocation (mean-variance contrainte ou risk parity) pour atteindre la volatilité cible, plutôt que de fixer arbitrairement des pourcentages ronds sans lien direct avec la contrainte de risque.", options: ["Allouer un tiers égal à chaque classe d'actifs par simplicité", "Définir un budget de risque puis optimiser l'allocation pour atteindre la volatilité cible", "Investir uniquement en cash pour garantir le respect de la contrainte", "Maximiser le rendement espéré sans tenir compte de la contrainte de volatilité"], correct: 1 },
  { id: 712, deck: "entretien", sub: "Études de cas de portefeuille", q: "Un client souhaite un portefeuille dont le maximum drawdown historique ne dépasse jamais 15%. Comment structureriez-vous l'allocation ?", a: "Combiner des actifs procycliques avec des stratégies de couverture de queue (tail hedging), limiter le levier, et tester l'allocation via des scénarios de stress historiques (2008, 2020) pour valider le respect de la contrainte.", options: ["Investir uniquement en obligations d'État pour éliminer tout risque de drawdown", "Combiner actifs procycliques et couverture de queue, en testant via des scénarios de stress historiques", "Ignorer la contrainte tant que le rendement espéré est suffisamment élevé", "Utiliser un levier important pour compenser un rendement autrement trop faible"], correct: 1 },
  { id: 713, deck: "entretien", sub: "Études de cas de portefeuille", q: "Vous devez construire un portefeuille market-neutral à partir de 30 actions. Quelle est la première étape méthodologique essentielle ?", a: "Neutraliser les expositions factorielles principales (beta de marché, secteur, taille) avant de sélectionner les paires long/short, sinon le portefeuille reste exposé à des facteurs non désirés malgré un beta de marché apparemment nul.", options: ["Sélectionner directement les paires les plus corrélées historiquement", "Neutraliser les expositions factorielles principales avant de sélectionner les paires long/short", "Maximiser immédiatement le nombre de positions pour diversifier", "Ignorer les facteurs sectoriels tant que le beta de marché est nul"], correct: 1 },
  { id: 714, deck: "entretien", sub: "Études de cas de portefeuille", q: "Un fonds multi-stratégies doit allouer du capital entre 5 stratégies décorrélées ayant des Sharpe similaires mais des volatilités différentes. Quelle approche d'allocation est la plus cohérente ?", a: "Allouer inversement proportionnellement à la volatilité de chaque stratégie (logique de risk parity entre stratégies), plutôt qu'un capital égal, afin d'équilibrer leur contribution respective au risque total du fonds.", options: ["Allouer un capital strictement identique à chaque stratégie", "Allouer inversement proportionnellement à la volatilité de chaque stratégie", "Allouer uniquement à la stratégie ayant historiquement le meilleur rendement absolu", "Allouer proportionnellement à l'ancienneté de chaque stratégie dans le fonds"], correct: 1 },
  { id: 715, deck: "entretien", sub: "Études de cas de portefeuille", q: "Vous gérez un portefeuille obligataire et anticipez une hausse des taux d'intérêt. Comment ajusteriez-vous l'allocation ?", a: "Réduire la duration globale du portefeuille en vendant les obligations longues et en privilégiant les maturités courtes ou les obligations à taux variable (FRN), pour limiter la sensibilité du portefeuille à la hausse des taux.", options: ["Augmenter la duration en achetant des obligations longues pour maximiser le portage", "Réduire la duration globale en privilégiant les maturités courtes ou les FRN", "L'anticipation de taux n'a aucune implication sur la gestion de duration", "Vendre l'intégralité du portefeuille obligataire sans réallocation"], correct: 1 },
  { id: 716, deck: "entretien", sub: "Études de cas de portefeuille", q: "Un investisseur souhaite un portefeuille répliquant un indice actions tout en réduisant de 30% son exposition aux mouvements de marché. Quelle solution technique proposeriez-vous ?", a: "Conserver le portefeuille actions et vendre des futures sur l'indice à hauteur de 30% du notionnel total, réduisant ainsi le beta net du portefeuille sans liquider les positions actions sous-jacentes.", options: ["Vendre directement 30% des actions détenues en portefeuille", "Conserver les actions et vendre des futures sur indice à hauteur de 30% du notionnel", "Acheter des puts très hors de la monnaie sur chaque action individuellement", "Il n'existe aucune solution technique simple à ce problème"], correct: 1 },
  { id: 717, deck: "entretien", sub: "Études de cas de portefeuille", q: "Vous devez optimiser un portefeuille avec une contrainte réglementaire limitant chaque émetteur à 10% maximum de l'actif net. Comment intégrer cette contrainte ?", a: "Ajouter des contraintes explicites de poids maximal par actif directement dans le problème d'optimisation quadratique, plutôt que d'ajuster manuellement les poids après une optimisation menée sans cette contrainte.", options: ["Ignorer la contrainte lors de l'optimisation puis ajuster manuellement ensuite", "Ajouter des contraintes explicites de poids maximal directement dans l'optimisation", "Exclure systématiquement tout émetteur dépassant 5% par précaution excessive", "La contrainte ne peut pas être intégrée dans un cadre d'optimisation quantitative"], correct: 1 },
  { id: 718, deck: "entretien", sub: "Études de cas de portefeuille", q: "Un portefeuille actions internationales doit être couvert du risque de change vers l'euro. Quelle est l'approche standard ?", a: "Vendre à terme (forward) les devises étrangères concernées à hauteur de l'exposition en actifs sous-jacents, en ajustant régulièrement la couverture (rolling hedge) selon la variation de valeur du portefeuille dans le temps.", options: ["Convertir immédiatement tous les actifs en euros en les liquidant", "Vendre à terme les devises concernées à hauteur de l'exposition, avec ajustement régulier", "Ignorer le risque de change tant que le portefeuille reste diversifié", "Acheter systématiquement des options de change très hors de la monnaie uniquement"], correct: 1 },
  { id: 719, deck: "entretien", sub: "Études de cas de portefeuille", q: "Vous devez construire un portefeuille factoriel exposé positivement au facteur value et négativement au facteur momentum. Comment procéder concrètement ?", a: "Sélectionner et pondérer les actifs de façon à maximiser l'exposition nette désirée sur chaque facteur (via optimisation ou tri/scoring factoriel), tout en neutralisant si possible les autres facteurs de risque non désirés.", options: ["Sélectionner uniquement les actifs les moins chers du marché sans autre critère", "Sélectionner et pondérer les actifs pour maximiser l'exposition nette désirée sur chaque facteur ciblé", "Il est impossible d'être simultanément long value et short momentum", "Ignorer le facteur momentum tant que l'exposition value est correcte"], correct: 1 },
  { id: 720, deck: "entretien", sub: "Études de cas de portefeuille", q: "Un client veut un portefeuille avec un rendement cible de 6% et une volatilité maximale de 10%. Que devez-vous vérifier en premier ?", a: "Vérifier si ce couple rendement/risque est effectivement atteignable sur la frontière efficiente compte tenu des actifs disponibles, car un objectif situé hors de la frontière efficiente est structurellement inatteignable quelle que soit l'allocation choisie.", options: ["Commencer directement l'allocation sans vérification préalable", "Vérifier si ce couple rendement/risque est atteignable sur la frontière efficiente disponible", "Garantir ce rendement contractuellement au client sans analyse supplémentaire", "Augmenter automatiquement le levier jusqu'à atteindre l'objectif de rendement"], correct: 1 },
  { id: 721, deck: "entretien", sub: "Études de cas de portefeuille", q: "Vous constatez que deux stratégies de votre portefeuille multi-stratégies, historiquement décorrélées, deviennent fortement corrélées en période de stress. Que faites-vous ?", a: "Réduire l'allocation combinée aux deux stratégies pour limiter le risque de concentration non anticipé, et analyser la cause structurelle de cette hausse de corrélation apparue spécifiquement en régime de stress.", options: ["Ignorer ce phénomène tant que chaque stratégie reste individuellement rentable", "Réduire l'allocation combinée et analyser la cause structurelle de cette hausse de corrélation", "Augmenter l'allocation aux deux stratégies pour profiter de leur alignement", "Fusionner immédiatement les deux stratégies en une seule position"], correct: 1 },
  { id: 722, deck: "entretien", sub: "Études de cas de portefeuille", q: "Un portefeuille doit respecter une contrainte ESG excluant 20% de l'univers d'investissement initial. Comment adapter la construction du portefeuille ?", a: "Reconstruire la frontière efficiente et l'optimisation sur l'univers restreint disponible, en acceptant que le couple rendement/risque optimal théorique puisse être légèrement dégradé du fait de la contrainte d'exclusion appliquée.", options: ["Ignorer la contrainte ESG si elle dégrade la performance théorique", "Reconstruire la frontière efficiente sur l'univers restreint, en acceptant une dégradation possible du couple rendement/risque", "Compenser systématiquement par un levier accru sur l'univers restant", "La contrainte ESG ne peut techniquement pas être intégrée à une optimisation quantitative"], correct: 1 },
  { id: 723, deck: "entretien", sub: "Études de cas de portefeuille", q: "Vous devez allouer du capital entre plusieurs gérants externes pour un fonds de fonds. Quel critère est le plus important au-delà du seul rendement passé ?", a: "La cohérence et la robustesse du processus d'investissement de chaque gérant, ainsi que la faible corrélation de leurs styles respectifs entre eux, plutôt que la seule performance historique brute affichée.", options: ["Le rendement historique brut affiché sur les 12 derniers mois uniquement", "La cohérence du processus d'investissement et la faible corrélation des styles entre gérants", "Le montant total d'actifs sous gestion de chaque gérant", "L'ancienneté du gérant dans l'industrie, indépendamment de sa performance"], correct: 1 },
  { id: 724, deck: "entretien", sub: "Études de cas de portefeuille", q: "Un portefeuille actions présente une forte concentration sectorielle non intentionnelle après plusieurs mois de gestion active. Comment corriger cela ?", a: "Analyser l'exposition sectorielle réelle du portefeuille (au-delà du simple nombre de titres détenus), puis rééquilibrer activement en réduisant les positions concentrées ou en ajoutant une couverture sectorielle ciblée si nécessaire.", options: ["Ignorer la concentration tant que la performance globale reste positive", "Analyser l'exposition sectorielle réelle puis rééquilibrer ou couvrir la concentration identifiée", "Vendre l'intégralité du portefeuille pour repartir sur une base neutre", "Augmenter davantage la concentration sur le secteur le plus performant récemment"], correct: 1 },
  { id: 725, deck: "entretien", sub: "Études de cas de portefeuille", q: "Vous devez présenter à un comité d'investissement pourquoi votre portefeuille a sous-performé son benchmark ce trimestre malgré un bon stock-picking individuel. Quelle explication structurée fourniriez-vous ?", a: "Décomposer la performance entre effet d'allocation sectorielle, effet de sélection de titres, et effet d'interaction (attribution de performance), afin d'isoler précisément la source réelle de la sous-performance au-delà du seul ressenti qualitatif.", options: ["Affirmer que la sous-performance est uniquement due au hasard du marché", "Décomposer la performance via une attribution formelle (allocation, sélection, interaction)", "Attribuer systématiquement la sous-performance à l'équipe de gestion des risques", "Éviter d'approfondir l'explication tant que la performance annuelle reste correcte"], correct: 1 },
  { id: 726, deck: "entretien", sub: "Applications numériques", q: "Un portefeuille a un rendement annuel de 12%, un taux sans risque de 3%, et une volatilité de 15%. Quel est son ratio de Sharpe ?", a: "0,6, car Sharpe = (12% − 3%) / 15% = 9% / 15% = 0,6.", options: ["0,45", "0,6", "0,8", "1,2"], correct: 1 },
  { id: 727, deck: "entretien", sub: "Applications numériques", q: "Une option a un Delta de 0,6 et un Gamma de 0,05. Si le sous-jacent monte de 2€, quel est le nouveau Delta approximatif ?", a: "0,7, car nouveau Delta ≈ Delta initial + Gamma × variation du sous-jacent = 0,6 + 0,05 × 2 = 0,7.", options: ["0,6", "0,65", "0,7", "0,75"], correct: 2 },
  { id: 728, deck: "entretien", sub: "Applications numériques", q: "Une obligation a une duration modifiée de 7 et un rendement actuel de 4%. Si les taux montent de 50 bps, quelle est la variation approximative de son prix ?", a: "Environ −3,5%, car ΔP/P ≈ −duration modifiée × Δtaux = −7 × 0,005 = −0,035, soit −3,5%.", options: ["−1,75%", "−3,5%", "−7%", "−0,5%"], correct: 1 },
  { id: 729, deck: "entretien", sub: "Applications numériques", q: "Un portefeuille de 100M€ a une VaR à 99% sur 1 jour de 2M€. Comment interpréter précisément ce chiffre ?", a: "Avec 99% de probabilité, la perte du portefeuille sur ce jour ne devrait pas dépasser 2M€ (soit 2% du portefeuille) ; il reste néanmoins 1% de probabilité de subir une perte supérieure à ce montant.", options: ["Le portefeuille ne peut jamais perdre plus de 2M€, en toute circonstance", "Avec 99% de probabilité, la perte ne devrait pas dépasser 2M€ ce jour-là", "Le portefeuille perd en moyenne 2M€ chaque jour", "2M€ représente la perte totale possible sur toute la durée du portefeuille"], correct: 1 },
  { id: 730, deck: "entretien", sub: "Applications numériques", q: "Deux actifs : A (rendement 10%, vol 20%) et B (rendement 6%, vol 10%), corrélation de 0,3. Quel est le rendement d'un portefeuille pondéré 50/50 ?", a: "8%, car le rendement d'un portefeuille est une simple moyenne pondérée des rendements individuels : 0,5×10% + 0,5×6% = 8%.", options: ["7%", "8%", "9%", "6,5%"], correct: 1 },
  { id: 731, deck: "entretien", sub: "Applications numériques", q: "Avec les mêmes actifs A (vol 20%) et B (vol 10%), corrélation 0,3, pondération 50/50, quelle est approximativement la volatilité du portefeuille ?", a: "Environ 12,5%, via σ² = 0,5²×20%² + 0,5²×10%² + 2×0,5×0,5×0,3×20%×10% = 1%+0,25%+0,3% = 1,55%, donc σ ≈ √1,55% ≈ 12,45%.", options: ["Environ 15%", "Environ 12,5%", "Environ 10%", "Environ 20%"], correct: 1 },
  { id: 732, deck: "entretien", sub: "Applications numériques", q: "Un call vaut 5€, le sous-jacent est à 100€, le strike à 95€, taux sans risque 0%, pas de dividende. Que vaut un put de même strike/maturité par la parité call-put ?", a: "0€, car par parité C − P = S − K, donc P = C − (S − K) = 5 − (100 − 95) = 5 − 5 = 0.", options: ["0€", "5€", "10€", "-5€ (impossible)"], correct: 0 },
  { id: 733, deck: "entretien", sub: "Applications numériques", q: "Une stratégie a un rendement moyen mensuel de 1% avec un écart-type mensuel de 3% (taux sans risque négligé). Quel est son Sharpe annualisé ?", a: "Environ 1,15, car Sharpe mensuel = 1%/3% ≈ 0,333, annualisé en multipliant par √12 ≈ 3,46, soit environ 1,15.", options: ["Environ 0,33", "Environ 1,15", "Environ 4", "Environ 12"], correct: 1 },
  { id: 734, deck: "entretien", sub: "Applications numériques", q: "Un portefeuille est levé 3x (150M€ de position pour 50M€ de capital propre). Si les actifs sous-jacents perdent 10%, quelle est la perte en % du capital propre ?", a: "−30%, car la perte en valeur est de 10% × 150M€ = 15M€, rapportée au capital propre de 50M€, soit 30%.", options: ["−10%", "−15%", "−30%", "−45%"], correct: 2 },
  { id: 735, deck: "entretien", sub: "Applications numériques", q: "Une option a un Vega de 0,20 (par point de volatilité). Si la volatilité implicite passe de 20% à 23%, quel est l'impact approximatif sur le prix de l'option ?", a: "Environ +0,60, car le Vega s'exprime par point de volatilité et la variation est de 3 points : 0,20 × 3 = 0,60.", options: ["+0,20", "+0,40", "+0,60", "+0,80"], correct: 2 },
  { id: 736, deck: "entretien", sub: "Applications numériques", q: "Vous investissez 10 000€ à un taux composé annuel de 7% pendant 10 ans. Quelle est approximativement la valeur finale ?", a: "Environ 19 670€, car 10 000 × 1,07^10 ≈ 19 672€.", options: ["Environ 17 000€", "Environ 19 670€", "Environ 22 000€", "Environ 15 000€"], correct: 1 },
  { id: 737, deck: "entretien", sub: "Applications numériques", q: "Un fonds affiche +50% une année puis −50% l'année suivante. Quel est le rendement cumulé sur les 2 ans ?", a: "−25%, car 1,5 × 0,5 = 0,75, soit une valeur finale à 75% du capital initial, donc −25% cumulé (et non 0% comme on pourrait naïvement le penser).", options: ["0%", "−10%", "−25%", "−50%"], correct: 2 },
  { id: 738, deck: "entretien", sub: "Applications numériques", q: "Un portefeuille a une tracking error de 4% par rapport à son benchmark, et un rendement actif moyen de 2% par an. Quel est son ratio d'information ?", a: "0,5, car ratio d'information = rendement actif / tracking error = 2% / 4% = 0,5.", options: ["0,25", "0,5", "2", "8"], correct: 1 },
  { id: 739, deck: "entretien", sub: "Applications numériques", q: "Vous devez couvrir une position de 10M€ d'actions US ayant un beta de 1,2, avec des futures sur indice dont le notionnel unitaire est de 250 000$. Combien de contrats devez-vous vendre ?", a: "48 contrats, car le notionnel à couvrir est de 10M€ × 1,2 = 12M€, divisé par 250 000$ par contrat = 48 contrats.", options: ["40 contrats", "48 contrats", "60 contrats", "12 contrats"], correct: 1 },
  { id: 740, deck: "entretien", sub: "Applications numériques", q: "Un dépôt de 1M€ génère un intérêt à un taux annuel simple de 5% sur une base ACT/360. Quel est l'intérêt généré en 30 jours ?", a: "Environ 4 167€, car 1 000 000 × 5% × 30/360 = 4 166,67€.", options: ["Environ 1 500€", "Environ 4 167€", "Environ 8 333€", "Environ 15 000€"], correct: 1 },
  { id: 741, deck: "entretien", sub: "Repères marché à connaître", q: "Quel est le rendement annuel moyen historique (nominal) des actions américaines sur longue période (plus de 100 ans) ?", a: "Environ 9 à 10% par an en moyenne nominale (environ 6-7% en termes réels), un repère de référence essentiel en finance de long terme.", options: ["Environ 3 à 4%", "Environ 9 à 10%", "Environ 15 à 18%", "Environ 25%"], correct: 1 },
